```\\n\\nファイアーウォール の穴あけ\\n\\n```\\n# ポート番号指定（「1234」の例）\\nfirewall-cmd --add-port=1234/tcp --permanent\\n\\n# HTTP\\nfirewall-cmd --add-service=http --zone=public --permanent\\n\\n# HTTPS\\nfirewall-cmd --add-service=https --zone=public --permanent\\n```\\n\\nファイアーウォール 穴あけ後の再読み込み\\n\\n```\\nfirewall-cmd --reload\\n```\\n\\nファイアーウォール の開通確認\\n\\n```\\nfirewall-cmd --list-all\\n```\\n\"},{\"slug\":\"2020-05-01-000000-3\",\"frontmatter\":{\"title\":\"React Nativeの環境構築【ReactNative】\",\"createAt\":\"2020-05-01 00:00\",\"updateAt\":null,\"tags\":[]},\"rawContent\":\"$91\"},{\"slug\":\"2020-05-01-000000-4\",\"frontmatter\":{\"title\":\"SignalRでの連携（WPFアプリ）\",\"createAt\":\"2020-05-01 00:00\",\"updateAt\":null,\"tags\":[]},\"rawContent\":\"$92\"},{\"slug\":\"2020-05-01-000000\",\"frontmatter\":{\"title\":\"SignalRでの連携（UWPアプリ）\",\"createAt\":\"2020-05-01 00:00\",\"updateAt\":null,\"tags\":[]},\"rawContent\":\"$93\"},{\"slug\":\"2020-04-30-000000-1\",\"frontmatter\":{\"title\":\"BitriseでiOSアプリのリリースビルドを自動化する方法\",\"createAt\":\"2020-04-30 00:00\",\"updateAt\":null,\"tags\":[]},\"rawContent\":\"$94\"},{\"slug\":\"2020-04-30-000000-2\",\"frontmatter\":{\"title\":\"express-generatorを使用してNodeプロジェクト（ejs）を作成する方法【Node.js】\",\"createAt\":\"2020-04-30 00:00\",\"updateAt\":null,\"tags\":[\"Node.js\"]},\"rawContent\":\"\\n## ■はじめに\\n\\n本記事はNode.jsがインストールされている事が前提となります。\\n\\nまだインストールされていない方は「[ローカルにNode.jsをインストールする方法](http://developer-kuro.com/develop/2019/09/01/local-node-js-nodebrew/)」の記事をご参考にインストールしてください。\\n\\n## ■手順\\n\\n1.以下のコマンドをターミナルで実行し、グローバルパッケージをアップデートする。\\n\\n```\\n$ npm update --global\\n```\\n\\n2.以下のコマンドをターミナルで実行し、「Express Generator」をグローバルインストールする。\\n\\n```\\n$ npm install express-generator --global\\n```\\n\\n3.以下のコマンドをターミナルで実行し、プロジェクトを作成したいディレクトリに移動する。\\n\\n```\\n$ cd [ディレクトリパス]\\n```\\n\\n4.以下のコマンドをターミナルで実行し、プロジェクトを作成する。\\n\\n```\\n$ express appname --view=ejs\\n```\\n\\n5.以下のコマンドをターミナルで実行し、プロジェクト内に移動する。\\n\\n```\\n$ cd appname\\n```\\n\\n6.以下のコマンドをターミナルで実行し、Nodeモジュールをインストールする。\\n\\n```\\n$ npm install\\n```\\n\\n7.以下のコマンドをターミナルで実行し、Nodeサーバーを起動する。\\n\\n```\\n$ npm start\\n```\\n\\n8.ブラウザで以下のURLにアクセスし、正常にアクセスできることを確認する。\\n\\n[http://localhost:3000/](http://localhost:3000/)\\n\\n![](/images/2020-04-30-000000-2/20220707120743.png)\\n\\n■おまけ\\n\\n・サーバーのアクセスポートを変更するには、「package.json」の「scripts」内を以下のように書き換えるだけでできます！（サーバーにアップして使用する際にはファイアーウォール に穴を開けるのをお忘れなく。）\\n\\n```\\n\\\"scripts\\\": {\\n    \\\"start\\\": \\\"PORT=[ポート番号] node ./bin/www\\\"\\n},\\n```\\n\"},{\"slug\":\"2020-04-30-000000-3\",\"frontmatter\":{\"title\":\"Wordpressの環境構築をする方法（VPS使用）\",\"createAt\":\"2020-04-30 00:00\",\"updateAt\":null,\"tags\":[]},\"rawContent\":\"$95\"},{\"slug\":\"2020-04-30-000000-4\",\"frontmatter\":{\"title\":\"PM2を利用してNode.jsのプロジェクトを実行する方法（npm start）【Node.js】\",\"createAt\":\"2020-04-30 00:00\",\"updateAt\":null,\"tags\":[\"Node.js\"]},\"rawContent\":\"\\n## ■はじめに\\n\\n「[express-generatorを使用してNodeプロジェクト（ejs）を作成する方法](http://developer-kuro.com/develop/2019/09/03/node-express-generator/)」の記事で作成したNode.jsのプロジェクトを前提としています。\\n\\nプロジェクトの作成方法がわからない場合は上記の記事をご参照ください。\\n\\n## ■手順\\n\\n1.以下のコマンドを実行して、PM2をグローバルにインストールする。\\n\\n```\\n$ npm install -g pm2\\n```\\n\\n2.以下のコマンドを実行して、アプリケーションを起動する。（「[アプリ名]」の箇所には自由にアプリ名を入力してください。PM2の管理で使用するアプリ名となります。）\\n\\n```\\n$ pm2 start npm --name [アプリ名] -- start\\n```\\n\\n## ■おまけ\\n\\n・以下のコマンドを実行することで、起動しているPM2のアプリ一覧が確認できます。\\n\\n```\\n$ pm2 list\\n```\\n\\n・以下のコマンドを実行することで、対象アプリの停止ができます。\\n\\n```\\n$ pm2 stop [プロセスID]\\n```\\n\\n・以下のコマンドを実行することで、全てのアプリの停止ができます。\\n\\n```\\n$ pm2 stop all\\n```\\n\\n・以下のコマンドを実行することで、対象アプリの再起動ができます。\\n\\n```\\n$ pm2 restart [プロセスID]\\n```\\n\\n・以下のコマンドを実行することで、全てのアプリの再起動ができます。\\n\\n```\\n$ pm2 restart all\\n```\\n\"},{\"slug\":\"2020-04-30-000000\",\"frontmatter\":{\"title\":\"サーバー再起動時にPM2の状態を復元する方法（自動起動）【Node.js】\",\"createAt\":\"2020-04-30 00:00\",\"updateAt\":null,\"tags\":[\"Node.js\"]},\"rawContent\":\"\\n■はじめに\\n\\n「[PM2を利用してNode.jsのプロジェクトを実行する方法（npm start）](http://developer-kuro.com/develop/2019/09/04/pm2-node-js/)」の記事でPM2を利用したプロジェクトの実行方法を記載しました。\\n\\nしかし、サーバーを再起動すると、起動しているNodeサーバーが停止されるようになります。\\n\\n複数のプロジェクトを並行起動していた場合、それぞれ起動し直すのは手間なので、サーバー再起動時に自動起動させる方法を記載します。\\n\\n■手順\\n\\n1.以下のコマンドを実行しPM2のプロセスに起動されていることを確認する。\\n\\n```\\n$ pm2 list\\n```\\n\\n2.以下のコマンドを実行し、自動起動スクリプトを作成する。\\n\\n```\\n$ pm2 startup\\n```\\n\\n3.以下のコマンドを実行し、現在のPM2の状態を保存する。\\n\\n```\\n$ pm2 save\\n```\\n\\n4.サーバーを再起動し、以下のコマンド実行結果が「1」と同じであることを確認する。\\n\\n```\\n$ pm2 list\\n```\\n\"},{\"slug\":\"2020-04-29-000000-1\",\"frontmatter\":{\"title\":\"CentOS7にnodebrewを使用してNode.jsをインストールする方法【Node.js】\",\"createAt\":\"2020-04-29 00:00\",\"updateAt\":null,\"tags\":[\"Node.js\"]},\"rawContent\":\"\\n## ■はじめに\\n\\nCentOS7の環境構築はこの記事では記載しませんので、別途お調べください。。。\\n\\n## ■手順\\n\\n1.以下のコマンドを実行して、nodebrewをインストールする。\\n\\n```\\n$ curl -L git.io/nodebrew | perl - setup\\n```\\n\\n2.以下のコマンドを実行して、nodebrewのPATHを通す。\\n\\n```\\n$ echo 'export PATH=$HOME/.nodebrew/current/bin:$PATH' \u003e\u003e ~/.bashrc\\n```\\n\\n3.以下のコマンドを実行して、「2」で設定したPATHを反映させる。\\n\\n```\\n$ source ~/.bashrc\\n```\\n\\n4.以下のコマンドを実行して、Node.jsを「安定版」でインストールする。\\n\\n```\\n$ nodebrew install stable\\n```\\n\\n5.以下のコマンドを実行して、Node.jsの「安定版」を利用するように反映する。\\n\\n```\\n$ nodebrew use stable\\n```\\n\\n## ■おまけ\\n\\n以下のコマンドで、インストールできるNode.jsのバージョンが確認できます。\\n\\n```\\n$ nodebrew ls-remote\\n```\\n\\n上記で確認したバージョンを以下のようにコマンド実行することで、指定バージョンをインストールすることができます。（以下は「v12.5.0」をインストールする場合）\\n\\n```\\n$ nodebrew install-binary v12.5.0\\n```\\n\\nインストールしたら、バージョンを切り替える必要がありますので、以下のコマンドでバージョンを切り替えましょう。\\n\\n```\\n$ nodebrew use v12.5.0\\n```\\n\\nちなみに、インストールしているNode.jsの全てのバージョンを確認したい場合は以下のコマンドです。\\n\\n```\\n$ nodebrew ls\\n```\\n\"},{\"slug\":\"2020-04-29-000000-2\",\"frontmatter\":{\"title\":\"ローカルにNode.jsをインストールする方法【Node.js】\",\"createAt\":\"2020-04-29 00:00\",\"updateAt\":null,\"tags\":[\"Node.js\"]},\"rawContent\":\"$96\"},{\"slug\":\"2020-04-29-000000-3\",\"frontmatter\":{\"title\":\"SwiftUIで地図の詳細を表示する【Swift】\",\"createAt\":\"2020-04-29 00:00\",\"updateAt\":null,\"tags\":[\"SwiftUI\"]},\"rawContent\":\"$97\"},{\"slug\":\"2020-04-29-000000-4\",\"frontmatter\":{\"title\":\"SwiftUIでImageを装飾する【Swift】\",\"createAt\":\"2020-04-29 00:00\",\"updateAt\":null,\"tags\":[\"SwiftUI\"]},\"rawContent\":\"\\n## ■はじめに\\n\\n「[SwiftUIのプロジェクト作成](http://developer-kuro.com/develop/2019/08/20/swiftui-create-project/)」の記事で紹介しているSwiftUIのプロジェクトを作成できる前提とします。（作成方法がわからない場合は「[SwiftUIのプロジェクト作成](http://developer-kuro.com/develop/2019/08/20/swiftui-create-project/)」の記事を参照してください。）\\n\\n## ■SwiftUIでImageを装飾する\\n\\n1.Imageを表示する。（詳細は「[SwiftUIでImageを表示する](http://developer-kuro.com/develop/2019/08/27/swiftui-image/)」の記事を参照してください）\\n\\n![](/images/2020-04-29-000000-4/20220707140339.png)\\n\\n2.「1」で用意した画像を丸く表示するために、以下のコードを追記する。\\n\\n```swift\\n.clipShape(Circle())\\n```\\n\\n![](/images/2020-04-29-000000-4/20220707130339.png)\\n\\n3.「2」で丸くした画像に枠線を追加するために、以下のコードを追記する。\\n\\n```swift\\n.overlay(\\n    Circle().stroke(\\n        Color.gray, lineWidth: 4\\n    )\\n)\\n```\\n\\n![](/images/2020-04-29-000000-4/20220707140314.png)\\n\\n4.「3」で枠線を追加した画像の周りに影を追加するために、以下のコードを追記する。\\n\\n```swift\\n.shadow(radius: 10)\\n```\\n\\n![](/images/2020-04-29-000000-4/20220707120510.png)\\n\\n上記は順番に記載しましたが、それぞれ独立したパラメータなので、好きなように定義できます。\\n\\n色々とパラメータを操作してみてください！！\\n\"},{\"slug\":\"2020-04-29-000000\",\"frontmatter\":{\"title\":\"SwiftUIでMapKitを利用して地図を表示する【Swift】\",\"createAt\":\"2020-04-29 00:00\",\"updateAt\":null,\"tags\":[\"SwiftUI\"]},\"rawContent\":\"\\n# ◾️はじめに\\n\\n「[SwiftUIのプロジェクト作成](http://developer-kuro.com/develop/2019/08/20/swiftui-create-project/)」の記事で紹介しているSwiftUIのプロジェクトを作成できる前提とします。（作成方法がわからない場合は「[SwiftUIのプロジェクト作成](http://developer-kuro.com/develop/2019/08/20/swiftui-create-project/)」の記事を参照してください。）\\n\\n## ■SwiftUIでMapKitを利用して地図を表示する\\n\\n1.以下のソースを記載して、「MapKit」をインポートする。\\n\\n```swift\\nimport MapKit\\n```\\n\\n![](/images/2020-04-29-000000/20220707140318.png)\\n\\n2.以下のソースを記載して、継承を「UIViewRepresentable」に変更し、必要な関数を記載する。\\n\\n```swift\\nstruct ContentView: UIViewRepresentable {\\n    func makeUIView(context: Context) -\u003e MKMapView {\\n        MKMapView(frame: .zero)\\n    }\\n\\n    func updateUIView(_ view: MKMapView, context: Context) {\\n    }\\n}\\n```\\n\\n![](/images/2020-04-29-000000/20220707140335.png)\\n\\n3.プレビュー画面の「Resume」を押下する。\\n\\n![](/images/2020-04-29-000000/20220707140327.png)\\n\\n4.プレビュー画面の「ライブプレビュー」ボタンを押下する。\\n\\n![](/images/2020-04-29-000000/20220707140347.png)\\n\\n5.マップが表示されれば成功です。\\n\\n![](/images/2020-04-29-000000/20220707120844.png)\\n\"},{\"slug\":\"2020-04-28-000000-1\",\"frontmatter\":{\"title\":\"SwiftUIでTextの文字色を変更する【Swift】\",\"createAt\":\"2020-04-28 00:00\",\"updateAt\":null,\"tags\":[\"SwiftUI\"]},\"rawContent\":\"\\n## ■はじめに\\n\\n「[SwiftUIのプロジェクト作成](http://developer-kuro.com/develop/2019/08/20/swiftui-create-project/)」の記事で紹介しているSwiftUIのプロジェクトを作成できる前提とします。（作成方法がわからない場合は「[SwiftUIのプロジェクト作成](http://developer-kuro.com/develop/2019/08/20/swiftui-create-project/)」の記事を参照してください。）\\n\\n## ■SwiftUIでTextの文字色を変更する\\n\\n1.対象のTextを「command」を押下しながらクリックする。\\n\\n2.メニューから「Inspect...」をクリックする。\\n\\n![](/images/2020-04-28-000000-1/20220707130347.png)\\n\\n3.「Color」のプルダウンから希望の色を選択する。\\n\\n![](/images/2020-04-28-000000-1/20220707120417.png)\\n\\n![](/images/2020-04-28-000000-1/20220707140310.png)\\n\\n4.ソースコード上に「.foregroundColor」が追加されていたら成功です。（プレビューで確認してみましょう）\\n\\n![](/images/2020-04-28-000000-1/20220707120334.png)\\n\"},{\"slug\":\"2020-04-28-000000-2\",\"frontmatter\":{\"title\":\"SwiftUIでTextを縦(VStack)に並べて複数表示する【Swift】\",\"createAt\":\"2020-04-28 00:00\",\"updateAt\":null,\"tags\":[\"SwiftUI\"]},\"rawContent\":\"\\n## ■はじめに\\n\\n「SwiftUIのプロジェクト作成」の記事で紹介しているSwiftUIのプロジェクトを作成できる前提とします。（作成方法がわからない場合は「SwiftUIのプロジェクト作成」の記事を参照してください。）\\n\\n## ■SwiftUIでTextを縦(VStack)に並べて複数表示する\\n\\n1.Textを「command」を押下しながらクリックする。\\n\\n2.「Embed in VStack」を押下する。\\n\\n![](/images/2020-04-28-000000-2/20220707130411.png)\\n\\n3.「1」のTextが「VStack」のブロック（カッコ）で囲まれたことを確認する。\\n\\n![](/images/2020-04-28-000000-2/20220707130450.png)\\n\\n4.Xcodeの右上の「＋」を押下する。\\n\\n![](/images/2020-04-28-000000-2/20220707120819.png)\\n\\n5.一番左のViewのメニューを選択して、「Text」をドラッグする。\\n\\n![](/images/2020-04-28-000000-2/20220707120610.png)\\n\\n6.「3」で用意した「VStack」の場所にドロップする。\\n\\n![](/images/2020-04-28-000000-2/20220707120856.png)\\n\\n7.Textが追加されたら成功です。（プレビューで確認してみましょう）\\n\\n![](/images/2020-04-28-000000-2/20220707120306.png)\\n\"},{\"slug\":\"2020-04-28-000000-3\",\"frontmatter\":{\"title\":\"SwiftUIでTextを横(HStack)に並べて複数表示する【Swift】\",\"createAt\":\"2020-04-28 00:00\",\"updateAt\":null,\"tags\":[\"SwiftUI\"]},\"rawContent\":\"\\n## ■はじめに\\n\\n「[SwiftUIのプロジェクト作成](http://developer-kuro.com/develop/2019/08/20/swiftui-create-project/)」の記事で紹介しているSwiftUIのプロジェクトを作成できる前提とします。（作成方法がわからない場合は「[SwiftUIのプロジェクト作成](http://developer-kuro.com/develop/2019/08/20/swiftui-create-project/)」の記事を参照してください。）\\n\\n## ■SwiftUIでTextを横(HStack)に並べて複数表示する\\n\\n1.Textを「command」を押下しながらクリックする。\\n\\n2.「Embed in HStack」を押下する。\\n\\n![](/images/2020-04-28-000000-3/20220707120359.png)\\n\\n3.「1」のTextが「HStack」のブロック（カッコ）で囲まれたことを確認する。\\n\\n![](/images/2020-04-28-000000-3/20220707120708.png)\\n\\n4.Xcodeの右上の「＋」を押下する。\\n\\n![](/images/2020-04-28-000000-3/20220707120528.png)\\n\\n5.一番左のViewのメニューを選択して、「Text」をドラッグする。\\n\\n![](/images/2020-04-28-000000-3/20220707120723.png)\\n\\n6.「3」で用意した「 HStack」の場所にドロップする。\\n\\n![](/images/2020-04-28-000000-3/20220707120439.png)\\n\\n7.Textが追加されたら成功です。（プレビューで確認してみましょう）\\n\\n![](/images/2020-04-28-000000-3/20220707120849.png)\\n\"},{\"slug\":\"2020-04-28-000000-4\",\"frontmatter\":{\"title\":\"SwiftUIでImageを表示する【Swift】\",\"createAt\":\"2020-04-28 00:00\",\"updateAt\":null,\"tags\":[\"SwiftUI\"]},\"rawContent\":\"$98\"},{\"slug\":\"2020-04-28-000000\",\"frontmatter\":{\"title\":\"SwiftUIでTextを上(ZStack)に並べて複数表示する【Swift】\",\"createAt\":\"2020-04-28 00:00\",\"updateAt\":null,\"tags\":[\"SwiftUI\"]},\"rawContent\":\"\\n## ■はじめに\\n\\n「[SwiftUIのプロジェクト作成](http://developer-kuro.com/develop/2019/08/20/swiftui-create-project/)」の記事で紹介しているSwiftUIのプロジェクトを作成できる前提とします。（作成方法がわからない場合は「[SwiftUIのプロジェクト作成](http://developer-kuro.com/develop/2019/08/20/swiftui-create-project/)」の記事を参照してください。）\\n\\n## ■SwiftUIでTextを上(ZStack)に並べて複数表示する\\n\\n1.Xcodeの右上の「＋」を押下する。\\n\\n![](/images/2020-04-28-000000/20220707130305.png)\\n\\n2.一番左のViewのメニューを選択して、「Z Stack」をドラッグする。\\n\\n![](/images/2020-04-28-000000/20220707120544.png)\\n\\n3.「body」内にドロップする。\\n\\n![](/images/2020-04-28-000000/20220707120342.png)\\n\\n4.元々あった、Textを「3」で用意した「ZStack」内にカット＆ペーストする。\\n\\n5.画像の形になれば成功です。（プレビューで確認してみましょう）\\n\\n![](/images/2020-04-28-000000/20220707130309.png)\\n\"},{\"slug\":\"2020-04-27-000000-1\",\"frontmatter\":{\"title\":\"SwiftUIでTextの文字を変更する【Swift】\",\"createAt\":\"2020-04-27 00:00\",\"updateAt\":null,\"tags\":[\"SwiftUI\"]},\"rawContent\":\"\\n## ■はじめに\\n\\n「[SwiftUIのプロジェクト作成](http://developer-kuro.com/develop/2019/08/20/swiftui-create-project/)」の記事で紹介しているSwiftUIのプロジェクトを作成できる前提とします。（作成方法がわからない場合は「[SwiftUIのプロジェクト作成](http://developer-kuro.com/develop/2019/08/20/swiftui-create-project/)」の記事を参照してください。）\\n\\n## ■SwiftUIでTextの文字を変更する\\n\\n1.対象のTextを「command」を押下しながらクリックする。\\n\\n2.メニューから「Inspect...」をクリックする。\\n\\n![](/images/2020-04-27-000000-1/20220707130407.png)\\n\\n3.「Text」の項目を書き換える。\\n\\n![](/images/2020-04-27-000000-1/20220707120318.png)\\n\\n4.ソースコード上の文字が変更されていたら成功です。（プレビューで確認してみましょう）\\n\\n![](/images/2020-04-27-000000-1/20220707120621.png)\\n\"},{\"slug\":\"2020-04-27-000000-2\",\"frontmatter\":{\"title\":\"SwiftUIのプロジェクト作成【Swift】\",\"createAt\":\"2020-04-27 00:00\",\"updateAt\":null,\"tags\":[\"SwiftUI\"]},\"rawContent\":\"$99\"},{\"slug\":\"2020-04-27-000000-3\",\"frontmatter\":{\"title\":\"さくらVPSのドメイン設定\",\"createAt\":\"2020-04-27 00:00\",\"updateAt\":null,\"tags\":[]},\"rawContent\":\"\\n## ■はじめに\\n\\n本記事は、さくらVPSの利用方法がある程度わかっている前提で記載しています。\\n\\nまた、VPSを借りている方を対象としています。\\n\\n## ■ドメインの設定\\n\\n1.さくらVPSコンソール（以降、コンソール）を開く。\\n\\n2.コンソールの左のメニューから、「ドメイン取得・転入」を押下する。\\n\\n![](/images/2020-04-27-000000-3/20220707120453.png)\\n\\n3.欲しいドメインを入力して、「検索」ボタンを押下する。\\n\\n![](/images/2020-04-27-000000-3/20220707115321.png)\\n\\n4.取得したいドメインの「申し込む」ボタンを押下する。（このボタンがない場合には、他者が既に取得している為、別ドメインを使用する必要があります。\\n\\n![](/images/2020-04-27-000000-3/20220707120429.png)\\n\\n5.以降、画面の手順にしたがって、支払情報などを記載する。\\n\\n6.ドメインが取得できたら、以下のリンク先にアクセスする。\\n\\n[https://secure.sakura.ad.jp/menu/domain/](https://secure.sakura.ad.jp/menu/domain/)\\n\\n7.取得したドメインが「利用中」になるまで、数時間〜48時間かかるようなので、それまで待機する。\\n\\n8.利用中になったら「ゾーン編集」を押下する。\\n\\n![](/images/2020-04-27-000000-3/20220707120411.png)\\n\\n「さくらインターネットのネームサーバに設定する（簡単設定）」に設定したいIPアドレスを入力して、「送信する」を押下する。\\n\\n![](/images/2020-04-27-000000-3/20200522143342.png)\\n\\nエントリ名「＠」のタイプ「A」にIPが設定されていればOKです。\\n\\n![](/images/2020-04-27-000000-3/20200522143325.png)\\n\"},{\"slug\":\"2020-04-27-000000-4\",\"frontmatter\":{\"title\":\"Apple Beta Software Programの利用\",\"createAt\":\"2020-04-27 00:00\",\"updateAt\":null,\"tags\":[]},\"rawContent\":\"$9a\"},{\"slug\":\"2020-04-27-000000\",\"frontmatter\":{\"title\":\"SwiftUIでTextのフォントを変更する【Swift】\",\"createAt\":\"2020-04-27 00:00\",\"updateAt\":null,\"tags\":[\"SwiftUI\"]},\"rawContent\":\"\\n## ■はじめに\\n\\n「[SwiftUIのプロジェクト作成](http://developer-kuro.com/develop/2019/08/20/swiftui-create-project/)」の記事で紹介しているSwiftUIのプロジェクトを作成できる前提とします。（作成方法がわからない場合は「[SwiftUIのプロジェクト作成](http://developer-kuro.com/develop/2019/08/20/swiftui-create-project/)」の記事を参照してください。）\\n\\n## ■SwiftUIでTextのフォントを変更する\\n\\n1.対象のTextを「command」を押下しながらクリックする。\\n\\n2.メニューから「Inspect...」をクリックする。\\n\\n![](/images/2020-04-27-000000/20220707130353.png)\\n\\n3.「Font」のプルダウンから希望のフォントを選択する。\\n\\n![](/images/2020-04-27-000000/20220707140305.png)\\n\\n![](/images/2020-04-27-000000/20220707120643.png)\\n\\n4.ソースコード上に「.font」が追加されていたら成功です。（プレビューで確認してみましょう）\\n\\n![](/images/2020-04-27-000000/20220707120750.png)\\n\\n![](/images/2020-04-27-000000/20220707120830.png)\\n\"},{\"slug\":\"2020-04-26-000000-1\",\"frontmatter\":{\"title\":\"SidecarでiPadをサブディスプレイにする方法\",\"createAt\":\"2020-04-26 00:00\",\"updateAt\":null,\"tags\":[]},\"rawContent\":\"$9b\"},{\"slug\":\"2020-04-26-000000-2\",\"frontmatter\":{\"title\":\"NSUserdefaultsにNSMutablearrayを格納する/読み出す【Objective-C】\",\"createAt\":\"2020-04-26 00:00\",\"updateAt\":null,\"tags\":[\"Objective-C\"]},\"rawContent\":\"$9c\"},{\"slug\":\"2020-04-26-000000-3\",\"frontmatter\":{\"title\":\"SQLiteの使用方法【Objective-C】\",\"createAt\":\"2020-04-26 00:00\",\"updateAt\":null,\"tags\":[\"Objective-C\"]},\"rawContent\":\"$9d\"},{\"slug\":\"2020-04-26-000000-4\",\"frontmatter\":{\"title\":\"NSUserDefaultsの基礎【Objective-C】\",\"createAt\":\"2020-04-26 00:00\",\"updateAt\":null,\"tags\":[\"Objective-C\"]},\"rawContent\":\"$9e\"},{\"slug\":\"2020-04-26-000000\",\"frontmatter\":{\"title\":\"UITableViewセルの選択を解除する【Objective-C】\",\"createAt\":\"2020-04-26 00:00\",\"updateAt\":null,\"tags\":[\"Objective-C\"]},\"rawContent\":\"\\n# ◾️はじめに\\n\\nUITableViewは活用していますか？\\n\\nアプリを作る上で、UITableViewは必須と言えるほど利用頻度が高いです。\\n\\n（個人的意見ですよ！！）\\n\\nそのUITableViewにも欠点があります。\\n\\nそう、UITableViewのCellをタップした後、選択状態が解除されないのです！！\\n\\n灰色っぽいままになっちゃいます。。。\\n\\nUITableViewの選択状態を解除するためには、実装が必要なのですよ。\\n\\nこれには、正直ビックリしましたが、仕方ない！と割り切りましょう。\\n\\nここでは、UITableViewの選択状態を解除する方法を記載します。\\n\\n（UITableViewは表示できている前提で進めます。）\\n\\n# ◾️UITableViewセルの選択を解除する\\n\\nUITableViewの選択状態を解除するには、UITableViewのDelegateの「didSelectRowAtIndexpath」メソッドに\\n 以下を記載する事で、解除されます。\\n ※以下の処理が通る事で解除されるので、一定時間後に解除したい場合などは、遅延処理も行いましょう！\\n\\n```objectivec\\n[self.tableView deselectRowAtIndexPath:indexPath animated:YES];\\n```\\n\"},{\"slug\":\"2020-04-25-000000-1\",\"frontmatter\":{\"title\":\"処理を遅延実行する【Swift】\",\"createAt\":\"2020-04-25 00:00\",\"updateAt\":null,\"tags\":[\"Swift\"]},\"rawContent\":\"\\n# ◾️処理の遅延実行\\n\\nアプリケーションを作成していると、処理を遅延して実行したい場合がある。\\n（データの更新を行なった後、0.5秒後に処理をするなど。）\\n\\nそのような場合に、以下のように記載する事で処理を遅延させることができる。\\n※以下では、0.5秒後の遅延処理ですが、「0.5」の部分を書き換えれば遅延時間を変更できます。\\n※ちなみに、処理を一定時間ごとに実行したい場合には、別のタイマーを使用した方法を利用する方がいいです。\\n\\n```swift\\nDispatchQueue.main.asyncAfter(deadline: .now() + 0.5) {\\n    // 0.5秒後に実行したい処理\\n}\\n```\\n\"},{\"slug\":\"2020-04-25-000000-2\",\"frontmatter\":{\"title\":\"ナビゲーションバーを透過させる【Swift】\",\"createAt\":\"2020-04-25 00:00\",\"updateAt\":null,\"tags\":[\"Swift\"]},\"rawContent\":\"\\n# ■はじめに\\n\\nアプリケーションを開発していると、画像のプレビュー画面などでナビゲーションバーはつけたいけど透明にしておきたい。\\nという場面が出てくる。\\n\\nここでは、ナビゲーションバーを透明にする方法と、透明から戻す方法を記載する。\\n※ナビゲーションバーを透明にしても、ナビゲーションアイテムは透明にならないので、ボタンの押下は可能です。\\n\\n# ◾️ナビゲーションバーを透明にする方法\\n\\nナビゲーションバーを透明にする方法は以下です。\\n「viewWillAppear」などで使用するのがいいと思います。\\n\\n```swift\\nself.navigationController?.navigationBar.setBackgroundImage(UIImage(), for: .default)\\nself.navigationController?.navigationBar.shadowImage = UIImage()\\n```\\n\\n# ◾️ナビゲーションバーを透明から戻す方法\\n\\nナビゲーションバーを透明から戻す方法は以下です。\\n「viewWillDisappear」などで使用するのがいいと思います。\\n\\n```swift\\nself.navigationController?.navigationBar.setBackgroundImage(nil, for: .default)\\nself.navigationController?.navigationBar.shadowImage = nil\\n```\\n\"},{\"slug\":\"2020-04-25-000000-3\",\"frontmatter\":{\"title\":\"画面サイズやステータスバーのサイズ【Swift】\",\"createAt\":\"2020-04-25 00:00\",\"updateAt\":null,\"tags\":[\"Swift\"]},\"rawContent\":\"\\n# ◾️デバイスの各サイズの取得方法\\n\\nUIをソースコードで実装したい場合や、動的にUIを調整する場合など、ソースコードでUIを変更することはよくあります。\\nその際に、端末のサイズやナビゲーションバーの高さなどを取得したいことがあります。\\n\\nそれぞれのサイズの取得方法を以下に記載します。\\n\\n```swift\\n// ステータスバーの高さを取得\\nlet statusBarHeight: CGFloat = UIApplication.shared.statusBarFrame.height\\n// ナビゲーションバーの高さを取得（ナビゲーションバーが存在しない場合には、0を設定する）\\nlet navBarHeight: CGFloat = self.navigationController?.navigationBar.frame.size.height ?? 0\\n// タブバーの高さを取得（タブバーが存在しない場合には、0を設定する）\\nlet tabBarHeight: CGFloat = self.tabBarController?.tabBar.frame.size.height ?? 0\\n// 端末の画面の幅を取得\\nlet width = UIScreen.main.bounds.size.width\\n// 端末の画面の高さを取得\\nlet height = UIScreen.main.bounds.size.height\\n```\\n\"},{\"slug\":\"2020-04-25-000000-4\",\"frontmatter\":{\"title\":\"ソースコードで画面遷移【Swift】\",\"createAt\":\"2020-04-25 00:00\",\"updateAt\":null,\"tags\":[\"Swift\"]},\"rawContent\":\"$9f\"},{\"slug\":\"2020-04-25-000000\",\"frontmatter\":{\"title\":\"一定時間ごとに処理を実行する【Swift】\",\"createAt\":\"2020-04-25 00:00\",\"updateAt\":null,\"tags\":[\"Swift\"]},\"rawContent\":\"\\n# ◾️一定時間ごとに処理\\n\\nアプリケーションを作成していると、処理を一定時間毎に実行したい場合がある。\\n（1秒毎にデータの更新処理をするなど。）\\n\\nそのような場合に、以下のように記載する事で一定時間毎に処理を実行する事ができる。\\n※以下では、1秒毎の遅延処理ですが、「1.0」の部分を書き換えれば処理時間を変更できます。\\n\\n一定時間毎の処理を止めたい場合には、「timer.invalidate()」を実行する事で止めることができる。\\n\\n```swift\\nimport UIKit\\n\\nclass ViewController: UIViewController {\\n    var timer = Timer()\\n\\n    override func viewDidLoad() {\\n        super.viewDidLoad()\\n\\n        // 1秒毎に処理を実行する\\n        timer = Timer.scheduledTimer(withTimeInterval: 1.0, repeats: true, block: { (timer) in\\n            // 一定時間ごとに実行したい処理を記載する\\n        })\\n\\n        // タイマーを停止する\\n        // timer.invalidate()\\n    }\\n}\\n```\\n\"},{\"slug\":\"2020-04-24-000000-1\",\"frontmatter\":{\"title\":\"QRコードの生成【Swift】\",\"createAt\":\"2020-04-24 00:00\",\"updateAt\":null,\"tags\":[\"Swift\"]},\"rawContent\":\"$a0\"},{\"slug\":\"2020-04-24-000000-2\",\"frontmatter\":{\"title\":\"UIButtonを回転させる【Swift】\",\"createAt\":\"2020-04-24 00:00\",\"updateAt\":null,\"tags\":[\"Swift\"]},\"rawContent\":\"\\n# ◾️UIButtonを回転させる\\n\\n端末を回転させた時などで、表示しているボタンも回転させたい場合があります。\\nその場合のボタンを回転させる方法を以下に記載します。\\n※ボタン以外もほぼ同様の方法で可能です。\\n\\n端末を回転させた時などで、表示しているボタンも回転させたい場合があります。\\nその場合のボタンを回転させる方法を以下に記載します。\\n※ボタン以外もほぼ同様の方法で可能です。\\n\\n```swift\\n// 円周率（π）を取得\\nlet pi = CGFloat.pi\\n\\n// ホームボタンが下になる向き\\n[Buttonの変数].transform = rotation: CGAffineTransform(rotationAngle: CGFloat(0.0 * pi))\\n\\n// ホームボタンが上になる向き\\n[Buttonの変数].transform = rotation: CGAffineTransform(rotationAngle: CGFloat(1.0 * pi))\\n\\n// ホームボタンが右になる向き\\n[Buttonの変数].transform = rotation: CGAffineTransform(rotationAngle: CGFloat(0.5 * pi))\\n\\n// ホームボタンが左になる向き\\n[Buttonの変数].transform = rotation: CGAffineTransform(rotationAngle: CGFloat(-0.5 * pi))\\n```\\n\"},{\"slug\":\"2020-04-24-000000-3\",\"frontmatter\":{\"title\":\"動画のプレビュー【Swift】\",\"createAt\":\"2020-04-24 00:00\",\"updateAt\":null,\"tags\":[\"Swift\"]},\"rawContent\":\"$a1\"},{\"slug\":\"2020-04-24-000000-4\",\"frontmatter\":{\"title\":\"動画や画像の圧縮【Swift】\",\"createAt\":\"2020-04-24 00:00\",\"updateAt\":null,\"tags\":[\"Swift\"]},\"rawContent\":\"$a2\"},{\"slug\":\"2020-04-24-000000\",\"frontmatter\":{\"title\":\"QRコードリーダー【Swift】\",\"createAt\":\"2020-04-24 00:00\",\"updateAt\":null,\"tags\":[\"Swift\"]},\"rawContent\":\"$a3\"},{\"slug\":\"2020-04-23-000000-1\",\"frontmatter\":{\"title\":\"端末の回転を検知する【Swift】\",\"createAt\":\"2020-04-23 00:00\",\"updateAt\":null,\"tags\":[\"Swift\"]},\"rawContent\":\"$a4\"},{\"slug\":\"2020-04-23-000000-2\",\"frontmatter\":{\"title\":\"UserDefaults【Swift】\",\"createAt\":\"2020-04-23 00:00\",\"updateAt\":null,\"tags\":[\"Swift\"]},\"rawContent\":\"$a5\"},{\"slug\":\"2020-04-23-000000-3\",\"frontmatter\":{\"title\":\"UserDefaultsに配列・辞書を設定【Swift】\",\"createAt\":\"2020-04-23 00:00\",\"updateAt\":null,\"tags\":[\"Swift\"]},\"rawContent\":\"$a6\"},{\"slug\":\"2020-04-23-000000-4\",\"frontmatter\":{\"title\":\"処理の共通化【Swift】\",\"createAt\":\"2020-04-23 00:00\",\"updateAt\":null,\"tags\":[\"Swift\"]},\"rawContent\":\"$a7\"},{\"slug\":\"2020-04-23-000000\",\"frontmatter\":{\"title\":\"Selectorで引数を渡す【Swift】\",\"createAt\":\"2020-04-23 00:00\",\"updateAt\":null,\"tags\":[\"Swift\"]},\"rawContent\":\"$a8\"},{\"slug\":\"2020-04-22-000000-1\",\"frontmatter\":{\"title\":\"JSONの操作【Swift】\",\"createAt\":\"2020-04-22 00:00\",\"updateAt\":null,\"tags\":[\"Swift\"]},\"rawContent\":\"$a9\"},{\"slug\":\"2020-04-22-000000-2\",\"frontmatter\":{\"title\":\"Realm【Swift】\",\"createAt\":\"2020-04-22 00:00\",\"updateAt\":null,\"tags\":[\"Swift\"]},\"rawContent\":\"$aa\"},{\"slug\":\"2020-04-22-000000-3\",\"frontmatter\":{\"title\":\"アラートダイアログ【Swift】\",\"createAt\":\"2020-04-22 00:00\",\"updateAt\":null,\"tags\":[\"Swift\"]},\"rawContent\":\"$ab\"},{\"slug\":\"2020-04-22-000000-4\",\"frontmatter\":{\"title\":\"SQLite【Swift】\",\"createAt\":\"2020-04-22 00:00\",\"updateAt\":null,\"tags\":[\"Swift\"]},\"rawContent\":\"$ac\"},{\"slug\":\"2020-04-22-000000\",\"frontmatter\":{\"title\":\"キーボードに閉じるボタンを追加（UITextField,UITextView）【Swift】\",\"createAt\":\"2020-04-22 00:00\",\"updateAt\":null,\"tags\":[\"Swift\"]},\"rawContent\":\"$ad\"},{\"slug\":\"2020-04-21-000000-1\",\"frontmatter\":{\"title\":\"イニシャライザ【Swift】\",\"createAt\":\"2020-04-21 00:00\",\"updateAt\":null,\"tags\":[\"Swift\"]},\"rawContent\":\"\\n# ◾️イニシャライザ\\n\\nイニシャライザとは、クラスのインスタンス生成時に必ず実行されるメソッドの事である。\\n以下の様にイニシャライザの定義を行う\\n\\n（記載ルール）\\n\\n```swift\\nclass クラス名 {\\n    プロパティ\\n    メソッド\\n    init(){\\n        // イニシャライザの処理\\n    }\\n}\\n```\\n\\n（例）\\n\\n```swift\\nclass Cls {\\n    var name:String = \\\"Hello\\\"\\n    func kansu(){\\n        print(\\\"clsのkansuメソッド\\\")\\n    }\\n    init(){\\n        print(\\\"init\\\")\\n    }\\n}\\n```\\n\\n注意点は、メソッドの様な形で宣言するのだが、「func」を記述しない点である。\\n\\n「func」を記述するとエラーとなるので、注意する事。\\n\"},{\"slug\":\"2020-04-21-000000-2\",\"frontmatter\":{\"title\":\"アクセス修飾子【Swift】\",\"createAt\":\"2020-04-21 00:00\",\"updateAt\":null,\"tags\":[\"Swift\"]},\"rawContent\":\"\\n# ◾️アクセス修飾子\\n\\nアクセス修飾子とは、クラスやメソッド、プロパティなどがどこからアクセス可能であるかを設定する修飾子である。\\n\\nSwiftのアクセス修飾子には以下がある。\\n\\n【open】\\n\\nモジュール外からもアクセスできる一番ゆるいアクセス修飾子である。\\n\\n【public】\\n\\nモジュール外からもアクセスできるが、サブクラスかされず、overrideもできないアクセス修飾子である。\\n\\n【internal】\\n\\nモジュール内であればアクセスができるアクセス修飾子である。\\nアクセス修飾子を指定しない場合には、このアクセス修飾子が設定される。\\n\\n【fileprivate】\\n\\n同じファイル内であればアクセスができるアクセス修飾子である。\\n\\n【private】\\n\\nクラスなどの宣言内であればアクセスができるアクセス修飾子である。\\n\\n基本的な使用方法は以下である。（例ではクラスに対してアクセス修飾子を定義する。）\\n\\n```swift\\nアクセス修飾子 class クラス名{\\n}\\n```\\n\"},{\"slug\":\"2020-04-21-000000-3\",\"frontmatter\":{\"title\":\"オーバーライド【Swift】\",\"createAt\":\"2020-04-21 00:00\",\"updateAt\":null,\"tags\":[\"Swift\"]},\"rawContent\":\"\\n# ◾️オーバーライド\\n\\nクラスを継承したが、あるメソッドは、スーパークラスのメソッドではなく、サブクラスのメソッドを使用したい場合がある。\\nそのようなときは、以下のコードのようにoverrideを先頭に書いてメソッドを定義することで、スーパークラスの関数を上書きできる。\\nこれをオーバーライドという。\\n※メソッド名、引数、戻り値などで相違する点がある場合にはコンパイルエラーが発生する。\\n\\n```swift\\nclass サブクラス名：スーパークラス名 {\\n    プロパティ\\n    メソッド\\n    override func スーパークラスと同じメソッド名(){\\n        // 新しい処理\\n    }\\n}\\n```\\n\\n# ◾️スーパークラスのメソッドの呼び出し\\n\\nスーパークラスのメソッドをオーバーライドしたけど、オーバーライド前のスーパークラスのメソッドを呼び出したいときがある。\\nそんなときは、以下の様にsuperに対してオーバーライドしたメソッドを呼び出す。\\nsuperとはスーパークラスの事を意味している。\\nメソッドをオーバーライドしてもスーパークラスのメソッドが完全に消えてしまうわけでは無い。\\n\\n```swift\\nclass サブクラス名：スーパークラス名 {\\n    プロパティ\\n    メソッド\\n    override func スーパークラスと同じメソッド名(){\\n        // 新しい処理\\n        super.スーパークラスと同じメソッド名()\\n    }\\n}\\n```\\n\"},{\"slug\":\"2020-04-21-000000-4\",\"frontmatter\":{\"title\":\"クラス,インスタンス【Swift】\",\"createAt\":\"2020-04-21 00:00\",\"updateAt\":null,\"tags\":[\"Swift\"]},\"rawContent\":\"\\n# ◾️クラス,インスタンス\\n\\nクラスとは、プロパティ（データ）とメソッド（操作）を集めて1つにまとめたコードの事である。\\nただし、クラスはインスタンスという物を生成して始めてオブジェクトの役割を担うことができる。\\n言わば、クラスは設計図、インスタンスは設計図を元に作られた実体のような物である。\\n※メソッドとは、クラス内に定義する関数の事である。\\n\\nクラスの定義は以下の様に行う。\\n\\n（記載ルール）\\n\\n```swift\\nclass クラス名 {\\n    プロパティ\\n    メソッド\\n}\\n```\\n\\n（例）\\n\\n```swift\\nclass Cls {\\n    var name:String = \\\"Hello\\\"\\n    func kansu(){\\n        print(\\\"clsのkansuメソッド\\\")\\n    }\\n}\\n```\\n\\n次に呼び出すクラスのインスタンスを生成する。\\n以下のように記述する事でインスタンスが変数に代入される。\\n\\n（記載ルール）\\n\\n```swift\\nvar インスタンス変数名 = クラス名()\\n```\\n\\n（例）\\n\\n```swift\\nlet instans = Cls()\\n```\\n\\nそして、以下の様に記述する事でクラス内のプロパティやメソッドを呼び出す。\\n\\n（記載ルール）\\n\\n```swift\\nインスタンス変数名.プロパティ\\nインスタンス変数名.メソッド()\\n```\\n\\n（例）\\n\\n```swift\\ninstans.name\\ninstans.kansu()\\n```\\n\"},{\"slug\":\"2020-04-21-000000\",\"frontmatter\":{\"title\":\"クラス継承【Swift】\",\"createAt\":\"2020-04-21 00:00\",\"updateAt\":null,\"tags\":[\"Swift\"]},\"rawContent\":\"\\n# ◾️クラス継承\\n\\nクラス継承とは、あるクラスのプロパティ、メソッドを引き継ぎながら新しいクラスを作成する事である。\\n継承する親のクラスの事をスーパークラス、スーパークラスを継承した子クラスの事をサブクラスという。\\nサブクラスはスーパークラスの全ての機能を利用できる。\\n※複数のクラスからの継承できない。\\n\\n複数のクラスで共通したメソッドやプロパティがある場合に使用される。\\n以下に、サブクラスの実装方法を記載する。（スーパークラスは通常のクラス作成と同様である）\\n\\n```swift\\nclass サブクラス名：スーパークラス名 {\\n    プロパティ\\n    メソッド\\n}\\n```\\n\\n# ◾️クラスの継承禁止\\n\\nクラスによっては、安全な作りにする為に、継承させたくないクラスが出てくる事がある。\\nそのようなときは、以下の様にfinalをつけてクラス宣言すると他のクラスが継承することができないクラスを記述する事ができる。\\n\\n```swift\\nfinal class クラス名 {\\n    プロパティ\\n    メソッド\\n}\\n```\\n\"},{\"slug\":\"2020-04-20-000000-1\",\"frontmatter\":{\"title\":\"関数【Swift】\",\"createAt\":\"2020-04-20 00:00\",\"updateAt\":null,\"tags\":[\"Swift\"]},\"rawContent\":\"\\n# ◾️関数\\n\\n関数とは、特定の処理をする小分けにされたプログラムの事である。\\nプログラムの中で何度も繰り返す一連の処理をそのまま記述すると、似たようなコードが散在してソースが見づらくなり、修正が必要になった時に時間がかかってしまう。\\nそのような時は、一連の処理を関数として切り出し、呼び出して使う事でソースがすっきりし、修正箇所を限定するができる。\\n\\n関数の作成方法は以下である。\\n\\n（記載ルール）\\n\\n```swift\\nfunc 関数名(){\\n    // 関数の中の処理\\n}\\n```\\n\\n（例）\\n\\n```swift\\nfunc kansu(){\\n    print(\\\"関数の呼び出し\\\")\\n}\\n```\\n\\n関数の呼び出しは以下の様に呼び出す。\\n\\n（記載ルール）\\n\\n```swift\\n呼び出したい関数名()\\n```\\n\\n（例）\\n\\n```swift\\nkansu()\\n```\\n\\nなぜ、関数を使用するのかというと、仮に10行の処理を100回実行したい場合があったとする。\\n今までは「10行×100回で1000行処理」を書く必要があるが、この10行の処理を関数に記載する事で、100回その関数を呼び出すだけで良い。\\nそれだけでなく、仮にこの10行の処理を修正する必要がある場合、関数を使用しなければ、100回使用している分を全て修正する必要があるが、\\n関数にまとめると、この関数を修正するだけで良い為、非常に楽に修正ができる。\\n\\nこの様な利点がある為、共通的な処理は関数にまとめる方が良い。\\n\"},{\"slug\":\"2020-04-20-000000-2\",\"frontmatter\":{\"title\":\"オプショナル型の「？」「！」の違い【Swift】\",\"createAt\":\"2020-04-20 00:00\",\"updateAt\":null,\"tags\":[\"Swift\"]},\"rawContent\":\"\\n# ◾️オプショナル型の「？」「！」の違い\\n\\nオプショナル型の宣言で、型の後ろに「？」「！」が付いているが、この違いは以下である。\\n「？」：nilを代入する事を許す。（オプショナル型）\\n「！」：nilを代入する事を許し、変数を使用する時に強制的アンラップする。（暗黙的アンラップ型）\\n\\n暗黙的アンラップ型の「！」は強制的アンラップとは別物である。\\n暗黙的アンラップ型は、使用するとき必ず強制的アンラップをする為、以下の様に使用する事ができる。\\n\\n（記載ルール）\\n\\n```swift\\nlet 定数名: 型! = 値\\nprint(定数名)\\n```\\n\\n（例）\\n\\n```swift\\nvar str: String! = \\\"オプショナル型\\\"\\nprint(str)\\n```\\n\"},{\"slug\":\"2020-04-20-000000-3\",\"frontmatter\":{\"title\":\"オーバーロード【Swift】\",\"createAt\":\"2020-04-20 00:00\",\"updateAt\":null,\"tags\":[\"Swift\"]},\"rawContent\":\"\\n# ◾️オーバーロード\\n\\nオーバーロードとは、関数名は同じだが、引数や戻り値が違う関数を定義する事である。\\n以下に一例を記載する。（以下の例では、引数の型が相違する為、エラーにならない）\\n\\n（例）\\n\\n```swift\\nfunc funcA(sample:String){\\n    // 関数の中の処理\\n}\\nfunc funcA(sample:Int){\\n    // 関数の中の処理\\n}\\n```\\n\\nこの様に定義する事で、引数が文字列の場合は上の関数の処理を実行、引数が数値の場合は下の関数の処理を実行という様な分け方もできる。\\nしかし、以下の様に関数名、引数が同じで戻り値の型のみ相違する場合には注意が必要である。\\n\\n（例）\\n\\n```swift\\nfunc funcA(sample:String) -\u003e String{\\n    // 関数の中の処理\\n    return \\\"戻り値\\\"\\n}\\nfunc funcA(sample:String) -\u003e Int{\\n    // 関数の中の処理\\n    return 0\\n}\\n```\\n\\nこの場合、関数の呼び出しは同じになる為、受け取った後、データ型を明記した変数や定数に設定する必要がある。\\n\\n（例）\\n\\n```swift\\nlet str :String = funcA(sample:\\\"引数\\\")\\n→上のメソッドが実行される。（戻り値の型がStringの方）\\n\\nlet num :Int = funcA(sample:\\\"引数\\\")\\n→下のメソッドが実行される。（戻り値の型がIntの方）\\n\\nfuncA(sample:\\\"引数\\\")\\n→エラーになる。\\n```\\n\"},{\"slug\":\"2020-04-20-000000-4\",\"frontmatter\":{\"title\":\"引数【Swift】\",\"createAt\":\"2020-04-20 00:00\",\"updateAt\":null,\"tags\":[\"Swift\"]},\"rawContent\":\"\\n# ◾️引数\\n\\n引数（ひきすう）とは、関数に値を渡す方法である。\\n※引数は「,」で区切る事で複数指定する事が可能である。\\n\\n以下の様に記載する。\\n\\n（記載ルール）\\n\\n```swift\\nfunc 関数名(関数内で使用する変数名:データ型, 、、、){\\n    // 関数の中の処理\\n}\\n```\\n\\n（例）\\n\\n```swift\\nfunc kansu(str:String){\\n    print(\\\"引数は\\\\(str)である\\\")\\n}\\n```\\n\\n引数を利用する際の呼び出しは以下の様に呼び出す。\\n\\n（記載ルール）\\n\\n```swift\\n呼び出したい関数名(関数内で使用する変数名:渡したい値, 、、、)\\n```\\n\\n（例）\\n\\n```swift\\nkansu(str: \\\"hikisuu\\\")\\n```\\n\\n関数の呼び出し時に記載する「関数内で使用する変数名」を省略する事ができる。\\n省略する為には、以下の様に関数を定義する必要がある。\\n※「関数内で使用する変数名」の前にスペースを開けて「_」を記載する事で省略ができる。\\n\\n（記載ルール）\\n\\n```swift\\nfunc 関数名(_ 関数内で使用する変数名:データ型, 、、、){\\n    // 関数の中の処理\\n}\\n```\\n\\n（例）\\n\\n```swift\\nfunc kansu(_ str:String){\\n    print(\\\"引数は\\\\(str)である\\\")\\n}\\n```\\n\\n引数を利用する際の呼び出しは以下の様に呼び出す。\\n\\n（記載ルール）\\n\\n```swift\\n呼び出したい関数名(渡したい値, 、、、)\\n```\\n\\n（例）\\n\\n```swift\\nkansu(\\\"hikisuu\\\")\\n```\\n\"},{\"slug\":\"2020-04-20-000000\",\"frontmatter\":{\"title\":\"戻り値【Swift】\",\"createAt\":\"2020-04-20 00:00\",\"updateAt\":null,\"tags\":[\"Swift\"]},\"rawContent\":\"\\n# ◾️戻り値\\n\\n戻り値とは、関数を呼び出したときに関数から返ってくる値の事である。\\n以下のコードように関数の引数のあとに「-\u003e 戻り値の型」を記述する事で値を返す関数を定義する事ができる。\\n処理の中で「return 値」と記述すると関数の処理が終了し、呼び元に値を返す。\\n※戻り値の型を指定すると、「return」を記載しないとビルドエラーになる為、注意が必要である。\\n\\n（記載ルール）\\n\\n```swift\\nfunc 関数名(引数名:データ型,、、、) -\u003e 戻り値の型{\\n    // 関数の中の処理\\n    return 戻り値\\n}\\n```\\n\\n（例）\\n\\n```swift\\nfunc kansu(str:String) -\u003e String {\\n    let result:String = \\\"引数は　\\\" + str + \\\"である\\\"\\n    return result\\n}\\n```\\n\"},{\"slug\":\"2020-04-19-000000-1\",\"frontmatter\":{\"title\":\"オプショナル（Optional）型【Swift】\",\"createAt\":\"2020-04-19 00:00\",\"updateAt\":null,\"tags\":[\"Swift\"]},\"rawContent\":\"\\n## ◾️オプショナル（Optional）型\\n\\n「オプショナル型」とは、変数にnilの代入を許す型の事である。\\n※「nil」とはデータが無い状態を表す。\\n\\nデフォルトではnilの代入を許さない「非オプショナル型」である。\\n明示的にオプショナル型の宣言を行う事で、nilの代入を許す事ができる。\\n\\nオプショナル型の宣言は以下である。\\n※型の後ろの「？」「！」の違いは、後の記事で説明する。\\n現状は、オプショナル型の宣言は「？」をつける方法を使用し、「！」は「この様な方法もある」程度に認識すれば良い。\\n\\n（記載ルール）\\n\\n```swift\\nlet 変数名:型?\\nlet 変数名:型!\\n```\\n\\nオプショナル型のInt型の変数（b）と、非オプショナル型のInt型の変数（a）で足し算などの計算を行う場合、計算ができず、エラーが起きる。\\n\\n（例）\\n\\n```swift\\nlet a:Int= 10\\nlet b:Int? = 10\\nprint(a + b)\\n\\n→エラー\\n```\\n\\n上記でエラーが発生する理由は、オプショナル型を使用する事で、値は「Optional(値)」という形式になり、非オプショナル型との計算ができない為、エラーとなる。\\nここで、エラーを発生させない為に、オプショナル型のアンラップを行い、計算する必要がある。\\n\\n# ◾️オプショナル型のアンラップ\\n\\nオプショナル型のアンラップの方法はいくつかある。\\n代表的なアンラップの方法は以下である。\\n※以下のアンラップ方法の目的はオプショナル型の変数から値を取り出す事である。\\n\\nForced Unwrapping (強制的アンラップ)\\nOptional Binding (オプショナルバインディング)\\nOptional Chaining (オプショナルチェイニング)\\n\\nそれぞれのアンラップの使用方法は後の記事で説明する。\\n\"},{\"slug\":\"2020-04-19-000000-2\",\"frontmatter\":{\"title\":\"Optional Chaining (オプショナルチェイニング)【Swift】\",\"createAt\":\"2020-04-19 00:00\",\"updateAt\":null,\"tags\":[\"Swift\"]},\"rawContent\":\"\\n# ◾️Optional Chaining (オプショナルチェイニング)\\n\\nオプショナルチェイニングもオプショナル型の変数の中身がnilのときに安全にプログラムを実行するための機能である。\\nオプショナルチェイニングはオプショナル型の変数に続けてプロパティを取得したり、メソッドを呼び出す場合に使用する。\\n※注意点：オプショナルチェイニングに続けて取得したプロパティやメソッドの戻り値はオプショナル型になる為、使用する際にはアンラップが必要である。\\n※クラスのインスタンス変数などで使用する事があるが、あまり使用しないので覚える必要はない。\\n\\n【記載ルール】\\n\\n```swift\\nオプショナル型の変数?.プロパティ\\nオプショナル型の変数?.メソッド()\\n```\\n\"},{\"slug\":\"2020-04-19-000000-3\",\"frontmatter\":{\"title\":\"比較演算子・論理演算子【Swift】\",\"createAt\":\"2020-04-19 00:00\",\"updateAt\":null,\"tags\":[\"Swift\"]},\"rawContent\":\"\\n# ◾️比較演算子\\n\\n比較演算子では主に2つ値を比較して、比較結果によって条件が真（true）または偽（false）を返す方法である。\\n文字列同士の比較の場合でも、この比較演算子を使用する。\\n（他の言語では、文字列同士の比較で比較演算子が使用できない場合がある。）\\n\\n主な比較演算子：\\n・a == b：aとbが等しい場合にtrue、等しくなければfalse\\n・a != b：aとbが等しくなければtrue、等しい場合はfalse\\n・a \u003e b：aがbより大きい場合にtrue、aとbが等しいまたはbが大きい場合はfalse\\n・a \u003c b：aよりbが大きい場合にtrue、aとbが等しいまたはaが大きい場合はfalse\\n・a \u003e= b：aとbが等しいまたはaがbより大きければtrue、aがbより小さければfalse\\n・a \u003c= b：aとbが等しいまたはaがbより小さければtrue、aがbより大きければfalse\\n\\n# ◾️論理演算子\\n\\n値の比較を行いたい時に、複数の比較演算子を組み合わせて比較する事もよくある。\\n例えば条件式1と条件式2を1つのif文で比較したい場合は論理演算子を使用する。\\n\\n主な論理演算子：\\n・条件式1 \u0026\u0026 条件式2：条件式1と条件式2が成り立てばtrue、どちらかが成り立たない場合はfalse\\n・条件式1 || 条件式2：条件式1と条件式2のどちらかが成り立てばtrue、両方とも成り立たない場合はfalse\\n\"},{\"slug\":\"2020-04-19-000000-4\",\"frontmatter\":{\"title\":\"Optional Binding (オプショナルバインディング)【Swift】\",\"createAt\":\"2020-04-19 00:00\",\"updateAt\":null,\"tags\":[\"Swift\"]},\"rawContent\":\"\\n# ◾️Optional Binding (オプショナルバインディング)\\n\\n強制的アンラップはオプショナル型の変数を中身の値に関係なくアンラップした。\\nそのため変数にnilが入ってしまうとアプリケーションが落ちてしまうという問題がある。\\n\\nこの問題を解決するアンラップの方法がオプショナルバインディングである。\\n\\nオプショナルバインディングはif文などの条件式と組み合わせて使う。\\n\\n（記載ルール）\\n\\n```swift\\nlet 定数名: 型? = 値\\nif let 定数名1 = 定数名 {\\n    // [定数名]がnilではない場合\\n} else {\\n    // [定数名]がnilの場合\\n}\\n```\\n\\n（例）\\n\\n```swift\\nvar str: String? = \\\"オプショナル型\\\"\\nif let unwrappedStr = str {\\n    print(unwrappedStr)\\n} else {\\n    print(\\\"strはnil\\\")\\n}\\n```\\n\"},{\"slug\":\"2020-04-19-000000\",\"frontmatter\":{\"title\":\"Forced Unwrapping (強制的アンラップ)【Swift】\",\"createAt\":\"2020-04-19 00:00\",\"updateAt\":null,\"tags\":[\"Swift\"]},\"rawContent\":\"\\n## ◾️Forced Unwrapping (強制的アンラップ)\\n\\nForced Unwrapping(強制的アンラップ)はオプショナル型を強制的にアンラップする方法である。\\nオプショナル型の変数の中にどんな値が入っていても関係なく、その値を取り出す。\\n※注意点：アンラップする対象のオプショナル型の変数の中身がnilだった場合、エラーが発生し、アプリケーションが落ちてしまう為、nilが入る事がない状況で使用する事。\\n\\n強制的アンラップの記述方法は簡単で、オプショナル型の変数の後ろに「!」をつける事でアンラップされる。\\n※この「!」は変数宣言時に使用する「!」とは別である。\\n\\n（記載ルール）\\n\\n```swift\\nlet 定数名: 型? = 値\\nprint(定数名!)\\n```\\n\\n（例）\\n\\n```swift\\nlet str: String? = \\\"オプショナル型\\\"\\nprint(str!)\\n```\\n\"},{\"slug\":\"2020-04-18-000000-1\",\"frontmatter\":{\"title\":\"while,repeat while文【Swift】\",\"createAt\":\"2020-04-18 00:00\",\"updateAt\":null,\"tags\":[\"Swift\"]},\"rawContent\":\"\\n# ◾️while\\n\\n「while」文とは条件が真の場合に処理を繰り返すループ処理である。\\n指定した条件に達するまで、ずっとループを繰り返す場合などに使用する。\\n※指定した条件に達する事がない場合、無限ループに陥る事がある為、注意が必要である。\\n\\n（記載ルール）\\n\\n```swift\\nwhile (ループ条件) {\\n    // 処理\\n}\\n```\\n\\n（例）\\n\\n```swift\\nvar num = 0\\nwhile(num \u003c 10) {\\n    print(num)\\n    num += 1\\n}\\n```\\n\\n# ◾️repeat while\\n\\n「repeat while」は、最初に処理を実行した後で指定したループ条件をチェックし、満たしている間はループを行う。\\nwhile文と違い、最低でも1回は処理が行われる。\\n\\n（記載ルール）\\n\\n```swift\\nrepeat {\\n    // 処理\\n} while (ループ条件)\\n```\\n\\n（例）\\n\\n```swift\\nvar num = 0\\nrepeat {\\n    print(num)\\n    num += 1\\n} while(num \u003e 10)\\n```\\n\"},{\"slug\":\"2020-04-18-000000-2\",\"frontmatter\":{\"title\":\"switch文【Swift】\",\"createAt\":\"2020-04-18 00:00\",\"updateAt\":null,\"tags\":[\"Swift\"]},\"rawContent\":\"$ae\"},{\"slug\":\"2020-04-18-000000-3\",\"frontmatter\":{\"title\":\"for in文【Swift】\",\"createAt\":\"2020-04-18 00:00\",\"updateAt\":null,\"tags\":[\"Swift\"]},\"rawContent\":\"\\n# ◾️for in文\\n\\n「for in」文とは条件が真の場合に処理を繰り返すループ処理である。\\n指定した回数分、ループで処理を繰り返したい時などに使用する。\\n\\n昇順ループの場合には、以下の様に記載する。\\n\\n（記載ルール）\\n\\n```swift\\nfor 変数 in 開始値 ..\u003c 終了値 {\\n    // 処理\\n}\\n```\\n\\n（例）\\n\\n```swift\\nfor num in 0 ..\u003c 10 {\\n    print(num)\\n}\\n```\\n\\n降順ループの場合には、以下の様に記載する。（reversedを使用する）\\n\\n（記載ルール）\\n\\n```swift\\nfor 変数 in (開始値 ..\u003c 終了値).reversed() {\\n    // 処理\\n}\\n```\\n\\n（例）\\n\\n```swift\\nfor num in (0 ..\u003c 10).reversed() {\\n    print(num)\\n}\\n```\\n\"},{\"slug\":\"2020-04-18-000000-4\",\"frontmatter\":{\"title\":\"if文【Swift】\",\"createAt\":\"2020-04-18 00:00\",\"updateAt\":null,\"tags\":[\"Swift\"]},\"rawContent\":\"\\n# ◾️if文\\n\\nif文とは、条件分岐処理で使用される構文である。\\n条件分岐とは、「〜の場合は〜をするが、〜の場合には〜をする。」という様に状況によって処理を変える方法である。\\n\\n（記載ルール）\\n\\n```swift\\nif 条件式 {\\n    条件式が真（true）の場合の処理\\n}\\n```\\n\\n（例）\\n\\n```swift\\nif 1 \u003c 2 {\\n    print(\\\"true\\\")\\n}\\n```\\n\\n「条件式が真（true）の場合、偽(false)の場合」で処理を分ける事ができる。\\n\\n（記載ルール）\\n\\n```swift\\nif 条件式 {\\n    条件式が真（true）の場合の処理\\n} else {\\n    条件式が偽（false）の場合の処理\\n}\\n```\\n\\n（例）\\n\\n```swift\\nif 1 \u003c 3 {\\n    print(\\\"true\\\")\\n} else {\\n    print(\\\"else\\\")\\n}\\n```\\n\\n「複数の条件を指定」を行うこともできる。（「else if」を使用する）\\n\\n（記載ルール）\\n\\n```swift\\nif 条件式1 {\\n    条件式1が真（true）の場合の処理\\n} else if 条件式2 {\\n    条件式2が真（true）の場合の処理\\n} else {\\n    どの条件にも一致しなかった場合に実行する処理\\n}\\n```\\n\\n（例）\\n\\n```swift\\nif 1 \u003c 2 {\\n    print(\\\"true\\\")\\n} else if 1 \u003c 3 {\\n    print(\\\"else if\\\")\\n} else {\\n    print(\\\"else\\\")\\n}\\n```\\n\\n条件式には、「比較演算子」「論理演算子」などで条件式を記載する。\\n※比較演算子と論理演算子に関しては、【比較演算子】【論理演算子】で説明する。\\n\"},{\"slug\":\"2020-04-18-000000\",\"frontmatter\":{\"title\":\"break・continue【Swift】\",\"createAt\":\"2020-04-18 00:00\",\"updateAt\":null,\"tags\":[\"Swift\"]},\"rawContent\":\"\\n# ◾️break\\n\\n「break」とはループ処理などを終了する事ができる構文である。\\n記述方法は単純で、処理を終了させたい繰り返し処理の中に「break」と書くだけである。\\n以下に一例を記載する。\\n\\n（記載ルール）\\nwhileなどのループ処理の中で「break」を記載する。\\n\\n（例）\\n\\n```swift\\nvar num = 0\\nwhile true {\\n    if num \u003e= 3 {\\n        break\\n    }\\n    print(num)\\n    num += 1\\n}\\n```\\n\\n本来であれば、上記のwhile分は条件が「true」のため、永遠とループする。\\nしかし、numが3以上の場合に「break」しているため、numが3以上になればループを終了する。\\n\\n# ◾️continue\\n\\n「continue」は次のループ処理の先頭に飛ぶ事ができる構文である。\\n記述方法は単純に処理を終了させたい繰り返し処理の中に「continue」と書くだけである。\\n以下に一例を記載する。\\n\\n（記載ルール）\\nwhileなどのループ処理の中で「continue」を記載する。\\n（例）\\n\\n```swift\\nvar num = 0\\nwhile num \u003c= 10 {\\n    num += 1\\n    if num % 3 == 0 {\\n        continue\\n    }\\n    print(num)\\n}\\n```\\n\\n上記は「num」の中身が「3」で割り切れたときに「continue」が実行されるようにしている。\\nつまり「numの中身が3で割り切れたときにそのループは飛ばされて次のループに移る」という動作になる。\\n\"},{\"slug\":\"2020-04-17-000000-1\",\"frontmatter\":{\"title\":\"配列【Swift】\",\"createAt\":\"2020-04-17 00:00\",\"updateAt\":null,\"tags\":[\"Swift\"]},\"rawContent\":\"\\n# ◾️配列\\n\\n配列とは、複数のデータを1つの変数で管理できる入れ物の事である。\\nデータを入れるための箱が番号付きで並べられていて、その中にデータを入れていくイメージである。\\n箱の中に入れたデータを差し替えたり、箱を追加、削除する事もできる。\\n※「var（変数）」で宣言した配列は要素の変更が可能だが、「let（定数）」で宣言した配列は変更できない。\\n\\n配列は以下のコードのように[値, 値, 値,…]で作る。\\n型を指定しなければ、型の種類を混在させて格納できる。\\n\\n[型推論]\\n（記載ルール）\\n\\n```swift\\nvar 変数名 = [データ, データ, データ、、、]\\n```\\n\\n（例）\\n\\n```swift\\nvar array = [\\\"データ1\\\", \\\"データ2\\\", \\\"データ3\\\"]\\n```\\n\\n[データ型指定]\\n（記載ルール）\\n\\n```swift\\nvar 変数名:[データ型] = [データ, データ, データ、、、]\\n```\\n\\n（例）\\n\\n```swift\\nvar array:[String] = [\\\"データ1\\\", \\\"データ2\\\", \\\"データ3\\\"]\\n```\\n\\n空の配列を作るには以下のコード様にする。\\n\\n[型推論]\\n（記載ルール）\\n\\n```swift\\nvar 変数名 = [AnyObject]()\\n```\\n\\n（例）\\n\\n```swift\\nvar array = [AnyObject]()\\n```\\n\\n[データ型指定]\\n（記載ルール）\\n\\n```swift\\nvar 変数名 = [データ型]()\\n```\\n\\n（例）\\n\\n```swift\\nvar array = [String]()\\n```\\n\"},{\"slug\":\"2020-04-17-000000-2\",\"frontmatter\":{\"title\":\"辞書【Swift】\",\"createAt\":\"2020-04-17 00:00\",\"updateAt\":null,\"tags\":[\"Swift\"]},\"rawContent\":\"\\n# ◾️辞書\\n\\n辞書（ディクショナリ）とは、キーと値を1セットとした複数のデータを1つの変数で管理できる入れ物の事である。\\n辞書は以下のコードのように[キー:値,キー:値,キー:値,キー:値, ...]で作る。\\nキーと値の型を指定しなければ、型を混在して格納する事ができる。\\n配列と同様に、var（変数）で宣言した辞書はコードの中で要素の変更ができ、let（定数）で宣言した辞書は要素を変更する事はできない。\\n\\n[型推論]\\n（記載ルール）\\n\\n```swift\\nvar 変数名 = [キー:値, キー:値, キー:値、、、]\\n```\\n\\n（例）\\n\\n```swift\\nvar dict = [\\\"name\\\":\\\"名前\\\", \\\"age\\\":\\\"20\\\", \\\"height\\\":\\\"30\\\"]\\n```\\n\\n[データ型指定]\\n（記載ルール）\\n\\n```swift\\nvar 変数名:[データ型:データ型] = [キー:値, キー:値, キー:値、、、]\\n```\\n\\n（例）\\n\\n```swift\\nvar dict:[String:String] = [\\\"name\\\":\\\"名前\\\", \\\"age\\\":\\\"20\\\", \\\"height\\\":\\\"30\\\"]\\n```\\n\\n空の配列を作るには以下のコード様にする。\\n\\n[データ型指定]\\n（記載ルール）\\n\\n```swift\\nvar 変数名:[データ型:データ型] = [:]\\n```\\n\\n（例）\\n\\n```swift\\nvar dict:[String:String] = [:]\\n```\\n\"},{\"slug\":\"2020-04-17-000000-3\",\"frontmatter\":{\"title\":\"辞書のその他のプロパティ、便利な使用方法【Swift】\",\"createAt\":\"2020-04-17 00:00\",\"updateAt\":null,\"tags\":[\"Swift\"]},\"rawContent\":\"\\n# ◾️辞書のその他のプロパティ、便利な使用方法\\n\\n以下によく使用する辞書のプロパティと、便利な使用方法を記載する。\\n\\n[辞書の要素を取得する]\\n\\n```swift\\n辞書の変数名[キー]!\\n```\\n\\n[辞書の全ての要素を1つずつ取得する]\\n\\n```swift\\nfor (キー変数, 値変数) in 辞書の変数名 {\\n}\\n```\\n\\n[辞書のすべてのキーを1つずつ取得する]\\n\\n```swift\\nfor キー変数 in 辞書の変数名.keys {\\n}\\n```\\n\\n[辞書のすべての値を1つずつ取得する]\\n\\n```swift\\nfor 値変数 in 辞書の変数名.values {\\n}\\n```\\n\\n[辞書が空かチェックする(空の場合は「true」)]\\n\\n```swift\\n辞書の変数名.isEmpty\\n```\\n\\n辞書の要[素数を取得する]\\n\\n```swift\\n辞書の変数名.count\\n```\\n\\n[キーで辞書を検索する（存在する場合は「true」）]\\n\\n```swift\\n辞書の変数名.keys.contains(キー)\\n```\\n\\n[値で辞書を検索する]\\n\\n```swift\\n辞書の変数名.values.contains(値)\\n```\\n\\n[キーと値のセットで辞書を検索する（存在する場合は「true」）]\\n\\n```swift\\n辞書の変数名.contains{ $0.0 == キー \u0026\u0026 $0.1 == 値 }\\n```\\n\\n[配列の中身を表示する]\\n\\n```swift\\n辞書の変数名.description\\n```\\n\\n[辞書に要素を追加する（既に存在するキーの場合には更新する）]\\n\\n```swift\\n辞書の変数名[キー] = 値\\n```\\n\\n[辞書から指定のキーの要素を削除する]\\n\\n```swift\\n辞書の変数名.removeValue(forKey: キー)\\n```\\n\\n[辞書の全ての要素を削除する]\\n\\n```swift\\n辞書の変数名.removeAll()\\n```\\n\"},{\"slug\":\"2020-04-17-000000-4\",\"frontmatter\":{\"title\":\"タプルから値の取得【Swift】\",\"createAt\":\"2020-04-17 00:00\",\"updateAt\":null,\"tags\":[\"Swift\"]},\"rawContent\":\"\\n# ◾️タプルから値の取得\\n\\nタプルから値を取得する方法は複数ある。\\n\\n以下のコードはインデックス番号を指定してタプルの値を取得する方法である。\\n※注意点：1つめの要素のインデックス番号は0から始まる。\\n\\n（例）\\n\\n```swift\\nlet tap:(String, Int, Double) = (\\\"こんにちは\\\", 1, 170.0)\\nprint(tap.0)\\n```\\n\\n以下のコードはタプルの値につけたラベルを指定して取得する方法である。\\n\\n[型推論]\\n（例）\\n\\n```swift\\nlet tap = (name:\\\"名前\\\", age:99, height:300.5)\\nprint(tap.name)\\n```\\n\\n[データ型指定]\\n（例）\\n\\n```swift\\nlet tap:(name:String, age:Int, height:Double) = (\\\"名前\\\", 99, 300.5)\\nprint(tap.name)\\n```\\n\"},{\"slug\":\"2020-04-17-000000\",\"frontmatter\":{\"title\":\"配列のその他のプロパティ、便利な使用方法【Swift】\",\"createAt\":\"2020-04-17 00:00\",\"updateAt\":null,\"tags\":[\"Swift\"]},\"rawContent\":\"\\n# ◾️配列のその他のプロパティ、便利な使用方法\\n\\n以下によく使用する配列のプロパティと、便利な使用方法を記載する。\\n\\n[配列の指定indexの要素を取得する]\\n\\n```swift\\n配列の変数名[index番号]\\n```\\n\\n[最初の要素を取得する]\\n\\n```swift\\n配列の変数名.first!\\n```\\n\\n[最後の要素を取得する]\\n\\n```swift\\n配列の変数名.last!\\n```\\n\\n[配列の先頭を削除する]\\n\\n```swift\\n配列の変数名.removeFirst()\\n```\\n\\n[配列の末尾を削除する]\\n\\n```swift\\n配列の変数名.removeLast()\\n```\\n\\n[配列の指定indexを削除する]\\n\\n```swift\\n配列の変数名.remove(at: index番号)\\n```\\n\\n[配列の全要素を削除する]\\n\\n```swift\\n配列の変数名.removeAll()\\n```\\n\\n[配列が空かチェック(空の場合は「true」)]\\n\\n```swift\\n配列の変数名.isEmpty\\n```\\n\\n配列の要[素数を取得]\\n\\n```swift\\n配列の変数名.count\\n```\\n\\n[配列の中身を表示]\\n\\n```swift\\n配列の変数名.description\\n```\\n\\n[配列の要素分のループ]\\n\\n```swift\\nfor 変数A in 配列の変数名 {\\n}\\n```\\n\\n[配列の後ろに要素を1つ追加する]\\n\\n```swift\\n配列の変数名.append(追加する値)\\n```\\n\\n[任意の位置に要素を追加する]\\n\\n```swift\\n配列の変数名.insert(追加する値, at:index番号)\\n```\\n\\n[配列の結合]\\n\\n```swift\\n配列の変数名 + 追加する配列の変数名\\n```\\n\\n[任意の位置に配列を追加する]\\n\\n```swift\\n配列の変数名.insert(contentsOf: 追加する配列の変数名, at: index番号)\\n```\\n\"},{\"slug\":\"2020-04-16-210000-1\",\"frontmatter\":{\"title\":\"文字列型・文字列結合【Swift】\",\"createAt\":\"2020-04-16 21:00\",\"updateAt\":null,\"tags\":[\"Swift\"]},\"rawContent\":\"\\n# ◾️文字列型\\n\\nSwift標準の文字列は、「\\\"」で囲む事で認識される。\\n※文字列型の数字では、足し算や引き算などの計算が出来ないので、注意が必要である。\\n\\n（記載ルール）\\n\\n```swift\\nlet 定数名:String = \\\"値\\\"\\n```\\n\\n（例）\\n\\n```swift\\nlet str:String = \\\"こんにちは\\\"\\n```\\n\\n型宣言を省略した型推論の場合には、自動的にString型となる。\\n\\n（記載ルール）\\n\\n```swift\\nlet 定数名 = \\\"値\\\"\\n```\\n\\n（例）\\n\\n```swift\\nlet str = \\\"こんにちは\\\"\\n```\\n\\n# ◾️文字列結合\\n\\n文字列同士の結合は、「＋」演算子で簡単に結合できる。\\n\\n（記載ルール）\\n\\n```swift\\nlet 定数名 = \\\"値\\\" + \\\"値\\\"\\n```\\n\\n（例）\\n\\n```swift\\nlet str = \\\"こんにちは\\\" + \\\"こんばんは\\\"\\n```\\n\"},{\"slug\":\"2020-04-16-210000\",\"frontmatter\":{\"title\":\"浮動小数点型【Swift】\",\"createAt\":\"2020-04-16 21:00\",\"updateAt\":null,\"tags\":[\"Swift\"]},\"rawContent\":\"\\n# ◾️浮動小数点型\\n\\n浮動小数点型は、小数点以下の値を持つ数値を表すための型である。\\nSwiftではDouble型とFloat型の2種類が用意されている。\\n\\n型宣言なしの型推論で宣言するとDouble型になる。\\n\\n[Double型]\\n（記載ルール）\\n\\nlet 定数名 = 浮動少数点型の値\\n\\n（例）\\n\\n```swift\\nlet num = 3.14\\n```\\n\\nFloat型の変数を宣言するには、明示的に型を指定する必要がある。\\n\\n[Float型]\\n（記載ルール）\\n\\nlet 定数名:Float = 浮動少数点型の値\\n\\n（例）\\n\\n```swift\\nlet num:Float = 3.14\\n```\\n\"},{\"slug\":\"2020-04-16-000000-1\",\"frontmatter\":{\"title\":\"NSStringクラス【Swift】\",\"createAt\":\"2020-04-16 00:00\",\"updateAt\":null,\"tags\":[\"Swift\"]},\"rawContent\":\"\\n# ◾️NSStringクラス\\n\\nSwiftでも、Objective-Cで使用されていた「NSString」クラスを使用する事が可能である。\\nNSStringクラスはObjective-Cのクラスの為、ソースコードの最上行に「import UIKit」を追加する必要がある。\\n\\n（記載ルール）\\n\\n```swift\\nlet 定数名:NSString = \\\"値\\\"\\n```\\n\\n（例）\\n\\n```swift\\nlet str:NSString = \\\"こんにちは\\\"\\n```\\n\\nNSString型とString型は相互変換可能である。\\n相互変換するには次のように「変数名 as String」を使用する。\\n\\n[NSString型→String型]\\n（記載ルール）\\n\\n```swift\\nlet 定数名1:NSString = \\\"値\\\"\\nlet 定数名2:String = 定数名1 as String\\n```\\n\\n（例）\\n\\n```swift\\nlet str:NSString = \\\"こんにちは\\\"\\nlet str1:String = str as String\\n```\\n\\n[String型→NSString型]\\n（記載ルール）\\n\\n```swift\\nlet 定数名1:String = \\\"値\\\"\\nlet 定数名2:NSString = 定数名1 as String\\n```\\n\\n（例）\\n\\n```swift\\nlet str:String = \\\"こんにちは\\\"\\nlet str1:NSString = str as NSString\\n```\\n\"},{\"slug\":\"2020-04-16-000000-2\",\"frontmatter\":{\"title\":\"タプル【Swift】\",\"createAt\":\"2020-04-16 00:00\",\"updateAt\":null,\"tags\":[\"Swift\"]},\"rawContent\":\"\\n# ◾️タプル\\n\\n「タプル」とは、順序付けられた複数データの集合体の事である。\\nSwiftではこのデータの集合を1つの変数として扱う事ができる。\\n\\nタプルを利用すれば、簡単にデータの詰め合わせを作る事ができる。\\nタプルは、複数のデータ型が混在しても良いが、宣言した後にデータの追加や削除はできない。\\n以下がタプルの宣言方法である。\\n\\n[型推論]\\n（記載ルール）\\n\\n```swift\\nlet 変数名 ＝ （データ, データ, データ, 、、、）\\n```\\n\\n（例）\\n\\n```swift\\nlet tap = (\\\"Hello\\\", 10, 3.14)\\n```\\n\\n[データ型指定]\\n（記載ルール）\\n\\n```swift\\nlet 変数名:(型, 型, 型、、、) = （データ, データ, データ, 、、、）\\n```\\n\\n（例）\\n\\n```swift\\nlet tap:(String, Int, Double) = (\\\"Hello\\\", 10, 3.14)\\n```\\n\\nラベル付き[型推論]\\n（記載ルール）\\n\\n```swift\\nlet 定数名 = (ラベル名:データ, ラベル名:データ, ラベル名:データ, 、、、)\\n```\\n\\n（例）\\n\\n```swift\\nlet tap = (name:\\\"名前\\\", age:99, height:300.5)\\n```\\n\\n[ラベル付きデータ型指定]\\n（記載ルール）\\n\\n```swift\\nlet 定数名:(ラベル:型, ラベル:型, ラベル:型, 、、、) = (データ, データ, データ, 、、、)\\n```\\n\\n（例）\\n\\n```swift\\nlet tap:(name:String, age:Int, height:Double) = (\\\"名前\\\", 99, 300.5)\\n```\\n\"},{\"slug\":\"2020-04-16-000000\",\"frontmatter\":{\"title\":\"型の変換【Swift】\",\"createAt\":\"2020-04-16 00:00\",\"updateAt\":null,\"tags\":[\"Swift\"]},\"rawContent\":\"$af\"},{\"slug\":\"2020-04-15-210000-1\",\"frontmatter\":{\"title\":\"定数【Swift】\",\"createAt\":\"2020-04-15 21:00\",\"updateAt\":null,\"tags\":[\"Swift\"]},\"rawContent\":\"\\n# ◾️定数\\n\\n定数とは、変数と違って後から変更する事ができない宣言方法である。\\n変数ではvarを使用していたが、定数ではletを使用して宣言する。\\n\\n「値が変更されない場合でも、変数を使用すれば良いのでは？」と感じるかもしれないが、その値が「変更される可能性があるのか」「変更される可能性がないのか」を他の人や、10年後の自分が見てもすぐに判断が付く方がソースコードが読みやすくなるなどの利点がある。\\nその為、値が変更されない場合には、定数を使用する事。\\n（値が変わらないのに、変数を使用しているとXcodeが警告を出してくれる。）\\n\\n[定数宣言]\\n（記載ルール）\\n\\nlet 定数名 = 値\\n\\n（例）\\n\\n```swift\\nlet day = 10\\n```\\n\\n[定数を変更しようとする]\\n\\nday = 11\\n\\n→コンパイルエラーが発生する\\n\"},{\"slug\":\"2020-04-15-210000\",\"frontmatter\":{\"title\":\"型推論・型の確認【Swift】\",\"createAt\":\"2020-04-15 21:00\",\"updateAt\":null,\"tags\":[\"Swift\"]},\"rawContent\":\"\\n# ◾️型推論\\n\\n変数（定数）の宣言時に型を指定せずに宣言する際には、「型推論」を使用して自動で型を判別される。\\n型推論を使用するには、変数（定数）の宣言時に必ず値を代入して宣言する必要がある。\\nこの時、型を指定してはいけない。\\n\\n[Int型]\\n（記載ルール）\\n\\nvar 変数名 = 整数\\n\\n（例）\\n\\n```swift\\nvar age = 30\\n```\\n\\n[String型]\\n（記載ルール）\\n\\nvar 変数名 = \\\"値\\\"\\n\\n（例）\\n\\n```swift\\nvar name = \\\"山田太郎\\\"\\n```\\n\\n[Double型]\\n（記載ルール）\\n\\nvar 変数名 = 少数点付きの数値\\n\\n（例）\\n\\n```swift\\nvar rate = 104.5\\n```\\n\\n# ◾️型の確認\\n\\n型推論を使用して型を宣言せずに変数（定数）宣言した場合、その変数（定数）が何型なのかを確認したい時がある。\\nその場合は、以下の方法で型の確認ができる。\\n\\n（記載ルール）\\n\\ntype(of: 変数名)\\n\\n（例）\\n\\n```swift\\nvar age = 30\\nprint(type(of: age))\\n```\\n\"},{\"slug\":\"2020-04-15-200000-1\",\"frontmatter\":{\"title\":\"エスケープシーケンス【Swift】\",\"createAt\":\"2020-04-15 20:00\",\"updateAt\":null,\"tags\":[\"Swift\"]},\"rawContent\":\"\\n# ◾️エスケープシーケンス\\n\\nエスケープシーケンスとは、通常の文字ではなく、特殊な意味を持つ文字を「通常の文字」として使用する為のものである。\\n例として、「\\\"」をコンソールに出力してみる。\\n\\n（例）\\n\\n```swift\\nprint(\\\"\\\"\\\")\\n```\\n\\n上記の様に書くと、エラーとなる。\\nこれは、「\\\"」が特殊な意味を持つ文字だからである。\\nこの様な特殊な文字を出力させる為に、「\\\\」を使用して文字列として認識させる事ができる。\\n※「option + ¥」で「\\\\」を記載できる。\\n\\n（例）\\n\\n```swift\\nprint(\\\"\\\\\\\"\\\")\\n```\\n\\n上記の記載で、特殊な文字である「\\\"」が、通常の文字としてコンソールに出力される。\\n\\nさらに、特定の文字と組み合わせる事で、別の意味を持つものもある。\\n一例をあげると、「改行」である。\\n\\n改行は、通常の文字では表す事ができない。\\nその為、「\\\\n」と記述することで改行を表現する事ができる。\\n\\n（例）\\n\\n```swift\\nprint(\\\"\\\\n\\\")\\n```\\n\\nよく使用する特殊文字には、以下の特殊文字がある。\\n\\n（ダブルクォーテーションを出力する場合）\\n\\n```swift\\nprint(\\\"\\\\\\\"\\\")\\n```\\n\\n（シングルクォーテーションを出力する場合）\\n\\n```swift\\nprint(\\\"\\\\'\\\")\\n```\\n\\n（バックスラッシュを出力する場合）\\n\\n```swift\\nprint(\\\"\\\\\\\\\\\")\\n```\\n\\n（改行を出力する場合）\\n\\n```swift\\nprint(\\\"\\\\n\\\")\\nprint(\\\"\\\\r\\\")\\n```\\n\\n（タブを出力する場合）\\n\\n```swift\\nprint(\\\"\\\\t\\\")\\n```\\n\"},{\"slug\":\"2020-04-15-200000-2\",\"frontmatter\":{\"title\":\"変数【Swift】\",\"createAt\":\"2020-04-15 20:00\",\"updateAt\":null,\"tags\":[\"Swift\"]},\"rawContent\":\"\\n# ◾️変数\\n\\n変数とは、値を入れておく箱の様なもので、特定の文字や数字などを使い回す様な場合に使用される。\\n変数の宣言は、varを使用して行う。\\n※最初から変数に値を入れる方法と、値を入れずに変数宣言を行う方法がある。\\n\\n[値を入れずに変数宣言する方法]\\n（記載ルール）\\n\\nvar 変数名:型\\n\\n（例）\\n\\n```swift\\nvar num:Int\\n```\\n\\n[値を入れて変数宣言する方法]\\n（記載ルール）\\n\\nvar 変数名:型 = 値\\n\\n（例）\\n\\n```swift\\nvar num:Int = 30\\n```\\n\\n変数を使用していく中で、途中で変数の値を変更したりする事もできる。\\n上記の例の変数の値を変更する場合には、以下の様に変数名を指定する事で、変更が可能である。\\n\\n（記載ルール）\\n\\n変数名 = 値\\n\\n（例）\\n\\n```swift\\nnum = 50\\n```\\n\\n変数の宣言時に記載している「型」とは、どのような型の値が入るかを明確に定めたものである。\\n上記の例では、Int型という型を指定している。\\n型には様々なものがあり、一例を挙げると以下がある。\\n\\nInt：整数\\nFloat：小数点付きの数字（単精度実数）\\nDoble：小数点付きの数字（倍精度実数）\\nString：文字列\\nCharacter：文字\\nBool：真偽値\\n\"},{\"slug\":\"2020-04-15-200000\",\"frontmatter\":{\"title\":\"演算子【Swift】\",\"createAt\":\"2020-04-15 20:00\",\"updateAt\":null,\"tags\":[\"Swift\"]},\"rawContent\":\"\\n# ◾️演算子\\n\\n足し算や、引き算などの基本的な演算子は以下の様に記載する事で使用する事ができる。\\n注意点としては、演算子の両サイドは必ずスペースを記載する必要がある事です。\\n他の言語では、スペースを入れなくても良い言語が多いが、Swiftの場合には、両サイドにスペースが無いと演算子として認識されない場合がある。\\n\\n[加算]\\n（記載ルール）\\n数字 + 数字\\n（例）\\n\\n```swift\\nprint(1 + 2)\\n```\\n\\n[減算]\\n（記載ルール）\\n数字 - 数字\\n（例）\\n\\n```swift\\nprint(3 - 2)\\n```\\n\\n[乗算]\\n（記載ルール）\\n数字 * 数字\\n（例）\\n\\n```swift\\nprint(3 * 2)\\n```\\n\\n[除算]\\n（記載ルール）\\n数字 / 数字\\n（例）\\n\\n```swift\\nprint(6 / 2)\\n```\\n\\n[剰余]\\n（記載ルール）\\n数字 % 数字\\n（例）\\n\\n```swift\\nprint(6 % 5)\\n```\\n\\n[変数の値を加算]\\n（記載ルール）\\nvar 変数名 = 数字\\n変数名 += 加算する数字\\n（例）\\n\\n```swift\\nvar num = 1\\nnum += 1\\n```\\n\\n→num = 2\\n\\n[変数の値を減算]\\n（記載ルール）\\nvar 変数名 = 数字\\n変数名 -= 加算する数字\\n（例）\\n\\n```swift\\nvar num = 1\\nnum -= 1\\n```\\n\\n→num = 0\\n\\n[変数の値を乗算]\\n（記載ルール）\\nvar 変数名 = 数字\\n変数名 *= 加算する数字\\n（例）\\n\\n```swift\\nvar num = 1\\nnum *= 3\\n```\\n\\n→num = 3\\n\\n[変数の値を除算]\\n（記載ルール）\\nvar 変数名 = 数字\\n変数名 /= 加算する数字\\n（例）\\n\\n```swift\\nvar num = 10\\nnum /= 2\\n```\\n\\n→num = 5\\n\\n[変数の値を剰算]\\n（記載ルール）\\nvar 変数名 = 数字\\n変数名 %= 加算する数字\\n（例）\\n\\n```swift\\nvar num = 7\\nnum %= 5\\n```\\n\\n→num = 2\\n\\n他の言語でよく使用される「num++」「num--」などの「インクリメント」「デクリメント」はSwiftでは使用できない。\\nその為、上記で挙げている「変数の値の加算」などの方法を用いる必要がある。\\n\"},{\"slug\":\"2020-04-14-200000-1\",\"frontmatter\":{\"title\":\"print【Swift】\",\"createAt\":\"2020-04-14 20:00\",\"updateAt\":null,\"tags\":[\"Swift\"]},\"rawContent\":\"\\n# ◾️print\\n\\nprintは主に文字列の出力や変数の中身などを、コンソールに出力して確認したいときに使用する。\\nprintはソースコード上のどこでも記述する事ができ、変数の確認以外にも、さまざまな用途で使用できる。\\n※コンソールとは、プログラムの実行結果の表示や、デバッグで使用される場所のことである。\\n以下の画像にコンソールの場所を表示する。\\n\\n![](/images/2020-04-14-200000-1/20220707120225.png)\\n\\n※変数については、後の記事で説明する。\\n\\n（記載ルール）\\n\\n```swift\\nprint(出力する値)\\n```\\n\\n（文字列を出力する例）\\n\\n```swift\\nprint(\\\"コンソール出力\\\")\\n```\\n\\n（変数を出力する例）\\n\\n```swift\\nvar hensuu = \\\"変数\\\"\\nprint(hensuu)\\n```\\n\\n文字列の途中で変数を組み込み、コンソールに出力させるには以下のように「\\\\(変数名)」とする事で組み込める。\\n\\n（文字列に変数を組み込んで出力する例）\\n\\n```swift\\nvar hensuu = \\\"変数\\\"\\nprint(\\\"hensuuの値は、「\\\\(hensuu)」です。\\\")\\n```\\n\\nコンソール出力の文字列の途中で改行するには「\\\\n」を記載する事で、記載した箇所で改行される。\\n\\n（文字列の途中で改行する例）\\n\\n```swift\\nprint(\\\"1行目の文字列です。\\\\n2行目の文字列です。\\\")\\n```\\n\"},{\"slug\":\"2020-04-14-200000-2\",\"frontmatter\":{\"title\":\"コメント【Swift】\",\"createAt\":\"2020-04-14 20:00\",\"updateAt\":null,\"tags\":[\"Swift\"]},\"rawContent\":\"\\n# ◾️コメント\\n\\n「コメント」はちょっとしたメモを書いたり、処理の説明を記述しておいたり、今は使用しない処理を一旦無視するようにしておいたり、といった使い方をする。\\n「コメント」の部分はプログラムとして実行される事はない。\\n\\n（記載ルール）\\n単一行のコメント（「//」の後ろがコメントになる。）\\n\\n（例）\\n\\n```swift\\n// ここはコメント\\n```\\n\\n（記載ルール）\\n複数行のコメント（「/*」から「*/」までの間がコメントになる。）\\n※エンジニアの中では以下の様に、行の先頭に「*」をつけるという暗黙の了解もある。\\n\\n（例）\\n\\n```swift\\n/*\\n * コメント\\n * コメント2行目\\n */\\n```\\n\\nプログラミングをしている中で、「一旦この行の処理を行いたくない」と思う時がある。\\nその時には、上記のコメントを記載する事で処理を行わないようにする事ができる。\\nこれを「コメントアウト」という。\\n\\n（コメントアウトの例）\\n\\n```swift\\n// print(\\\"コメントアウトされたソース\\\")\\n```\\n\\nコメントアウトは、対象行を選択している状態で「command + /」のショートカットでコメントアウトする事ができる。\\n\"},{\"slug\":\"2020-04-14-200000-3\",\"frontmatter\":{\"title\":\"Swift 開発環境【Swift】\",\"createAt\":\"2020-04-14 20:00\",\"updateAt\":null,\"tags\":[\"Swift\"]},\"rawContent\":\"\\n# ◾️Swift開発環境\\n\\nSwiftを使用する為の開発環境は、Apple社が公式に提供している『Xcode』(エックスコード)というIDE(開発に特化したツール)を使用する。\\nXcodeはMacのAppStoreからインストールが可能である。\\n\\n過去のバージョンのXcodeをインストールしたい場合には、以下のリンク先（Apple公式サイト）からXcodeのバージョンを指定してインストールする事ができる。\\n\\n[https://developer.apple.com/download/more/](https://developer.apple.com/download/more/)\\n\\n注意点として、XcodeはMac専用の統合開発環境（IDE)の為、Windows環境で開発ができない。\\nブラウザやLinuxで実行する事もできるが、実機での確認やリリースなどを踏まえると、Macを用意する必要がある。\\n※なるべく新しいMacを用意する事をお勧めする。（古いバージョンの場合、OSのサポートが切れると最新版のXcodeのインストールができなくなる可能性がある為）\\n\\nよって、iOSアプリケーションの開発にはMacが必要と言っても過言ではない。\\n\"},{\"slug\":\"2020-04-14-200000-4\",\"frontmatter\":{\"title\":\"Playground【Swift】\",\"createAt\":\"2020-04-14 20:00\",\"updateAt\":null,\"tags\":[\"Swift\"]},\"rawContent\":\"\\n# ◾️Playground\\n\\nPlaygroundとは、Swiftの実験用の環境で、コードを書く事ですぐに実行結果が出力される環境である。\\n（iOSなどのアプリケーションの開発用の環境ではない。）\\nSwiftを初めて使用する人は、いきなりアプリケーションを作成するのではなく、このPlaygroundでSwiftのコードを書き実行する事をオススメする。\\n\\nPlaygroundの作成は、以下の手順で作成できる。\\n\\n1.Xcodeを起動する。\\n2.メニューバーから「File \u003e New \u003e Playground」を選択する。\\n\\n![](/images/2020-04-14-200000-4/20220707120227.png)\\n\\n3.「iOS」の「Blank」を選択し、「Next」を押下する。\\n\\n![](/images/2020-04-14-200000-4/20220707120231.png)\\n\\n4.保存先のディレクトリを指定して「create」ボタンを押下する。\\n\\n上記で作成した拡張子が「.playground」のファイルをダブルクリックする事で、Playgroundで記述したソースが開かれる。\\n\"},{\"slug\":\"2020-04-14-200000\",\"frontmatter\":{\"title\":\"Swiftとは【Swift】\",\"createAt\":\"2020-04-14 20:00\",\"updateAt\":null,\"tags\":[\"Swift\"]},\"rawContent\":\"\\n# ◾️Swiftとは\\n\\nSwift（スウィフト）とは、Apple社が2014年に発表したモダンな（コードが読みやすくて書きやすい）新しいプログラミング言語である。\\niPhoneやMacなどのApple製品のアプリをはじめ、Webアプリケーションまで開発することができる。\\nさらに2015年には、全世界にSwiftのコードが公開された。(オープンソースである。)\\n\\n今までiOSのアプリ開発で使われてきた主な開発言語は「Objective-C」だが、独特な構文や特徴を持っていたので、開発を続けていく上で不便な部分や難しい部分があった。\\nまた、Objective-CはApple製品に特化していた為、違う言語を使用している人や新しく学ぶ人たちの敷居が高くなっていた。\\nこの様な理由から、Swiftは「世界中の人たちに使ってもらいたい」という思いが込められて作られた。\\n\"}],\"allTags\":[{\"tag\":\"Swift\",\"count\":106},{\"tag\":\"React\",\"count\":100},{\"tag\":\"JavaScript\",\"count\":79},{\"tag\":\"TypeScript\",\"count\":52},{\"tag\":\"CentOS7\",\"count\":43},{\"tag\":\"Flutter\",\"count\":24},{\"tag\":\"Mac\",\"count\":22},{\"tag\":\"Tailwind CSS\",\"count\":22},{\"tag\":\"Knex\",\"count\":21},{\"tag\":\"Node.js\",\"count\":18},{\"tag\":\"Go言語\",\"count\":14},{\"tag\":\"SwiftUI\",\"count\":13},{\"tag\":\"HTML\",\"count\":12},{\"tag\":\"Material UI\",\"count\":11},{\"tag\":\"CSS\",\"count\":10},{\"tag\":\"WebPack\",\"count\":10},{\"tag\":\"Docker\",\"count\":9},{\"tag\":\"iOS\",\"count\":9},{\"tag\":\"Objective-C\",\"count\":9},{\"tag\":\"エラー\",\"count\":9},{\"tag\":\"Slack\",\"count\":8},{\"tag\":\"GoogleAppScript\",\"count\":7},{\"tag\":\"MySQL\",\"count\":7},{\"tag\":\"Zod\",\"count\":7},{\"tag\":\"Stripe\",\"count\":6},{\"tag\":\"スプレッドシート\",\"count\":6},{\"tag\":\"ESLint\",\"count\":5},{\"tag\":\"nginx\",\"count\":5},{\"tag\":\"jQuery\",\"count\":4},{\"tag\":\"Prettier\",\"count\":4},
