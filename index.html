ndle.main.object(forInfoDictionaryKey: \"CFBundleShortVersionString\") as? String\n                else {\n                    print(\"エラー\")\n                    return\n            }\n\n            if version != nowAppVersion {\n                // TODO: ここでAppStoreを開く処理を記載するなど。\n                print(\"バージョンが古い\")\n            }\n        } catch {\n            print(\"エラー\")\n        }\n    }\n    task.resume()\n}\n```\n"])</script><script>self.__next_f.push([1,"89:T763,"])</script><script>self.__next_f.push([1,"\n## ■はじめに\n\nアプリでよくある、最新版のアプリじゃないと、アップデートしてね〜\n\nというようなダイアログを出す場合があります。\n\nこれは、最新アプリがあるのに、古いバージョンのアプリを利用されないようにするためには、非常にいい方法です。\n\nここでは、AppStoreのアプリのバージョンの取得方法を記載します。\n\n## ■手順\n\nURLのリクエストで、バージョン情報を取得するのですが、URLにはそのアプリのIDが必要になります。\n\nこれは、iTunes Connectで確認してください。（アプリが既にリリースされている必要があります。）\n\n以下のURLの「[Apple ID]」の部分をそのIDに書き換えてください。\n\n```\nhttps://itunes.apple.com/lookup?id=[Apple ID]\n```\n\n以下がリクエストを行い、バージョン情報をコンソールに出力する処理です。\n\n```objectivec\nNSURLRequest *request = [NSURLRequest requestWithURL:[NSURL URLWithString:@\"https://itunes.apple.com/lookup?id=[Apple ID]\"]\n                                        cachePolicy:NSURLRequestUseProtocolCachePolicy\n                                    timeoutInterval:60.0];\nNSURLSessionConfiguration *configuration = [NSURLSessionConfiguration ephemeralSessionConfiguration];\nNSURLSession *session = [NSURLSession sessionWithConfiguration:configuration];\n[[session dataTaskWithRequest:request completionHandler:^(NSData * _Nullable data, NSURLResponse * _Nullable response, NSError * _Nullable error) {\n    if (error || [(NSHTTPURLResponse *)response statusCode] != 200) {\n        return;\n    }\n    NSLog(@\"=====成功======\");\n    NSDictionary *dic = [NSJSONSerialization JSONObjectWithData:data options:NSJSONReadingAllowFragments error:nil];\n    NSLog(@\"%@\", dic[@\"results\"][0][@\"version\"]);\n}] resume];\n```\n"])</script><script>self.__next_f.push([1,"8a:Te81,"])</script><script>self.__next_f.push([1,"\n## ■はじめに\n\nコンソールログを残したままリリースすると、ログが表示されてしまいます。\n\nAPIの情報などをログに出してしまうと、セキュリティ上、問題になるので、開発環境ではログが表示されて、本番環境では表示されないようにロガークラスを作成して管理しましょう。\n\n## ■手順\n\n「YNLogger.swift」ファイルを作成し、以下のソースを丸々コピペで貼り付けてください。\n\n```swift\nimport Foundation\n\nclass YNLogger {\n    /// ログに表示する日時\n    private static var dateString: String {\n        let date = Date()\n        let formatter = DateFormatter()\n        formatter.dateFormat = \"yyyy/MM/dd HH:mm:ss\"\n        return formatter.string(from: date)\n    }\n\n    /// ログレベルの種類のENUM\n    private enum LogLevel: String {\n        case debug\n        case error\n    }\n\n    /// デバッグのログ（ログに「[DEBUG]」が表示される）\n    /// - Parameter file: 該当のファイル名を取得する（引数で明示的に渡す必要はない）\n    /// - Parameter function: 該当の関数名を取得する（引数で明示的に渡す必要はない）\n    /// - Parameter line: 該当の行数を取得する（引数で明示的に渡す必要はない）\n    /// - Parameter message: ログメッセージを渡す\n    public static func log(file: String = #file, function: String = #function, line: Int = #line, _ message: String = \"\") {\n        printToConsole(logLevel: .debug, file: file, function: function, line: line, message: message)\n    }\n\n    /// エラーのログ（ログに「[DEBUG]」が表示される）\n    /// - Parameter file: 該当のファイル名を取得する（引数で明示的に渡す必要はない）\n    /// - Parameter function: 該当の関数名を取得する（引数で明示的に渡す必要はない）\n    /// - Parameter line: 該当の行数を取得する（引数で明示的に渡す必要はない）\n    /// - Parameter message: ログメッセージを渡す\n    public static func error(file: String = #file, function: String = #function, line: Int = #line, _ message: String = \"\") {\n        printToConsole(logLevel: .error, file: file, function: function, line: line, message: message)\n    }\n\n    /// ファイル名からクラス名を取得する\n    /// - Parameter filePath: ファイル名\n    private static func className(from filePath: String) -\u003e String {\n        let fileName = filePath.components(separatedBy: \"/\").last\n        return fileName?.components(separatedBy: \".\").first ?? \"\"\n    }\n\n    /// 開発環境でのみ、コンソールにログを出力する\n    /// - Parameter logLevel: ログレベル\n    /// - Parameter file: ファイル名\n    /// - Parameter function: 関数名\n    /// - Parameter line: 行数\n    /// - Parameter message: ログ内容\n    private static func printToConsole(logLevel: LogLevel, file: String, function: String, line: Int, message: String) {\n        #if DEBUG\n            print(\"\\(dateString) [\\(logLevel.rawValue.uppercased())] \\(className(from: file)).\\(function) \\(line)s: \\(message)\")\n        #endif\n    }\n}\n```\n\n呼び出し元では、以下のどちらかの方法で呼び出しましょう。\n\n※「log」は「[DEBUG]」のタグが付き、「error」は「[ERROR]」のタグが付くログです。\n\n```swift\nYNLogger.log(\"こんにちは\")\n```\n\n```\nYNLogger.error(\"えらー\")\n```\n\nコンソールには、以下のように表示されます。\n\n```\n2019/11/22 21:39:34 [DEBUG] ViewController.viewDidLoad() 16s: こんにちは\n2019/11/22 21:39:34 [ERROR] ViewController.viewDidLoad() 17s: えらー\n```\n"])</script><script>self.__next_f.push([1,"8b:T76d,"])</script><script>self.__next_f.push([1,"\n## ■はじめに\n\nFirebase Cloud Messaging（以降、FCM）でPush通知を送信するため、「Server Key」と、送信先の「Device Token」が取得できている前提として本手順を記載します。\n\n## ■手順\n\nNode.jsからFCMに対して、リクエストを送るために、以下のコマンドで、「request」のnpmモジュールをインストールする。\n\n```\nnpm install request --save\n```\n\nFCMを送るために、「 [https://fcm.googleapis.com/fcm/send](https://fcm.googleapis.com/fcm/send) 」に対してPOSTリクエストを行い、通知を送ります。\n\nBodyに通知の情報を設定する必要があります。\n\n以下に、FCMの通知を送信する関数を記載します。\n\n```js\n/**\n * プッシュ通知送信処理\n * @param {*} serverKey　サーバーキー\n * @param {*} deviceToken デバイストークン\n * @param {*} title タイトル\n * @param {*} message メッセージ\n */\nfunction pushMessage(serverKey, deviceToken, title, message) {\n    var headers = {\n        'Content-Type': 'application/json',\n        'Authorization': 'key=' + serverKey\n    };\n\n    var dataString = '{\"to\": \"' + deviceToken + '\", \"notification\": {\"title\": \"' + title + '\", \"body\": \"' + message + '\", \"sound\": \"default\"}, \"priority\":\"high\"}';\n\n    var options = {\n        url: 'https://fcm.googleapis.com/fcm/send',\n        method: 'POST',\n        headers: headers,\n        body: dataString\n    };\n\n    request(options, callback);\n}\n```\n\n上記の関数を呼び出す際には、以下のように呼び出します。\n\n```js\npushMessage({サーバーキー}, {デバイストークン}, {通知タイトル}, {通知内容});\n```\n\n以下が、呼び出しの例です。\n\n```js\npushMessage(\"AAAA6UEzuRA:APA91bFhX84Xyl-ZZZsssadasanogbeoasjnak0-21-4r1mfoas\", \"fLc3NGPOgsw:APasdagolrnaeiuiflaksdnlaiuhilab\", \"タイトル\", \"メッセージ\");\n```\n"])</script><script>self.__next_f.push([1,"8c:T1b27,"])</script><script>self.__next_f.push([1,"\n## ■はじめに\n\n本記事では、「UIPageControl」「UIScrollView」を使用して、横スクロールのよくあるチュートリアル画面を作る方法をまとめています。\n 使用している画像はサンプルの画像なので、チュートリアルの画像に差し替えて使用してください。\n\n![](/images/2020-05-03-000000-1/20220707140432.png)\n\n## ■手順\n\nソースコードは、[こちら](https://github.com/nakkann-1013/PageControlSample_ios)にアップしていますので、とりあえず動かしてみたい方はクローンして確認してください。\n\n本記事の方法だと、スクロールした時に、以下のようにUIPageControlが切り替わるようになります。\n\n![](/images/2020-05-03-000000-1/20220707140423.png)\n\n![](/images/2020-05-03-000000-1/20220707140426.png)\n\nフィールドに、今回のチュートリアルで使用する「UIPageControl」「UIScrollView」の定義と、使用する画像名を保持しているリストを宣言します。\n\n```swift\nvar pageControl: UIPageControl!\nvar scrollView: UIScrollView!\n\n// 表示する画像の名前のリスト\nlet imageArray = [\"memoruntyo\", \"dc_dentaku\", \"fx_sp\", \"check_imikotoba\", \"patata_talk\", \"patata_wiq\", \"shiftter\"]\n```\n\n「viewDidLoad」にて、画面のサイズを取得して定数として定義した後に、スクロールビューの定義を行います。\n\n```swift\n// 画面の横のサイズを取得する\nlet scWidth = self.view.frame.width\n// 画面の縦のサイズを取得する\nlet scHeight = self.view.frame.height\n\n// ScrollViewを取得する\nscrollView = UIScrollView()\nscrollView.frame = CGRect(x: 0, y: 0, width: scWidth, height: scHeight)\n// 横方向のスクロールバーを非表示にする\nscrollView.showsHorizontalScrollIndicator = false;\n// 縦方向のスクロールバーを非表示にする\nscrollView.showsVerticalScrollIndicator = false\n// ページングを許可する（中途半端な位置でスクロールが止まらないように設定）\nscrollView.isPagingEnabled = true\n// ScrollViewのデリゲートを設定する\nscrollView.delegate = self\n// スクロールの画面サイズを指定する\nscrollView.contentSize = CGSize(width: CGFloat(imageArray.count) * scWidth, height: 0)\n// ScrollViewをViewに追加する\nself.view.addSubview(scrollView)\n```\n\n「viewDidLoad」にて、上記で定義したスクロールビューにチュートリアルの画像を設定します。\n\n```swift\n// 画像をページ数分設定する\nfor i in 0 ..\u003c imageArray.count {\n    let imgView = UIImageView()\n    imgView.frame = CGRect(x: CGFloat(i) * scWidth, y: 0, width: scWidth, height: scHeight)\n    imgView.image = UIImage(named: imageArray[i])\n    scrollView.addSubview(imgView)\n}\n```\n\n「viewDidLoad」にて、ページコントロールの定義を行います。\n\n```swift\n// PageControlを作成する\npageControl = UIPageControl(frame: CGRect(x: 0, y: scHeight - 50, width: scWidth, height: 50))\n// PageControlするページ数を設定する\npageControl.numberOfPages = imageArray.count\n// 現在ページを設定する\npageControl.currentPage = 0\n// 「pageControl」のタップイベントを止める\npageControl.isUserInteractionEnabled = false\n// pageControlをViewに追加する\nself.view.addSubview(pageControl)\n```\n\n「scrollViewDidEndDecelerating」の関数を定義し、その内部にて、ページが切り替わった際には、ページコントロールも切り替えるように処理を追加します。\n\n```swift\n/// スクロール終了後の処理\n/// - Parameter scrollView: scrollView description\nfunc scrollViewDidEndDecelerating(_ scrollView: UIScrollView) {\n    // スクロール数が1ページ分になったら時\n    if fmod(scrollView.contentOffset.x, scrollView.frame.maxX) == 0 {\n        // ページの場所を切り替える\n        pageControl.currentPage = Int(scrollView.contentOffset.x / scrollView.frame.maxX)\n    }\n}\n```\n\nこれで、よく見る横スクロールのチュートリアルの完成です。\n\nソースコードの全量は以下に記載しておきます。\n\n```swift\nimport UIKit\n\nclass ViewController: UIViewController, UIScrollViewDelegate {\n\n    var pageControl: UIPageControl!\n    var scrollView: UIScrollView!\n\n    // 表示する画像の名前のリスト\n    let imageArray = [\"memoruntyo\", \"dc_dentaku\", \"fx_sp\", \"check_imikotoba\", \"patata_talk\", \"patata_wiq\", \"shiftter\"]\n\n    override func viewDidLoad() {\n        // 画面の横のサイズを取得する\n        let scWidth = self.view.frame.width\n        // 画面の縦のサイズを取得する\n        let scHeight = self.view.frame.height\n\n        // ScrollViewを取得する\n        scrollView = UIScrollView()\n        scrollView.frame = CGRect(x: 0, y: 0, width: scWidth, height: scHeight)\n        // 横方向のスクロールバーを非表示にする\n        scrollView.showsHorizontalScrollIndicator = false;\n        // 縦方向のスクロールバーを非表示にする\n        scrollView.showsVerticalScrollIndicator = false\n        // ページングを許可する（中途半端な位置でスクロールが止まらないように設定）\n        scrollView.isPagingEnabled = true\n        // ScrollViewのデリゲートを設定する\n        scrollView.delegate = self\n        // スクロールの画面サイズを指定する\n        scrollView.contentSize = CGSize(width: CGFloat(imageArray.count) * scWidth, height: 0)\n        // ScrollViewをViewに追加する\n        self.view.addSubview(scrollView)\n\n        // 画像をページ数分設定する\n        for i in 0 ..\u003c imageArray.count {\n            let imgView = UIImageView()\n            imgView.frame = CGRect(x: CGFloat(i) * scWidth, y: 0, width: scWidth, height: scHeight)\n            imgView.image = UIImage(named: imageArray[i])\n            scrollView.addSubview(imgView)\n        }\n\n        // PageControlを作成する\n        pageControl = UIPageControl(frame: CGRect(x: 0, y: scHeight - 50, width: scWidth, height: 50))\n        // PageControlするページ数を設定する\n        pageControl.numberOfPages = imageArray.count\n        // 現在ページを設定する\n        pageControl.currentPage = 0\n        // 「pageControl」のタップイベントを止める\n        pageControl.isUserInteractionEnabled = false\n        // pageControlをViewに追加する\n        self.view.addSubview(pageControl)\n    }\n\n    /// スクロール終了後の処理\n    /// - Parameter scrollView: scrollView description\n    func scrollViewDidEndDecelerating(_ scrollView: UIScrollView) {\n        // スクロール数が1ページ分になったら時\n        if fmod(scrollView.contentOffset.x, scrollView.frame.maxX) == 0 {\n            // ページの場所を切り替える\n            pageControl.currentPage = Int(scrollView.contentOffset.x / scrollView.frame.maxX)\n        }\n    }\n}\n```\n"])</script><script>self.__next_f.push([1,"8d:T22d2,"])</script><script>self.__next_f.push([1,"\n## ■はじめに\n\n本記事では、「[FloatingPanel](https://github.com/SCENEE/FloatingPanel)」のライブラリを使用させて頂き、セミモーダルビューを表示する方法をまとめています。\n ライブラリのインストールにはCocoaPodsを使用するため、環境ができていない方は「[CocoaPodsのインストール【iOS】](http://developer-kuro.com/develop/2019/10/28/cocoapods%e3%81%ae%e3%82%a4%e3%83%b3%e3%82%b9%e3%83%88%e3%83%bc%e3%83%ab%e3%80%90ios%e3%80%91/)」にて環境構築をしてください。\n\n## ■手順\n\nソースコードは、[こちら](https://github.com/nakkann-1013/FloatingPanelSample_ios)にアップしていますので、とりあえず動かしてみたい方はクローンして確認してください。\n\n以下のように、下からニュッと出てきて、ドラッグして上げたり下げたりできるViewのことをセミモーダルビューと言うようです。\n\n本手順では、以下のセミモーダルビューの作成方法をまとめています。\n\n![](/images/2020-05-03-000000-2/20220707140429.png)\n\n以下をPodfileに追加して、インストールする\n\n```\npod 'FloatingPanel'\n```\n\nセミモーダルビューに表示するUIViewControllerを作成します。\n\nここでは「SemiModalViewController」として作成しています。\n\n```swift\nimport UIKit\n\nclass SemiModalViewController: UIViewController {\n\n    override func viewDidLoad() {\n        super.viewDidLoad()\n\n        // とりあえず背景色のみ設定\n        self.view.backgroundColor = UIColor.orange\n    }\n}\n```\n\nセミモーダルビューのサイズや背景の透明度などの定義をカスタマイズするために「FloatingPanelLayout」を継承したカスタムクラスを作成します。\n\nここでは「CustomFloatingPanelLayout」として作成しています。\n\n```swift\nimport UIKit\nimport FloatingPanel\n\nclass CustomFloatingPanelLayout: FloatingPanelLayout {\n\n    // ここで、最初に表示するパネルの高さを設定する\n    var initialPosition: FloatingPanelPosition {\n        return .half\n    }\n\n    /// セミモーダルビューの高さを設定する処理\n    /// - Parameter position: position description\n    func insetFor(position: FloatingPanelPosition) -\u003e CGFloat? {\n        switch position {\n            case .full:\n                return 56.0\n            case .half:\n                return 262.0\n            case .tip:\n                return 100.0\n            case .hidden:\n                return 0\n        }\n    }\n\n    /// セミモーダルビュー表示中の背景の透明度（0だと通常表示で、1だと真っ暗）\n    /// - Parameter position: position description\n    func backdropAlphaFor(position: FloatingPanelPosition) -\u003e CGFloat {\n        return 0.0\n    }\n}\n```\n\nセミモーダルビューを表示するために、ViewControllerを作成していきます。\n\nViewControllerに「FloatingPanel」をインポートする。\n\n```swift\nimport FloatingPanel\n```\n\nセミモーダルビューのController変数をフィールドに定義する。\n\n```swift\nvar floatingPanelController: FloatingPanelController!\n```\n\nセミモーダルビューの初期化を行い、角を丸くする。\n\nまた、「SemiModalViewController」をセミモーダルビューで表示されるように設定する。\n\n```swift\n// セミモーダルビューの初期化\nfloatingPanelController = FloatingPanelController()\n// 角を丸くする\nfloatingPanelController.surfaceView.cornerRadius = 24.0\n// 「floatingPanelDidEndDragging」などが呼ばれるようにDelegateの設定\nfloatingPanelController.delegate = self\n\n// セミモーダルビューとなるViewControllerをインスタンス化し、floatingPanelControllerに設定する\nlet semiModalViewController = SemiModalViewController()\nfloatingPanelController.set(contentViewController: semiModalViewController)\n```\n\n上記で、Delegateを追加したので、「FloatingPanelControllerDelegate」を継承に追加する。\n\n```swift\nclass ViewController: UIViewController, FloatingPanelControllerDelegate {\n```\n\nセミモーダルビューの移動後に実行される関数「floatingPanelDidEndDragging」を定義し、「tip」の場合にはセミモーダルビューを閉じるように定義する。\n\n```swift\n/// セミモーダルビューの移動後に実行される処理（各種サイズに応じて処理を追加する\n/// - Parameters:\n///   - vc: vc description\n///   - velocity: velocity description\n///   - targetPosition: targetPosition description\nfunc floatingPanelDidEndDragging(_ vc: FloatingPanelController, withVelocity velocity: CGPoint, targetPosition: FloatingPanelPosition) {\n    // セミモーダルビューの各表示パターンの高さに応じて処理を実行する\n    switch targetPosition {\n        case .tip:\n            print(\"tip\")\n            // tipだった場合には、セミモーダルビューを閉じる\n            floatingPanelController.removePanelFromParent(animated: true)\n        case .half:\n            print(\"half\")\n        case .full:\n            print(\"full\")\n        case .hidden:\n            print(\"hidden\")\n    }\n}\n```\n\nセミモーダルビューのレイアウトをカスタムクラスから適応するように以下の関数を定義する。\n\n```swift\n/// セミモーダルビューのカスタムクラスの適応\n/// - Parameters:\n///   - vc: vc description\n///   - newCollection: newCollection description\nfunc floatingPanel(_ vc: FloatingPanelController, layoutFor newCollection: UITraitCollection) -\u003e FloatingPanelLayout? {\n    return CustomFloatingPanelLayout()\n}\n```\n\nこれで、セミモーダルビューの定義はできたので、ボタン押下時などに以下の処理を実行し、セミモーダルビューを表示してみてください。\n\n```swift\nfloatingPanelController.addPanel(toParent: self, belowView: nil, animated: true)\n```\n\n以下にViewControllerのサンプルを記載します。（セミモーダルビューの表示処理を含む）\n\n```swift\nimport UIKit\nimport FloatingPanel\n\nclass ViewController: UIViewController, FloatingPanelControllerDelegate {\n\n    // セミモーダルビューの変数\n    var floatingPanelController: FloatingPanelController!\n\n    override func viewDidLoad() {\n        super.viewDidLoad()\n\n        let button = UIButton(type: .system)\n        button.addTarget(self, action: #selector(btnAction(_:)), for: .touchUpInside)\n        button.setTitle(\"セミモーダルビュー表示\", for: .normal)\n        button.sizeToFit()\n        button.center = self.view.center\n        self.view.addSubview(button)\n\n        // セミモーダルビューの初期化\n        floatingPanelController = FloatingPanelController()\n        // 角を丸くする\n        floatingPanelController.surfaceView.cornerRadius = 24.0\n        // 「floatingPanelDidEndDragging」などが呼ばれるようにDelegateの設定\n        floatingPanelController.delegate = self\n\n        // セミモーダルビューとなるViewControllerをインスタンス化し、floatingPanelControllerに設定する\n        let semiModalViewController = SemiModalViewController()\n        floatingPanelController.set(contentViewController: semiModalViewController)\n    }\n\n    /// 「表示」ボタン押下時処理\n    /// - Parameter sender: sender description\n    @objc func btnAction(_ sender: Any) {\n        // セミモーダルビューを表示する\n        floatingPanelController.addPanel(toParent: self, belowView: nil, animated: true)\n    }\n\n    /// セミモーダルビューの移動後に実行される処理（各種サイズに応じて処理を追加する\n    /// - Parameters:\n    ///   - vc: vc description\n    ///   - velocity: velocity description\n    ///   - targetPosition: targetPosition description\n    func floatingPanelDidEndDragging(_ vc: FloatingPanelController, withVelocity velocity: CGPoint, targetPosition: FloatingPanelPosition) {\n        // セミモーダルビューの各表示パターンの高さに応じて処理を実行する\n        switch targetPosition {\n            case .tip:\n                print(\"tip\")\n                // tipだった場合には、セミモーダルビューを閉じる\n                floatingPanelController.removePanelFromParent(animated: true)\n            case .half:\n                print(\"half\")\n            case .full:\n                print(\"full\")\n            case .hidden:\n                print(\"hidden\")\n        }\n    }\n\n    /// セミモーダルビューのカスタムクラスの適応\n    /// - Parameters:\n    ///   - vc: vc description\n    ///   - newCollection: newCollection description\n    func floatingPanel(_ vc: FloatingPanelController, layoutFor newCollection: UITraitCollection) -\u003e FloatingPanelLayout? {\n        return CustomFloatingPanelLayout()\n    }\n}\n```\n"])</script><script>self.__next_f.push([1,"8e:T1981,"])</script><script>self.__next_f.push([1,"\n## ■はじめに\n\nUserDefaultsには通常は、独自クラスの設定ができません。\n\nそのため、ここでは独自クラスをエンコードして設定する方法を記載します。\n\n※ついでに、配列として設定する方法を記載していますが、配列にしない場合には、通常のクラス型で設定してください。\n\n## ■手順\n\n保存するクラスを作成する。\n ※「NSObject」「NSSecureCoding」を継承する必要があります。\n\n```swift\nclass SampleClass: NSObject, NSSecureCoding {\n}\n```\n\n上記のクラスに設定したいパラメータを追加します。\n\n```swift\nclass SampleClass: NSObject, NSSecureCoding {\n    var intt: Int?\n    var stringgg: String?\n    var array: [String] = []\n}\n```\n\n追加したら、以下のパラメータを追加します。\n\n※セキュリティの強いエンコードをするためのフラグなので、おまじないだと思ってください。\n\n```swift\nstatic var supportsSecureCoding: Bool = true\n```\n\nエンコードの関数「encode」を作成し、パラメータをエンコードするコードを記載します。（詳細はソースを参照してください）\n\n「forKey」の部分は他のパラメータと被らない、一意の値にするようにしてください。\n\n※デコードの時にこのKeyを元にデコードします。\n\n```swift\nclass SampleClass: NSObject, NSSecureCoding {\n    var intt: Int?\n    var stringgg: String?\n    var array: [String] = []\n\n    static var supportsSecureCoding: Bool = true\n\n    func encode(with coder: NSCoder) {\n        coder.encode(index, forKey: \"dataKey\")\n        coder.encode(zyuusyo, forKey: \"dataKey1\")\n        coder.encode(todoArray, forKey: \"dataKey2\")\n    }\n}\n```\n\nデコードの関数「init?」を作成し、パラメータをデコードするコードを記載します。\n\n「forKey」の部分はエンコードで利用したKeyを記載してください。\n\n```swift\nclass SampleClass: NSObject, NSSecureCoding {\n    var intt: Int?\n    var stringgg: String?\n    var array: [String] = []\n\n    static var supportsSecureCoding: Bool = true\n\n    func encode(with coder: NSCoder) {\n        coder.encode(index, forKey: \"dataKey\")\n        coder.encode(zyuusyo, forKey: \"dataKey1\")\n        coder.encode(todoArray, forKey: \"dataKey2\")\n    }\n\n    required init?(coder: NSCoder) {\n        self.index = (coder.decodeObject(forKey: \"dataKey\") as? Int)\n        self.zyuusyo = (coder.decodeObject(forKey: \"dataKey1\") as? String)\n        self.todoArray = (coder.decodeObject(forKey: \"dataKey2\") as! [String])\n    }\n}\n```\n\nこのままでは、「init?」関数の影響で、インスタンス作成時に引数「NSCoder」が必要になってしまうので、インスタンス作成用に空のinitメソッドを追加します。\n\n```swift\nclass SampleClass: NSObject, NSSecureCoding {\n    var intt: Int?\n    var stringgg: String?\n    var array: [String] = []\n\n    static var supportsSecureCoding: Bool = true\n\n    func encode(with coder: NSCoder) {\n        coder.encode(index, forKey: \"dataKey\")\n        coder.encode(zyuusyo, forKey: \"dataKey1\")\n        coder.encode(todoArray, forKey: \"dataKey2\")\n    }\n\n    required init?(coder: NSCoder) {\n        self.index = (coder.decodeObject(forKey: \"dataKey\") as? Int)\n        self.zyuusyo = (coder.decodeObject(forKey: \"dataKey1\") as? String)\n        self.todoArray = (coder.decodeObject(forKey: \"dataKey2\") as! [String])\n    }\n\n    override init(){\n    }\n}\n```\n\nこれで、設定するクラスの作成は完了です。\n\nViewControllerの「ViewDidLoad」で値を設定して、その後に設定した値を取得する処理を記載して動作確認を行いましょう。\n\nまずは、作成したクラス型の配列に適当な値を設定します。\n\n```swift\noverride func viewDidLoad() {\n    super.viewDidLoad()\n\n    let samp = SampleClass()\n    samp.intt = 1\n    samp.stringgg = \"住所\"\n    samp.array.append(\"TODO1\")\n    samp.array.append(\"TODO2\")\n\n    let sampp = SampleClass()\n    sampp.intt = 2\n    sampp.stringgg = \"住所2\"\n    sampp.array.append(\"TODO3\")\n    sampp.array.append(\"TODO4\")\n\n    var array = [SampleClass]()\n    array.append(samp)\n    array.append(sampp)\n}\n```\n\n「NSKeyedArchiver」クラスの「archivedData」関数を利用してエンコードし、if letを利用してエンコードされている場合にはUserDefaultsに保存する処理を記載してください。\n\n```swift\noverride func viewDidLoad() {\n    super.viewDidLoad()\n\n    let samp = SampleClass()\n    samp.intt = 1\n    samp.stringgg = \"住所\"\n    samp.array.append(\"TODO1\")\n    samp.array.append(\"TODO2\")\n\n    let sampp = SampleClass()\n    sampp.intt = 2\n    sampp.stringgg = \"住所2\"\n    sampp.array.append(\"TODO3\")\n    sampp.array.append(\"TODO4\")\n\n    var array = [SampleClass]()\n    array.append(samp)\n    array.append(sampp)\n\n    if let archiveData = try? NSKeyedArchiver.archivedData(withRootObject: array, requiringSecureCoding: true) {\n        // Userdefaultsにデータを保存する\n        UserDefaults.standard.set(archiveData, forKey: \"array\")\n        UserDefaults.standard.synchronize()\n    }\n}\n```\n\nUserDefaultsから設定したデータをData型で取得し、取得できた場合には「NSKeyedUnarchiver」クラスの「unarchiveTopLevelObjectWithData」関数でデコードし、if letを利用してコンソール出力させます。\n\n```swift\noverride func viewDidLoad() {\n    super.viewDidLoad()\n\n    let samp = SampleClass()\n    samp.intt = 1\n    samp.stringgg = \"住所\"\n    samp.array.append(\"TODO1\")\n    samp.array.append(\"TODO2\")\n\n    let sampp = SampleClass()\n    sampp.intt = 2\n    sampp.stringgg = \"住所2\"\n    sampp.array.append(\"TODO3\")\n    sampp.array.append(\"TODO4\")\n\n    var array = [SampleClass]()\n    array.append(samp)\n    array.append(sampp)\n\n    if let archiveData = try? NSKeyedArchiver.archivedData(withRootObject: array, requiringSecureCoding: true) {\n        UserDefaults.standard.set(archiveData, forKey: \"array\")\n        UserDefaults.standard.synchronize()\n    }\n\n    if let loadedData = UserDefaults().data(forKey: \"array\") {\n        if let sample = try? NSKeyedUnarchiver.unarchiveTopLevelObjectWithData(loadedData) as? [SampleClass] {\n            for aaaaaa in sample {\n                print(aaaaaa.intt)\n                print(aaaaaa.stringgg)\n            }\n        }\n    }\n}\n```\n\n変数名などは適当ですが、これで独自のクラスを保存し、取得することができました。\n"])</script><script>self.__next_f.push([1,"8f:Ta36,"])</script><script>self.__next_f.push([1,"\n## ■はじめに\n\n本記事は、SignalRを利用して、UWPのアプリからWPFのアプリのメソッドを実行する為の方法をまとめた記事の、引数と戻り値の方法です。\n\n以下の2つの準備ができている前提となります。\n\n[UWPアプリ](http://developer-kuro.com/develop/2019/10/13/signalr%e3%81%a7%e3%81%ae%e9%80%a3%e6%90%ba%ef%bc%88uwp%e3%82%a2%e3%83%97%e3%83%aa%ef%bc%89/)\n\n[WPFアプリ](http://developer-kuro.com/develop/2019/10/13/signalr%e3%81%a7%e3%81%ae%e9%80%a3%e6%90%ba%ef%bc%88wpf%e3%82%a2%e3%83%97%e3%83%aa%ef%bc%89/)\n\n## ■引数\n\nサーバー側のソースの「SampleHub」クラスに以下のメソッドを追加する。\n\n```c#\npublic void CallSampleTwo(string sample)\n{\n    System.Diagnostics.Debug.WriteLine(\"=====SampleHubの呼び出す=====\");\n    System.Diagnostics.Debug.WriteLine(sample);\n}\n```\n\nクライアント側のソースの「MainPage」クラスの「proxy.Invoke」の処理を以下に書き換える。\n\n変更前\n\n```c#\nproxy.Invoke(\"CallSample\").Wait();\n```\n\n変更後\n\n```c#\nproxy.Invoke(\"CallSampleTwo\", \"引数のデータだよ\").Wait();\n```\n\nその後、サーバー実行を行ったあとクライアントの実行を行い、サーバー側のコンソールに以下が出力されていることを確認する。\n\n![](/images/2020-05-02-000000-2/20220707115325.png)\n\n## ■戻り値\n\nサーバー側のソースの「SampleHub」クラスに以下のメソッドを追加する。\n\n```c#\npublic void CallSampleThree()\n{\n    System.Diagnostics.Debug.WriteLine(\"=====あああああああああああ123=====\");\n    Clients.All.HelloWorld(\"あいうえお\", \"かきくけこ\");\n}\n```\n\nクライアント側のソースの「MainPage」クラスの「proxy.Invoke」の処理を以下に書き換える。\n\n変更前\n\n```c#\nproxy.Invoke(\"CallSample\").Wait();\n```\n\n変更後\n\n```c#\nproxy.Invoke(\"CallSampleThree\").Wait();\n```\n\nクライアント側のソースの「MainPage」クラスの「var proxy = connection.CreateHubProxy(\"Sample\");」以降、「connection.Start().Wait();」以前に以下を追加する。\n\n```c#\nproxy.On\u003cstring, string\u003e(\"HelloWorld\", (user, message) =\u003e\n{\n    System.Diagnostics.Debug.WriteLine(\"=====あああああああああああ=====\");\n    System.Diagnostics.Debug.WriteLine(user);\n    System.Diagnostics.Debug.WriteLine(message);\n});\n```\n\nその後、サーバー実行を行ったあとクライアントの実行を行い、クライアント側のコンソールに以下が出力されていることを確認する。\n\n![](/images/2020-05-02-000000-2/20220707115337.png)\n"])</script><script>self.__next_f.push([1,"90:T788,"])</script><script>self.__next_f.push([1,"\n## ■はじめに\n\nCocoaPodsをインストールしていない方は、「[CocoaPodsインストール](https://developer-kuro.com/develop/2019/10/28/cocoapods%e3%81%ae%e3%82%a4%e3%83%b3%e3%82%b9%e3%83%88%e3%83%bc%e3%83%ab%e3%80%90ios%e3%80%91/)」よりインストールしてください。\n\niOSアプリのプロジェクトを作成していること。\n\n## ■手順\n\nターミナルで以下のコマンドを実行し、プロジェクトに移動する。\n\n```\ncd [プロジェクトまでのディレクトリ]\n```\n\nターミナルで以下のコマンドを実行し、CocoaPodsのファイルを作成する。\n\n```\npod init\n```\n\nターミナルで以下のコマンドを実行し、Podfileを編集モードにする。\n\n```\nvi Podfile\n```\n\n上記の編集モードのファイルに以下を追加する。\n\n```\npod 'lottie-ios'\n```\n\n編集モードを終了し、以下のコマンドでCocoaPodsをインストールする。\n\n```\npod install\n```\n\nインストールしたら、プロジェクトを開き、Lottieを使用したいソースで、以下をインポートする。\n\n```swift\nimport Lottie\n```\n\n以下のJSONファイルをプロジェクトにドラッグ＆ドロップし追加する。\n\n[JSONサンプルファイル](https://developer-kuro.com/develop/wp-content/uploads/2019/10/sample.json_.zip)[ダウンロード](https://developer-kuro.com/develop/wp-content/uploads/2019/10/sample.json_.zip)\n\nアニメーションを追加したい箇所に以下を記載してアニメーションさせる。\n\n```swift\nvar animationView = AnimationView(name: \"sample\")\nanimationView.frame = CGRect(x: 0, y: 0, width: 300, height: 300)\nanimationView.center = self.view.center\nanimationView.animationSpeed = 1\nanimationView.loopMode = .loop\n\nself.view.addSubview(animationView)\nanimationView.play()\n```\n\nアニメーションのJSONは「Adobe After Effects」などで作成してください。\n"])</script><script>self.__next_f.push([1,"91:T827,"])</script><script>self.__next_f.push([1,"\n## ■はじめに\n\nNode.jsがローカルにインストールされていない方は、以下からインストールをお願いします。\n\n[https://developer-kuro.com/develop/2019/09/01/local-node-js-nodebrew/](https://developer-kuro.com/develop/2019/09/01/local-node-js-nodebrew/)\n\n## ■手順\n\nターミナルを起動し、以下のコマンドを実行する。\n\n```\nnpm install -g react-native-cli\n```\n\nたったこれだけで、React Nativeの環境構築が終わります！！\n\n## ■プロジェクトの作成\n\nプロジェクトを作成するには、ターミナルで以下のコマンドを実行するだけです！\n\n```\nreact-native init [プロジェクト名]\n```\n\n## ■プロジェクトの実行\n\n作成したプロジェクトを実行するためには、以下の下準備が必要です。\n\n・iOSの実行の場合には、Xcodeのインストールと、起動\n\n・Androidの実行の場合には、Android Studioのインストールと、起動\n\n実行には、ターミナルで以下のコマンドを実行する事で起動できます。\n\n```\n# プロジェクトディレクトリをカレントディレクトリにする\ncd [プロジェクト名]\n\n# iOSの実行の場合\nreact-native run-ios\n\n# Androidの実行の場合\nreact-native run-android\n```\n\n## ■エラーに関して\n\nプロジェクト作成時に、以下のエラーが出た場合\n\n```\n(node:[行数]) UnhandledPromiseRejectionWarning: Error: Failed to install CocoaPods dependencies for iOS project, which is required by this template.\nPlease try again manually: \"cd ./[プロジェクト名]/ios \u0026\u0026 pod install\".\n```\n\n以下のコマンドを実行して\n\n```\nxcrun -k --sdk iphoneos --show-sdk-path\n```\n\n以下のエラーが出ているか確認する\n\n```\nxcrun: error: SDK \"iphoneos\" cannot be located\nxcrun: error: SDK \"iphoneos\" cannot be located\nxcrun: error: unable to lookup item 'Path' in SDK 'iphoneos'\n```\n\n上記のエラーが出ている場合には、以下のコマンドを実行する。\n\n```\nsudo xcode-select --switch /Applications/Xcode.app\n```\n"])</script><script>self.__next_f.push([1,"92:T100c,"])</script><script>self.__next_f.push([1,"\n## ■はじめに\n\n本記事は、SignalRを利用して、UWPのアプリからWPFのアプリのメソッドを実行する為の方法をまとめた記事の、WPFアプリの作成記事です。\n\n## ■手順\n\nVisual Studioの新規プロジェクト作成より、「WPF　アプリ（.NET Framework）」を選択し、「次へ」を押下する。\n\n![](/images/2020-05-01-000000-4/20220707120117.png)\n\nプロジェクト名に任意の名前を設定し、「作成」を押下する。\n\n![](/images/2020-05-01-000000-4/20220707120121.png)\n\nプロジェクトが起動したら、「ソリューション エクスプローラー」のプロジェクト名を右クリックする。\n\n![](/images/2020-05-01-000000-4/20220707140409.png)\n\n右クリックで出てきたポップアップの「NuGet パッケージ管理」を選択する。\n\n![](/images/2020-05-01-000000-4/20220707140412.png)\n\nNuGetのウィンドウの「参照」を押下する。\n\n![](/images/2020-05-01-000000-4/20220707115348.png)\n\n検索項目に「Microsoft.AspNet.SignalR.Core」を入力し、対象のパッケージを選択後、「インストール」ボタンを押下する。\n\n※ライセンスの同意などを行い、NuGetがインストールされるのをまつ。\n\n※「インストール」を押下場所が「アンインストール」に変われば、インストール成功です。\n\n同様の手順で、以下のパッケージをインストールする。（一番上は、上記手順でインストールされているはずです。）\n\nMicrosoft.AspNet.SignalR.Core\nMicrosoft.AspNet.SignalR.SystemWeb\nMicrosoft.Owin.Cors\nMicrosoft.Owin.Hosting\nMicrosoft.Owin.Host.HttpListener\n\n![](/images/2020-05-01-000000-4/20220707120209.png)\n\n![](/images/2020-05-01-000000-4/20220707140416.png)\n\n「ソリューション エクスプローラー」のプロジェクト名を右クリックし、「追加」内の「クラス」を選択する。\n\n![](/images/2020-05-01-000000-4/20220707120126.png)\n\n「クラス」が選択されている状態で、「名前」に「AppStartup.cs」を入力し、「追加」を押下する。\n\n※同様の手順で、「SampleHub.cs」クラスも作成する。\n\n![](/images/2020-05-01-000000-4/20220707120214.png)\n\n出来上がった「AppStartup」クラスに以下を記載する。\n\n```c#\nusing Microsoft.Owin.Cors;\nusing Owin;\n\nnamespace SignalRSampleServer\n{\n    class AppStartup\n    {\n        public void Configuration(IAppBuilder app)\n        {\n            app.UseCors(CorsOptions.AllowAll);\n            app.MapSignalR(\"/device\", new Microsoft.AspNet.SignalR.HubConfiguration());\n        }\n    }\n}\n```\n\n出来上がった「SampleHub」クラスに以下を記載する。\n\n```c#\nusing Microsoft.AspNet.SignalR;\nusing Microsoft.AspNet.SignalR.Hubs;\n\nnamespace SignalRSampleServer\n{\n    [HubName(\"Sample\")]\n    public class SampleHub : Hub\n    {\n        public void CallSample()\n        {\n            System.Diagnostics.Debug.WriteLine(\"=====SampleHubの呼び出す=====\");\n        }\n    }\n}\n```\n\nプロジェクト作成時に用意されていた、「MainWindow.xaml」を展開し、「MainWindow.xaml.cs」を開き、以下になるように記載する。\n\n※具体的には、「_startup」のグローバル変数の追加と、「MainWindow」のコンストラクタ内で、ローカルホストの起動を追加しています。\n\n![](/images/2020-05-01-000000-4/20220707140419.png)\n\n```c#\nusing Microsoft.Owin.Hosting;\nusing System;\nusing System.Windows;\n\nnamespace SignalRSampleServer\n{\n    /// \u003csummary\u003e\n    /// MainWindow.xaml の相互作用ロジック\n    /// \u003c/summary\u003e\n    public partial class MainWindow : Window\n    {\n\n        private IDisposable _startup;\n\n        public MainWindow()\n        {\n            InitializeComponent();\n            _startup = WebApp.Start\u003cAppStartup\u003e(\"http://localhost:8080\");\n        }\n    }\n}\n```\n\nこちらのソースは以下のGithubにアップしています。\n\n[https://github.com/nakkann-1013/SignalR_WPF_Sample_Server](https://github.com/nakkann-1013/SignalR_WPF_Sample_Server)\n"])</script><script>self.__next_f.push([1,"93:Tdec,"])</script><script>self.__next_f.push([1,"\n## ■はじめに\n\n本記事は、SignalRを利用して、UWPのアプリからWPFのアプリのメソッドを実行する為の方法をまとめた記事の、UWPアプリの作成記事です。\n\n## ■手順\n\nVisual Studioの新規プロジェクト作成より、「空白のアプリ（ユニバーサル Windows）」を選択し、「次へ」を押下する。\n\n![](/images/2020-05-01-000000/20220707120110.png)\n\nプロジェクト名に任意の名前を設定し、「作成」を押下する。\n\n![](/images/2020-05-01-000000/20220707115332.png)\n\n「ターゲット バージョン」はそのままで、「最小バージョン」は、一番下のものに変更して、「OK」を押下する。\n\n※明確に必要なバージョンが分かっていれば、そのバージョンを指定してください。\n\n![](/images/2020-05-01-000000/20220707140352.png)\n\nプロジェクトが起動したら、「ソリューション エクスプローラー」のプロジェクト名を右クリックする。\n\n![](/images/2020-05-01-000000/20220707140355.png)\n\n右クリックで出てきたポップアップの「NuGet パッケージ管理」を選択する。\n\n![](/images/2020-05-01-000000/20220707140359.png)\n\nNuGetのウィンドウの「参照」を押下する。\n\n![](/images/2020-05-01-000000/20220707120204.png)\n\n検索項目に「Microsoft.AspNet.SignalR.Client」を入力し、対象のパッケージを選択後、「インストール」ボタンを押下する。\n\n※ライセンスの同意などを行い、NuGetがインストールされるのをまつ。\n\n※「インストール」を押下場所が「アンインストール」に変われば、インストール成功です。\n\n同様の手順で、以下のパッケージをインストールする。（一番上は、上記手順でインストールされているはずです。）\n\nMicrosoft.AspNet.SignalR.Client\n\n![](/images/2020-05-01-000000/20220707115343.png)\n\n![](/images/2020-05-01-000000/20220707140402.png)\n\nプロジェクト作成時に用意されていた、「MainPage.xaml」を展開し、「MainPage.xaml.cs」を開き、以下になるように記載する。\n\n※具体的には、「_startup」のグローバル変数の追加と、「MainWindow」のコンストラクタ内で、ローカルホストの起動を追加しています。\n\n![](/images/2020-05-01-000000/20220707140406.png)\n\n```c#\nusing Microsoft.AspNet.SignalR.Client;\nusing Windows.UI.Xaml.Controls;\n\nnamespace SignalRSampleClient\n{\n    public sealed partial class MainPage : Page\n    {\n        private HubConnection _connection;\n\n        public MainPage()\n        {\n            this.InitializeComponent();\n            var connection = new HubConnection(\"http://localhost:8080/device\");\n            connection.Closed += Connection_Closed;\n            connection.StateChanged += (state) =\u003e\n            {\n                if (state.NewState == ConnectionState.Connected)\n                {\n                    _connection = connection;\n                }\n            };\n            var proxy = connection.CreateHubProxy(\"Sample\");\n            connection.Start().Wait();\n            proxy.Invoke(\"CallSample\").Wait();\n        }\n\n        private void Connection_Closed()\n        {\n            System.Diagnostics.Debug.WriteLine(\"=====Connection Closed=====\");\n        }\n    }\n}\n```\n\nこちらのソースは以下のGithubにアップしています。\n\n[https://github.com/nakkann-1013/SignalR_UWP_Sample_Client](https://github.com/nakkann-1013/SignalR_UWP_Sample_Client)\n"])</script><script>self.__next_f.push([1,"94:T24ca,"])</script><script>self.__next_f.push([1,"\n■はじめに\n\n本記事は、以下の条件で記載しています。\n\n・既にAppStoreにアプリがリリースされている物を自動化する\n\n・Githubでソースコードを管理している\n\n・CocoaPodsを使用している\n\n■BitriseでiOSアプリのリリースビルドを自動化する方法\n\n1.プロジェクトをXcodeで開き、左上のプロジェクト名を選択し、「Manage Schemes...」を押下する。\n\n![](/images/2020-04-30-000000-1/20220707130323.png)\n\n2.「＋」を押下し、適当な名前を入力して「OK」を押下する。\n\n![](/images/2020-04-30-000000-1/20220707120407.png)\n\n3.「2」で追加したSchemeの「Container」を「[プロジェクト名] Workspace」に変更してGitへPushする。\n\n![](/images/2020-04-30-000000-1/20220707130423.png)\n\n4.以下のリンク先にアクセスする。\n\n[https://www.bitrise.io/](https://www.bitrise.io/)\n\n5.「Sign Up」を押下する。\n\n![](/images/2020-04-30-000000-1/20220707120326.png)\n\n6.「Sign up with GitHub」を押下する。\n\n![](/images/2020-04-30-000000-1/20220707120432.png)\n\n7.GitHubのユーザー名（メールアドレス）とパスワードを入力して「Sign in」を押下する。\n\n![](/images/2020-04-30-000000-1/20220707120532.png)\n\n8.「Authorize bitrise-io」を押下する。（Bitriseとの接続を認証させる。）\n\n![](/images/2020-04-30-000000-1/20220707120648.png)\n\n9.Bitriseで使用するユーザー名とパスワードを入力して「Next」を押下する。\n\n![](/images/2020-04-30-000000-1/20220707120758.png)\n\n10.「START BUILDING FOR FREE」を押下する。\n\n![](/images/2020-04-30-000000-1/20220707120840.png)\n\n11.「Add your first app」を押下する。\n\n![](/images/2020-04-30-000000-1/20220707120853.png)\n\n12.「Private」を選択し、「Next」を押下する。（リポジトリがPublicの場合はそちらを選択する。）\n\n![](/images/2020-04-30-000000-1/20220707120904.png)\n\n13.「Repositories」から対象のリポジトリを選択する。\n\n![](/images/2020-04-30-000000-1/20220707130313.png)\n\n14.「I need to」を選択する。（初回だけで良さそう。。。？）\n\n![](/images/2020-04-30-000000-1/20220707130317.png)\n\n15.「COPY TO CLIPBOARD」を押下し、「GITHUB SETTINGS」を押下する。\n\n![](/images/2020-04-30-000000-1/20220707120330.png)\n\n16.「New SSH Key」を押下する。\n\n![](/images/2020-04-30-000000-1/20220707120339.png)\n\n17.「Title」に任意のタイトルを入力し、Keyに「15」でコピーしたキーを貼り付け、「Add SSH key」を押下する。\n\n![](/images/2020-04-30-000000-1/20220707120346.png)\n\n18.GitHubのパスワードを入力して、「Confirm password」を押下する。\n\n![](/images/2020-04-30-000000-1/20220707120349.png)\n\n19.SSH keysにキーが追加されていたら成功なので、Bitriseのタブに戻る。\n\n![](/images/2020-04-30-000000-1/20220707120352.png)\n\n20.「I've added the SSH key」を押下する。\n\n![](/images/2020-04-30-000000-1/20220707120356.png)\n\n21.「Choose branch」に対象のブランチを入力し、「Next」を押下する。（特にブランチを切っていなければ「master」を入力する）\n\n![](/images/2020-04-30-000000-1/20220707120403.png)\n\n22.「VALIDATING REPOSITORY」が出たら、放置する。（リポジトリのチェックが行われる）\n\n![](/images/2020-04-30-000000-1/20220707120414.png)\n\n23.「Project build configuration」が表示されたら、「Select ipa export method」で対象環境を選択する。\n\n![](/images/2020-04-30-000000-1/20220707120422.png)\n\n24.「Selected project build configuration」を確認して、問題なければ「Confirm」を押下する。\n\n![](/images/2020-04-30-000000-1/20220707120425.png)\n\n25.「App icon」でBitriseで表示するアイコンを選択し、「Choose Image and Proceed」を押下する。（特に拘らなければ、そのまま押下する）\n\n![](/images/2020-04-30-000000-1/20220707120436.png)\n\n26.「Skip the Webhook registration」を押下する。（GitへのPushを監視して自動でデプロイしたい場合は、このWebhookを設定する。）\n\n![](/images/2020-04-30-000000-1/20220707120443.png)\n\n27.「We've kicked off your first test build for you!」を押下する。\n\n![](/images/2020-04-30-000000-1/20220707120446.png)\n\n28.初回ビルドが実行されるので、終了するまで待機する。（ここではエラーが発生します。※証明書の設定をしていないので。）\n\n![](/images/2020-04-30-000000-1/20220707120450.png)\n\n29.プロジェクト名を押下する。\n\n![](/images/2020-04-30-000000-1/20220707120456.png)\n\n30.「Workflow」を押下する。\n\n![](/images/2020-04-30-000000-1/20220707120500.png)\n\n31.「Code Signing」を押下する。\n\n![](/images/2020-04-30-000000-1/20220707120503.png)\n\n32.証明書（拡張子が「.p12」のファイル）を「CODE SIGNING IDENTITY」にドラック＆ドロップでアップし、パスワードを入力する。\n\n![](/images/2020-04-30-000000-1/20220707120506.png)\n\n33.「Workflows」を押下する。\n\n![](/images/2020-04-30-000000-1/20220707120514.png)\n\n34.「Run CocoaPods install」の下の「＋」を押下する。\n\n![](/images/2020-04-30-000000-1/20220707120521.png)\n\n35.「Search steps」に「auto」を入力する。\n\n![](/images/2020-04-30-000000-1/20220707120536.png)\n\n36.表示された「iOS Auto Provision」を押下する。\n\n![](/images/2020-04-30-000000-1/20220707120548.png)\n\n37.「Certificate and profile installer」を削除する。\n\n![](/images/2020-04-30-000000-1/20220707120552.png)\n\n38.「command + s」で保存し、プロジェクト名を選択する。\n\n![](/images/2020-04-30-000000-1/20220707120556.png)\n\n39.「Click here to setup deployment to your devices!」を押下する。\n\n![](/images/2020-04-30-000000-1/20220707120603.png)\n\n40.証明書は入っているはずなので、そのまま「Next」を押下する。\n\n![](/images/2020-04-30-000000-1/20220707120606.png)\n\n41.画面の手順に沿ってAppleのログインをする（個人情報がぎっしりだったので、画像は省きました。。。）\n\n42.対象のチームを選択して、「Select Team」を押下する。\n\n![](/images/2020-04-30-000000-1/20220707120614.png)\n\n43.「Team」タブを押下する。\n\n![](/images/2020-04-30-000000-1/20220707120617.png)\n\n44.下の方の「Connected Apple Developer Portal Account」を自分のアカウントに変更し、「Save」を押下する。\n\n![](/images/2020-04-30-000000-1/20220707120626.png)\n\n45.「Start/Schedule a Build」を押下する。\n\n![](/images/2020-04-30-000000-1/20220707120652.png)\n\n46.「Start Build」を押下する。\n\n![](/images/2020-04-30-000000-1/20220707120655.png)\n\n47.ビルドが終了するまで待つ。\n\n![](/images/2020-04-30-000000-1/20220707120658.png)\n\n48.ビルドが成功したら、ワークフローを表示する。\n\n![](/images/2020-04-30-000000-1/20220707120702.png)\n\n49.「Bitrise.io Cache:Push」の上の「＋」を押下する。\n\n![](/images/2020-04-30-000000-1/20220707120705.png)\n\n50.「itunes」を検索し、「Deploy to iTunes Connect - Application Loader」を選択する。\n\n![](/images/2020-04-30-000000-1/20220707120712.png)\n\n51.「50」で追加したジョブの設定で、「Apple ID」の「Select secret varible」を押下する。\n\n![](/images/2020-04-30-000000-1/20220707120727.png)\n\n52.「Key」に適当な値を入力し、「Value」にAppleのメールアドレス（AppleId）を入力し、「Add new」を押下する。\n\n![](/images/2020-04-30-000000-1/20220707120731.png)\n\n53.「Password」の「Select secret variable」を押下する。\n\n![](/images/2020-04-30-000000-1/20220707120735.png)\n\n54.「Key」に適当な値を入力し、「Value」にAppleのパスワードを入力し、「Add new」を押下する。\n\n![](/images/2020-04-30-000000-1/20220707120739.png)\n\n55.「Application Specific Password」を選択し、「AppleID Wensite」を押下する。\n\n![](/images/2020-04-30-000000-1/20220707120802.png)\n\n56.「55」で開いたWebサイトにログインする。（ログインするだけなので画像は省きます。）\n\n57.「セキュリティ」の「パスワードを生成...」を押下する。\n\n![](/images/2020-04-30-000000-1/20220707120806.png)\n\n58.適当なラベルを入力し、「作成」を押下して生成されたパスワードをコピーする。（※25個まで保持できますが、一応メモしておいてください。）\n\n![](/images/2020-04-30-000000-1/20220707120810.png)\n\n59.Bitriseに戻り、「Application Specific Password」の「Select secret variable」を押下し、「Key」に適当な値を入力し、「Value」に「58」で取得したパスワードを入力し、「Add new」を押下する。\n\n![](/images/2020-04-30-000000-1/20220707120813.png)\n\n60.「Deploy to Bitrise.io - Apps,Lo...」を削除する。\n\n![](/images/2020-04-30-000000-1/20220707120822.png)\n\n61.「iOS Auto Provision」の「Distribution type」を「app-store」に変更する。\n\n![](/images/2020-04-30-000000-1/20220707120826.png)\n\n62.これで、設定は終了です。保存して、ビルドしてみましょう！\n\n※エラーが出たら、そのエラーをググるか、Xcodeで手動でリリースビルドしてみてエラーが出るか確認してみましょう。\n"])</script><script>self.__next_f.push([1,"95:T9f7,"])</script><script>self.__next_f.push([1,"\n# 以下の下準備を行いましょう。\n\n- VPSを契約する。 （以下など）さくらVPS（[https://vps.sakura.ad.jp/](https://vps.sakura.ad.jp/)）\n- ConoHa VPS（[https://www.conoha.jp/?btn_id=header_top](https://www.conoha.jp/?btn_id=header_top)）\n\n\u003c/li\u003e\u003cli\u003eCentOS7をインストールする。- スタートアップスクリプトをLAMPを選択してインストールする。\n\n\u003c/li\u003e\u003c/ul\u003e\n\n# 以下の手順でWordpressをインストールする。\n\n- ターミナルを起動し、SSH（以下のコマンド）でサーバーにアクセスする。\n\n```\nssh root@[IP]\n```\n\n※上記の「[IP]」には自身のサーバーのIPを代入すること（以下のようになる）\n\n```\nssh root@111.222.33.44\n```\n\n\u003chr class=\"wp-block-separator\"/\u003e\n\n- mariadb（MySQL）をインストール\n\n```\nyum install mariadb mariadb-server\n```\n\n- DBの自動起動設定\n\n```\nsystemctl enable mariadb.service\n```\n\n- DB起動\n\n```\nsystemctl start mariadb.service\n```\n\n- MySQLにログイン\n\n```sql\nmysql -u root\n```\n\n- DBを作成\n\n```sql\ncreate database wordpress;\n```\n\n- rootのパスワードを設定\n\n```sql\nupdate mysql.user set password=password('password') where user = 'root';\n```\n\n- 設定を反映\n\n```sql\nflush privileges;\n```\n\n- MySQLログアウト\n\n```sql\nexit;\n```\n\n\u003chr class=\"wp-block-separator\"/\u003e\n\n- PHPをインストール（LAMPでインストールされているが、足りないモジュールがあるため）\n\n```\nyum -y install php\n```\n\n- ファイアーウォールを起動（CentOS7起動時には停止されている）\n\n```\nsystemctl start firewalld\n```\n\n- ポート８０を開放\n\n```\nfirewall-cmd --add-port=80/tcp --zone=public --permanent\n```\n\n- ファイアーウォールの再起動\n\n```\nfirewall-cmd --reload\n```\n\n- Apacheの起動\n\n```\nsystemctl start httpd\n```\n\n- Apacheのデーモン化（サーバー起動時に、自動起動するように設定）\n\n```\nsystemctl enable httpd\n```\n\n- Apacheのルートに移動\n\n```\ncd /var/www/html/\n```\n\n- Wordpressをインストール（Zipをダウンロード）\n\n```\nwget https://ja.wordpress.org/wordpress-4.4.2-ja.zip\n```\n\n- Wordpressを解凍\n\n```\nunzip wordpress-4.4.2-ja.zip\n```\n\n- 権限をApacheで設定（「wordpress」ディレクトリにApacheでアクセスできるようにする）\n\n```\nchown -R apache. wordpress\n```\n\n- Apacheの再起動\n\n```\nsystemctl restart httpd\n```\n\n\u003chr class=\"wp-block-separator\"/\u003e\n\n- 以下のURLにアクセスして、Wordpressの手順に沿ってインストールする。http://[IP]/wordpress/\n"])</script><script>self.__next_f.push([1,"96:Tb71,"])</script><script>self.__next_f.push([1,"\n## ■はじめに\n\nこの環境構築はmacを前提にしています。\n\n## ■手順\n\n1.AppStoreで「Xcode」をインストールする。（Xcodeの中に入っている「Command Line Tools」が必要になります。）\n\n![](/images/2020-04-29-000000-2/20220707130331.png)\n\n2.「1」でインストールしたXcodeを開き、以下の画面まで進める。（インストールなど実施する。）\n\n![](/images/2020-04-29-000000-2/20220707120746.png)\n\n2.以下のURLにアクセスし、Homebrewのインストールコマンドをコピーしてターミナルに貼り付け、実行する。\n\n[https://brew.sh/index_ja](https://brew.sh/index_ja)\n\n![](/images/2020-04-29-000000-2/20220707130359.png)\n\n3.以下のコマンドをターミナルで実行し、nodebrewをインストールする。\n\n```\n$ brew install nodebrew\n```\n\n4.以下のコマンドをターミナルで実行し、nodebrewをセットアップする。\n\n```\n$ nodebrew setup\n```\n\n5.以下のコマンドをターミナルで実行し、設定を行う。\n\n※「.bashrc」の部分は「.bash_profile」に書き換えても可（自身の環境に合わせて変えてください。\n\n※新しいmacを利用している人は、「bash」ではなく、「zsh」に変更されていますので、「.bashrc」の部分は「.zprofile」に書き換えてください。\n\n```\n$ echo 'export PATH=$HOME/.nodebrew/current/bin:$PATH' \u003e\u003e ~/.bashrc\n```\n\n6.以下のコマンドを実行して、「6」で設定したPATHを反映させる。\n\n※「.bashrc」の部分は「.bash_profile」に書き換えても可（自身の環境に合わせて変えてください。\n\n※新しいmacを利用している人は、「bash」ではなく、「zsh」に変更されていますので、「.bashrc」の部分は「.zprofile」に書き換えてください。\n\n```\n$ source ~/.bashrc\n```\n\n7.以下のコマンドを実行して、Node.jsの安定版のインストールする。\n\n```\n$ nodebrew install stable\n```\n\n8.以下のコマンドを実行して、Node.jsの「安定版」を利用するように反映する。\n\n```\n$ nodebrew use stable\n```\n\n## ■おまけ\n\n以下のコマンドで、インストールできるNode.jsのバージョンが確認できます。\n\n```\n$ nodebrew ls-remote\n```\n\n上記で確認したバージョンを以下のようにコマンド実行することで、指定バージョンをインストールすることができます。（以下は「v12.5.0」をインストールする場合）\n\n```\n$ nodebrew install-binary v12.5.0\n```\n\nインストールしたら、バージョンを切り替える必要がありますので、以下のコマンドでバージョンを切り替えましょう。\n\n```\n$ nodebrew use v12.5.0\n```\n\nちなみに、インストールしているNode.jsの全てのバージョンを確認したい場合は以下のコマンドです。\n\n```\n$ nodebrew ls\n```\n"])</script><script>self.__next_f.push([1,"97:Tc58,"])</script><script>self.__next_f.push([1,"\n## ◾️はじめに\n\n「[SwiftUIのプロジェクト作成](http://developer-kuro.com/develop/2019/08/20/swiftui-create-project/)」の記事で紹介しているSwiftUIのプロジェクトを作成できる前提とします。（作成方法がわからない場合は「[SwiftUIのプロジェクト作成](http://developer-kuro.com/develop/2019/08/20/swiftui-create-project/)」の記事を参照してください。）\n\n## ■SwiftUIで地図の詳細を表示する\n\n1.プロジェクトのディレクトリを右クリックし、「New File...」を押下する。\n\n![](/images/2020-04-29-000000-3/20220707120559.png)\n\n2.「SwiftUI View」を選択して、「Next」を押下する。\n\n![](/images/2020-04-29-000000-3/20220707120310.png)\n\n3.適当な名前を入力し、「Create」を押下する。\n\n![](/images/2020-04-29-000000-3/20220707130334.png)\n\n4.「[SwiftUIでMapKitを利用して地図を表示する](http://developer-kuro.com/develop/2019/08/29/swiftui-mapkit/)」の記事で紹介した地図の表示を「3」で作成したファイルに書き込む。\n\n![](/images/2020-04-29-000000-3/20220707130343.png)\n\n5.「ContentView」に戻り、Textを「VStack」に入れる。（「[SwiftUIでTextを縦(VStack)に並べて複数表示する](http://developer-kuro.com/develop/2019/08/23/swiftui-text-vstack/)」を参照してください。）\n\n![](/images/2020-04-29-000000-3/20220707120517.png)\n\n6.Textの上の行に「3」で作成した「クラス名()」を記載する。（地図クラスのインスタンス化）\n\n![](/images/2020-04-29-000000-3/20220707130432.png)\n\n7.「6」に以下のソースコードを記載し、高さを設定する。（正常に地図が表示されることをプレビューで確認する）\n\n```\n.frame(height: 300)\n```\n\n![](/images/2020-04-29-000000-3/20220707120900.png)\n\n8.「7」のしたの行に「[SwiftUIでImageを表示する](http://developer-kuro.com/develop/2019/08/27/swiftui-image/)」「[SwiftUIでImageを装飾する](http://developer-kuro.com/develop/2019/08/28/swiftui-image-custom/)」で作成した画像を作成する。（正常に画像が表示されることをプレビューで確認する）\n\n![](/images/2020-04-29-000000-3/20220707120323.png)\n\n9.以下のソースコードを「8」の画像の下の行に記載し、画像を地図に被せる。\n\n```\n.offset(y: -130)\n.padding(.bottom, -130)\n```\n\n![](/images/2020-04-29-000000-3/20220707120524.png)\n\n10.以下のソースコードを「VStack」の一番下に記載し、スペースを埋めて画像を画面上部に押し上げる。\n\n```\nSpacer()\n```\n\n![](/images/2020-04-29-000000-3/20220707120755.png)\n\n11.以下のソースコードを「Map」の下の行に記載し、セーフエリアを埋める。\n\n```\n.edgesIgnoringSafeArea(.top)\n```\n\n![](/images/2020-04-29-000000-3/20220707130416.png)\n\nこれで、地図の詳細のような画面が作成できました！（画像はアヒルですがw）\n\nApple様のチュートリアルではテキストの位置の微調整や画像が地図っぽい画像だったりしますが、概ねやっていることは同じです！\n"])</script><script>self.__next_f.push([1,"98:T659,"])</script><script>self.__next_f.push([1,"\n## ■はじめに\n\n「[SwiftUIのプロジェクト作成](http://developer-kuro.com/develop/2019/08/20/swiftui-create-project/)」の記事で紹介しているSwiftUIのプロジェクトを作成できる前提とします。（作成方法がわからない場合は「[SwiftUIのプロジェクト作成](http://developer-kuro.com/develop/2019/08/20/swiftui-create-project/)」の記事を参照してください。）\n\n## ■SwiftUIでImageを表示する\n\n1.「Assets.xcassets」を選択し、「＋」を押下する。\n\n![](/images/2020-04-28-000000-4/20220707130419.png)\n\n2.「New Image Set」を押下する。\n\n![](/images/2020-04-28-000000-4/20220707130428.png)\n\n3.追加された「Image」に任意の画像をドラッグ＆ドロップで設定する。\n\n![](/images/2020-04-28-000000-4/20220707140444.png)\n\n4.「3」の「Image」の名前を任意の名前に変更する。\n\n![](/images/2020-04-28-000000-4/20220707140435.png)\n\n5.ソースコードの「Text(・・・」を削除して、「+」を押下する。\n\n![](/images/2020-04-28-000000-4/20220707130403.png)\n\n6.一番左のViewのメニューを選択して、「Image」をドラッグする。\n\n![](/images/2020-04-28-000000-4/20220707120540.png)\n\n7.「body」のブロック内でドロップする。\n\n![](/images/2020-04-28-000000-4/20220707140331.png)\n\n8.「Image」の「Image Name」を「4」で変更した名前に変更する。\n\n![](/images/2020-04-28-000000-4/20220707130436.png)\n\n9.画像の形になれば成功です。（プレビューで確認してみましょう）\n\n![](/images/2020-04-28-000000-4/2022070714043 \n「NSUserDefaults」を使用して、データの保存などを行う際に、リスト形式のデータをそのまま\n\n使用したい場合がある。\n\nここでは、「NSUserDefaults」に「NSMutableArray」を格納、取得を行う方法を記載する。\n\n# ◾️NSUserDefaultsにNSMutableArrayを格納する\n\n「NSUserDefaults」に「NSMutableArray」を格納するには、そのままでは格納ができない。\n\nその為、一旦「NSData」に変換してから格納する。\n\n具体的には、以下の様に設定する。\n （以下では、「NSMutableArray」に値を設定していないが、設定しても同様です。）\n\n```objectivec\n// NSUserDefaultsのインスタンスを生成する\nNSUserDefaults *ud = [NSUserDefaults standardUserDefaults];\n// NSUserDefaultsに格納するNSMutableArrayのインスタンスを生成する\nNSMutableArray *array = [[NSMutableArray alloc] init];\n// NSMutableArrayをNSData型に変換する\nNSData *data = [NSKeyedArchiver archivedDataWithRootObject:array];\n// NSUserDefaultsに値を設定する\n[ud setObject:data forKey:@\"TargetKey\"];\n// 設定を反映する\n[ud synchronize];\n```\n\n# ◾️ NSUserDefaultsからNSMutableArrayを取得する\n\n「NSUserDefaultsにNSMutableArrayを格納する」で記載した通り、「NSMutableArray」を\n\n「NSUserDefaults」に格納するために、「NSData」型に変換した。\n\nそのため、取得する際には、「NSData」型から「NSMutableArray」に変換する必要がある。\n\n具体的には、以下の様に取得する。\n\n```objectivec\n// NSUserDefaultsのインスタンスを生成する\nNSUserDefaults *ud = [NSUserDefaults standardUserDefaults];\n// NSUserDefaultsからNSData型の値を取得する\nNSData *data = [ud objectForKey:@\"TargetKey\"];\n// NSData型からNSMutableArray型へ変換する\nNSMutableArray *array = [NSKeyedUnarchiver unarchiveObjectWithData:data];\n```\n"])</script><script>self.__next_f.push([1,"9d:T33ed,"])</script><script>self.__next_f.push([1,"\n# ◾️はじめに\n\nデータを永続的に保存する方法で、数々の方法があります。\n\n以下に一例を挙げます。\n\n・NSUserDefaults\n\n・CoreData\n\n・SQLite\n\n・Realm\n\nここでは、「SQLite」に関して記載します。\n\n※SQL文に関しては、簡単なサンプルや記載方法は記載するが細かい部分は別途調査する事。\n\n# ◾️SQLiteとは\n\nSQLiteとは、数あるSQLの中の一つです。\n\n※ちなみに、SQLとはDB（データベース）を定義したり操作したりするプログラミング言語です。\n\nSQLiteの特徴として、他のSQL（MySQL,Oracleなど）と違い、DBをファイル形式で保持する事ができます。\n\n※他のSQL（MySQL,Oracleなど）のほとんどは、サーバー上にDBを保持します。\n\n上記の特徴があるため、ローカルにDBファイルを保存しておく事で、サーバーへ接続する必要がなくなるメリットがあります。\n\n# ◾️SQLiteのインポート\n\nSwiftでSQLiteを使用する為に、便利なライブラリが色々とありますが\n\nライブラリを使用したくない場合もありますよね。（現場の方針など。。。）\n\nここでは、ライブラリを使用しないSQLiteの操作を記載します。\n\nまずは、SQLiteを操作する為に以下をインポートします。\n\n※SQLiteの操作をするクラスでは必ずインポートしてください。\n\nソースコードを記載する前に、「Linked Frameworks and Libraries」に「libsqlite3.0.tbd」を追加する必要がある。\n\n```objectivec\n@import SQLite3;\n```\n\n# ◾️DBファイルの定義\n\n「SQLiteとは」で説明した通り、SQLiteはDBをファイル形式で保持しています。\n\nそのため、まずはDBファイルを生成する必要があります。\n\nまずは、フィールド変数に、以下を定義してください。\n ※都度定義するのが手間なので、まとめて。\n\n```objectivec\n// SQLiteのファイル名\nNSString *dataFileName;\n// SQLiteのファイルまでのフルパス\nNSString *dataFileFullPath;\n// 開いているSQLiteファイルのインスタンス\nsqlite3 *sqlax;\n```\n\n上記を定義したら、SQLiteの物理ファイルを生成します。\n 以下のメソッドを定義して、呼び出してください。\n\n```objectivec\n/**\n * SQLiteの物理ファイルの作成\n */\n-(void)preparationOfPhysicalDiles {\n    // 1.【物理ファイルを準備します】\n    dataFileName = @\"unkolist.sqlite3\";\n\n    // 使用可能なファイルパスを全て取得する\n    NSArray *availablePats = NSSearchPathForDirectoriesInDomains(NSDocumentDirectory, NSUserDomainMask, YES);\n    // 最初のものを使用する\n    NSString *dir = [availablePats objectAtIndex:0];\n    // ファイルマネージャを召還する\n    NSFileManager *myFM = [NSFileManager defaultManager];\n    // 物理ファイルって既にありますか？\n    dataFileFullPath = [dir stringByAppendingPathComponent:dataFileName];\n    BOOL fileExists = [myFM fileExistsAtPath:dataFileFullPath];\n    // 無い場合はつくる\n    if (! fileExists) {\n        BOOL isSuccessfullyCreated = [myFM createFileAtPath:dataFileFullPath contents:nil attributes:nil];\n        if (! isSuccessfullyCreated) {\n            NSLog(@\"新規ファイル作成に失敗しました=\u003e%@\", dataFileFullPath);\n        }\n    }\n}\n```\n\nここまでの下準備ができたら、以下のメソッドを実行し、SQLiteを開きます。\n ※テーブル作成などを行う前に、一番最初に実行する必要があります。\n\n```objectivec\n/**\n * SQLiteを開くメソッド（※SQLの実行前には呼んでおく必要がある。）\n */\n-(void)openSQLite {\n    BOOL isSuccessfullyOpened = sqlite3_open([dataFileFullPath UTF8String], \u0026sqlax);\n    if (isSuccessfullyOpened != SQLITE_OK) {\n        NSLog(@\"sqlite開けませんでした！=\u003e %s\", sqlite3_errmsg(sqlax));\n    }\n}\n```\n\nこれで、SQLiteを開く事ができたので、以降でDBの操作をします。\n\n# ◾️Table作成（CREATE TABLE）\n\nここでは、テーブルの作成方法を記載します。\n\n以下のメソッドを実行する事で、Tableの作成が可能です。\n\n※以下のメソッドに記載しているSQL文は各自書き換えてください。\n\n【テーブル作成のSQLの基本の記載方法】\n CREATE TABLE [テーブル名] ([カラム名] [データ型], [カラム名] [データ型] ・・・)\n\n```objectivec\n/**\n * テーブル作成処理\n */\n-(void)createTable {\n    sqlite3_stmt *statement;\n\n    // CREATE TABLE文 （「IF NOT EXISTS」を書くことで、既に作成されている場合には処理しない）\n    NSString *query = @\"CREATE TABLE IF NOT EXISTS sampleTable (name TEXT)\";\n    sqlite3_prepare_v2(sqlax, [query UTF8String], -1, \u0026statement, nil);\n    sqlite3_step(statement);\n    sqlite3_finalize(statement);\n}\n```\n\n# ◾️カラムの登録（INSERT）\n\nここでは、カラムの登録方法を記載します。\n\n以下のメソッドを実行する事で、カラムの登録が可能です。\n\n※以下のメソッドに記載しているSQL文は各自書き換えてください。\n\n【カラムの登録のSQLの基本の記載方法】\n INSERT INTO [テーブル名] ([カラム名], [カラム名]・・・) VALUES ([データ], [データ]・・・)\n\n```objectivec\n/**\n * データの追加処理\n */\n-(void)insertData: (NSString*) name {\n    sqlite3_stmt *statement;\n\n    // INSERT\n    NSString *query = [NSString stringWithFormat:@\"INSERT INTO sampleTable (name) VALUES (\\\"%@\\\")\", name];\n    sqlite3_prepare_v2(sqlax, [query UTF8String], -1, \u0026statement, nil);\n    sqlite3_step(statement);\n    sqlite3_finalize(statement);\n}\n```\n\n# ◾️データの取得（SELECT）\n\nここでは、データの取得方法を記載します。\n\n以下のメソッドを実行する事で、データの取得が可能です。\n\n※以下のメソッドに記載しているSQL文は各自書き換えてください。\n\n※取得したレコードのループ処理は各自書き換えてください。\n\n【データの取得のSQLの基本の記載方法】\n SELECT * FROM [テーブル名]\n\n```objectivec\n/**\n * データの検索処理\n */\n-(void)selectData {\n    sqlite3_stmt *statement;\n\n    NSString *query = @\"SELECT name FROM sampleTable\";\n    sqlite3_prepare_v2(sqlax, [query UTF8String], -1, \u0026statement, nil);\n    while (sqlite3_step(statement) == SQLITE_ROW) {\n        char *ownerNameChars = (char *) sqlite3_column_text(statement,0);\n        NSLog(@\"Found : %s\", ownerNameChars);\n    }\n    sqlite3_finalize(statement);\n}\n```\n\n# ◾️データの更新（UPDATE）\n\nここでは、データの更新方法を記載します。\n\n以下のメソッドを実行する事で、データの更新が可能です。\n\n※以下のメソッドに記載しているSQL文は各自書き換えてください。\n\n【データの更新のSQLの基本の記載方法】\n UPDATE [テーブル名] SET [カラム名] = [データ] WHERE [カラム名] = [データ]\n\n```objectivec\n/**\n * データの更新処理\n */\n-(void)updateData {\n    sqlite3_stmt *statement;\n\n    // UPDATE\n    NSString *query = [NSString stringWithFormat:@\"UPDATE sampleTable SET name = \\\"KONBANWA\\\" WHERE name = \\\"HELLO\\\"\"];\n    sqlite3_prepare_v2(sqlax, [query UTF8String], -1, \u0026statement, nil);\n    sqlite3_step(statement);\n    sqlite3_finalize(statement);\n}\n```\n\n# ◾️データの削除（DELETE）\n\nここでは、データの削除方法を記載します。\n\n以下のメソッドを実行する事で、データの削除が可能です。\n\n※以下のメソッドに記載しているSQL文は各自書き換えてください。\n\n【データの削除のSQLの基本の記載方法】\n DELETE FROM [テーブル名] WHERE [カラム名] = [データ]\n\n```objectivec\n/**\n * データの削除処理\n */\n-(void)deleteData {\n    sqlite3_stmt *statement;\n\n    // DELETE\n    NSString *query = [NSString stringWithFormat:@\"DELETE FROM sampleTable WHERE name = \\\"HELLOHELLO\\\"\"];\n    sqlite3_prepare_v2(sqlax, [query UTF8String], -1, \u0026statement, nil);\n    sqlite3_step(statement);\n    sqlite3_finalize(statement);\n}\n```\n\n# ◾️SQLiteを閉じる\n\n以下のメソッドを実行する事で、SQLiteを閉じる事ができます。\n SQLの処理が終わって、不要になれば閉じるようにしましょう。\n\n```objectivec\n/**\n * SQLiteを閉じるメソッド（※SQLの実行後に呼ぶ必要がある。）\n */\n-(void)closeSQLite {\n    // SQLiteを閉じる\n    sqlite3_close(sqlax);\n}\n```\n\n# ◾️さいごに\n\n色々と、書きましたが、私が動作確認で実行したソースを以下に記載しておきます。\n\n```objectivec\n#import \"SQLiteViewController.h\"\n@import SQLite3;\n\n@interface SQLiteViewController () {\n    // SQLiteのファイル名\n    NSString *dataFileName;\n    // SQLiteのファイルまでのフルパス\n    NSString *dataFileFullPath;\n    // 開いているSQLiteファイルのインスタンス\n    sqlite3 *sqlax;\n}\n\n@end\n\n@implementation SQLiteViewController\n\n- (void)viewDidLoad {\n    [super viewDidLoad];\n\n    // SQLiteの物理ファイルの生成\n    [self preparationOfPhysicalDiles];\n    // SQLiteを開く\n    [self openSQLite];\n\n    // テストでいくつかのSQLを実行する\n    [self test];\n\n    // SQLiteを閉じる\n    [self closeSQLite];\n}\n\n/**\n * テストで適当なSQLを実行する\n */\n-(void)test {\n    // CREATE TABLE\n    [self createTable];\n\n    // INSERT\n    [self insertData:@\"HELLO\"];\n    [self insertData:@\"HELLOHELLO\"];\n    [self insertData:@\"HELLOHELLOHELLO\"];\n\n    // UPDATE\n    [self updateData];\n\n    // DELETE\n    [self deleteData];\n\n    // SELECT\n    [self selectData];\n}\n\n/**\n * SQLiteの物理ファイルの作成\n */\n-(void)preparationOfPhysicalDiles {\n    // 1.【物理ファイルを準備します】\n    dataFileName = @\"unkolist.sqlite3\";\n\n    // 使用可能なファイルパスを全て取得する\n    NSArray *availablePats = NSSearchPathForDirectoriesInDomains(NSDocumentDirectory, NSUserDomainMask, YES);\n    // 最初のものを使用する\n    NSString *dir = [availablePats objectAtIndex:0];\n    // ファイルマネージャを召還する\n    NSFileManager *myFM = [NSFileManager defaultManager];\n    // 物理ファイルって既にありますか？\n    dataFileFullPath = [dir stringByAppendingPathComponent:dataFileName];\n    BOOL fileExists = [myFM fileExistsAtPath:dataFileFullPath];\n    // 無い場合はつくる\n    if (! fileExists) {\n        BOOL isSuccessfullyCreated = [myFM createFileAtPath:dataFileFullPath contents:nil attributes:nil];\n        if (! isSuccessfullyCreated) {\n            NSLog(@\"新規ファイル作成に失敗しました=\u003e%@\", dataFileFullPath);\n        }\n    }\n}\n\n/**\n * SQLiteを開くメソッド（※SQLの実行前には呼んでおく必要がある。）\n */\n-(void)openSQLite {\n    BOOL isSuccessfullyOpened = sqlite3_open([dataFileFullPath UTF8String], \u0026sqlax);\n    if (isSuccessfullyOpened != SQLITE_OK) {\n        NSLog(@\"sqlite開けませんでした！=\u003e %s\", sqlite3_errmsg(sqlax));\n    }\n}\n\n/**\n * SQLiteを閉じるメソッド（※SQLの実行後に呼ぶ必要がある。）\n */\n-(void)closeSQLite {\n    // SQLiteを閉じる\n    sqlite3_close(sqlax);\n}\n\n/**\n * テーブル作成処理\n */\n-(void)createTable {\n    sqlite3_stmt *statement;\n\n    // CREATE TABLE文 （「IF NOT EXISTS」を書くことで、既に作成されている場合には処理しない）\n    NSString *query = @\"CREATE TABLE IF NOT EXISTS sampleTable (name TEXT)\";\n    sqlite3_prepare_v2(sqlax, [query UTF8String], -1, \u0026statement, nil);\n    sqlite3_step(statement);\n    sqlite3_finalize(statement);\n}\n\n/**\n * データの追加処理\n */\n-(void)insertData: (NSString*) name {\n    sqlite3_stmt *statement;\n\n    // INSERT\n    NSString *query = [NSString stringWithFormat:@\"INSERT INTO sampleTable (name) VALUES (\\\"%@\\\")\", name];\n    sqlite3_prepare_v2(sqlax, [query UTF8String], -1, \u0026statement, nil);\n    sqlite3_step(statement);\n    sqlite3_finalize(statement);\n}\n\n/**\n * データの更新処理\n */\n-(void)updateData {\n    sqlite3_stmt *statement;\n\n    // UPDATE\n    NSString *query = [NSString stringWithFormat:@\"UPDATE sampleTable SET name = \\\"KONBANWA\\\" WHERE name = \\\"HELLO\\\"\"];\n    sqlite3_prepare_v2(sqlax, [query UTF8String], -1, \u0026statement, nil);\n    sqlite3_step(statement);\n    sqlite3_finalize(statement);\n}\n\n/**\n * データの削除処理\n */\n-(void)deleteData {\n    sqlite3_stmt *statement;\n\n    // DELETE\n    NSString *query = [NSString stringWithFormat:@\"DELETE FROM sampleTable WHERE name = \\\"HELLOHELLO\\\"\"];\n    sqlite3_prepare_v2(sqlax, [query UTF8String], -1, \u0026statement, nil);\n    sqlite3_step(statement);\n    sqlite3_finalize(statement);\n}\n\n/**\n * データの検索処理\n */\n-(void)selectData {\n    sqlite3_stmt *statement;\n\n    NSString *query = @\"SELECT name FROM sampleTable\";\n    sqlite3_prepare_v2(sqlax, [query UTF8String], -1, \u0026statement, nil);\n    while (sqlite3_step(statement) == SQLITE_ROW) {\n        char *ownerNameChars = (char *) sqlite3_column_text(statement,0);\n        NSLog(@\"Found : %s\", ownerNameChars);\n    }\n    sqlite3_finalize(statement);\n}\n@end\n```\n"])</script><script>self.__next_f.push([1,"9e:Tf73,"])</script><script>self.__next_f.push([1,"\n# ◾️はじめに\n\nアプリを作成していると、データを保存しておきたい時が多々あります。\n\n（一例を挙げると、「設定」の値など）\n\nそのような場合に、色々とデータを保存する方法はありますが、今回は「NSUserDefaults」に関して記載します。\n\nちなみに、NSUserDefaultsはアプリの保存ディレクトリに「plist」形式のファイルとして保持されます。\n\n# ◾️データの保存、更新\n\nここでは、NSUserDefaultsへのデータの保存方法を記載します。\n\nデータの保存は、key,value形式で保存されます。\n\n既に対象のキーでデータが保存されている場合は、上書きで更新されるので注意してください。\n\n以下にデータの保存のサンプルを記載します。\n\n```objectivec\n// NSUserDefaultsのインスタンスを作成\nNSUserDefaults *ud = [NSUserDefaults standardUserDefaults];\n// NSString型の「test」を「string_key」のキーに保存\n[ud setObject:@\"test\" forKey:@\"string_key\"];\n// int型の「1」を「int_key」のキーに保存\n[ud setInteger:100 forKey:@\"int_key\"];\n// float型の「1.1」を「float_key」のキーに保存\n[ud setFloat:1.1 forKey:@\"float_key\"];\n// double型の「1.1」を「double_key」のキーに保存\n[ud setDouble:1.1 forKey:@\"double_key\"];\n// BOOL型の「YES」を「bool_key」のキーに保存\n[ud setBool:YES forKey:@\"bool_key\"];\n// 保存内容を即時で反映する為に、同期する（この記載がない場合には、即時反映されない）\n[ud synchronize];\n```\n\n# ◾️データの取得\n\nここでは、NSUserDefaultsのデータの取得方法を記載します。\n\nデータの保存で記載したキーを元にデータを取得します。\n\n以下にデータの取得のサンプルを記載します。\n\n```objectivec\n// NSUserDefaultsのインスタンスを作成\nNSUserDefaults *ud = [NSUserDefaults standardUserDefaults];\n// 「string_key」キーの値を取得（NSString型）\nNSString s = [ud stringForKey:@\"string_key\"];\n// 「int_key」キーの値を取得（int型）\nint i = [ud integerForKey:@\"int_key\"];\n// 「float_key」キーの値を取得（float型）\nfloat f = [ud floatForKey:@\"float_key\"];\n// 「double_key」キーの値を取得（double型）\ndouble d = [ud doubleForKey:@\"double_key\"];\n// 「bool_key」キーの値を取得（BOOL型）\nBOOL b = [ud boolForKey:@\"bool_key\"];\n```\n\n# ◾️データの削除\n\nここでは、NSUserDefaultsのデータの削除方法を記載します。\n データの保存で記載したキーを元にデータを削除します。\n\n以下にデータの削除のサンプルを記載します。\n\n```objectivec\n// NSUserDefaultsのインスタンスを作成\nNSUserDefaults *ud = [NSUserDefaults standardUserDefaults];\n// 「string_key」キーの値を削除（NSString型）\n[ud removeObjectForKey:@\"string_key\"];\n// 「int_key」キーの値を削除（int型）\n[ud removeObjectForKey:@\"int_key\"];\n// 「float_key」キーの値を削除（float型）\n[ud removeObjectForKey:@\"float_key\"];\n// 「double_key」キーの値を削除（double型）\n[ud removeObjectForKey:@\"double_key\"];\n// 「bool_key」キーの値を削除（BOOL型）\n[ud removeObjectForKey:@\"bool_key\"];\n```\n\n# ◾️キーの存在チェック\n\nNSUserDefaultsのキーの存在チェック\n\nここでは、NSUserDefaultsのキーが存在するかどうかのチェック方法を記載します。\n\n以下にキーが存在するかどうかのチェック方法のサンプルを記載します。\n\n```objectivec\n// NSUserDefaultsのインスタンスを作成\nNSUserDefaults *ud = [NSUserDefaults standardUserDefaults];\n// 「TargetKey」キーが存在するかどうかを判定する\nif([[[ud dictionaryRepresentation] allKeys] containsObject:@\"TargetKey\"]){\n    // キーが存在する場合\n} else {\n    // キーが存在しない場合\n}\n```\n"])</script><script>self.__next_f.push([1,"9f:T983,"])</script><script>self.__next_f.push([1,"\n# ■はじめに\n\nボタン押下時の処理などで、ソースコードで画面遷移を実装したいことは多々あります。\nその際の画面遷移方法を記載します。\n\n# ◾️画面遷移\n\n通常の画面遷移の方法を以下に記載します。\n※遷移先の画面を「SecondViewController」としています。\n\n```swift\n// 画面遷移\nlet createViewController = self.storyboard?.instantiateViewController(withIdentifier: \"遷移先のViewControllerのStoryboard ID\") as! SecondViewController\nself.present(createViewController, animated: true, completion: nil)\n```\n\n# ◾️画面遷移時のアニメーション指定\n\n通常の画面遷移でアニメーションを指定する方法を以下に記載します。\n※遷移先の画面を「SecondViewController」としています。\n\n```swift\nlet createViewController = self.storyboard?.instantiateViewController(withIdentifier: \"遷移先のViewControllerのStoryboard ID\") as! SecondViewController\n\n/* 四種類のアニメーションのうちのどれかを使用する。（デフォルトは「coverVertical」） */\n// 遷移先Viewが下から上にスライドアップする\ncreateViewController.modalTransitionStyle = .coverVertical\n// 遷移元Viewがフェードアウトしつつ、遷移先Viewがフェードインする\ncreateViewController.modalTransitionStyle = .crossDissolve\n// 遷移元Viewと遷移先Viewが水平方向に裏返しになる\ncreateViewController.modalTransitionStyle = .flipHorizontal\n// 遷移元Viewが下からめくれて、遷移先Viewがその下から表示される\ncreateViewController.modalTransitionStyle = .partialCurl\n\nself.present(createViewController, animated: true, completion: nil)\n```\n\n# ◾️ナビゲーションバーの画面遷移\n\nナビゲーションバーを使用した画面遷移の方法を以下に記載します。\n※遷移先の画面を「SecondViewController」としています。\n\n```swift\n// NavigationBarでの画面遷移\nlet createViewController = self.storyboard?.instantiateViewController(withIdentifier: \"遷移先のViewControllerのStoryboard ID\") as! SecondViewController\nnavigationController?.pushViewController(createViewController, animated: true)\n```\n\n# ◾️画面遷移の前の画面への遷移\n\n一つ前の画面に戻る方法を記載します。\n\n```swift\n// 前の画面に戻る\nself.dismiss(animated: true, completion: nil)\n```\n"])</script><script>self.__next_f.push([1,"a0:Tb64,"])</script><script>self.__next_f.push([1,"\n# ◾️はじめに\n\nチャットアプリのフレンド登録など、様々な場面でQRコードを利用したい事があります。\n\n・QRコードを読み取り、取得した文字列に応じて処理を行う方法\n・QRコードを読み取り、取得したURLへアクセスしてAPIを実行する方法\n\n上記の方法を想定してそれぞれ（文字列、URL）のQRコード生成を記載します。\n\n# ◾️文字列からQRコードを生成する\n\n「QRコードを読み取り、取得した文字列に応じて処理を行う方法」\nを想定して、文字列からQRコードを生成する方法を記載します。\n\n以下がその方法です。\n\n```swift\nimport UIKit\n\nclass ViewController: UIViewController {\n    override func viewDidLoad() {\n        super.viewDidLoad()\n\n        // 文字列をNSDataに変換\n        let str = \"変換する文字列\"\n        let data = str.data(using: String.Encoding.utf8)!\n\n        // QRコード生成\n        let qr = CIFilter(name: \"CIQRCodeGenerator\", withInputParameters: [\"inputMessage\": data, \"inputCorrectionLevel\": \"M\"])!\n        let sizeTransform = CGAffineTransform(scaleX: 10, y: 10)\n        let qrImage = qr.outputImage!.transformed(by: sizeTransform)\n        let context = CIContext()\n        let cgImage = context.createCGImage(qrImage, from: qrImage.extent)\n        let uiImage = UIImage(cgImage: cgImage!)\n\n        // 作成したQRコードを表示\n        let qrImageView = UIImageView()\n        qrImageView.contentMode = .scaleAspectFit\n        qrImageView.frame = self.view.frame\n        qrImageView.image = uiImage\n        self.view.addSubview(qrImageView)\n    }\n}\n```\n\n# ◾️URLからQRコードを生成する\n\n「QRコードを読み取り、取得したURLへアクセスしてAPIを実行する方法」\nを想定して、URLからQRコードを生成する方法を記載します。\n\n以下がその方法です。\n\n```swift\nimport UIKit\n\nclass ViewController: UIViewController {\n    override func viewDidLoad() {\n        super.viewDidLoad()\n\n        // URLをNSDataに変換\n        let url = \"https://www.google.co.jp/\"\n        let data = url.data(using: String.Encoding.utf8)!\n\n        // QRコード生成\n        let qr = CIFilter(name: \"CIQRCodeGenerator\", withInputParameters: [\"inputMessage\": data, \"inputCorrectionLevel\": \"M\"])!\n        let sizeTransform = CGAffineTransform(scaleX: 10, y: 10)\n        let qrImage = qr.outputImage!.transformed(by: sizeTransform)\n        let context = CIContext()\n        let cgImage = context.createCGImage(qrImage, from: qrImage.extent)\n        let uiImage = UIImage(cgImage: cgImage!)\n\n        // 作成したQRコードを表示\n        let qrImageView = UIImageView()\n        qrImageView.contentMode = .scaleAspectFit\n        qrImageView.frame = self.view.frame\n        qrImageView.image = uiImage\n        self.view.addSubview(qrImageView)\n    }\n}\n```\ ()\n    // 動画の再生状況保持ステータス\n    private var movieStatus = 0\n    private var showControllFlag = true\n\n    private var screenWidth = UIScreen.main.bounds.size.width\n    private var screenHeight = UIScreen.main.bounds.size.height\n\n    override open func viewDidLoad() {\n        let playerItem = player.currentItem\n        // 動画の再生の終了を検知\n        NotificationCenter.default.addObserver(self, selector: #selector(didPlayToEndTime), name: .AVPlayerItemDidPlayToEndTime, object: playerItem)\n\n        // Viewを生成.\n        let videoPlayerView = AVPlayerView(frame: CGRect(x: 0, y: 0, width: screenWidth, height: screenHeight))\n        // UIViewのレイヤーをAVPlayerLayerにする.\n        layer = videoPlayerView.layer as? AVPlayerLayer\n        layer.videoGravity = AVLayerVideoGravity.resizeAspect\n        layer.player = player\n\n        // レイヤーを追加する.\n        self.view.layer.addSublayer(layer)\n\n        // フッター\n        footer.backgroundColor = UIColor.darkGray\n        footer.layer.cornerRadius = 10\n\n        // 動画のシークバーとなるUISliderを生成.\n        seekBar.minimumValue = 0\n        seekBar.maximumValue = Float(CMTimeGetSeconds(playerItem!.asset.duration))\n        seekBar.addTarget(self, action: #selector(onSliderValueChange), for: UIControl.Event.valueChanged)\n        let greenImage = UIImage.image(color: .green, size: CGSize(width: 10, height: 5))\n        seekBar.setThumbImage(greenImage, for: .normal)\n        footer.addSubview(seekBar)\n\n        /* シークバーを動画とシンクロさせる為の処理 */\n        // 0.5分割で動かす事が出来る様にインターバルを指定.\n        let interval : Double = Double(0.5 * seekBar.maximumValue) / Double(seekBar.bounds.maxX)\n        // CMTimeに変換する.\n        let time : CMTime = CMTimeMakeWithSeconds(interval, preferredTimescale: Int32(NSEC_PER_SEC))\n        // time毎に呼び出される.\n        player.addPeriodicTimeObserver(forInterval: time, queue: nil) { (time) -\u003e Void in\n            // 総再生時間を取得.\n            let duration = CMTimeGetSeconds((self.player.currentItem?.duration)!)\n            // 現在の時間を取得.\n            let time = CMTimeGetSeconds(self.player.currentTime())\n\n            self.setTime()\n\n            // シークバーの位置を変更.\n            let value = Float(self.seekBar.maximumValue - self.seekBar.minimumValue) * Float(time) / Float(duration) + Float(self.seekBar.minimumValue)\n            self.seekBar.value = value\n        }\n\n        // 動画の再生ボタンを生成.\n        movieBtn.layer.masksToBounds = true\n        movieBtn.layer.cornerRadius = 20.0\n        movieBtn.backgroundColor = UIColor.orange\n        movieBtn.setTitle(\"Start\", for: UIControl.State.normal)\n        movieBtn.addTarget(self, action: #selector(onButtonClick), for: UIControl.Event.touchUpInside)\n        footer.addSubview(movieBtn)\n\n        // 次へスキップボタン\n        skipNextBtn.layer.masksToBounds = true\n        skipNextBtn.layer.cornerRadius = 20.0\n        skipNextBtn.backgroundColor = UIColor.orange\n        skipNextBtn.setTitle(\"15\", for: UIControl.State.normal)\n        skipNextBtn.addTarget(self, action: #selector(skipNextAction), for: UIControl.Event.touchUpInside)\n        footer.addSubview(skipNextBtn)\n\n        // 前へスキップボタン\n        skipPrevBtn.layer.masksToBounds = true\n        skipPrevBtn.layer.cornerRadius = 20.0\n        skipPrevBtn.backgroundColor = UIColor.orange\n        skipPrevBtn.setTitle(\"-15\", for: UIControl.State.normal)\n        skipPrevBtn.addTarget(self, action: #selector(skipPrevAction), for: UIControl.Event.touchUpInside)\n        footer.addSubview(skipPrevBtn)\n\n        // 現在の動画の再生時間\n        currentLabel.text = \"00:00\"\n        currentLabel.textAlignment = NSTextAlignment.left\n        currentLabel.textColor = UIColor.white\n        footer.addSubview(currentLabel)\n\n        // 動画の残りの時間\n        durationLabel.text = \"-00:00\"\n        durationLabel.textAlignment = NSTextAlignment.right\n        durationLabel.textColor = UIColor.white\n        footer.addSubview(durationLabel)\n\n        self.view.addSubview(footer)\n\n        backBtn.frame = CGRect(x: 10, 生成し直すだけでは、容量は抑える事ができません。\n動画を生成し直す時に、「動画のサイズ」「フレームレート」などを下げて生成し直す事で容量を抑える事ができます。\n\n以下のメソッドを使用する事で、生成し直した動画をDocumentディレクトリ内に生成できます。\nこのメソッドを呼び出す時には、引数に生成し直す元の動画のURLを渡してください。\n\n```swift\nfunc compression(beforeMovieUrl: URL) {\n    let videoURL: URL = getDocumentsDirectory().appendingPathComponent(\"\\(Date().millisecondsSince1970)tmpMovieSample.mov\")\n    //コンポジション作成\n    let mixComposition : AVMutableComposition = AVMutableComposition()\n    //アセットの作成\n    //動画のアセットとトラックを作成\n    let videoAsset: AVURLAsset = AVURLAsset(url: beforeMovieUrl, options:nil)\n    // 元の動画ファイルから、動画（音声なし）トラックの取得\n    let videoTrack: AVAssetTrack = (videoAsset.tracks(withMediaType: AVMediaType.video))[0]\n    // ベースとなる動画のコンポジション作成\n    let compositionVideoTrack: AVMutableCompositionTrack! = mixComposition.addMutableTrack(withMediaType: AVMediaType.video, preferredTrackID: kCMPersistentTrackID_Invalid)\n    // 動画の長さ設定\n    try! compositionVideoTrack.insertTimeRange(CMTimeRangeMake(start: CMTime.zero, duration: videoAsset.duration), of: videoTrack, at: CMTime.zero)\n    // 音声付きの動画か判定\n    if videoAsset.tracks(withMediaType: AVMediaType.audio).count \u003e 0 {\n        // 音声付き動画の場合、音声を取得し設定する\n        // 元の動画ファイルから、オーディオトラックの取得\n        let audioTrack: AVAssetTrack = (videoAsset.tracks(withMediaType: AVMediaType.audio))[0]\n        // ベースとなる音声のコンポジション作成\n        let compositionAudioTrack: AVMutableCompositionTrack! = mixComposition.addMutableTrack(withMediaType: AVMediaType.audio, preferredTrackID: kCMPersistentTrackID_Invalid)\n        // 音声の長さ設定\n        try! compositionAudioTrack.insertTimeRange(CMTimeRangeMake(start: CMTime.zero, duration: videoAsset.duration), of: audioTrack, at: CMTime.zero)\n    }\n    // 回転方向の設定\n    compositionVideoTrack.preferredTransform = videoTrack.preferredTransform\n    // 動画のサイズを取得\n    var videoSize: CGSize = videoTrack.naturalSize\n    // 動画が縦の場合は「true」で、横の場合には「false」が入る\n    var isPortrait: Bool = false\n    // ビデオを縦横方向\n    let transform: CGAffineTransform = videoTrack.preferredTransform\n    // 動画が縦かどうかを判定する\n    if (transform.a == 0 \u0026\u0026 transform.d == 0 \u0026\u0026 (transform.b == 1.0 || transform.b == -1.0) \u0026\u0026 (transform.c == 1.0 || transform.c == -1.0)) {\n        // 動画が縦の場合\n        isPortrait = true\n        // 「videoSize」に設定している「高さ」と「幅」を反転させる（デフォルトが横向きのサイズの為）\n        videoSize = CGSize(width: videoSize.height, height: videoSize.width)\n    }\n    // 合成用コンポジション作成\n    let videoComp: AVMutableVideoComposition = AVMutableVideoComposition()\n    videoComp.renderSize = videoSize\n    // フレームレートの設定\n    // TODO: ここの値を調整する事で、動画のフレームレートを落として、容量の削減につながる\n    videoComp.frameDuration = CMTimeMake(value: 1, timescale: 30)\n    // インストラクションを合成用コンポジションに設定\n    let instruction: AVMutableVideoCompositionInstruction = AVMutableVideoCompositionInstruction()\n    instruction.timeRange = CMTimeRangeMake(start: CMTime.zero, duration: videoAsset.duration)\n    let layerInstruction: AVMutableVideoCompositionLayerInstruction = AVMutableVideoCompositionLayerInstruction.init(assetTrack: compositionVideoTrack)\n    instruction.layerInstructions = [layerInstruction]\n    videoComp.instructions = [instruction]\n    if isPortrait {\n        // 動画が縦の場合\n        // 動画を90％回す（「AVAssetExportSession」を使用する場合には、縦の場合でも横向きで表示される為、90％回す必要がある）\n        let FirstAssetScaleFactor: CGAffineTransform = CGAffineTransform(scaleX: 1.0, y: 1.0)\n        layerInstruction.setTransform(videoTrack.preferredTransform.concatenating(FirstAssetScaleFactor), at: CMTime.zero)\n    }\n    // 動画のコンポジションをベースにAVAssetExportを生成\n    _assetExport = AVAssetExportSession.init(asset: mixComposition, presetName: AVAssetExportPresetHighestQuality)\n    // 合成用コンポジションを設定\n    _assetExport?.videoComposition = videoComp\n    let exportUrl: URL = videoURL\n    _assetExport?.outputFileType = AVFileType.mov\n    _assetExport?.outputURL = exportUrl\n    _assetExport?.shouldOptimizeForNetworkUse = true\n    // エクスポート実行\n    _assetExport?.exportAsynchronously(completionHandler: {() -\u003e Void in\n        if self._assetExport?.status == AVAssetExportSession.Status.failed {\n            // 失敗した場合\n        }\n        if self._assetExport?.status == AVAssetExportSession.Status.completed {\n            // 成功した場合\n        }\n    })\n}\n```\n\nちなみに、フレームレートや、サイズなどを変更せずに単に新しい動画にコピーしたい場合には、以下のメソッドを呼び出す事でコピーできます。\n\n※引数にはコピーする動画のURLを渡してください。\n\n```swift\nfunc compression(beforeMovieUrl: URL) {\n    let videoURL: URL = getDocumentsDirectory().appendingPathComponent(\"\\(Date().millisecondsSince1970)tmpMovie.mov\")\n    //アセットの作成\n    //動画のアセットとトラックを作成\n    let videoAsset: AVURLAsset = AVURLAsset(url: beforeMovieUrl, options:nil)\n    // 動画のコンポジションをベースにAVAssetExportを生成\n    self._assetExport = AVAssetExportSession.init(asset: videoAsset, presetName: AVAssetExportPresetHighestQuality)\n    let exportUrl: URL = videoURL\n    self._assetExport?.outputFileType = AVFileType.mov\n    self._assetExport?.outputURL = exportUrl\n    // エクスポート実行\n    self._assetExport?.exportAsynchronously(completionHandler: {() -\u003e Void in\n        if self._assetExport?.status == AVAssetExportSession.Status.failed {\n            // 失敗した場合\n        }\n        if self._assetExport?.status == AVAssetExportSession.Status.completed {\n            // 成功した場合\n        }\n    })\n}\n```\n"])</script><script>self.__next_f.push([1,"a3:Td24,"])</script><script>self.__next_f.push([1,"\n# ◾️QRコードリーダーの実装\n\nQRコードを読み取る方法を以下に記載します。\n読み取った後の処理は各自必要な処理を記載する必要があります。\n\n```swift\nimport AVFoundation\nimport UIKit\n\nclass CameraViewController: UIViewController, AVCaptureMetadataOutputObjectsDelegate {\n    // カメラやマイクの入出力を管理するオブジェクトを生成\n    let session = AVCaptureSession()\n\n    override func viewDidLoad() {\n        super.viewDidLoad()\n\n        // カメラやマイクのデバイスオブジェクトを生成\n        let devices:[AVCaptureDevice] = AVCaptureDevice.DiscoverySession(deviceTypes: [.builtInWideAngleCamera], mediaType: .video, position: .back).devices\n\n        //　該当するデバイスのうち最初に取得したもの(背面カメラ)を利用する\n        if ntDeviceOrientation: UIDeviceOrientation = .portrait\n    private let motionLimit: Double = 0.6\n\n    init() {\n        motionManager = CMMotionManager()\n        motionManager.accelerometerUpdateInterval = 0.2\n        queue = OperationQueue()\n    }\n\n    public func startDeviceOrientationNotifier(with handler: DeviceOrientationHandler) {\n        self.deviceOrientationAction = handler\n        motionManager.startAccelerometerUpdates(to: queue) { (data, error) in\n            if let accelerometerData = data {\n                var newDeviceOrientation: UIDeviceOrientation?\n\n                if (accelerometerData.acceleration.x \u003e= self.motionLimit) {\n                    newDeviceOrientation = .landscapeLeft\n                } else if (accelerometerData.acceleration.x \u003c= -self.motionLimit) {\n                    newDeviceOrientation = .landscapeRight\n                } else if (accelerometerData.acceleration.y \u003c= -self.motionLimit) {\n                    newDeviceOrientation = .portrait\n                } else if (accelerometerData.acceleration.y \u003e= self.motionLimit) {\n                    newDeviceOrientation = .portraitUpsideDown\n                } else {\n                    return\n                }\n\n                if newDeviceOrientation != self.currentDeviceOrientation {\n                    self.currentDeviceOrientation = newDeviceOrientation\n                    if let deviceOrientationHandler = self.deviceOrientationAction {\n                        DispatchQueue.main.async {\n                            deviceOrientationHandler!(self.currentDeviceOrientation)\n                        }\n                    }\n                }\n            }\n        }\n    }\n    public func stopDeviceOrientationNotifier() {\n        motionManager.stopAccelerometerUpdates()\n    }\n}\n```\n\nちなみに、利用する時には、以下のように利用します。\n\nまず、利用するために、フィールドに以下の変数宣言を行います。\n\n```swift\nvar deviceOrientationHelper = DeviceOrientationHelper()\n```\n\n次に、回転の検知を開始したい場所で以下の処理を追加します。（ViewDidLoadなどかな。）\n\n```swift\ndeviceOrientationHelper.startDeviceOrientationNotifier { (deviceOrientation) in\n    // 回転検知後の処理\n    // 「deviceOrientation」には「UIDeviceOrientation」型のデータが入っています。（回転後の向き）\n    self.sample(deviceOrientation)\n}\n```\n\n最後に、回転の検知を終了したい場所で以下の処理を追加します。\n\n```swift\ndeviceOrientationHelper.stopDeviceOrientationNotifier()\n```\n\n回転を検知した後に諸々の処理をしたい場合には、以下の実装を行います。\n※このメソッドを回転検知後の処理で呼び出します。\n\n```swift\nfunc sample(_ deviceOrientation: UIDeviceOrientation) {\n    // 端末の向きを判定\n    switch deviceOrientation {\n        case .portrait:\n            // 縦の場合（ホームボタンが下に来る向き）\n        case .portraitUpsideDown:\n            // 反対の場合（ホームボタンが上に来る向き）\n        case .landscapeLeft:\n            // 左の場合（ホームボタンが右に来る向き）\n        case .landscapeRight:\n            // 右の場合（ホームボタンが左に来る向き）\n        default:\n            // 向きを取得できなかった場合には、縦の場合として処理する。\n    }\n}\n```\n"])</script><script>self.__next_f.push([1,"a5:T153f,"])</script><script>self.__next_f.push([1,"\n## ■はじめに\n\nアプリケーションを作成している時に、データを永続的に保存したい場合など、良くありますよね？\n※私はよくあります！！\n\nそんな時に、いくつかデータを保存する方法があります。\nその中でも今回は、「UserDefaults」について記載します。\n（他にも、「CoreData」「SQLite」「NSKeyedArchiver」などありますが、ここでは説明を省きます。）\n\n## ■UserDefaults\n\nUserDefaultsは、データをplistファイルに保存する事でデータを永続的に保持する方法です。\n\nデータを保存する時には一旦データをメモリに保存した後に、非同期でplistファイルへ保存します。\nアプリケーションの起動時には、plistファイルのデータを全てメモリ上に展開されます。\n\n上記にも記載した通り、plistファイルのデータを全てメモリ上に展開されるため、データ量が多いと\nメモリが足りなくなり、アプリケーションが強制終了する原因となります。\nそのため、大量のデータを保存することには向いておらず、アプリケーション内の設定や、ユーザー情報などの\n限られた情報のみを保存する用途で使用することをお勧めします。\n※大量のデータを保存する時には、「CoreData」などを使用してください。\n\nちなみに、保存できる件数ですが、特に決まりはありません。\nメモリが足りる限り保存できるみたいです。。。\n\n【Appleの公式リファレンス】\n\n[https://developer.apple.com/documentation/foundation/userdefaults](https://developer.apple.com/documentation/foundation/userdefaults)\n\nUserDefaultsの具体的な使用方法は以下に記載します。\n※NSUserDefaultsではなく、UserDefaultsの使用方法です。\n※Swift3.0から「NSUserDefaults」が「UserDefaults」に変わりました。\n\n## ◾️インスタンスの生成\n\nUserDefaultsのインスタンスの生成方法は以下です。\nこのインスタンスを元にデータの保存や取得などの処理を行います。\n\n
