tps://example.com/hoge', {\\n  'method': 'post',\\n  'contentType': 'application/json',\\n  'payload': {\\n    'hoge': 'hogehoge',\\n  }\\n});\\n```\\n\"},{\"slug\":\"2022-08-26-100000\",\"frontmatter\":{\"title\":\"nginxでReactのSPAデプロイした場合、ブラウザリロードで404エラーになる場合の解決方法\",\"createAt\":\"2022-08-26 10:00\",\"updateAt\":null,\"tags\":[\"nginx\",\"エラー\",\"React\"]},\"rawContent\":\"\\n# はじめに\\n\\nReactでSPAの任意のWebアプリを作成します。\\n\\nローカルホストでは、ブラウザリロードなどを行っても正常に機能しますが、nginxのサーバーにデプロイした際に404エラーが発生する場合の解決方法を記載します。\\n\\n# nginxの設定\\n\\n以下の記事でnginxの設定をして頂いた方を対象としていますので、適時読み替えてください。\\n\\nhttps://reigle.info/entry/2022/08/01/100000\\n\\n以下のコマンドを実行します。\\n\\n「`example.com`」の部分は各自のドメインに書き換えてください。\\n\\n```sh\\nvi /etc/nginx/conf.d/example.com.conf\\n```\\n\\n「`server`」に以下の設定を追加します。\\n\\n```sh\\ntry_files $uri /index.html =404;\\n```\\n\\n全量は以下です。\\n\\n```JavaScript\\nserver {\\n  listen 443 ssl;\\n  server_name example.com;\\n  root /var/www/html;\\n  try_files $uri /index.html =404;\\n  index  index.html;\\n\\n  ssl_certificate /etc/letsencrypt/live/example.com/fullchain.pem;\\n  ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem;\\n\\n  ssl_prefer_server_ciphers on;\\n}\\n\\nserver {\\n  listen 80;\\n  server_name example.com;\\n\\n  return 301 https://$host$request_uri;\\n}\\n```\\n\"},{\"slug\":\"2022-08-25-100000\",\"frontmatter\":{\"title\":\"HTMLでファビコンを設定する方法\",\"createAt\":\"2022-08-25 10:00\",\"updateAt\":null,\"tags\":[\"HTML\"]},\"rawContent\":\"$4a\"},{\"slug\":\"2022-08-24-100000\",\"frontmatter\":{\"title\":\"React（TypeScript）　WebPackでCSSの環境定数\",\"createAt\":\"2022-08-24 10:00\",\"updateAt\":null,\"tags\":[\"React\",\"TypeScript\",\"WebPack\",\"CSS\"]},\"rawContent\":\"$4b\"},{\"slug\":\"2022-08-23-100000\",\"frontmatter\":{\"title\":\"HTMLとJavaScriptとCSSでローディングを作成する方法（SpinKit）\",\"createAt\":\"2022-08-23 10:00\",\"updateAt\":null,\"tags\":[\"jQuery\",\"JavaScript\",\"CSS\",\"HTML\"]},\"rawContent\":\"$4c\"},{\"slug\":\"2022-08-22-100000\",\"frontmatter\":{\"title\":\"React（TypeScript）　WebPackでインポートのエイリアス化（省略、@、アットマーク）\",\"createAt\":\"2022-08-22 10:00\",\"updateAt\":null,\"tags\":[\"React\",\"TypeScript\",\"WebPack\"]},\"rawContent\":\"$4d\"},{\"slug\":\"2022-08-21-100000\",\"frontmatter\":{\"title\":\"React（TypeScript）　WebPackで難読化、ソースマップの非表示する方法\",\"createAt\":\"2022-08-21 10:00\",\"updateAt\":null,\"tags\":[\"WebPack\",\"React\",\"TypeScript\"]},\"rawContent\":\"$4e\"},{\"slug\":\"2022-08-20-100000\",\"frontmatter\":{\"title\":\"React(TypeScript、Docker、WebPack)のプロジェクトの環境定数（@types　global.d.ts）\",\"createAt\":\"2022-08-20 10:00\",\"updateAt\":null,\"tags\":[\"React\",\"WebPack\"]},\"rawContent\":\"\\n# はじめに\\n\\n以下の記事を参考に、DockerとWebPackを使用したプロジェクトに環境毎のWebPackを用意してください。\\n\\n既にプロジェクトがある場合は、適時読み替えてください。\\n\\n[https://reigle.info/entry/2022/08/19/100000](https://reigle.info/entry/2022/08/19/100000)[reigle.info](https://reigle.info/entry/2022/08/19/100000)\\n\\n# 環境毎のWebPackを修正する\\n\\n以下のように記載してください。\\n\\n環境定数の内容は任意で記載してください。\\n\\n```JavaScript\\nconst webpack = require(\\\"webpack\\\");\\n\\nmodule.exports = (env) =\u003e {\\n  return {\\n    plugins: [\\n      new webpack.DefinePlugin({\\n        ~~~~~環境定数ここから~~~~~\\n        HOGE: JSON.stringify(\\\"SAMPLE\\\"),\\n        URL_TEST: JSON.stringify(\\\"https://hogehoge.com\\\"),\\n        BOOL_TEST: JSON.stringify(false),\\n        ~~~~~環境定数ここまで~~~~~\\n      }),\\n    ],\\n  };\\n};\\n```\\n\\n# 環境定数をプロジェクト内で使用出来るようにする\\n\\n「`/src`」配下に「`@types`」のディレクトリを作成します。\\n\\n「`@types`」のディレクトリ配下に「`global.d.ts`」のファイルを作成します。\\n\\n以下のように環境定数と、その型を定義します。\\n\\n```JavaScript\\ndeclare const HOGE: string;\\ndeclare const URL_TEST: string;\\ndeclare const BOOL_TEST: boolean;\\n```\\n\\n# 環境定数を使用する\\n\\n環境定数を使用したい箇所で、その環境定数を使用するだけです。\\n\\n※インポートなどは必要ありません。\\n\"},{\"slug\":\"2022-08-19-100000\",\"frontmatter\":{\"title\":\"WebPackを環境毎に記載する方法\",\"createAt\":\"2022-08-19 10:00\",\"updateAt\":null,\"tags\":[\"WebPack\",\"React\"]},\"rawContent\":\"$4f\"},{\"slug\":\"2022-08-18-100000\",\"frontmatter\":{\"title\":\"React(TypeScript、Docker、WebPack)のプロジェクトのサーバーデプロイ方法\",\"createAt\":\"2022-08-18 10:00\",\"updateAt\":null,\"tags\":[\"React\",\"WebPack\",\"Docker\"]},\"rawContent\":\"$50\"},{\"slug\":\"2022-08-17-100000\",\"frontmatter\":{\"title\":\"nginxでBasic認証を設定する方法\",\"createAt\":\"2022-08-17 10:00\",\"updateAt\":null,\"tags\":[\"nginx\"]},\"rawContent\":\"$51\"},{\"slug\":\"2022-08-16-100000\",\"frontmatter\":{\"title\":\"Node.jsでStripeのカスタマー（顧客）のクレジットカードをデフォルトカードに設定方法　stripe.customers.update　default_payment_method\",\"createAt\":\"2022-08-16 10:00\",\"updateAt\":null,\"tags\":[\"Node.js\",\"Stripe\"]},\"rawContent\":\"$52\"},{\"slug\":\"2022-08-15-100000\",\"frontmatter\":{\"title\":\"Stripeのカスタマー（顧客）の支払い方法の設定方法（クライアント側　純粋なHTML/JavaScript jQuery）【2/2】\",\"createAt\":\"2022-08-15 10:00\",\"updateAt\":null,\"tags\":[\"JavaScript\",\"Stripe\"]},\"rawContent\":\"$53\"},{\"slug\":\"2022-08-14-100000\",\"frontmatter\":{\"title\":\"Node.jsでStripeのカスタマー（顧客）の支払い方法の設定方法（クライアントシークレット取得）　stripe.setupIntents.create【1/2】\",\"createAt\":\"2022-08-14 10:00\",\"updateAt\":null,\"tags\":[\"Node.js\",\"Stripe\"]},\"rawContent\":\"$54\"},{\"slug\":\"2022-08-13-100000\",\"frontmatter\":{\"title\":\"Node.jsでStripeのカスタマー（顧客）の削除方法　stripe.customers.del\",\"createAt\":\"2022-08-13 10:00\",\"updateAt\":null,\"tags\":[\"Node.js\",\"Stripe\"]},\"rawContent\":\"$55\"},{\"slug\":\"2022-08-12-100000\",\"frontmatter\":{\"title\":\"Node.jsでStripeのカスタマー（顧客）の存在確認方法　stripe.customers.retrieve\",\"createAt\":\"2022-08-12 10:00\",\"updateAt\":null,\"tags\":[\"Node.js\",\"Stripe\"]},\"rawContent\":\"$56\"},{\"slug\":\"2022-08-11-100000\",\"frontmatter\":{\"title\":\"Node.jsでStripeのカスタマー（顧客）の登録方法　stripe.customers.create\",\"createAt\":\"2022-08-11 10:00\",\"updateAt\":null,\"tags\":[\"Node.js\",\"Stripe\"]},\"rawContent\":\"$57\"},{\"slug\":\"2022-08-10-100000\",\"frontmatter\":{\"title\":\"CentOS7で公開鍵を使用したSSHログイン\",\"createAt\":\"2022-08-10 10:00\",\"updateAt\":null,\"tags\":[\"CentOS7\"]},\"rawContent\":\"$58\"},{\"slug\":\"2022-08-09-100000\",\"frontmatter\":{\"title\":\"CentOS7にGitをインストールする方法\",\"createAt\":\"2022-08-09 10:00\",\"updateAt\":null,\"tags\":[\"CentOS7\"]},\"rawContent\":\"\\n# yumを使用してGitをインストールする方法\\n\\n以下のコマンドを実行するだけです。\\n\\n```sh\\nyum install git\\n```\\n\\n# Sourceを使用してGitをインストールする方法\\n\\nどこでも良いので、Gitのファイルをダウンロードするディレクトリへ移動します。\\n\\n```sh\\ncd /usr/local/src/\\n```\\n\\nサイトからGitのファイルをダウンロードします。\\n\\n（以下は、バージョン2.9.5の例です）\\n\\nバージョンは以下のGitHubからご確認ください。\\n\\nhttps://github.com/git/git/tags\\n\\n```sh\\nsudo wget https://mirrors.edge.kernel.org/pub/software/scm/git/git-2.9.5.tar.gz\\n```\\n\\nファイルを解凍します。\\n\\n```sh\\nsudo tar xzvf git-2.9.5.tar.gz\\n```\\n\\n解凍前のファイルを削除します。\\n\\n```sh\\nsudo rm -rf git-2.9.5.tar.gz\\n```\\n\\nGitのディレクトリに移動します。\\n\\n```sh\\ncd git-2.9.5/\\n```\\n\\n以下のコマンドでインストールします。\\n\\n```sh\\nsudo make prefix=/usr/local all\\nsudo make prefix=/usr/local install\\n```\\n\\n# Gitのバージョン確認\\n\\n以下のコマンドでバージョン確認ができます。\\n\\n```sh\\ngit --version\\n```\\n\"},{\"slug\":\"2022-08-08-100000\",\"frontmatter\":{\"title\":\"通常のJavaScriptで共通関数を作成する方法\",\"createAt\":\"2022-08-08 10:00\",\"updateAt\":null,\"tags\":[\"JavaScript\"]},\"rawContent\":\"$59\"},{\"slug\":\"2022-08-07-100000\",\"frontmatter\":{\"title\":\"通常のJavaScriptでグローバル定数を作成する方法\",\"createAt\":\"2022-08-07 10:00\",\"updateAt\":null,\"tags\":[\"JavaScript\"]},\"rawContent\":\"\\n# はじめに\\n\\nReactなどのフレームワークを使用していない純粋なHTML/JavaScriptでグローバル定数を使用する方法を記載します。\\n\\n# プロジェクト構成\\n\\nプロジェクトの構成は以下とします。\\n\\n```javascript\\nproject\\n┣ index.html\\n┣ index.js\\n┗ const.js\\n```\\n\\n# グローバル定数の定義\\n\\n「`const.js`」に以下のように定数を定義します。\\n\\nここでは、「`HELLO`」「`SAMPLE`」の２つの定数を定義しています。\\n\\n```javascript\\nObject.defineProperty(window, \\\"HELLO\\\", {\\n  value: \\\"ハロー\\\",\\n  writable: false,\\n});\\n\\nObject.defineProperty(window, \\\"SAMPLE\\\", {\\n  value: \\\"サンプル\\\",\\n  writable: false,\\n});\\n```\\n\\n# グローバル定数の取得\\n\\n「`index.js`」に以下のように定数を定義します。\\n\\n「`HELLO`」「`SAMPLE`」の２つの定数を取得してコンソール出力しています。\\n\\n```javascript\\nconsole.log(HELLO);\\nconsole.log(SAMPLE);\\n```\\n\\n# HTMLで呼び出し\\n\\n「`index.html`」に以下のように定数を定義します。\\n\\nグローバル定数定義のJSファイルをインポートする必要がある点が注意です。\\n\\n```javascript\\n\u003c!DOCTYPE html\u003e\\n\u003chtml lang=\\\"ja\\\"\u003e\\n  \u003chead\u003e\\n    \u003ctitle\u003e\u003c/title\u003e\\n    \u003cmeta charset=\\\"UTF-8\\\" /\u003e\\n    \u003cscript src=\\\"./const.js\\\"\u003e\u003c/script\u003e\\n    \u003cscript src=\\\"./index.js\\\"\u003e\u003c/script\u003e\\n  \u003c/head\u003e\\n\\n  \u003cbody\u003e\u003c/body\u003e\\n\u003c/html\u003e\\n```\\n\\n以下のGitHubにソースコードをアップしていますので、実際に確認したい方はPullしてご確認ください。\\n\\nhttps://github.com/Reigle/global_const_js\\n\"},{\"slug\":\"2022-08-06-100000\",\"frontmatter\":{\"title\":\"JavaScriptでパスワードを自動生成する方法（記号を含めたパスワード、記号を含めないパスワード）\",\"createAt\":\"2022-08-06 10:00\",\"updateAt\":null,\"tags\":[\"JavaScript\"]},\"rawContent\":\"$5a\"},{\"slug\":\"2022-08-05-100000\",\"frontmatter\":{\"title\":\"CSSでメディアクエリを使用する方法\",\"createAt\":\"2022-08-05 10:00\",\"updateAt\":null,\"tags\":[\"CSS\"]},\"rawContent\":\"$5b\"},{\"slug\":\"2022-08-04-100000\",\"frontmatter\":{\"title\":\"コンソールに表示されるエラー「Unchecked runtime.lastError: The message port closed before a response was received.」に関して\",\"createAt\":\"2022-08-04 10:00\",\"updateAt\":null,\"tags\":[\"エラー\"]},\"rawContent\":\"\\n# エラーに関して\\n\\nコンソールに出力されるエラーは以下です。\\n\\n```sh\\nUnchecked runtime.lastError: The message port closed before a response was received.\\n```\\n\\n上記のエラーは画面表示時に出力されます。\\n\\nローカルサーバーで起動した場合に出力されました。\\n\\n# エラーの原因\\n\\nGoogle Chromeの拡張機能（chrome extension）が原因でした。\\n\\n※私の場合は「Keeper」が原因でした。\\n\\n調査方法は、単純に拡張機能を全てOFFにして、1つずつONに変更して確認するだけです。\\n\\n# 対応方法\\n\\n対応としては、特に何もしなくても良いです。\\n\\nただ、気になる方は、拡張機能をOFFにするだけです。\\n\"},{\"slug\":\"2022-08-03-100000\",\"frontmatter\":{\"title\":\"JavaScriptで文字列をハッシュ化する方法\",\"createAt\":\"2022-08-03 10:00\",\"updateAt\":null,\"tags\":[\"JavaScript\"]},\"rawContent\":\"\\n# ハッシュ化とは\\n\\nハッシュ化とは、データを不規則な文字列に変換する事です。\\n\\n変換されたデータはハッシュ値と呼ばれ、データの変換にはハッシュ関数と呼ばれるアルゴリズムが使われています。\\n\\n同一のデータから変換されるハッシュ値は常に同一の結果になります。\\n\\nまた、変換後は複合化できない性質（不可逆性）があることが特徴です。\\n\\nハッシュ化は、一度入力すると復号できないほうが都合がいいもの、パスワードや、データ・ファイルの改ざんがされていないかチェックする際（チェックサム）に使用します。\\n\\n# SHA-256のハッシュ化\\n\\n一般的なハッシュ化である「SHA-256」のハッシュ化の方法は以下です。\\n\\n非同期で処理されるため、thenで取得結果を受け取る必要があります。\\n\\n```javascript\\nconst sha256 = async (text) =\u003e {\\n    const uint8  = new TextEncoder().encode(text)\\n    const digest = await crypto.subtle.digest('SHA-256', uint8)\\n    return Array.from(new Uint8Array(digest)).map(v =\u003e v.toString(16).padStart(2,'0')).join('')\\n}\\n\\nsha256('テスト').then(hash =\u003e console.log(hash));\\n```\\n\\n# SHA-512のハッシュ化\\n\\n「SHA-256」のハッシュ化と方法はほとんど同じです。\\n\\n```javascript\\nconst sha512 = async (text) =\u003e {\\n    const uint8  = new TextEncoder().encode(text)\\n    const digest = await crypto.subtle.digest('SHA-512', uint8)\\n    return Array.from(new Uint8Array(digest)).map(v =\u003e v.toString(16).padStart(2,'0')).join('')\\n}\\n\\nsha512('テスト').then(hash =\u003e console.log(hash));\\n```\\n\"},{\"slug\":\"2022-08-02-100000\",\"frontmatter\":{\"title\":\"CentOS7.9にMariaDBのインストール\",\"createAt\":\"2022-08-02 10:00\",\"updateAt\":null,\"tags\":[\"CentOS7\",\"MySQL\"]},\"rawContent\":\"\\n# MariaDBのインストール\\n\\n以下のコマンドで設定ファイルを開く\\n\\n```sh\\nvi /etc/yum.repos.d/MariaDB.repo\\n```\\n\\n「`MariaDB.repo`」には、以下の内容を記載する。\\n\\n```sh\\n[mariadb]\\nname = MariaDB\\nbaseurl = http://yum.mariadb.org/10.3/centos7-amd64\\ngpgkey=https://yum.mariadb.org/RPM-GPG-KEY-MariaDB\\ngpgcheck=1\\n```\\n\\n以下のコマンドでMariaDBをインストールする。\\n\\n```sh\\nyum install MariaDB-server MariaDB-client\\n```\\n\\n以下のコマンドでサーバー起動、再起動時の自動起動設定を行う。\\n\\n```sh\\nsystemctl start mariadb\\nsystemctl enable mariadb\\n```\\n\\n# MariaDBの設定変更\\n\\n## セキュリティの設定\\n\\n以下のコマンドで、rootのパスワード変更など、セキュリティ的に必要な設定を行う。\\n\\n```sh\\nmysql_secure_installation\\n```\\n\\n## 文字コード設定\\n\\n以下のコマンドで設定ファイルを開く。\\n\\n```sh\\nvi /etc/my.cnf.d/client.cnf\\n```\\n\\n「`client.cnf`」に以下の内容を記載する。\\n\\n```sh\\n[client-mariadb]\\ndefault-character-set=utf8mb4\\n```\\n\\n以下のコマンドでMariaDBを再起動する。\\n\\n```sh\\nsystemctl restart mariadb\\n```\\n\"},{\"slug\":\"2022-08-01-100000\",\"frontmatter\":{\"title\":\"CentOS7.9にnginxをインストールする方法\",\"createAt\":\"2022-08-01 10:00\",\"updateAt\":null,\"tags\":[\"CentOS7\",\"nginx\"]},\"rawContent\":\"$5c\"},{\"slug\":\"2022-07-31-100000\",\"frontmatter\":{\"title\":\"スプレッドシートでセル情報を取得する方法、絶対参照のセル情報を取得する方法\",\"createAt\":\"2022-07-31 10:00\",\"updateAt\":null,\"tags\":[\"スプレッドシート\"]},\"rawContent\":\"\\n# セル情報を取得する方法\\n\\n以下の関数を実行する事で、セルの情報が取得できます。\\n\\n```sh\\n=ADDRESS(ROW(),COLUMN(),4)\\n```\\n\\n![](/images/2022-07-31-100000/20220722234541.png)\\n\\n# 絶対参照のセル情報を取得する方法（列絶対参照）\\n\\n以下の関数を実行する事で、列が絶対参照（「`$A1`」）のセルの情報が取得できます。\\n\\n```sh\\n=ADDRESS(ROW(),COLUMN(),3)\\n```\\n\\n![](/images/2022-07-31-100000/20220722234617.png)\\n\\n# 絶対参照のセル情報を取得する方法（行絶対参照）\\n\\n以下の関数を実行する事で、行が絶対参照（「`A$1`」）のセルの情報が取得できます。\\n\\n```sh\\n=ADDRESS(ROW(),COLUMN(),2)\\n```\\n\\n![](/images/2022-07-31-100000/20220722234700.png)\\n\\n# 絶対参照のセル情報を取得する方法（列と行絶対参照）\\n\\n以下の関数を実行する事で、列と行が絶対参照（「`$A$1`」）のセルの情報が取得できます。\\n\\n```sh\\n=ADDRESS(ROW(),COLUMN(),1)\\n```\\n\\n![](/images/2022-07-31-100000/20220722234709.png)\\n\"},{\"slug\":\"2022-07-30-100000\",\"frontmatter\":{\"title\":\"スプレッドシートで行数、列名を取得する方法\",\"createAt\":\"2022-07-30 10:00\",\"updateAt\":null,\"tags\":[\"スプレッドシート\"]},\"rawContent\":\"\\n# 行数を取得する方法\\n\\n以下の関数を使用することで、行の数字を取得できます。\\n\\n```\\n=ROW()\\n```\\n\\n![](/images/2022-07-30-100000/20220722234129.png)\\n\\n# 列名を取得する方法\\n\\n以下の関数を使用することで、列のアルファベットを取得できます。\\n\\n```\\n=SPLIT(ADDRESS(1,COLUMN(),4),1)\\n```\\n\\n![](/images/2022-07-30-100000/20220722234244.png)\\n\\n# 任意の列の列名を取得する方法\\n\\n以下の関数を使用することで、「`COLUMN`」の引数に記載のセルの列のアルファベットを取得できます。\\n\\n```\\n=SPLIT(ADDRESS(1,COLUMN(B2),4),1)\\n```\\n\\n![](/images/2022-07-30-100000/20220722234341.png)\\n\"},{\"slug\":\"2022-07-29-100000\",\"frontmatter\":{\"title\":\"exportsした関数を同一ファイルの別関数から実行する方法（Node.js）\",\"createAt\":\"2022-07-29 10:00\",\"updateAt\":null,\"tags\":[\"Node.js\"]},\"rawContent\":\"\\n# exportsとは\\n\\n別ファイルで、「`require`」する事で「`exports`」した関数を実行する事ができる仕組みです。\\n\\n# 通常の関数の実行\\n\\n以下の様に「`test`」関数内で「`sam()`」と記載する事で、「`sam`」関数を実行する事が出来ます。\\n\\n```javascript\\nconst sam = () =\u003e {\\n  console.log('HOGE');\\n}\\n\\nconst test = () =\u003e {\\n  sam();\\n}\\n```\\n\\n# 【注意】exportsした関数を呼び出せない\\n\\n呼び出し先の関数を「`exports`」にすることで、「`通常の関数の実行`」で記載した方法では呼び出す事が出来ません。\\n\\n```javascript\\nexports.sam = () =\u003e {\\n  console.log(\\\"HOGE\\\");\\n}\\n\\nconst test = () =\u003e {\\n  sam();\\n}\\n```\\n\\n# exportsした関数を呼び出す方法\\n\\n「`通常の関数の実行`」の呼び出し方の前に「`module.exports.`」を付けることで呼び出す事が出来ます。\\n\\n「`module.exports.呼び出す関数名`」\\n\\n```javascript\\nexports.sam = () =\u003e {\\n  console.log(\\\"HOGE\\\");\\n}\\n\\nconst test = () =\u003e {\\n  module.exports.sam();\\n}\\n```\\n\"},{\"slug\":\"2022-07-28-100000\",\"frontmatter\":{\"title\":\"JavaScriptで文字列からスペースを無くす方法（置換、正規表現）\",\"createAt\":\"2022-07-28 10:00\",\"updateAt\":null,\"tags\":[\"JavaScript\"]},\"rawContent\":\"\\n# 置換を使用してスペースを削除する\\n\\nこの方法では、最初のスペースのみが削除されます。\\n\\n全てのスペースを削除したい場合などは「`正規表現を使用してスペースを削除する`」の方法を使用してください。\\n\\n※スペースが１つと決まっているものには、こちらの方法でも可能です。\\n\\n```javascript\\nlet str = 'a b c d e';\\nconsole.log(str.replace(' ', ''));\\n\u003e\u003e ab c d e\\n```\\n\\n# 正規表現を使用してスペースを削除する\\n\\nこの方法では、全てのスペースが削除されます。\\n\\n```javascript\\nlet str = 'a b c d e';\\nconsole.log(str.replace(/ /g, ''));\\n\u003e\u003e abcde\\n```\\n\\n以下の方法でも同様に全てのスペースが削除されます。\\n\\n```javascript\\nlet str = 'a b c d e';\\nconsole.log(str.replace(/\\\\s/g, ''));\\n\u003e\u003e abcde\\n```\\n\"},{\"slug\":\"2022-07-27-100000\",\"frontmatter\":{\"title\":\"JavaScriptのObject型（オブジェクト型）の操作\",\"createAt\":\"2022-07-27 10:00\",\"updateAt\":null,\"tags\":[\"JavaScript\"]},\"rawContent\":\"$5d\"},{\"slug\":\"2022-07-26-100000\",\"frontmatter\":{\"title\":\"HomebrewでMySQLをインストールする手順（Mac 環境構築）\",\"createAt\":\"2022-07-26 10:00\",\"updateAt\":null,\"tags\":[\"MySQL\"]},\"rawContent\":\"\\n# Homebrewのインストール\\n\\nHomebrewは以下の公式ページからコマンドを取得して実行する。\\n\\nhttps://brew.sh/index_ja.html\\n\\n# MySQLのインストール\\n\\n以下のコマンドを実行し、MySQLをインストールする。\\n\\n```sh\\nbrew install mysql\\n```\\n\\n# MySQLのサーバー起動\\n\\n以下のコマンドでMySQLのサーバーが起動できる。\\n\\n```sh\\nmysql.server start\\n```\\n\\n# MySQLのrootログイン\\n\\n以下のコマンドで「`root`」ユーザーでMySQLにログインできる。\\n\\n```sh\\nmysql -u root\\n```\\n\\n# MySQLのバージョン確認\\n\\n以下のコマンドでインストールされたMySQLのバージョンが確認できる。\\n\\n```sh\\nbrew info mysql\\n```\\n\"},{\"slug\":\"2022-07-25-100000\",\"frontmatter\":{\"title\":\"MySQLで既に登録済みのカラムにDEFAULTの値を追加、削除する方法\",\"createAt\":\"2022-07-25 10:00\",\"updateAt\":null,\"tags\":[\"MySQL\"]},\"rawContent\":\"\\n# DEFAULTの値を追加する方法\\n\\n以下のSQL文を実行することで、デフォルト値の設定または変更を行えます。\\n\\n```sql\\nALTER TABLE テーブル名 ALTER フィールド名 SET DEFAULT デフォルト値;\\n```\\n\\n# DEFAULTの値を追加するSQL生成\\n\\nSQL生成\\n\\n※必ず上記の入力項目全てに値を設定してご利用ください。\\n\\n# DEFAULTの値を削除する方法\\n\\n以下のSQL文を実行することで、デフォルト値の削除を行えます。\\n\\n削除後は、デフォルト値が未設定（NULL）になります。\\n\\n```sql\\nALTER TABLE テーブル名 ALTER カラム名 DROP DEFAULT;\\n```\\n\\n# DEFAULTの値を削除するSQL生成\\n\\nSQL生成\\n\\n※必ず上記の入力項目全てに値を設定してご利用ください。\\n\"},{\"slug\":\"2022-07-24-100000\",\"frontmatter\":{\"title\":\"Node.jsからMySQLを実行した際にER_NOT_SUPPORTED_AUTH_MODEエラーが出る場合\",\"createAt\":\"2022-07-24 10:00\",\"updateAt\":null,\"tags\":[\"MySQL\",\"Node.js\"]},\"rawContent\":\"\\n# 状況\\n\\nNode.jsからMySQLを実行した際に「`エラーの原因`」に記載のエラーが発生する\\n\\nターミナルなどで、MySQLを実行しても問題なく実行ができる\\n\\nNode.jsで使用しているユーザーでもMySQLに接続ができる\\n\\n# エラーの原因\\n\\n```sql\\nER_NOT_SUPPORTED_AUTH_MODE: Client does not support authentication protocol requested by server; consider upgrading MySQL client\\n```\\n\\nエラー文から、認証系のエラーだと推察できるが、「`状況`」に記載の通りMySQLのログイン情報などに間違いはない。\\n\\n# 解決方法\\n\\nターミナルなどで、「`root`」ユーザーでアクセスし、Node.jsで使用しているユーザーのパスワードを以下のように設定する。\\n※「`user_name`」「`password`」は各自で書き換えてください。\\n\\n```sql\\nALTER USER 'user_name'@'localhost' IDENTIFIED WITH mysql_native_password BY 'password'\\n```\\n\"},{\"slug\":\"2022-07-23-100000\",\"frontmatter\":{\"title\":\"スプレッドシートで、シート名を設定したセルを参照して別シートのセルのデータ取得（INDIRECT関数）\",\"createAt\":\"2022-07-23 10:00\",\"updateAt\":null,\"tags\":[\"スプレッドシート\"]},\"rawContent\":\"$5e\"},{\"slug\":\"2022-07-22-100000\",\"frontmatter\":{\"title\":\"JavaScriptでasync（非同期処理）とawait（同期処理）の使い方\",\"createAt\":\"2022-07-22 10:00\",\"updateAt\":null,\"tags\":[\"JavaScript\"]},\"rawContent\":\"\\n# async（非同期処理）\\n\\n関数の前に「`async`」を付ける事で、非同期の関数になります。\\n\\nそもそも、非同期とは順番を待たずに後ろで処理をしておくという状態です。\\n\\n非同期にする事で、APIなど裏で実施したい内容を実行する事ができます。\\n\\n以下、非同期のサンプルコードです。\\n\\n※無名関数を使用して、シンプルに記載しています。\\n\\n```javascript\\n\u003cscript\u003e\\n    (async () =\u003e {\\n        // ここが非同期処理です。\\n        console.log('非同期処理');\\n    })()\\n\u003c/script\u003e\\n```\\n\\n# await（同期処理）\\n\\n非同期処理の中で、画面の表示を変えたいなど同期的に処理を行いたい場合があります。\\nその際には、明示的に同期処理を実行することが出来ます。\\n処理の左に「`await`」を付ける事で、同期処理になります。\\n\\n以下、同期処理のサンプルコードです。\\n\\n※無名関数を使用して、シンプルに記載しています。\\n\\n```javascript\\n\u003cscript\u003e\\n    (async () =\u003e {\\n        // 以下が同期処理です。\\n        await console.log('同期処理');\\n    })()\\n\u003c/script\u003e\\n```\\n\\n# 非同期処理と同期処理まとめ\\n\\nまずはソースコードの全量\\n\\n「`await`」の右の処理は、１秒止める処理だと思ってください。\\n\\n```javascript\\n\u003cscript\u003e\\n    console.log('ログ1');\\n    (async () =\u003e {\\n        console.log('ログ2');\\n        await new Promise(resolve =\u003e setTimeout(resolve, 1000))\\n        console.log('ログ3');\\n    })()\\n    console.log('ログ4');\\n\u003c/script\u003e\\n```\\n\\nコンソールには、以下の様な順番でログが出力されると思うかもしれません。\\n\\n```javascript\\nログ1\\nログ2\\nログ3\\nログ4\\n```\\n\\nしかし、非同期にしている事で、以下の様な順番でログが出力されます。\\n\\n```javascript\\nログ1\\nログ2\\nログ4\\nログ3\\n```\\n\"},{\"slug\":\"2022-07-21-100000\",\"frontmatter\":{\"title\":\"JavaScriptで九九計算（console.table　テーブル表示）\",\"createAt\":\"2022-07-21 10:00\",\"updateAt\":null,\"tags\":[\"JavaScript\"]},\"rawContent\":\"$5f\"},{\"slug\":\"2022-07-20-100000\",\"frontmatter\":{\"title\":\"SwiftでUINavigationBarの色が設定されなくなった場合、下線を非表示にしたい場合（iOS15以上）\",\"createAt\":\"2022-07-20 10:00\",\"updateAt\":null,\"tags\":[\"Swift\"]},\"rawContent\":\"$60\"},{\"slug\":\"2022-07-19-100000\",\"frontmatter\":{\"title\":\"Swiftの広告パーミッション確認の表示方法（AppTrackingTransparency）\",\"createAt\":\"2022-07-19 10:00\",\"updateAt\":null,\"tags\":[\"Swift\"]},\"rawContent\":\"$61\"},{\"slug\":\"2022-07-18-100000\",\"frontmatter\":{\"title\":\"VSCodeを日本語化する方法\",\"createAt\":\"2022-07-18 10:00\",\"updateAt\":null,\"tags\":[\"VSCode\"]},\"rawContent\":\"\\n# VSCodeを日本語化する方法\\n\\n以下の拡張機能をインストールする事で、VSCodeが日本語化されます。\\n\\nhttps://marketplace.visualstudio.com/items?itemName=MS-CEINTL.vscode-language-pack-ja\\n\\n拡張機能をインストールした後は、VSCodeを再起動してください。\\n\\n# VSCodeを別言語に変更する方法\\n\\nVSCodeにて「`command + shift + p`」のショートカットを実行する。\\n\\n検索バーに「`display`」と入力し、「`表示言語を構成する`」を選択する。\\n\\n![](/images/2022-07-18-100000/20220716191849.png)\\n\\n変更したい任意の言語を選択する。\\n\\n![](/images/2022-07-18-100000/20220716191851.png)\\n\\n「`再起動`」を押下する。\\n\\n![](/images/2022-07-18-100000/20220716191853.png)\\n\"},{\"slug\":\"2022-07-17-100000\",\"frontmatter\":{\"title\":\"VSCodeでローカルサーバーを起動する方法\",\"createAt\":\"2022-07-17 10:00\",\"updateAt\":null,\"tags\":[\"VSCode\"]},\"rawContent\":\"\\n# ローカルサーバーを起動する意味\\n\\nPHPなどでローカルサーバーを起動する事で、ローカルでもAPIの確認などが行える様になります。\\n\\n# VSCodeでローカルサーバーを起動するための準備\\n\\n以下のVSCodeの拡張機能をインストールします。\\n\\nhttps://marketplace.visualstudio.com/items?itemName=ritwickdey.LiveServer\\n\\n# ローカルサーバー起動方法\\n\\nVSCodeで「`File -\u003e Open`」からプロジェクトを開きます。\\n\\nVSCodeの右下の「`Go Live`」を押下する事でローカルサーバーが起動されます。\\n\\n![](/images/2022-07-17-100000/20220716190512.png)\\n\\n「`Go Live`」が「`Port : 5500`」に変更されたらローカルサーバーが起動されているので、以下のIPアドレスにブラウザでアクセスする事で確認できます。\\n\\n[http://127.0.0.1:5500](http://127.0.0.1:5500)\\n\\n# ローカルサーバーの停止方法\\n\\nVSCodeの「`Port : 5500`」を押下する事でローカルサーバーが停止します。\\n\\n「`Port : 5500`」が「`Go Live`」に変更されたらローカルサーバーが停止されています。\\n\\n![](/images/2022-07-17-100000/20220716190941.png)\\n\"},{\"slug\":\"2022-07-16-100000\",\"frontmatter\":{\"title\":\"JavaScriptで金額フォーマット表示（カンマ区切り toLocaleString 正規表現）\",\"createAt\":\"2022-07-16 10:00\",\"updateAt\":null,\"tags\":[\"JavaScript\"]},\"rawContent\":\"\\n# toLocaleStringで3桁カンマ区切り\\n\\n以下の様に数値型のデータに「`toLocaleString`」関数を使用することで、３桁毎にカンマ区切りされたデータが出力されます。\\n\\n```javascript\\n\u003cscript\u003e\\n    const target = 100000000;\\n    console.log(target.toLocaleString()); // 100,000,000\\n\u003c/script\u003e\\n```\\n\\n文字列型の場合には、一度数値型に変換してから使用してください。\\n\\n```javascript\\n\u003cscript\u003e\\n    const target = 100000000;\\n    console.log(Number(target).toLocaleString()); // 100,000,000\\n\u003c/script\u003e\\n```\\n\\n# 正規表現で3桁カンマ区切り\\n\\n以下の様にカンマ区切りの関数を用意して実行する事でカンマ区切りに変換できます。\\n\\nちなみに、本関数は小数点にも対応しているので小数点も利用できます。（小数点はカンマ区切りされません）\\n\\n```javascript\\n\u003cscript\u003e\\n    function toComma(target) {\\n        var targetSplit = String(target).split('.');\\n        var ret = String(targetSplit[0]).replace( /(\\\\d)(?=(\\\\d\\\\d\\\\d)+(?!\\\\d))/g, '$1,');\\n        if (targetSplit.length \u003e 1) {\\n            ret = ret + '.' + targetSplit[1];\\n        }\\n        return ret;\\n    }\\n    console.log(toComma(10000000)); // 10,000,000\\n\u003c/script\u003e\\n```\\n\"},{\"slug\":\"2022-07-15-100000\",\"frontmatter\":{\"title\":\"React(TypeScript)プロジェクトの作成方法（Docker、ESLint、Prettier、WebPack）【4/4】\",\"createAt\":\"2022-07-15 10:00\",\"updateAt\":null,\"tags\":[\"React\",\"TypeScript\",\"Docker\",\"ESLint\",\"Prettier\",\"WebPack\"]},\"rawContent\":\"$62\"},{\"slug\":\"2022-07-14-100000\",\"frontmatter\":{\"title\":\"React(TypeScript)プロジェクトの作成方法（Docker、ESLint、Prettier、WebPack）【3/4】\",\"createAt\":\"2022-07-14 10:00\",\"updateAt\":null,\"tags\":[\"React\",\"TypeScript\",\"Docker\",\"ESLint\",\"Prettier\",\"WebPack\"]},\"rawContent\":\"$63\"},{\"slug\":\"2022-07-13-100000\",\"frontmatter\":{\"title\":\"React(TypeScript)プロジェクトの作成方法（Docker、ESLint、Prettier、WebPack）【2/4】\",\"createAt\":\"2022-07-13 10:00\",\"updateAt\":null,\"tags\":[\"React\",\"TypeScript\",\"Docker\",\"ESLint\",\"Prettier\",\"WebPack\"]},\"rawContent\":\"$64\"},{\"slug\":\"2022-07-12-100000\",\"frontmatter\":{\"title\":\"React(TypeScript)プロジェクトの作成方法（Docker、ESLint、Prettier、WebPack）【1/4】\",\"createAt\":\"2022-07-12 10:00\",\"updateAt\":null,\"tags\":[\"React\",\"TypeScript\",\"Docker\",\"ESLint\",\"Prettier\",\"WebPack\"]},\"rawContent\":\"$65\"},{\"slug\":\"2022-07-11-100000\",\"frontmatter\":{\"title\":\"MarkdownをPDFに変換する方法\",\"createAt\":\"2022-07-11 10:00\",\"updateAt\":null,\"tags\":[\"Markdown\"]},\"rawContent\":\"\\n# 事前準備\\n\\n変換用のMarkdown（sample.md）を作成する\\n\\n```\\n# PDFサンプル\\n\\n変換用のPDF\\n```\\n\\npandocをインストールする\\n\\n```\\nbrew install pandoc\\n```\\n\\n# Markdownの変換\\n\\nMarkdownのディレクトリをルートにする（cdコマンドで移動）\\n\\n以下のコマンドを実行する\\n\\n```\\npandoc -s ./sample.md -t html5 -o ./index.html -f gfm\\n```\\n\\n生成されたHTML（index.html）をChromeで開き、「command + p」のショートカットを実行する\\n\\n送信先を「`PDFに保存`」に変更し、「`保存`」を押下\\n\\n![](/images/2022-07-11-100000/20220708094500.png)\\n\\n# ヘッダーとフッターの文字を消したい場合\\n\\n印刷の「詳細設定」の「ヘッダーとフッター」のチェックを外すことで、日付などのヘッダー、フッターを消す事ができる。\\n\\n![](/images/2022-07-11-100000/20220708094652.png)\\n\\n# CSSを適応したい場合\\n\\nMarkdownと同じディレクトリに「style.css」を作成して以下のコマンドを実行する\\n\\n```\\npandoc -s ./sample.md -t html5 -c ./style.css -o ./index.html -f gfm\\n```\\n\\nChromeの印刷設定にて「詳細設定」の「背景のグラフィック」にチェックを入れることで、背景色のCSSが設定されたPDFが出力できる。\\n\\n![](/images/2022-07-11-100000/20220708094630.png)\\n\\n# 複数のMarkdownをまとめてPDF出力する\\n\\n以下のように、Markdownの指定を「*」とする事で複数のMarkdownをまとめてindex.htmlに変換する事ができる。\\n\\n```\\npandoc -s ./*.md -t html5 -c ./style.css -o ./index.html -f gfm\\n```\\n\"},{\"slug\":\"2022-07-08-100000\",\"frontmatter\":{\"title\":\"JavaScriptのデータ保存方法（Cookie、SessionStorage、LocalStorage）\",\"createAt\":\"2022-07-08 10:00\",\"updateAt\":null,\"tags\":[\"JavaScript\"]},\"rawContent\":\"$66\"},{\"slug\":\"2021-06-02-190000-1\",\"frontmatter\":{\"title\":\"react-tabsでタブを作成する【React】\",\"createAt\":\"2021-06-02 19:00\",\"updateAt\":null,\"tags\":[\"React\"]},\"rawContent\":\"\\n■はじめに\\n\\nここでは、「react-tabs」というライブラリを使用してタブを作成します。\\n\\n[こちら](https://reactcommunity.org/react-tabs/)の公式サイトに書かれているような物が作成できます。\\n\\n■手順\\n\\n以下のコマンドで「react-tabs」をインストールしてください。\\n\\n```\\nnpm install react-tabs\\n```\\n\\nソースコードの全量は以下（App.jsに上書きすれば動きます。）\\n\\n```js\\nimport React from 'react';\\nimport { Tab, Tabs, TabList, TabPanel } from 'react-tabs';\\nimport 'react-tabs/style/react-tabs.css';\\n\\nclass App extends React.Component{\\n  render()\\n  {\\n    var textData = \\\"\\\"\\n    function changeText(e) {\\n      textData = e.target.value\\n    }\\n    function btnClick() {\\n      alert(textData);\\n    }\\n    return (\\n\\n        \u003cTabs\u003e\\n            \u003cTabList\u003e\\n                \u003cTab\u003eTab1\u003c/Tab\u003e\\n                \u003cTab\u003eTab2\u003c/Tab\u003e\\n            \u003c/TabList\u003e\\n            \u003cTabPanel\u003e\\n\\n## タブ1\\n\\n            \u003c/TabPanel\u003e\\n            \u003cTabPanel\u003e\\n\\n## タブ2\\n\\n            \u003c/TabPanel\u003e\\n        \u003c/Tabs\u003e\\n\\n    );\\n  }\\n}\\n\\nexport default App;\\n```\\n\"},{\"slug\":\"2021-06-02-190000-10\",\"frontmatter\":{\"title\":\"ピュアなJavaScriptで指定のオブジェクトまでスクロールする方法【JavaScript】\",\"createAt\":\"2021-06-02 19:00\",\"updateAt\":null,\"tags\":[]},\"rawContent\":\"\\n## ■はじめに\\n\\nページ内リンク（スヌース）などで、たまに利用したのでその方法を記載します。\\n\\nReactを使用する場合など、jQueryなどが使用できない場合があると思いますので、ここではシンプルなJavaScriptで記載しています。\\n\\n## ■手順\\n\\nソースコードの全量は以下\\n\\n```js\\nvar targetElement = document.getElementById(\\\"ID名\\\");\\n\\nwindow.scroll({\\n  top: targetElement.getBoundingClientRect().top + window.pageYOffset,\\n  behavior: \\\"smooth\\\"\\n});\\n```\\n\\n1行目で、移動したいオブジェクトをID指定で取得する。\\n\\n「window.scroll」で取得したオブジェクトまでの距離を計測して移動する。\\n\"},{\"slug\":\"2021-06-02-190000-11\",\"frontmatter\":{\"title\":\"SQLite3でINSERT時にPrepared Statementを複数使用する方法【Swift】\",\"createAt\":\"2021-06-02 19:00\",\"updateAt\":null,\"tags\":[\"Swift\"]},\"rawContent\":\"$67\"},{\"slug\":\"2021-06-02-190000-12\",\"frontmatter\":{\"title\":\"axiosを使用してRestAPIを呼び出す方法【React】\",\"createAt\":\"2021-06-02 19:00\",\"updateAt\":null,\"tags\":[\"React\"]},\"rawContent\":\"$68\"},{\"slug\":\"2021-06-02-190000-13\",\"frontmatter\":{\"title\":\"ローカルストレージに値を保存する方法【React】\",\"createAt\":\"2021-06-02 19:00\",\"updateAt\":null,\"tags\":[\"React\"]},\"rawContent\":\"\\n## ■はじめに\\n\\nデータの保持方法は色々とありますが、ここでは「ローカルストレージ」の使用方法を記載します。\\n\\n## ■手順\\n\\nボタン押下時に、データの取得、設定、削除を行うサンプルの全量（App.js）\\n\\n※確認は、「F12」を押して、コンソールを開いて確認してください。\\n\\n```js\\nimport React from 'react';\\n\\nclass App extends React.Component{\\n  render()\\n  {\\n    function btnClick() {\\n      console.log(\\\"~~~~~データ設定前の値（null）~~~~~\\\");\\n      console.log(localStorage.getItem('aaaa'));\\n      console.log(\\\"~~~~~データ設定~~~~~\\\");\\n      localStorage.setItem('aaaa', 'サンプル');\\n      console.log(\\\"~~~~~データ設定後の値~~~~~\\\");\\n      console.log(localStorage.getItem('aaaa'));\\n      console.log(\\\"~~~~~データ削除~~~~~\\\");\\n      localStorage.removeItem('aaaa');\\n      console.log(\\\"~~~~~データ削除後の値（null）~~~~~\\\");\\n      console.log(localStorage.getItem('aaaa'));\\n    }\\n    return (\\n\\n        \u003cbutton onClick={btnClick}\u003eボタン\u003c/button\u003e\\n\\n    );\\n  }\\n}\\n\\nexport default App;\\n```\\n\\nデータは以下の方法で設定できます。\\n\\n```js\\nlocalStorage.setItem('key', 'value');\\n```\\n\\nデータは以下の方法で取得できます。\\n\\n```js\\nlocalStorage.getItem('key');\\n```\\n\\nデータは以下の方法で削除できます。\\n\\n```js\\nlocalStorage.removeItem('aaaa');\\n```\\n\"},{\"slug\":\"2021-06-02-190000-14\",\"frontmatter\":{\"title\":\"CORSエラーの回避方法【Node.js】\",\"createAt\":\"2021-06-02 19:00\",\"updateAt\":null,\"tags\":[\"Node.js\"]},\"rawContent\":\"$69\"},{\"slug\":\"2021-06-02-190000-15\",\"frontmatter\":{\"title\":\"キーチェーンの共通クラスの作成【Swift】\",\"createAt\":\"2021-06-02 19:00\",\"updateAt\":null,\"tags\":[\"Swift\"]},\"rawContent\":\"$6a\"},{\"slug\":\"2021-06-02-190000-16\",\"frontmatter\":{\"title\":\"クリップボードに文字列をコピーする方法\",\"createAt\":\"2021-06-02 19:00\",\"updateAt\":null,\"tags\":[\"JavaScript\"]},\"rawContent\":\"\\n## ■手順\\n\\n以下の関数の第一引数にコピーしたい文字列を渡すことでクリップボードへコピーできます。\\n\\n```js\\nfunction copyText(target){\\n  // コピー用の仮テキストエリア作成\\n  const txtarea = document.createElement(\\\"textarea\\\");\\n  txtarea.textContent = target;\\n\\n  // bodyに仮テキストエリアを設定\\n  const body = document.getElementsByTagName(\\\"body\\\")[0];\\n  body.appendChild(txtarea);\\n\\n  // コピー\\n  txtarea.select();\\n  document.execCommand('copy');\\n\\n  // コピー用の仮テキストエリア削除\\n  body.removeChild(txtarea);\\n}\\n```\\n\"},{\"slug\":\"2021-06-02-190000-17\",\"frontmatter\":{\"title\":\"Dockerコマンド集【Docker】\",\"createAt\":\"2021-06-02 19:00\",\"updateAt\":null,\"tags\":[\"Docker\"]},\"rawContent\":\"\\nコマンド説明docker ps -aコンテナを全て表示docker ps起動中のコンテナを全て表示docker rm [コンテナ名]コンテナの削除docker build -t [任意の名前] .イメージの作成（ビルド）docker run -it --name [任意のコンテナ名] -p 3000:3000 -v $PWD:/usr/src/app [イメージビルドで使用した名前]コンテナ起動docker image lsイメージ一覧確認docker image rm [イメージID]イメージの削除docker logs [コンテナ名]コンテナのログ確認docker start [コンテナ名]コンテナ起動docker stop [コンテナ名]コンテナ停止\\n\"},{\"slug\":\"2021-06-02-190000-18\",\"frontmatter\":{\"title\":\"Dockerの環境構築（mac）【Docker】\",\"createAt\":\"2021-06-02 19:00\",\"updateAt\":null,\"tags\":[\"Docker\"]},\"rawContent\":\"\\n## ■はじめに\\n\\n本記事は、macでの環境構築です。\\n\\ndockerに関する詳しい説明などは記載しておりません。\\n\\n## ■手順\\n\\n[こちら](https://hub.docker.com/signup)の公式サイトより、Docker Hubのアカウントを作成します。\\n\\n[こちら](https://hub.docker.com/editions/community/docker-ce-desktop-mac)の公式サイトで「Get Docker」を押下して、Dockerのdmgファイルをダウンロードします。\\n\\nダウンロードしたら、「dmg」を実行して、Docker Desktopアプリを取得します。\\n\\nDockerアプリを起動して、画面の指示通りに進めていくと、チュートリアルコンテナが起動されます。\\n\\nこれで、環境構築は終了です。\\n\\nターミナルで、以下を実行することで、Dockerがインストールされている事が確認できます。\\n\\n```\\ndocker --version\\n```\\n\"},{\"slug\":\"2021-06-02-190000-19\",\"frontmatter\":{\"title\":\"スプラッシュのViewを取得する方法【Swift】\",\"createAt\":\"2021-06-02 19:00\",\"updateAt\":null,\"tags\":[\"Swift\"]},\"rawContent\":\"$6b\"},{\"slug\":\"2021-06-02-190000-2\",\"frontmatter\":{\"title\":\"GASからSlackにメッセージを送信する方法【GAS】\",\"createAt\":\"2021-06-02 19:00\",\"updateAt\":null,\"tags\":[\"GoogleAppScript\"]},\"rawContent\":\"$6c\"},{\"slug\":\"2021-06-02-190000-20\",\"frontmatter\":{\"title\":\"curlコマンドでRestAPIを実行【curl】\",\"createAt\":\"2021-06-02 19:00\",\"updateAt\":null,\"tags\":[\"curl\"]},\"rawContent\":\"\\n## ■はじめに\\n\\nRestAPIのテストで、「Postman」などのツールが使えれば良いですが、ダウンロードが禁止だったりして使えない場合があります。\\n\\nここでは、curlコマンドを使用してRestAPIを実行する方法を記載します。\\n\\n## ■GET通信\\n\\n・[URL]の部分は書き換えてください。\\n\\n・クエリパラメータを使用する場合はURLの後ろに「?」をつけてからパラメータを記載してください。（URL?key=value）\\n\\n```\\ncurl -X GET [URL]\\n```\\n\\n## ■POST通信\\n\\n・[URL]の部分は書き換えてください。\\n\\n・[JSON形式でのBody]はJSONでBodyを書いてください。（{\\\"param\\\": \\\"value\\\"}）\\n\\n```\\ncurl -d '[JSON形式でのBody]' -H \\\"Content-Type: application/json\\\" -X POST [URL]\\n```\\n\\n## ■DELETE通信\\n\\n・[URL]の部分は書き換えてください。\\n\\n・[JSON形式でのBody]はJSONでBodyを書いてください。（{\\\"param\\\": \\\"value\\\"}）\\n\\n```\\ncurl -d '[JSON形式でのBody]' -H \\\"Content-Type: application/json\\\" -X DELETE [URL]\\n```\\n\\n## ■エラー\\n\\ncurlを実行した時に、以下のエラーがでたら、URLが間違えている可能性が高いので、その部分を確認してください。\\n\\n```\\ncurl: (52) Empty reply from server\\n```\\n\"},{\"slug\":\"2021-06-02-190000-21\",\"frontmatter\":{\"title\":\"react-router-domで、ボタン押下時に画面遷移させる方法【React】\",\"createAt\":\"2021-06-02 19:00\",\"updateAt\":null,\"tags\":[\"React\"]},\"rawContent\":\"\\n## ■はじめに\\n\\nここでは、ボタン押下時のイベントの中で、色々と処理をしてから画面遷移をしたい！という要望に対する対応方法です。\\n\\nログインなどで使用すると思います。\\n\\n## ■手順\\n\\n以下、App.jsのソースコードの全量です。\\n\\n```js\\nimport React from 'react';\\n\\nclass App extends React.Component{\\n  render()\\n  {\\n    const btnClick = () =\u003e {\\n      this.props.history.push('/url');\\n    }\\n    return (\\n\\n        \u003cbutton onClick={btnClick}\u003eボタン\u003c/button\u003e\\n\\n    );\\n  }\\n}\\n\\nexport default App;\\n```\\n\\n以下の処理で画面遷移することができます。\\n\\n```js\\nthis.props.history.push('/url');\\n```\\n\\nただ、注意するべきなのは、ボタン押下時の関数です。\\n\\n「function」をつけた関数だと、「this.props」が「undefind」でエラーが発生します。\\n\\n以下のようにアロー関数を使用する必要があるので、ご注意ください。（結構ハマりました。。。）\\n\\n```js\\nconst btnClick = () =\u003e {\\n}\\n```\\n\"},{\"slug\":\"2021-06-02-190000-22\",\"frontmatter\":{\"title\":\"クラッシュログで一部のログが復元されない場合【iOS】\",\"createAt\":\"2021-06-02 19:00\",\"updateAt\":null,\"tags\":[\"iOS\"]},\"rawContent\":\"\\n■はじめに\\ndSYMを使用してログを復元させた際に、一部のログで復元されないものがある。\\n\\nその部分的な復元方法を以下にまとめます。\\n\\n■手順\\n確認したいログのバージョンの「.ipa」を取得する。\\n\\n（リリースビル度の場合は、「Archive」画面で対象のビルドを右クリックして「Show in Finder」で取得できます。）\\n\\n取得したIPAを以下のコマンドで解答する。\\n\\nunzip [アプリ名].ipa\\n\\n- Lang Select -\\ndata-line属性値\\nファイル名\\n「Payload」ディレクトリ内のアプリが入っているディレクトリをカレントディレクトリにする。（cdを使用する）\\n\\n以下のコマンドで、ログの復元ができる。\\n\\n※「app_name」は「Payload」ディレクトリ内に入っているファイルの名前です。\\n\\n※「短いアドレス」「長いアドレス」はログファイルから取得してください。\\n\\natos -o [app_name].app/[app_name] -arch arm64 -l [短いアドレス] [長いアドレス]\\n\\n- Lang Select -\\ndata-line属性値\\nファイル名\\n\"},{\"slug\":\"2021-06-02-190000-23\",\"frontmatter\":{\"title\":\"定数クラスの作り方と呼び出し方【React】\",\"createAt\":\"2021-06-02 19:00\",\"updateAt\":null,\"tags\":[\"React\"]},\"rawContent\":\"\\n## ■はじめに\\n\\nソースコードで共通の値（APIのURLなど）を使用するのに定数クラスがあると非常に便利です。\\n\\n仮にAPIのURLが変わってもその定数クラスを書き換えれば終わります。\\n\\nここで、定数クラスの書き方を記載します。（他にも方法はあると思いますので、一例程度で。）\\n\\n## ■手順\\n\\n定数クラスを作成します。\\n\\n「Const.js」を作成し、以下のように記載してください。（定数は任意で追加、削除してください。）\\n\\n```js\\nclass Const {\\n    API_URL = 'http://hogehoge.com';\\n    SAMPLE = 'sample';\\n}\\n\\nexport default new Const();\\n```\\n\\n呼び出す際には以下のようにインポートします。（パスは環境に合わせてください）\\n\\n```js\\nimport Const from './Const';\\n```\\n\\nインポートすると以下のような感じで呼び出しができます。\\n\\n```js\\n// Const.API_URL\\nconsole.log(Const.API_URL);\\n// Const.SAMPLE\\nconsole.log(Const.SAMPLE);\\n```\\n\"},{\"slug\":\"2021-06-02-190000-24\",\"frontmatter\":{\"title\":\"GASのエラーの解決方法【GAS】\",\"createAt\":\"2021-06-02 19:00\",\"updateAt\":null,\"tags\":[\"GoogleAppScript\"]},\"rawContent\":\"\\n## ■あれもこれも Google ドライブで\\n\\nGASを開こうとした際に、以下のように「現在、ファイルを開くことができません。」と出る場合があります。\\n\\n![](https://developer-kuro.com/develop/wp-content/uploads/2020/06/スクリーンショット-2020-06-23-13.24.34-300x197.png)\\n\\nこれは、1つのブラウザで複数のGoogleDriveを開いているなどして、どのGoogleアカウントかが判別できないために発生している可能性があります。\\n\\n解決策としては、以下のいずれかです。\\n\\n・GoogleChrome（使用しているブラウザ）を再起動する。\\n\\n・プライベートブラウザで起動する。\\n\"},{\"slug\":\"2021-06-02-190000-25\",\"frontmatter\":{\"title\":\"react-router-domを使用したSPAの画面切り替え（遷移）の方法【React】\",\"createAt\":\"2021-06-02 19:00\",\"updateAt\":null,\"tags\":[\"React\"]},\"rawContent\":\"$6d\"},{\"slug\":\"2021-06-02-190000-26\",\"frontmatter\":{\"title\":\"Reactのプロジェクトをサーバー（さくらVPS）にデプロイする方法【React】\",\"createAt\":\"2021-06-02 19:00\",\"updateAt\":null,\"tags\":[\"React\"]},\"rawContent\":\"\\n## ■はじめに\\n\\n環境は以下の環境で書いています。\\n\\n・さくらVPS\\n\\n・Apache\\n\\n・SSL（Let's Encrypt）\\n\\n環境構築や、Reactプロジェクトの作成は記載しませんので、それぞれで用意しておいてください。\\n\\n## ■手順\\n\\n「cd」でReactのプロジェクトディレクトリをカレントディレクトリにする。\\n\\n以下のコマンドを実行して、Reactプロジェクトをビルドする。\\n\\n```\\nyarn build\\n```\\n\\nちなみに、以下でも可能です。（どちらも同じ挙動をします。）\\n\\n```\\nnpm run build\\n```\\n\\n上記のコマンドを実行することで、以下のディレクトリが作成されました。\\n\\n```\\n[プロジェクトディレクトリ]/build\\n```\\n\\n今回は、Apacheなので、上記の「build」ディレクトリ配下を全て以下にアップロードしてください。（サーバー）\\n\\n```\\n/var/www/html\\n```\\n\\nすると、「/var/www/html」の配下に、「index.html」などが格納されます。\\n\\nこれで、デプロイは完了です。\\n\\nブラウザで、以下のURLにアクセスして確認してください。\\n\\n```\\nhttps://[ドメインやIPアドレス]/\\n```\\n\\nちなみに、注意ですが、以下のアクセスでは画面は表示されません。\\n\\n```\\nhttps://[ドメインやIPアドレス]/index.html\\n```\\n\"},{\"slug\":\"2021-06-02-190000-27\",\"frontmatter\":{\"title\":\"HTML要素の取得方法、親子要素の取得方法【JavaScript】\",\"createAt\":\"2021-06-02 19:00\",\"updateAt\":null,\"tags\":[\"JavaScript\"]},\"rawContent\":\"\\n## ■はじめに\\n\\nピュアなJavaScriptを使用したHTMLの要素の取得方法と、親子要素の取得方法を記載します。\\n\\n## ■HTML要素の取得方法\\n\\n以下のHTMLを元に、要素を取得する方法を記載します。\\n\\n```html\\n\\n```\\n\\n取得方法は以下\\n\\n```js\\n//タグ指定での取得\\ndocument.getElementsByTagName('div');\\n\\n// id指定での取得\\ndocument.getElementById('sample');\\n\\n//class指定での取得\\ndocument.getElementsByClassName('test');\\n```\\n\\n## ■親子要素の取得方法\\n\\n以下のHTMLを元に、要素を取得する方法を記載します。\\n\\n```html\\n\\n# HELLO\\n\\n# HELLO ONE\\n\\n# HELLO TWO\\n\\n```\\n\\n取得方法は以下\\n\\n```js\\n//親要素\\nelement.parentNode;\\n\\n//子要素\\nelement.firstElementChild; //最初の子要素\\nelement.lastElementChild;  //最後の子要素\\nelement.children; //子要素リスト\\n\\n//１つ前の要素\\nelement.previousElementSibling;\\n\\n//１つ後の要素\\nelement.nextElementSibling;\\n```\\n\"},{\"slug\":\"2021-06-02-190000-28\",\"frontmatter\":{\"title\":\"ボタン押下時にテキストの値を取得する方法【React】\",\"createAt\":\"2021-06-02 19:00\",\"updateAt\":null,\"tags\":[\"React\"]},\"rawContent\":\"\\n## ■はじめに\\n\\nログインする際など、ボタンを押下した時に、テキストフィールドの値を取得したい場合などは多々あります。\\n\\nここでは、その方法に関して、一例を記載します。\\n\\n## ■手順\\n\\nまずは、App.jsのソースコードの全文を載せます。\\n\\n以下をコピペすると動きは確認できます。\\n\\n```js\\nimport React from 'react';\\n\\nclass App extends React.Component{\\n  render()\\n  {\\n    var textData = \\\"\\\"\\n    function changeText(e) {\\n      textData = e.target.value\\n    }\\n    function btnClick() {\\n      alert(textData);\\n    }\\n    return (\\n\\n# Hello World\\n\\n        \u003cinput type=\\\"text\\\" onChange={changeText}/\u003e\\n\\n        \u003cbutton onClick={btnClick}\u003eボタン\u003c/button\u003e\\n\\n    );\\n  }\\n}\\n\\nexport default App;\\n```\\n\\n細かく解説すると、以下のテキストフィールドの定義で「onChange」の定義を記載してます。\\n\\nこの「onChange」は値が書き換わった時（テキストフィールドに値を入力した時）に呼び出される関数です。\\n\\nここでは「changeText」関数を呼び出しています。\\n\\n```html\\n\u003cinput type=\\\"text\\\" onChange={changeText}/\u003e\\n```\\n\\n以下の関数でフィールド変数の「textData」にテキストの値を格納しています。\\n\\n第一引数の「e」は「event」の略で、自動でchangeTextの呼び出し元のオブジェクトが格納されます。\\n\\n```js\\nvar textData = \\\"\\\"\\nfunction changeText(e) {\\n  textData = e.target.value\\n}\\n```\\n\\n以下で、保存していたテキストフィールドの値をalertで表示させています。\\n\\n```js\\nfunction btnClick() {\\n  alert(textData);\\n}\\n```\\n\"},{\"slug\":\"2021-06-02-190000-29\",\"frontmatter\":{\"title\":\"Appleから送られたログの解析方法【iOS】\",\"createAt\":\"2021-06-02 19:00\",\"updateAt\":null,\"tags\":[\"iOS\"]},\"rawContent\":\"\\n## ■はじめに\\n\\nAppleからリジェクトの際などで送られてきたアプリのクラッシュログの解析方法をまとめます。（順次更新します。）\\n\\n[Apple公式のクラッシュログに関する説明はこちら](https://developer.apple.com/library/archive/technotes/tn2151/_index.html#//apple_ref/doc/uid/DTS40008184-CH1-SYMBOLICATION)\\n\\n## ■手順\\n\\nException Typeを確認して、どのような理由でのクラッシュか？を確認する。\\n\\nタイプ大まかな理由EXC_BREAKPOINTオプショナル型がnilだった、型変換に失敗したなどEXC_CRASH例外が発生したがキャッチされなかった（Objective-Cの場合？）\\n\\nTriggered by Threadを確認して、どのスレッドで起きているクラッシュか？を確認する。\\n\\n以下の記事を元に、クラッシュログを復元する。\\n\\n・開発環境以外のクラッシュログの確認方法【iOS】\\n\\n・クラッシュログで一部のログが復元されない場合【iOS】\\n\\nこれで、最低限解析できる状態になっていると思います。\\n\"},{\"slug\":\"2021-06-02-190000-3\",\"frontmatter\":{\"title\":\"配列と配列で重複チェック【JavaScript】\",\"createAt\":\"2021-06-02 19:00\",\"updateAt\":null,\"tags\":[\"JavaScript\"]},\"rawContent\":\"\\n## ■はじめに\\n\\n2つ以上の配列があり、A配列にB配列の要素が重複しているか？重複している場合はどれが重複しているのか？\\n\\nを調べる方法を記載します。\\n\\n「filter」関数を使用しての実装になります。\\n\\n## ■手順\\n\\nA配列にB配列の要素重複確認\\n\\n```js\\nconst arrayA = ['Apple', 'Google', 'Facebook', 'Zoom', 'Slack'];\\nconst arrayB = ['Apple', 'Facebook'];\\n\\nconst result = arrayA.filter(item =\u003e arrayB.includes(item));\\n\\nconsole.log(result); // [\\\"Apple\\\", \\\"Facebook\\\"]\\n```\\n\\nA配列にB配列とC配列の要素重複確認\\n\\n```js\\nconst arrayA = ['Apple', 'Google', 'Facebook', 'Zoom', 'Slack'];\\nconst arrayB = ['Apple', 'Facebook'];\\nconst arrayC = ['Google'];\\n\\nconst result = arrayA.filter(item =\u003e arrayB.includes(item) || arrayC.includes(item));\\n\\nconsole.log(result); // [\\\"Apple\\\", \\\"Google\\\", \\\"Facebook\\\"]\\n```\\n\"},{\"slug\":\"2021-06-02-190000-30\",\"frontmatter\":{\"title\":\"「年次自己分類レポート」の提出方法【iOS】\",\"createAt\":\"2021-06-02 19:00\",\"updateAt\":null,\"tags\":[\"iOS\"]},\"rawContent\":\"$6e\"},{\"slug\":\"2021-06-02-190000-31\",\"frontmatter\":{\"title\":\"Gitを都度パスワード入力しなくていいように設定【CentOS7】\",\"createAt\":\"2021-06-02 19:00\",\"updateAt\":null,\"tags\":[\"CentOS7\"]},\"rawContent\":\"\\n## ■はじめに\\n\\nCentOS7でGitをクローンした後、「git pull」などを行うと、都度パスワードを求められます。\\n\\nここでは、毎回パスワードを求められないように設定する方法を記載します。\\n\\n## ■手順\\n\\ncdコマンドで対象の「.git」が入っているディレクトリに移動します。\\n\\n以下のコマンドを実行します。\\n\\n```\\ngit config credential.helper store\\n```\\n\\nこれで、設定が終わりました。\\n\\nあとは、「git pull」などを実行してみてください。\\n\\n※1回目はパスワードを求められる場合がありますので、ご注意ください。\\n\"},{\"slug\":\"2021-06-02-190000-32\",\"frontmatter\":{\"title\":\"UserDefaultsの処理をまとめて保守性が高いUserDefaultsの書き方【Swift】\",\"createAt\":\"2021-06-02 19:00\",\"updateAt\":null,\"tags\":[\"Swift\"]},\"rawContent\":\"$6f\"},{\"slug\":\"2021-06-02-190000-33\",\"frontmatter\":{\"title\":\"AndroidのWebViewアプリを作成する方法【Kotlin】\",\"createAt\":\"2021-06-02 19:00\",\"updateAt\":null,\"tags\":[\"Kotlin\"]},\"rawContent\":\"$70\"},{\"slug\":\"2021-06-02-190000-34\",\"frontmatter\":{\"title\":\"MacでWebページをクライアントアプリのように利用する方法【nativefier】\",\"createAt\":\"2021-06-02 19:00\",\"updateAt\":null,\"tags\":[\"nativefier\"]},\"rawContent\":\"\\n## ■はじめに\\n\\n普段、ChromeなどのWebブラウザで検索を行ったりしますが、Webアプリケーションをクライアントアプリのように利用したいと思う時があります。\\n\\n私は、Backlogなどで感じました。\\n\\n（Slackのようにアプリが配布されていればありがたいのですが。。。）\\n\\nここでは、「nativefier」を使用してWebサイトをクライアントアプリ化する方法を記載します。\\n\\n## ■手順\\n\\nHomebrew、Node.jsの環境構築を行っておいてください。\\n\\nまだの方は「[こちら](https://developer-kuro.com/develop/2019/09/01/local-node-js-nodebrew/)」からインストールをお願い致します。\\n\\n以下のコマンド（ターミナルで実行）で「nativefier」をインストールします。\\n\\n```\\nnpm install -g nativefier\\n```\\n\\nGoogleなどでクライアントアプリのアイコンをダウンロードしてください。（ローカルで使用するだけです。）\\n\\n上記のアイコンのディレクトリに「cd」コマンドで移動します。\\n\\n以下のコマンドでアプリを生成します。（各パラメータは以下に従って修正してください。）\\n\\n- 「Backlog」にはアプリ名\\n- 「backlog.com」には該当のサイトのURL\\n- 「backlog_icon.png」には上記でダウンロードした画像ファイル名\\n\\n```\\nnativefier --name \\\"Backlog\\\" \\\"backlog.com\\\" --icon \\\"backlog_icon.png\\\"\\n```\\n\\n生成された「[アプリ名]-darwin-x64」のディレクトリ内部の「[アプリ名]」ファイルがクライアントアプリです。\\n\"},{\"slug\":\"2021-06-02-190000-35\",\"frontmatter\":{\"title\":\"さくらVPSのドメイン設定方法\",\"createAt\":\"2021-06-02 19:00\",\"updateAt\":null,\"tags\":[\"CentOS7\"]},\"rawContent\":\"$71\"},{\"slug\":\"2021-06-02-190000-36\",\"frontmatter\":{\"title\":\"jQueryでajaxを使用したRestAPIの実行方法【jQuery】\",\"createAt\":\"2021-06-02 19:00\",\"updateAt\":null,\"tags\":[\"jQuery\"]},\"rawContent\":\"\\n## ■はじめに\\n\\njQueryを使用して、RestAPIを実行する方法を記載します。\\n\\najaxを利用します。\\n\\n## ■手順\\n\\nまずは、ソースコードの全量は以下\\n\\n```html\\n\u003c!DOCTYPE html\u003e\\n\u003chtml\u003e\\n\u003chead\u003e\\n  \u003cmeta charset=\\\"UTF-8\\\" /\u003e\\n  \u003cscript src=\\\"https://code.jquery.com/jquery-3.4.1.min.js\\\"\u003e\u003c/script\u003e\\n  \u003cscript\u003e\\n    $(function() {\\n      $('#hello').click(function() {\\n        $.ajax({\\n            url: '[APIのURL]',\\n            type: '[通信（GET,POST,DELETE）]',\\n            dataType: 'json',\\n            data: {\\\"data\\\": \\\"a\\\", \\\"data2\\\": \\\"a\\\"},\\n            timeout: 3000,\\n        }).done(function(data) {\\n            console.log(data);\\n        }).fail(function(XMLHttpRequest, textStatus, errorThrown) {\\n            console.log(XMLHttpRequest);\\n            console.log(textStatus);\\n            console.log(errorThrown);\\n        });\\n      });\\n    });\\n  \u003c/script\u003e\\n\u003c/head\u003e\\n\\n\u003cbody\u003e\\n  \u003cinput type=\\\"button\\\" id=\\\"hello\\\" value=\\\"API実行\\\"\u003e\\n\u003c/body\u003e\\n\u003c/html\u003e\\n```\\n\\n以下に関しては、それぞれ適当な環境に切り替えてください。\\n\\n```\\n[APIのURL]\\n[通信（GET,POST,DELETE）]\\n{\\\"data\\\": \\\"a\\\", \\\"data2\\\": \\\"a\\\"}\\n```\\n\"},{\"slug\":\"2021-06-02-190000-37\",\"frontmatter\":{\"title\":\"開発環境以外のクラッシュログの確認方法【iOS】\",\"createAt\":\"2021-06-02 19:00\",\"updateAt\":null,\"tags\":[\"iOS\"]},\"rawContent\":\"$72\"},{\"slug\":\"2021-06-02-190000-38\",\"frontmatter\":{\"title\":\"「kCBAdvDataManufacturerData」の操作【Swift】\",\"createAt\":\"2021-06-02 19:00\",\"updateAt\":null,\"tags\":[\"Swift\"]},\"rawContent\":\"$73\"},{\"slug\":\"2021-06-02-190000-4\",\"frontmatter\":{\"title\":\"GASでGoogleカレンダーの予定を取得する方法【GAS】\",\"createAt\":\"2021-06-02 19:00\",\"updateAt\":null,\"tags\":[\"GoogleAppScript\"]},\"rawContent\":\"$74\"},{\"slug\":\"2021-06-02-190000-5\",\"frontmatter\":{\"title\":\"画面読み込み終了後に呼び出す処理【React】\",\"createAt\":\"2021-06-02 19:00\",\"updateAt\":null,\"tags\":[\"React\"]},\"rawContent\":\"\\n## ■はじめに\\n\\n「render」から呼び出すと複数回呼び出されますが、画面読み込み後に「1回だけ呼び出したい」場合の書き方を紹介します。\\n\\nAPIでデータを取得したい場合や、DOMを書き換えたい場合には、ここで処理する方が良いと思います。\\n\\n## ■手順\\n\\nソースコードの全量は以下\\n\\n```js\\nimport React from 'react';\\n\\nclass App extends React.Component{\\n  componentDidMount() {\\n    // 読み込み後処理\\n  }\\n  render()\\n  {\\n    return (\\n\\n# HELLO\\n\\n    );\\n  }\\n}\\n\\nexport default App;\\n```\\n\\n「componentDidMount」が画面読み込み後に呼び出される処理です。\\n\\nこのなかで、APIの実行などを行いましょう。\\n\"},{\"slug\":\"2021-06-02-190000-6\",\"frontmatter\":{\"title\":\"TextFieldに英数記号のキーボードのみを表示する方法【Swift】\",\"createAt\":\"2021-06-02 19:00\",\"updateAt\":null,\"tags\":[\"Swift\"]},\"rawContent\":\"$75\"},{\"slug\":\"2021-06-02-190000-7\",\"frontmatter\":{\"title\":\"GoogleAppScriptとは【GAS】\",\"createAt\":\"2021-06-02 19:00\",\"updateAt\":null,\"tags\":[\"GoogleAppScript\"]},\"rawContent\":\"\\n## ■Google App Scriptとは\\n\\nGoogleAppScript（GASと呼ばれます）とは、Googleが提供しているプログラミング言語です。\\n\\n基本的には、JavaScriptと同じ書き方ができます。\\n\\nGASの利点として、Googleが提供しているサービス（スプレットシートやGmailなど）との連携が容易に行える点です。\\n\\n（例えば、特定のタイトルのGmailが送られてきたら、スプレットシートに転記するなど）\\n\\n## ■GASを使用する前の準備\\n\\nGoogleアカウントを作成しておいてください。\\n\\nGoogleDriveで、色々作業をします。\\n\\n## ■GASの使い方\\n\\nGoogleDriveでスプレットシートを作成し、開きます。\\n\\n「ツール」の「スクリプトエディタ」を選択します。\\n\\n![](https://developer-kuro.com/develop/wp-content/uploads/2020/06/スクリーンショット-2020-06-23-13.16.43-300x168.png)\\n\\nこれで、GASを使用する準備ができました。\\n\\n面倒な環境構築などは一切必要ありません。\\n\\n## ■GASの関数実行\\n\\n「関数を選択」のプルダウンから、実行したい関数を選択し、「スタートボタン」を押下することで実行できます。\\n\\n![](https://developer-kuro.com/develop/wp-content/uploads/2020/06/スクリーンショット-2020-06-23-13.18.29-300x51.png)\\n\\nちなみに、初回実行時には、権限確認が表示されますので、画面の操作にしたがって許可してください。\\n\\n## ■コンソールログの出力\\n\\nGASのコンソールログは以下の書き方で出力できます。\\n\\n```js\\nLogger.log(\\\"コンソールログ\\\");\\n```\\n\\n出力したログは、「command + Enter」を押下するか、「表示」の「ログ」を選択する事で確認できます。\\n\"},{\"slug\":\"2021-06-02-190000-8\",\"frontmatter\":{\"title\":\"ID指定でオブジェクトを取得する方法【React】\",\"createAt\":\"2021-06-02 19:00\",\"updateAt\":null,\"tags\":[\"React\"]},\"rawContent\":\"\\n## ■はじめに\\n\\n以前、「ボタン押下時にテキストの値を取得する方法【React】」でテキストの変更時処理で変数に値を保持して操作していました。\\n\\nここでは、オブジェクトを取得することで、必要な時に最新の値が取得できるようになります。\\n\\nどちらが良いかは、好みな気もしますが、個人的には、こちらの方法の方がしっくりきます。\\n\\n## ■手順\\n\\nまずは、App.jsのソースコードの全量は以下\\n\\n```js\\nimport React from 'react';\\n\\nclass App extends React.Component{\\n  render()\\n  {\\n    function btnClick() {\\n      alert(document.getElementById('target').value);\\n    }\\n    return (\\n\\n# Hello World\\n\\n        \u003cinput type=\\\"text\\\" id=\\\"target\\\"/\u003e\\n\\n        \u003cbutton onClick={btnClick}\u003eボタン\u003c/button\u003e\\n\\n    );\\n  }\\n}\\n\\nexport default App;\\n```\\n\\n以下のようにすることで、IDを指定してオブジェクトを取得できます。\\n\\n```js\\ndocument.getElementById('[id名]')\\n```\\n\\n取得したオブジェクトの「.value」でテキストフィールドの場合は入力されている値を取得できます。\\n\"},{\"slug\":\"2021-06-02-190000-9\",\"frontmatter\":{\"title\":\"環境毎に分けて定数を定義する方法【React】\",\"createAt\":\"2021-06-02 19:00\",\"updateAt\":null,\"tags\":[\"React\"]},\"rawContent\":\"$76\"},{\"slug\":\"2021-06-02-190000\",\"frontmatter\":{\"title\":\"ReactをDockerで実行する方法【React/Docker】\",\"createAt\":\"2021-06-02 19:00\",\"updateAt\":null,\"tags\":[\"React\",\"Docker\"]},\"rawContent\":\"\\n## ■はじめに\\n\\nReactとDockerの環境構築は完了している前提で記載します。\\n\\nまだの方は、それぞれの環境構築を行ってからご覧ください。\\n\\n## ■手順\\n\\n以下のコマンドを実行し、Reactプロジェクトを作成します。\\n\\n```\\ncreate-react-app dockersample\\n```\\n\\n以下のコマンドを実行し、reactアプリが正常に動作することを確認します。\\n\\n```\\ncd dockersample\\nyarn start\\n```\\n\\n以下のコマンドで、Dockerfileを生成します。\\n\\n```\\nvi Dockerfile\\n```\\n\\n「Dockerfile」に以下を記載します。\\n\\n```\\n# ベースイメージの作成\\nFROM node:12.16.1\\n# コンテナ内で作業するディレクトリを指定\\nWORKDIR /usr/src/app\\n# package.jsonとyarn.lockを/usr/src/appにコピー\\nCOPY [\\\"package.json\\\", \\\"yarn.lock\\\", \\\"./\\\"]\\n# パッケージをインストール\\nRUN yarn install\\n# ファイルを全部作業用ディレクトリにコピー\\nCOPY . .\\n# コンテナを起動する際に実行されるコマンド\\nENTRYPOINT [ \\\"yarn\\\", \\\"start\\\" ]\\n```\\n\\n以下のコマンドで、イメージを生成する（ビルドする）\\n\\n```\\ndocker build -t sample .\\n```\\n\\n以下のコマンドでdockerを起動する\\n\\n```\\ndocker run -it --name sample -p 3000:3000 -v $PWD:/usr/src/app sample\\n```\\n\\nブラウザで「[http://localhost:3000/](http://localhost:3000/)」にアクセスして、Reactの画面が表示されればOK！\\n\"},{\"slug\":\"2021-05-22-133322\",\"frontmatter\":{\"title\":\"Node.js Expressのexpress-generatorで作成したプロジェクトをHTTPS起動する方法【Node.js】\",\"createAt\":\"2021-05-22 13:33\",\"updateAt\":null,\"tags\":[\"Node.js\"]},\"rawContent\":\"$77\"},{\"slug\":\"2021-05-22-133020\",\"frontmatter\":{\"title\":\"ボタン押下時処理【React】\",\"createAt\":\"2021-05-22 13:30\",\"updateAt\":null,\"tags\":[\"React\"]},\"rawContent\":\"\\n# ■はじめに\\n\\nReactで作成したHTMLのボタンを押下した際の処理の方法を記載します。\\n\\n# ■手順\\n\\n以下の記事を参考に、Reactのプロジェクトを作成してください。\\n\\nhttps://www.reigle.info/entry/2021/05/22/132803\\n\\nApp.jsを以下のように書き換えてください。（丸々コピペで大丈夫です）.\\n\\n```\\nimport React from 'react';\\n\\nclass App extends React.Component{\\n  render()\\n  {\\n    return (\\n\\n# Hello World\\n\\n        \u003cbutton onClick={this.btnClick}\u003eボタン\u003c/button\u003e\\n\\n    );\\n  }\\n\\n  btnClick() {\\n    alert(\\\"ボタン押下\\\");\\n  }\\n}\\n\\nexport default App;\\n```\\n\\n「button」のHTMLの「onClick」でボタン押下時に呼び出される関数を指定しています。\\n\"},{\"slug\":\"2021-05-22-132803\",\"frontmatter\":{\"title\":\"Reactの環境構築【React】\",\"createAt\":\"2021-05-22 13:28\",\"updateAt\":null,\"tags\":[\"React\"]},\"rawContent\":\"\\n# ■はじめに\\n\\n最近話題のReactの環境構築方法をまとめました。\\nJavaなど他の環境と違って、どハマりする事もないかと思いますが、一応残しておきます。\\n\\n# ■手順\\n\\n以下のサイトを参考に、Node.jsをインストールしてください。\\n\\nhttps://www.reigle.info/entry/2020/04/29/000000_2\\n\\n以下のコマンドを実行し、yarnをインストールしてください。\\n\\n```\\nnpm install --global yarn\\n```\\n\\n以下のコマンドでcreate-react-appをインストールします。\\n\\n```\\nyarn global add create-react-app\\n```\\n\\nこれで環境構築は終了です。\\n\\n# ■プロジェクトの作成\\n\\n以下のコマンドでプロジェクトを作成します。（「[app_name]」の部分は任意で変えてください）.\\n\\n```\\ncreate-react-app [app_name]\\n```\\n\\nプロジェクト作成後、カレントディレクトリにし、以下のコマンドでアプリを起動する。\\n\\n```\\nnpm start\\n```\\n\\n以下にアクセスして、Reactのサンプルが起動されていれば終了です。\\n\\n```\\nhttp://localhost:3000/\\n```\\n\"},{\"slug\":\"2021-05-22-132503\",\"frontmatter\":{\"title\":\"テーブルの1日前のデータを自動で削除する方法【MySQL】\",\"createAt\":\"2021-05-22 13:25\",\"updateAt\":null,\"tags\":[\"MySQL\"]},\"rawContent\":\"\\n# ■はじめに\\n\\nテーブルに登録しているデータで「TIMESTAMP」を使用することがあります。\\n\\nこの「TIMESTAMP」のデータを使用して、1日前のデータは削除するなど、一定期間で削除する方法を記載します。\\n\\nもちろん手動でSQLを流してもいいですが、手間なので、今回は自動で削除する方法を記載します。\\n\\n# ■手順\\n\\nまずは、以下で、24時間前以前のデータを取得することができます。\\n\\n```\\nSELECT * FROM [DB名].[テーブル名] WHERE TIMESTAMPDIFF(HOUR, [TIMESTAMPのカラム名], CURRENT_TIMESTAMP()) \u003e 24\\n```\\n\\n上記をちょっと解説すると、「TIMESTAMPDIFF」というSQLの関数を利用して時間の差分を出しています。\\n\\n第一引数に「HOUR」とすることで、時間の差分になります。\\n\\n※ちなみに、「MINUTE」なら分、「SECOND」なら秒です。\\n\\nでは、上記を元に、今度は削除のSQLを以下に記載します。\\n\\n```\\nDELETE FROM [DB名].[テーブル名] WHERE TIMESTAMPDIFF(HOUR, [TIMESTAMPのカラム名], CURRENT_TIMESTAMP()) \u003e 24\\n```\\n\\nこれで、削除のSQLは完成です。\\n\\nただ、今回は自動で削除したいので、cronを使用します。\\n\\n以下のコマンドでcronの編集モードにします。\\n\\n```\\ncrontab -e\\n```\\n\\n編集モードになったら、以下を記載します。\\n\\n```\\n0 0 * * * mysql --user=[ユーザー名] --password=[パスワード] --database=[DB名] --execute=\\\"DELETE FROM [DB名].[テーブル名] WHERE TIMESTAMPDIFF(HOUR, [TIMESTAMPのカラム名], CURRENT_TIMESTAMP()) \u003e 24\\\" \u003e /var/log/mysql-[DB名]-[カラム名]-delete.log 2\u003e\u00261\\n```\\n\\n上記は、毎日0時にDELETE文を実行するcronです。\\n\\n実行されたら、以下にログが出力されるので、確認してみてください。\\n\\n```\\n/var/log/mysql-[DB名]-[カラム名]-delete.log\\n```\\n\"},{\"slug\":\"2020-05-25-200000\",\"frontmatter\":{\"title\":\"MySQLのアカウント作成方法【MySQL】\",\"createAt\":\"2020-05-25 20:00\",\"updateAt\":null,\"tags\":[\"MySQL\"]},\"rawContent\":\"\\n# はじめに\\n\\nプロジェクト毎、環境毎などDBを分けることはよくあると思います。\\n\\n当然、全てrootで操作するとセキュリティ上よくないです。\\n\\nここでは、アカウントを作成し、DBの操作権限を付与する部分を記載します。\\n\\n# 手順\\n\\nrootユーザーでMySQLに入ってください。\\n\\n```\\nmysql -u root -p\\n```\\n\\n以下のSQL文を実行し、ユーザーを作成する。\\n\\n```\\nCREATE USER '[ユーザー名]'@'localhost' IDENTIFIED BY '[パスワード]';\\n```\\n\\n以下のSQL文を実行し、ユーザーが操作できるテーブルを追加する。\\n\\n```\\nGRANT ALL PRIVILEGES ON [db名].* TO '[ユーザー名]'@'localhost';\\n```\\n\\n以下のSQL文を実行し、変更を反映させる。\\n\\n```\\nFLUSH PRIVILEGES;\\n```\\n\\nこれで、アカウント作成とDBの設定ができました。\\n\\n# ユーザーのパスワードを変更する方法\\n\\n以下のSQL文を実行し、パスワードを変更し、変更を反映する。\\n\\n```\\nALTER USER '[ユーザー名]'@'localhost' IDENTIFIED WITH mysql_native_password BY '[パスワード]';\\nFLUSH PRIVILEGES;\\n```\\n\"},{\"slug\":\"2020-05-20-200000\",\"frontmatter\":{\"title\":\"Apatchの再起動時にSSLのパスワードを求められないようにする方法【CentOS7】\",\"createAt\":\"2020-05-20 20:00\",\"updateAt\":null,\"tags\":[\"CentOS7\"]},\"rawContent\":\"\\n# はじめに\\n\\nSSLを設定すると、Apatchの再起動の時に毎回SSLのパスワードを求められてしまいます。\\n\\nこれのせいで、Apachのデーモン化しても起動され無くなってしまいます。\\n\\nここでは、Apach再起動時のSSLのパスワードの入力をなくす方法を記載します。\\n\\n# 手順\\n\\n「cd」コマンドにて、SSLの「.key」ファイルがおいてある階層に移動します。\\n\\n```\\ncd [SSLのkeyがある階層]\\n```\\n\\n念のために、keyファイルをバックアップします。\\n\\n```\\ncp [file_name].key [file_name].key.bk\\n```\\n\\nkeyファイルからパスフレーズを外して上書き保存する。\\n\\n※上書き保存するために、以下のコマンドの[file_name]は同一の名前にしてください。\\n\\n```\\nopenssl rsa -in [file_name].key -out [file_name].key\\n```\\n\\nこれで、SSLのパスワードが外れて、Apach再起動時に毎回パスワードを求められることがなくなりました。\\n\\n本来であれば、`SSLPassPhraseDialog`などを使用するのが正しいのでしょうが、私の環境では使用できなかったため。。。\\n\"},{\"slug\":\"2020-05-13-200000\",\"frontmatter\":{\"title\":\"fastlaneでAppStoreへのリリースビルドの自動化\",\"createAt\":\"2020-05-13 20:00\",\"updateAt\":null,\"tags\":[\"fastlane\"]},\"rawContent\":\"$78\"},{\"slug\":\"2020-05-12-200000\",\"frontmatter\":{\"title\":\"fastlaneのインストール\",\"createAt\":\"2020-05-12 20:00\",\"updateAt\":null,\"tags\":[\"fastlane\"]},\"rawContent\":\"\\n# ■はじめに\\n\\niOSアプリの自動リリースなどで、fastlaneを使用することがある。\\n\\nここでは、まずはfastlaneのインストール方法を記載します。\\n\\n別記事で、AppStoreへのリリースのlaneの記事を記載します。\\n\\n# ■手順\\n\\n以下のコマンドでXcodeのCommand Line Toolsをインストールします。\\n\\n```\\nxcode-select --install\\n```\\n\\n以下のコマンドでfastlaneをインストールします。\\n\\n```\\ngem install fastlane\\n```\\n\\nもし、エラーが出た場合には以下のコマンドを実行してみてください。\\n\\n```\\nsudo gem install fastlane --verbose\\n```\\n\\nこれで、fastlaneのインストールは完了です。\\n\\n以下のコマンドで、fastlaneのバージョンが返ってくることを確認してください。\\n\\n```\\nfastlane -v\\n```\\n\"},{\"slug\":\"2020-05-11-200000\",\"frontmatter\":{\"title\":\"rbenvでRubyのバージョン指定インストール、切り替え【Ruby】\",\"createAt\":\"2020-05-11 20:00\",\"updateAt\":null,\"tags\":[\"Ruby\"]},\"rawContent\":\"$79\"},{\"slug\":\"2020-05-10-000000-1\",\"frontmatter\":{\"title\":\"BitbucketにPushされた時に自動でサーバーにデプロイする方法【Node.js】\",\"createAt\":\"2020-05-10 00:00\",\"updateAt\":null,\"tags\":[\"Node.js\"]},\"rawContent\":\"$7a\"},{\"slug\":\"2020-05-10-000000-2\",\"frontmatter\":{\"title\":\"cronに環境変数を設定する方法【CentOS7】\",\"createAt\":\"2020-05-10 00:00\",\"updateAt\":null,\"tags\":[\"CentOS7\"]},\"rawContent\":\"\\n## ■はじめに\\n\\ncronを使用していると、〜comannd Not foundなどをよく見かけます。\\n\\nこれは、cronにPATHが通っていないために起きる問題です。\\n\\nここでは、cronに環境変数を設定する方法を記載します。\\n\\n## ■手順\\n\\nCentOSにSSHで接続する。\\n\\nrootユーザーに切り替える（rootでSSH接続した場合は不要）\\n\\n以下のコマンドを実行し、環境PATHを取得する。（表示されたパスをコピーするなりして保存しておいてください）\\n\\n```\\necho $PATH\\n```\\n\\n以下のコマンドを実行し、cronの設定を開く\\n\\n```\\ncrontab -u root -e\\n```\\n\\n一番上の行に以下を追加する。（cronは環境変数がほとんど設定されていないので。）\\n\\n```\\nPATH=「echo $PATH　で取得した値」\\n```\\n\"},{\"slug\":\"2020-05-10-000000-3\",\"frontmatter\":{\"title\":\"cronでサーバーを毎日指定時間に再起動させる方法【CentOS7】\",\"createAt\":\"2020-05-10 00:00\",\"updateAt\":null,\"tags\":[\"CentOS7\"]},\"rawContent\":\"\\n## ■はじめに\\n\\nサーバーを定期的に再起動させて、予期せぬ不具合を防ぎたいと思いますよね。\\n\\nでも、いちいちVPNのコンソールなどで再起動するのはめんどくさい。。。\\n\\nそんな時に便利なのが、cronです。\\n\\nここでは、cronの設定を説明します。\\n\\ncronの環境変数の設定に関しては「[こちらの記事](https://developer-kuro.com/develop/?p=1212)」をご確認ください。\\n\\n## ■手順\\n\\nCentOSにSSHで接続する。\\n\\nrootユーザーに切り替える（rootでSSH接続した場合は不要）\\n\\n以下のコマンドを実行し、cronの設定を開く\\n\\n```\\ncrontab -u root -e\\n```\\n\\n上記の環境変数設定のあとで、以下のように追加すると、サーバー再起動ができます。（以下は、毎日深夜0時0分にサーバー再起動する処理です。）\\n\\n```\\n0 0 * * * reboot\\n```\\n\\n以下がcronの全量です。\\n\\n```\\n0 0 * * * reboot\\n```\\n\"},{\"slug\":\"2020-05-10-000000-4\",\"frontmatter\":{\"title\":\"無料のSSL証明書を設定する方法【CentOS7】\",\"createAt\":\"2020-05-10 00:00\",\"updateAt\":null,\"tags\":[\"CentOS7\"]},\"rawContent\":\"$7b\"},{\"slug\":\"2020-05-10-000000\",\"frontmatter\":{\"title\":\"Gitを都度パスワード入力しなくていいように設定【CentOS7】\",\"createAt\":\"2020-05-10 00:00\",\"updateAt\":null,\"tags\":[\"CentOS7\"]},\"rawContent\":\"\\n# ■はじめに\\n\\nCentOS7でGitをクローンした後、「git pull」などを行うと、都度パスワードを求められます。\\n\\nここでは、毎回パスワードを求められないように設定する方法を記載します。\\n\\n# ■手順\\n\\ncdコマンドで対象の「.git」が入っているディレクトリに移動します。\\n\\n以下のコマンドを実行します。\\n\\n```\\ngit config credential.helper store\\n```\\n\\nこれで、設定が終わりました。\\n\\nあとは、「git pull」などを実行してみてください。\\n\\n※1回目はパスワードを求められる場合がありますので、ご注意ください。\\n\"},{\"slug\":\"2020-05-09-000000-1\",\"frontmatter\":{\"title\":\"開発（プログラム）に便利なWEBツール一覧\",\"createAt\":\"2020-05-09 00:00\",\"updateAt\":null,\"tags\":[]},\"rawContent\":\"$7c\"},{\"slug\":\"2020-05-09-000000-2\",\"frontmatter\":{\"title\":\"ライブラリを使用せずにJWT（JSON Web Token）をデコードする方法【Swift】\",\"createAt\":\"2020-05-09 00:00\",\"updateAt\":null,\"tags\":[\"Swift\"]},\"rawContent\":\"$7d\"},{\"slug\":\"2020-05-09-000000-3\",\"frontmatter\":{\"title\":\"Xcodeの便利なショートカット一覧【Xcode】\",\"createAt\":\"2020-05-09 00:00\",\"updateAt\":null,\"tags\":[]},\"rawContent\":\"\\nXcodeの便利なショートカット一覧\\n\\nショートカット概要command + shift + oクラス,メソッド,変数名検索command + shift + f全文検索command + shift + j現在開いているファイルをプロジェクトナビゲーターでフォーカスcommand + tタブの追加command + shift + ] or タブの移動command + /[コメントアウトcommand + option + /docコメント生成command + r実行command + bビルドcommand + shift + kクリーンcommand + shift + option + kビルドディレクトリのクリーン（Clean Build Folder）ctrl + .入力補完command + ctrl + j定義にジャンプcommand + ctrl + e選択している変数名などの一括置換\\n\"},{\"slug\":\"2020-05-09-000000-4\",\"frontmatter\":{\"title\":\"APIKitのサンプル（郵便番号検索）【Swift】\",\"createAt\":\"2020-05-09 00:00\",\"updateAt\":null,\"tags\":[\"Swift\"]},\"rawContent\":\"$7e\"},{\"slug\":\"2020-05-09-000000\",\"frontmatter\":{\"title\":\"Node.jsでJWT（JSON Web Token）を生成/デコードする方法【Node.js】\",\"createAt\":\"2020-05-09 00:00\",\"updateAt\":null,\"tags\":[\"Node.js\"]},\"rawContent\":\"$7f\"},{\"slug\":\"2020-05-08-000000-1\",\"frontmatter\":{\"title\":\"OpenCVを使用して画像を分類する方法【Python】\",\"createAt\":\"2020-05-08 00:00\",\"updateAt\":null,\"tags\":[\"Python\"]},\"rawContent\":\"$80\"},{\"slug\":\"2020-05-08-000000-2\",\"frontmatter\":{\"title\":\"Sign In with Appleを実装する方法【Swift】\",\"createAt\":\"2020-05-08 00:00\",\"updateAt\":null,\"tags\":[\"Swift\"]},\"rawContent\":\"$81\"},{\"slug\":\"2020-05-08-000000-3\",\"frontmatter\":{\"title\":\"機械学習で使用する画像を集める方法【Python】【google-images-download】\",\"createAt\":\"2020-05-08 00:00\",\"updateAt\":null,\"tags\":[\"Python\"]},\"rawContent\":\"$82\"},{\"slug\":\"2020-05-08-000000-4\",\"frontmatter\":{\"title\":\"KeyChainの操作（CRUD）の方法【Swift】\",\"createAt\":\"2020-05-08 00:00\",\"updateAt\":null,\"tags\":[\"Swift\"]},\"rawContent\":\"$83\"},{\"slug\":\"2020-05-08-000000\",\"frontmatter\":{\"title\":\"UIButtonの画像のタップ領域を設定する方法【Swift】\",\"createAt\":\"2020-05-08 00:00\",\"updateAt\":null,\"tags\":[\"Swift\"]},\"rawContent\":\"\\n## ■はじめに\\n\\nUIButtonに画像を設定した際に、その画像の領域以上にタップ領域を設定したい場合があります。\\n\\n（画像を小さくするけど、タップはしやすいようにしたい場合など）\\n\\nその際に、タップ領域を増やす方法を記載します。\\n\\n## ■手順\\n\\n以下のソースでタップ領域が増やせます。（画像名やタップ時のセレクタなどは書き換えてください。）\\n\\n```\\n// 増やしたいタップ領域（マイナスの場合はボタンサイズより外側にタップ領域を増やす）\\nlet tapMargin: CGFloat = 5\\n\\nlet btn = UIButton()\\nbtn.frame = CGRect(x: 0, y: 0, width: 30, height: 30)\\nbtn.imageEdgeInsets = UIEdgeInsets(top: tapMargin, left: tapMargin, bottom: tapMargin, right: tapMargin)\\nbtn.setImage(UIImage(named: \\\"画像名\\\"), for: .normal)\\nbtn.addTarget(vc, action: #selector(タップ処理), for: .touchUpInside)\\nself.view.addSubview(btn)\\n```\\n\\n上記の「tapMargin」が正の数の場合には、ボタンのサイズの内側にマージンが取られます。\\n\\nそのため、上記の例だと、画像サイズはWidth:20(30 - tapMargin * 2　※左右にマージンをとるため、＊2), Height:20(30 - tapMargin * 2　※上下にマージンをとるため、＊2)となります。\\n\\nちなみに、「tapMargin」が負の数の場合には、ボタンのサイズの外側にマージンが取られます。\\n\"},{\"slug\":\"2020-05-07-000000-1\",\"frontmatter\":{\"title\":\"Python,OpenCVの環境構築（Mac）【Python】\",\"createAt\":\"2020-05-07 00:00\",\"updateAt\":null,\"tags\":[\"Python\"]},\"rawContent\":\"$84\"},{\"slug\":\"2020-05-07-000000-2\",\"frontmatter\":{\"title\":\"TableViewの余分なセルの線を消す方法【Swift】\",\"createAt\":\"2020-05-07 00:00\",\"updateAt\":null,\"tags\":[\"Swift\"]},\"rawContent\":\"\\n## ■はじめに\\n\\nTableViewの余分なセルに線画ついていると、ユーザーがタップしてしまう可能性があります。\\n\\nUXを改善するために、余分なセルの線を消してあげれば、誤認がすくなくなります。\\n\\n## ■手順\\n\\n以下の処理を記載することで、TabelViewのあまりのセルの線を消すことができます。\\n\\n以下の「tableView」には、Outlet接続したTableViewの変数を記載してください。\\n\\n```swift\\ntableView.tableFooterView = UIView(frame: .zero)\\n```\\n\"},{\"slug\":\"2020-05-07-000000-3\",\"frontmatter\":{\"title\":\"子Viewを全て削除する方法【Swift】\",\"createAt\":\"2020-05-07 00:00\",\"updateAt\":null,\"tags\":[\"Swift\"]},\"rawContent\":\"\\n## ■はじめに\\n\\nViewをリフレッシュしたい場合など、子要素のViewを全て削除したい場合があります。\\n\\nここでは、その子Viewを全て削除する方法を記載します。\\n\\n## ■手順\\n\\n以下に、子Viewを削除する関数を記載します。\\n\\n```swift\\n/// 子Viewを全て削除する処理\\n/// - Parameter parentView: view description\\nfunc removeAllSubviews(view: UIView) {\\n    let subviews = view.subviews\\n    for subview in subviews {\\n        subview.removeFromSuperview()\\n    }\\n}\\n```\\n\\n## ■解説\\n\\n親から子を全て削除する方法は無いようなので、まずは、子のViewを全て取得するために、以下の処理を行います。\\n\\n```swift\\nlet subviews = view.subviews\\n```\\n\\nあとは、for文で回して「removeFromSuperview」関数で削除していけば、完成です。\\n\"},{\"slug\":\"2020-05-07-000000-4\",\"frontmatter\":{\"title\":\"OpenCVを使用して、データセットを作成する方法【Python】\",\"createAt\":\"2020-05-07 00:00\",\"updateAt\":null,\"tags\":[\"Python\"]},\"rawContent\":\"$85\"},{\"slug\":\"2020-05-07-000000\",\"frontmatter\":{\"title\":\"暗号化と複合化の方法【Swift】\",\"createAt\":\"2020-05-07 00:00\",\"updateAt\":null,\"tags\":[\"Swift\"]},\"rawContent\":\"$86\"},{\"slug\":\"2020-05-06-000000-1\",\"frontmatter\":{\"title\":\"httpにアクセスした際にhttpsを表示させる方法【CentOS7】\",\"createAt\":\"2020-05-06 00:00\",\"updateAt\":null,\"tags\":[\"CentOS7\"]},\"rawContent\":\"\\n## ■はじめに\\n\\nhttpにアクセスした際にhttpsで表示させる方法を記載します。\\n\\n「.htaccess」を使用するので、「.htaccess」が使用できるようにしておいてください。（まだの人は、[こちら](https://developer-kuro.com/develop/2020/01/08/httpにアクセスした際にhttpsを表示させる方法【centos7】/)から）\\n\\n## ■手順\\n\\n「.htaccess」に以下を記載することで、httpにアクセスした際にhttpsで表示できます。\\n\\n```\\n\u003cIfModule mod_rewrite.c\u003e\\n  RewriteEngine On\\n  RewriteCond %{HTTPS} off\\n  RewriteRule ^(.*)$ https://%{HTTP_HOST}%{REQUEST_URI} [R,L]\\n\u003c/IfModule\u003e\\n```\\n\\n試しに、httpでアクセスしてみてください。\\n\"},{\"slug\":\"2020-05-06-000000-2\",\"frontmatter\":{\"title\":\"リリースされているアプリのバージョンが取得できない場合【Apple】\",\"createAt\":\"2020-05-06 00:00\",\"updateAt\":null,\"tags\":[]},\"rawContent\":\"\\n## ■問題\\n\\n強制アップデートなどで、「`https://itunes.apple.com/lookup?id=[AppID]`」のAPIを使用してバージョンを取得することがあります。\\n\\nしかし、実際にAPIを実行しても以下のレスポンスが返ってきました。\\n\\n```\\n{\\n \\\"resultCount\\\":0,\\n \\\"results\\\": []\\n}\\n```\\n\\n## ■原因\\n\\nアプリのリリース国に「アメリカ」が含まれていない場合に、上記のレスポンスが返ってくるようです。\\n\\n対応としては、APIのURLに国の情報を入れることで正しく返ってきます。\\n\\n```\\n【URL】\\nhttps://itunes.apple.com/[国コード]/lookup?id=[AppID]\\n\\n【例（日本の場合）】\\nhttps://itunes.apple.com/jp/lookup?id=[AppID]\\n```\\n\"},{\"slug\":\"2020-05-06-000000-3\",\"frontmatter\":{\"title\":\"画像ボタンのタップ領域を増やす方法【Swift】\",\"createAt\":\"2020-05-06 00:00\",\"updateAt\":null,\"tags\":[\"Swift\"]},\"rawContent\":\"\\n## ■はじめに\\n\\n「デザインでは、小さいボタンがいいけど、タップし辛い！」ということがあります。\\n\\nその際に、ボタンのタップ領域を増やしたいので、ここではその方法を記載します。\\n\\nちなみに、「setImage」関数を使用して画像を設定したボタンを前提にしています。\\n\\n## ■手順\\n\\nまずは、ソースコードの全量です。\\n\\n```swift\\nlet btn = UIButton()\\nbtn.frame = CGRect(x: 0, y: 0, width: 60, height: 30)\\nbtn.setImage(UIImage(named: \\\"画像名\\\"), for: .normal)\\nbtn.imageEdgeInsets = UIEdgeInsets(top: 0, left: 0, bottom: 0, right: 45)\\nself.view.addSubview(btn)\\n```\\n\\n## ■解説\\n\\n以下のソースで、ボタンのサイズを指定します。\\n\\nこのときに、幅と高さは「画像サイズ + 余白サイズ」で計算してください。（今回は画像の右に余白をつける想定です。）\\n\\n```swift\\nbtn.frame = CGRect(x: 0, y: 0, width: 60, height: 30)\\n```\\n\\n以下のソースで、ボタンの画像の右に余白を設定します。\\n\\n先ほどの「画像サイズ + 余白サイズ」で、右に「45」の余白を設定したので、画像のサイズとしては、「W：15, H：30」となります。\\n\\n```swift\\nbtn.imageEdgeInsets = UIEdgeInsets(top: 0, left: 0, bottom: 0, right: 45)\\n```\\n\"},{\"slug\":\"2020-05-06-000000-4\",\"frontmatter\":{\"title\":\"ビルドタイプに応じた処理【Swift】\",\"createAt\":\"2020-05-06 00:00\",\"updateAt\":null,\"tags\":[\"Swift\"]},\"rawContent\":\"\\n## ■はじめに\\n\\nAPIの向き先を、開発環境と本番環境で分ける時など、ビルドタイプに応じて処理を変えたい場合があります。\\n\\nここでは、そのビルドタイプ（Debugとそれ以外）に応じた処理分けの方法をまとめます。\\n\\n## ■手順\\n\\n以下のソースコードでDebug環境とそれ以外（Release）を分けることができます。\\n\\n```swift\\n#if DEBUG\\n    print(\\\"開発環境\\\")\\n#else\\n    print(\\\"本番環境\\\")\\n#endif\\n```\\n\\n## ■確認方法\\n\\n上記の手順で、環境分けができます。\\n\\n以下は、実際にリリースせずに、Release環境の確認する方法を記載します。\\n\\n【手順】\\n\\nXcodeのアプリ名を押下する。\\n\\n![](https://developer-kuro.com/develop/wp-content/uploads/2020/01/スクリーンショット-2020-01-10-10.57.31-1-300x30.png)\\n\\n「Edit Scheme...」を押下する。\\n\\n![](https://developer-kuro.com/develop/wp-content/uploads/2020/01/スクリーンショット-2020-01-10-10.57.39.png)\\n\\n「Run」メニューの「Build Configuration」を「Release」に変更する。\\n\\n![](https://developer-kuro.com/develop/wp-content/uploads/2020/01/スクリーンショット-2020-01-10-10.57.49-300x167.png)\\n\\nこれで、いつも通りビルドすると本番環境としてビルドすることができます。\\n\"},{\"slug\":\"2020-05-06-000000\",\"frontmatter\":{\"title\":\"findコマンドでディレクトリ配下のファイル名を検索する方法【CentOS7】\",\"createAt\":\"2020-05-06 00:00\",\"updateAt\":null,\"tags\":[\"CentOS7\"]},\"rawContent\":\"\\n## ■はじめに\\n\\nサーバーで、指定のディレクトリ配下の「〜」を含むファイル名を検索したい場合があります。\\n\\nここでは、findコマンドを使用して、上記の要件を満たすコマンドを記載します。\\n\\n## ■手順\\n\\n以下のコマンドがディレクトリ配下のファイル名検索です。\\n\\n[ファイル名]の部分に任意のファイル名を記載してください。\\n\\n```bash\\n【コマンド】\\n$ find ./ -name \\\"*[ファイル名]*\\\" -type f\\n\\n【例】\\n$ find ./ -name \\\"*index*\\\" -type f\\n```\\n\"},{\"slug\":\"2020-05-05-000000-1\",\"frontmatter\":{\"title\":\"LicensePlistライブラリを使用したライセンスの表示【Swift】\",\"createAt\":\"2020-05-05 00:00\",\"updateAt\":null,\"tags\":[\"Swift\"]},\"rawContent\":\"$87\"},{\"slug\":\"2020-05-05-000000-2\",\"frontmatter\":{\"title\":\"アプリのAppStoreを表示する方法【Swift】\",\"createAt\":\"2020-05-05 00:00\",\"updateAt\":null,\"tags\":[\"Swift\"]},\"rawContent\":\"\\n## ■はじめに\\n\\nアプリの強制アップデートを行わせたい場合など、自分のアプリのAppStoreを表示したいことは、ときどきあります。\\n\\nここでは、指定のアプリのAppStoreを表示する方法を記載します。\\n\\n※表示したいアプリはリリースされている必要があります。\\n\\n## ■手順\\n\\nまずは、自分のアプリのAppIdを取得します。\\n\\n※iTunes Connectで確認できるので、確認してください。\\n\\n以下のソースを記載し、引数に取得したAppIdを渡すことで、AppStoreが表示されます。\\n\\n```swift\\nfunc openAppStore(appId: String) {\\n    DispatchQueue.main.async {\\n\\n        guard let url: URL = URL(string: \\\"https://itunes.apple.com/jp/app/apple-store/id\\\" + appId) else { return }\\n\\n        // URLを開けるかをチェックする\\n        if !UIApplication.shared.canOpenURL(url) {\\n            return\\n        }\\n        // URLを開く\\n        UIApplication.shared.open(url, options: [:]) { success in\\n            if success {\\n                print(\\\"successful\\\")\\n            }\\n        }\\n    }\\n}\\n```\\n\"},{\"slug\":\"2020-05-05-000000-3\",\"frontmatter\":{\"title\":\"アプリバージョンの取得を行う方法（強制アップデート）【Swift】\",\"createAt\":\"2020-05-05 00:00\",\"updateAt\":null,\"tags\":[\"Swift\"]},\"rawContent\":\"$88\"},{\"slug\":\"2020-05-05-000000-4\",\"frontmatter\":{\"title\":\"PHPでFirebase Cloud Messaging（FCM）のPush通知を送信する方法【Node.js】\",\"createAt\":\"2020-05-05 00:00\",\"updateAt\":null,\"tags\":[\"Node.js\"]},\"rawContent\":\"\\n## ■はじめに\\n\\nFirebase Cloud Messaging（以降、FCM）でPush通知を送信するため、「Server Key」と、送信先の「Device Token」が取得できている前提として本手順を記載します。\\n\\n## ■手順\\n\\n以下に、PHPでFCMのプッシュ通知を送信する処理を記載します。\\n\\n```\\n\u003c?php\\n\\n$api_key = \\\"{サーバーキー}\\\";\\n$base_url = \\\"https://fcm.googleapis.com/fcm/send\\\";\\n\\n$data = array(\\n    \\\"to\\\"           =\u003e $_POST['token']\\n    , \\\"priority\\\"     =\u003e \\\"high\\\"\\n    , \\\"notification\\\" =\u003e array(\\n        \\\"title\\\" =\u003e $_POST['title']\\n        , \\\"body\\\"  =\u003e $_POST['body']\\n        , \\\"sound\\\" =\u003e \\\"default\\\"\\n        , \\\"badge\\\" =\u003e $_POST['badge']\\n    )\\n);\\n$header = array(\\n    \\\"Content-Type:application/json\\\"\\n    , \\\"Authorization:key=\\\".$api_key\\n);\\n$context = stream_context_create(array(\\n    \\\"http\\\" =\u003e array(\\n        'method' =\u003e 'POST'\\n        , 'header' =\u003e implode(\\\"\\\\r\\\\n\\\", $header)\\n        , 'content'=\u003e json_encode($data)\\n    )\\n));\\nfile_get_contents($base_url, false, $context);\\n\\necho \\\"access\\\";\\n?\u003e\\n```\\n\"},{\"slug\":\"2020-05-05-000000\",\"frontmatter\":{\"title\":\"「.htaccess」の有効化する方法【CentOS7】\",\"createAt\":\"2020-05-05 00:00\",\"updateAt\":null,\"tags\":[\"CentOS7\"]},\"rawContent\":\"\\n## ■はじめに\\n\\nApacheを使用していると、様々な場面で「.htaccess」を利用したい場面がでてきます。\\n\\nここでは、「.htaccess」を使用するまでの手順を記載します。\\n\\n※サーバーの用意や、Apacheのインストールは行っている事を前提とします。\\n\\n## ■手順\\n\\n以下のコマンドを実行し、「httpd.conf」を編集する。\\n\\n```bash\\n$ vi /etc/httpd/conf/httpd.conf\\n```\\n\\n以下のコマンドを実行し、「AllowOverride」を探します。（100行目付近にあります。）\\n\\n```bash\\n$ /AllowOverride\\n```\\n\\n「None」を「All」に変更します。\\n\\n【変更前】\\n\\n```\\n\u003cDirectory /\u003e\\n    AllowOverride None\\n    Require all denied\\n\u003c/Directory\u003e\\n```\\n\\n【変更後】\\n\\n```\\n\u003cDirectory /\u003e\\n    AllowOverride All\\n    Require all denied\\n\u003c/Directory\u003e\\n```\\n\\nこれで、「.htaccess」の有効化は完了しました。\\n\\n「/var/www/html」配下に「.htaccess」を作成して利用してください。\\n\\n※ルートのパスを変更している方は、ルートのパスに作成してください。\\n\\n## ■動作確認\\n\\n「.htaccess」が本当に利用できるか確認したい場合は、以下を記載してください。\\n\\n```\\nRedirect /google/ http://www.google.com\\n```\\n\\nこれで、以下のURLにアクセスする事で、Googleのサイトに遷移すれば、「.htaccess」が正常に動作していることが確認できます。\\n\\n```\\n【URL】\\nhttp://[ドメイン名]/google/\\n\\n【例】\\nhttp://example.com/google/\\n```\\n\"},{\"slug\":\"2020-05-04-000000-1\",\"frontmatter\":{\"title\":\"アプリバージョンの取得を行う方法（強制アップデート）【Objective-C】\",\"createAt\":\"2020-05-04 00:00\",\"updateAt\":null,\"tags\":[\"Objective-C\"]},\"rawContent\":\"$89\"},{\"slug\":\"2020-05-04-000000-2\",\"frontmatter\":{\"title\":\"NSMutableArrayのデータをカンマ区切りの文字列に変換する方法【Swift】\",\"createAt\":\"2020-05-04 00:00\",\"updateAt\":null,\"tags\":[\"Swift\"]},\"rawContent\":\"\\n## ■はじめに\\n\\nNSMutableArrayの値をカンマ区切りの文字列に変換する方法を記載します。\\n\\nCSVでデータを保持したい場合などに利用することがあるかと思います。\\n\\n## ■手順\\n\\nまずは、NSMutableArray型の変数を作成し、適当なデータを格納します。\\n\\n```swift\\nvar array = NSMutableArray()\\narray.add(\\\"aaaaa\\\")\\narray.add(\\\"bbbbb\\\")\\n```\\n\\n次に、「componentsJoined」関数を利用して、カンマ区切りで文字列にキャストします。\\n\\n以下では、キャストした結果をコンソールに出力しています。\\n\\n```swift\\nprint(array.componentsJoined(by: \\\",\\\")) // -\u003e 「aaaaa,bbbbb」\\n```\\n\\n以下に、全てのコードを記載します。\\n\\n```swift\\nvar array = NSMutableArray()\\narray.add(\\\"aaaaa\\\")\\narray.add(\\\"bbbbb\\\")\\nprint(array.componentsJoined(by: \\\",\\\")) // -\u003e 「aaaaa,bbbbb」\\n```\\n\"},{\"slug\":\"2020-05-04-000000-3\",\"frontmatter\":{\"title\":\"ロガー(Logger)クラスの自作方法【Swift】\",\"createAt\":\"2020-05-04 00:00\",\"updateAt\":null,\"tags\":[\"Swift\"]},\"rawContent\":\"$8a\"},{\"slug\":\"2020-05-04-000000-4\",\"frontmatter\":{\"title\":\"文字列の空文字チェックとnilチェック【Swift】\",\"createAt\":\"2020-05-04 00:00\",\"updateAt\":null,\"tags\":[\"Swift\"]},\"rawContent\":\"\\n## ■はじめに\\n\\n文字列の空文字チェックとnilチェックに関して記載します。\\n\\nTextFieldやTextViewなどで、空文字チェックを行う場合や、オプショナル型のString型の変数のnilチェックを行う前提としています。\\n\\n## ■手順\\n\\n以下の方法で空文字チェックを行います。\\n\\n```swift\\nlet target: String = \\\"\\\"\\nif (target.isEmpty) {\\n    print(\\\"空文字\\\")\\n} else {\\n    print(\\\"空文字ではない\\\")\\n}\\n```\\n\\n以下の方法でnilチェックを行います。\\n\\n```swift\\nlet target: String? = nil\\nif let targetStr = target {\\n    print(\\\"nilではない\\\")\\n}\\n```\\n\\n以下の方法で、nilチェックを行い、空チェックも行います。\\n\\n```swift\\nlet target: String? = nil\\nif let str = str, !str.isEmpty {\\n    print(\\\"nilではなく、空でもない\\\")\\n}\\n```\\n\"},{\"slug\":\"2020-05-04-000000\",\"frontmatter\":{\"title\":\"Node.jsでFirebase Cloud Messaging（FCM）のPush通知を送信する方法【Node.js】\",\"createAt\":\"2020-05-04 00:00\",\"updateAt\":null,\"tags\":[\"Node.js\"]},\"rawContent\":\"$8b\"},{\"slug\":\"2020-05-03-000000-1\",\"frontmatter\":{\"title\":\"UIPageControlで横スライドのチュートリアルを作る方法【Swift】\",\"createAt\":\"2020-05-03 00:00\",\"updateAt\":null,\"tags\":[\"Swift\"]},\"rawContent\":\"$8c\"},{\"slug\":\"2020-05-03-000000-2\",\"frontmatter\":{\"title\":\"セミモーダルビューを追加する方法【Swift】\",\"createAt\":\"2020-05-03 00:00\",\"updateAt\":null,\"tags\":[\"Swift\"]},\"rawContent\":\"$8d\"},{\"slug\":\"2020-05-03-000000-3\",\"frontmatter\":{\"title\":\"UserDefaultsに独自クラスの配列を設定する方法【Swift】\",\"createAt\":\"2020-05-03 00:00\",\"updateAt\":null,\"tags\":[\"Swift\"]},\"rawContent\":\"$8e\"},{\"slug\":\"2020-05-03-000000-4\",\"frontmatter\":{\"title\":\"メソッドに配列を参照渡しする方法【Swift】\",\"createAt\":\"2020-05-03 00:00\",\"updateAt\":null,\"tags\":[\"Swift\"]},\"rawContent\":\"\\n## ■はじめに\\n\\nメソッドの引数に配列を渡す場合には、通常は値渡しになります。\\n ここでは、「参照渡し」の方法を記載します。\\n\\n## ■手順\\n\\nメソッドの引数のデータ型に「inout」をつけることで参照渡しになります。\\n\\n呼び出し元には「\u0026」をつける必要があるので、注意してください。\\n\\n以下に、ソースコードを記載します。\\n\\n```swift\\nvar array: [String] = [\\\"HELLO\\\", \\\"WORLD\\\"]\\nsample(array: \u0026array)\\n// 参照私のメソッドで「SAMPLE」が追加されたので、ここでも追加される。\\nprint(array) // -\u003e \\\"HELLO\\\", \\\"WORLD\\\", \\\"SAMPLE\\\"\\n\\nfunc sample(array: inout [String]) {\\n    print(array) // -\u003e \\\"HELLO\\\", \\\"WORLD\\\"\\n    array.append(\\\"SAMPLE\\\")\\n}\\n```\\n\"},{\"slug\":\"2020-05-03-000000\",\"frontmatter\":{\"title\":\"設定画面に遷移する場合のURLスキームのまとめ【Swift】\",\"createAt\":\"2020-05-03 00:00\",\"updateAt\":null,\"tags\":[\"Swift\"]},\"rawContent\":\"\\n■はじめに\\n\\n本記事では、アプリからiPhoneの設定アプリに遷移する方法をまとめています。\\n\\n■手順\\n\\n以下のソースを記載することで、設定アプリを開くことができます。\\n\\n```swift\\nif let url = URL(string:\\\"app-settings:path\\\") {\\n    UIApplication.shared.open(url, options: [:], completionHandler: nil)\\n}\\n```\\n\\n設定アプリの中の、自身のアプリの設定を開きたい場合には以下のソースを記載する必要があります。\\n\\n```swift\\nif let url = URL(string:\\\"app-settings:path=\\\" + (Bundle.main.bundleIdentifier ?? \\\"\\\")) {\\n    UIApplication.shared.open(url, options: [:], completionHandler: nil)\\n}\\n```\\n\"},{\"slug\":\"2020-05-02-000000-1\",\"frontmatter\":{\"title\":\"SignalRでの連携（流れ）\",\"createAt\":\"2020-05-02 00:00\",\"updateAt\":null,\"tags\":[]},\"rawContent\":\"\\n## ■はじめに\\n\\n本記事は、SignalRを利用して、UWPのアプリからWPFのアプリのメソッドを実行する為の方法をまとめた記事の、全体の流れをまとめた記事です。\\n\\n## ■流れ\\n\\n以下の記事を参考に、UWPアプリを作成する。\\n\\n[UWPアプリ](http://developer-kuro.com/develop/2019/10/13/signalr%e3%81%a7%e3%81%ae%e9%80%a3%e6%90%ba%ef%bc%88uwp%e3%82%a2%e3%83%97%e3%83%aa%ef%bc%89/)\\n\\n以下の記事を参考に、WPFアプリを作成する。\\n\\n[WPFアプリ](http://developer-kuro.com/develop/2019/10/13/signalr%e3%81%a7%e3%81%ae%e9%80%a3%e6%90%ba%ef%bc%88wpf%e3%82%a2%e3%83%97%e3%83%aa%ef%bc%89/)\\n\\n以下の記事を参考に、アプリケーションを実行し、動作確認を行う。\\n\\n[実行方法](http://developer-kuro.com/develop/2019/10/13/signalr%e3%81%a7%e3%81%ae%e9%80%a3%e6%90%ba%ef%bc%88%e5%ae%9f%e8%a1%8c%e6%96%b9%e6%b3%95%ef%bc%89/)\\n\\n以下の記事を参考に、引数と戻り値の実装を行う。\\n\\n[引数・戻り値](http://developer-kuro.com/develop/2019/10/13/signalr%e3%81%a7%e3%81%ae%e9%80%a3%e6%90%ba%ef%bc%88%e5%bc%95%e6%95%b0%e3%83%bb%e6%88%bb%e3%82%8a%e5%80%a4%ef%bc%89/)\\n\"},{\"slug\":\"2020-05-02-000000-2\",\"frontmatter\":{\"title\":\"SignalRでの連携（引数・戻り値）\",\"createAt\":\"2020-05-02 00:00\",\"updateAt\":null,\"tags\":[]},\"rawContent\":\"$8f\"},{\"slug\":\"2020-05-02-000000-3\",\"frontmatter\":{\"title\":\"CocoaPodsのインストール【iOS】\",\"createAt\":\"2020-05-02 00:00\",\"updateAt\":null,\"tags\":[]},\"rawContent\":\"\\n## ■CocoaPodsとは\\n\\niOSアプリ開発で利用するライブラリの管理（インストールなど）を行うツールです。\\n\\n## ■インストール手順\\n\\nターミナルで以下を実行\\n\\n```\\nsudo gem install cocoapods\\n```\\n\\nインストール完了後に、ターミナルで以下を実行\\n\\n```\\npod setup\\n```\\n\\n## ■エラーが出た場合\\n\\n以下のエラーが出た場合には\\n\\n```\\nERROR:  While executing gem ... (Gem::FilePermissionError)\\n    You don’t have write permissions for the /usr/bin directory.\\n```\\n\\n以下のコマンドでCocoaPodsをインストールする。\\n\\n```\\nsudo gem install cocoapods -n /usr/local/bin\\n```\\n\\nどうも、OSのアップデートで権限が強くなったみたい。。。\\n\"},{\"slug\":\"2020-05-02-000000-4\",\"frontmatter\":{\"title\":\"Lottieでアニメーションを実行する方法【Swift】\",\"createAt\":\"2020-05-02 00:00\",\"updateAt\":null,\"tags\":[\"Swift\"]},\"rawContent\":\"$90\"},{\"slug\":\"2020-05-02-000000\",\"frontmatter\":{\"title\":\"SignalRでの連携（実行方法）\",\"createAt\":\"2020-05-02 00:00\",\"updateAt\":null,\"tags\":[]},\"rawContent\":\"\\n## ■はじめに\\n\\n本記事は、SignalRを利用して、UWPのアプリからWPFのアプリのメソッドを実行する為の方法をまとめた記事の、実行方法です。\\n\\n以下の2つの準備ができている前提となります。\\n\\n[UWPアプリ](http://developer-kuro.com/develop/2019/10/13/signalr%e3%81%a7%e3%81%ae%e9%80%a3%e6%90%ba%ef%bc%88uwp%e3%82%a2%e3%83%97%e3%83%aa%ef%bc%89/)\\n\\n[WPFアプリ](http://developer-kuro.com/develop/2019/10/13/signalr%e3%81%a7%e3%81%ae%e9%80%a3%e6%90%ba%ef%bc%88wpf%e3%82%a2%e3%83%97%e3%83%aa%ef%bc%89/)\\n\\n## ■手順\\n\\nサーバー側のアプリを起動する。\\n\\n![](/images/2020-05-02-000000/20220707120107.png)\\n\\n起動できると、真っ白なウィンドウが表示されるので、停止せずにそのまま起動させておく。\\n\\n![](/images/2020-05-02-000000/20220707115328.png)\\n\\nクライアント側のアプリを起動する。\\n\\n![](/images/2020-05-02-000000/20220707120157.png)\\n\\n起動できると、真っ白なウィンドウが表示される。\\n\\n![](/images/2020-05-02-000000/20220707120201.png)\\n\\nサーバー側のプロジェクトのコンソールに「=====SampleHubの呼び出す=====」が表示されていれば、正常にUWPからWPFへSignalRを介してアクセスが出来ました。\\n\\n※「SampleHub」クラスの「CallSample」メソッドが呼び出されました。\\n\\n![](/images/2020-05-02-000000/20220707120113.png)\\n\"},{\"slug\":\"2020-05-01-000000-1\",\"frontmatter\":{\"title\":\"サーバー用意後のApache起動\",\"createAt\":\"2020-05-01 00:00\",\"updateAt\":null,\"tags\":[]},\"rawContent\":\"\\n## ■はじめに\\n\\n本手順は、さくらVPSでサーバーを契約し、スタートアップスクリプトで「LAMP」を選択し、インストールした後の手順を記載します。\\n\\n## ■手順\\n\\nターミナルでさくらVPSにSSH接続する。\\n\\n```\\nssh root@[IPアドレス]\\n```\\n\\n接続後、以下のコマンドをコピペして、実行する。\\n\\n```\\n# ファイアーウォール の自動起動\\nsystemctl enable firewalld\\n# ファイアーウォール の起動\\nsystemctl start firewalld\\n# Apacheの起動\\nsystemctl start httpd\\n# ファイアーウォール のHTTPの開通\\nfirewall-cmd --add-service=http --zone=public --permanent\\n# ファイアーウォール のHTTPSの開通\\nfirewall-cmd --add-service=https --zone=public --permanent\\n# ファイアーウォール の80番ポートの開通\\nfirewall-cmd --add-port=80/tcp --permanent\\n# ファイアーウォール の再起動\\nsystemctl restart firewalld\\n# Apacheの自動起動\\nsystemctl enable httpd\\n```\\n\\nその後、ブラウザで、以下のアドレスにアクセスして、ApacheのサイトにつながればOKです！\\n\\nhttp://[IPアドレス]\\n\"},{\"slug\":\"2020-05-01-000000-2\",\"frontmatter\":{\"title\":\"CentOS7のファイアーウォール操作まとめ【コマンド集】\",\"createAt\":\"2020-05-01 00:00\",\"updateAt\":null,\"tags\":[]},\"rawContent\":\"\\n## ■コマンド集\\n\\nファイアーウォール の起動\\n\\n```\\nsystemctl start firewalld\\n```\\n\\nファイアーウォール の自動起動\\n\\n```\\nsystemctl enable firewalld\\n```\\n\\nファイアーウォール の再起動\\n\\n```\\nsystemctl restart firewalld\\n```\\n\\nファイアーウォール の停止\\n\\n```\\nsystemctl stop firewalld\\n
