ンポーネントを用意します。\n\n```javascript\nimport React, { useEffect } from \"react\";\n\nconst CustomTable = ({ header = [], body = [], pageLen = 5 }: Props) =\u003e {\n  const [bodyData, setBodyData] = React.useState(body); // 画面描画データ\n  const [pagerList, setPagerList] = React.useState\u003cnumber[]\u003e([]); // ページ表示情報\n  const [pageNum, setPageNum] = React.useState(1); // ページ番号\n\n  // =====ページャー=====\n\n  const changePage = (num: number) =\u003e {\n    setPageNum(num);\n    pageChangeList(num);\n  };\n\n  const pageChangeList = (num: number) =\u003e {\n    const pageMax = Math.ceil(bodyData.length / pageLen);\n    let pager = [];\n    if (pageMax \u003e 5) {\n      if (num \u003c 3) {\n        for (let r = 1; r \u003c= 5; r++) {\n          pager.push(r);\n        }\n      } else if (num \u003e pageMax - 2) {\n        const lowNum = pageMax - 5;\n        for (let r = lowNum; r \u003c= pageMax; r++) {\n          pager.push(r);\n        }\n      } else {\n        const lowNum = num - 2;\n        const heiNum = num + 2;\n        for (let r = lowNum; r \u003c= heiNum; r++) {\n          pager.push(r);\n        }\n      }\n    } else {\n      for (let r = 1; r \u003c= pageMax; r++) {\n        pager.push(r);\n      }\n    }\n    setPagerList(pager);\n  };\n\n  // =====ソート=====\n  const [columnNo, setColumnNo] = React.useState(-1); // 前回クリックされた列番号\n\n  // 配列のソート\n  const arraySortAct = (a: any, b: any) =\u003e {\n    if (!isNaN(a) \u0026\u0026 !isNaN(b)) {\n      return a - b;\n    } else {\n      if (a \u003e b) {\n        return -1;\n      } else {\n        return 1;\n      }\n    }\n  };\n\n  // ソートの処理\n  const sortAct = (e: any) =\u003e {\n    var target = e.srcElement || e.target;\n    const nowClm = target.cellIndex;\n    const targett = bodyData.concat();\n\n    if (columnNo === nowClm) {\n      // 昇順\n      targett.sort((a, b) =\u003e arraySortAct(a[nowClm], b[nowClm]));\n      setBodyData(targett);\n      setColumnNo(-1);\n    } else {\n      // 降順\n      targett.sort((a, b) =\u003e arraySortAct(b[nowClm], a[nowClm]));\n      setBodyData(targett);\n      setColumnNo(nowClm);\n    }\n  };\n\n  useEffect(() =\u003e {\n    const pageMax = Math.ceil(bodyData.length / pageLen);\n    let pager = [];\n    if (pageMax \u003e 5) {\n      for (let r = 1; r \u003c= 5; r++) {\n        pager.push(r);\n      }\n    } else {\n      for (let r = 1; r \u003c= pageMax; r++) {\n        pager.push(r);\n      }\n    }\n    setPagerList(pager);\n  }, []);\n\n  return (\n\n      \u003ctable id=\"sort_table\"\u003e\n        \u003ctr\u003e\n          {header.map((tgt) =\u003e (\n            \u003cth onClick={sortAct}\u003e{tgt}\u003c/th\u003e\n          ))}\n        \u003c/tr\u003e\n        {bodyData.map((tgt, index) =\u003e {\n          const minPage = (pageNum - 1) * pageLen;\n          const maxPage = minPage + pageLen;\n          if (index \u003e= minPage \u0026\u0026 index \u003c maxPage) {\n            return (\n              \u003ctr\u003e\n                {tgt.map((data) =\u003e (\n                  \u003ctd\n                    onClick={() =\u003e {\n                      console.log(\"========HELLO\");\n                      console.log(`行数：${index}`);\n                      console.log(`行データ：${tgt}`);\n                    }}\n                  \u003e\n                    {data}\n                  \u003c/td\u003e\n                ))}\n              \u003c/tr\u003e\n            );\n          } else {\n            return \u003c\u003e\u003c/\u003e;\n          }\n        })}\n      \u003c/table\u003e\n      \u003cbutton\n        onClick={() =\u003e {\n          if (pageNum \u003e 1) {\n            changePage(pageNum - 1);\n          }\n        }}\n      \u003e\n        前へ\n      \u003c/button\u003e\n      {pagerList.map((val) =\u003e (\n        \u003cbutton onClick={() =\u003e changePage(val)}\u003e{val}\u003c/button\u003e\n      ))}\n      \u003cbutton\n        onClick={() =\u003e {\n          const pageMax = Math.ceil(bodyData.length / pageLen);\n          if (pageNum \u003c pageMax) {\n            changePage(pageNum + 1);\n          }\n        }}\n      \u003e\n        次へ\n      \u003c/button\u003e\n\n  );\n};\n\ntype Props = {\n  header?: string[]; // テーブルヘッダー\n  body?: Array\u003cstring[]\u003e; // テーブル表示データ\n  pageLen?: number; // 1ページの上限件数\n};\n\nexport default CustomTable;\n```\n\n# テーブルコンポーネントを使用\n\n以下の様に「`PageData`」というページにコンポーネントを呼び出して使用する事で、カスタムテーブルが表示されます。\n\n```javascript\nimport CustomTable from \"./CustomTable\";\n\nconst PageData = () =\u003e {\n  return (\n\n      \u003cCustomTable\n        header={[\"No\", \"あああ\", \"いいい\", \"ううう\"]}\n        body={[\n          [\"1\", \"あasds\", \"か\", \"123\"],\n          [\"2\", \"あi,1\", \"か\", \"123\"],\n          [\"3\", \"あ3,u\", \"か\", \"123\"],\n          [\"4\", \"あasd\", \"か\", \"123\"],\n          [\"5\", \"あnt1\", \"か\", \"123\"],\n          [\"6\", \"あdd3\", \"か\", \"123\"],\n          [\"7\", \"あcasc\", \"か\", \"123\"],\n          [\"8\", \"あs1\", \"か\", \"123\"],\n          [\"9\", \"あ ad3\", \"か\", \"123\"],\n          [\"10\", \"あas\", \"か\", \"123\"],\n          [\"11\", \"あdht1\", \"か\", \"123\"],\n          [\"12\", \"あi,3\", \"か\", \"123\"],\n          [\"1\", \"あasds\", \"か\", \"123\"],\n          [\"2\", \"あi,1\", \"か\", \"123\"],\n          [\"3\", \"あ3,u\", \"か\", \"123\"],\n          [\"4\", \"あasd\", \"か\", \"123\"],\n          [\"5\", \"あnt1\", \"か\", \"123\"],\n          [\"6\", \"あdd3\", \"か\", \"123\"],\n          [\"7\", \"あcasc\", \"か\", \"123\"],\n          [\"8\", \"あs1\", \"か\", \"123\"],\n          [\"9\", \"あ ad3\", \"か\", \"123\"],\n          [\"10\", \"あas\", \"か\", \"123\"],\n          [\"11\", \"あdht1\", \"か\", \"123\"],\n          [\"12\", \"あi,3\", \"か\", \"123\"],\n          [\"6\", \"あdd3\", \"か\", \"123\"],\n          [\"7\", \"あcasc\", \"か\", \"123\"],\n          [\"8\", \"あs1\", \"か\", \"123\"],\n          [\"9\", \"あ ad3\", \"か\", \"123\"],\n          [\"10\", \"あas\", \"か\", \"123\"],\n          [\"11\", \"あdht1\", \"か\", \"123\"],\n          [\"12\", \"あi,3\", \"か\", \"123\"],\n        ]}\n      /\u003e\n\n  );\n};\n\nexport default PageData;\n```\n\n# ソートの方法\n\n完成したテーブルのヘッダーをクリックすることで、ソートが実行されます。\n\n１度クリックすると、「降順」\n\nもう一度同じヘッダーをクリックすると、「昇順」になります。\n\n# フィルターの方法\n\nテーブルの下の数字のボタンが、ページ数になります。\n\nボタンを押下することで、該当のページに切り替わります。\n\n「前へ」ボタンは、１つ前のページへ切り替わります。\n\n※現在のページが１ページ目だと動作しません。\n\n「次へ」ボタンは、１つ次のページへ切り替わります。\n\n※現在のページが最後のページだと動作しません。\n"])</script><script>self.__next_f.push([1,"46:T593,"])</script><script>self.__next_f.push([1,"\n# React v17以前\n\nReact v17以前では、以下のサンプルのように「VFC」を使用してPropsを渡していました。\n\nまた、初期値などのdefaultPropsで設定していました。\n\n```javascript\nimport React, { VFC } from \"react\";\nimport styles from \"./index.module.css\";\n\nconst Button: VFC\u003cProps\u003e = ({ title, onClick }) =\u003e {\n  return (\n    \u003cbutton className={styles.button} onClick={onClick}\u003e{title}\u003c/button\u003e\n  );\n};\n\ntype Props = {\n  title: string;\n  onClick?: () =\u003e void;\n};\n\nconst defaultProps: Props = {\n  title: \"\",\n  onClick: () =\u003e undefined,\n};\n\nButton.defaultProps = defaultProps;\n\nexport default Button;\n```\n\n# React v18以降\n\nReact v18以降では、「VFC」などが、非推奨になったため、以下のように修正する必要があります。\n\nまた、初期値に関しても、「defaultProps」が非推奨になるため、修正しています。\n\n※「`非推奨`」というだけなので、v18時点では、VFCなどを使用したままでも良いですが、今後を考えると修正しておいても良いかもしれません。\n\n```javascript\nimport styles from \"./index.module.css\";\n\nconst Button = ({\n    title = \"\",\n    onClick = () =\u003e undefined\n}: Props) =\u003e {\n  return (\n    \u003cbutton className={styles.button} onClick={onClick}\u003e\n      {title}\n    \u003c/button\u003e\n  );\n};\n\ntype Props = {\n  title: string;\n  onClick?: () =\u003e void;\n};\n\nexport default Button;\n```\n"])</script><script>self.__next_f.push([1,"47:T7e7,"])</script><script>self.__next_f.push([1,"\n# 分岐処理とは\n\n信号が青の場合は、進む。\n\n信号が赤の場合は、止まる。\n\nといったように、「`〜の場合は、〜する`」という分岐する処理のことを、分岐処理と言います。\n\n# 条件分岐\n\n以下のような「`switch文`」の記述を行うことで、条件分岐を行うことができます。\n\n```javascript\nswitch (変数){\n  case 条件:\n    条件に一致する場合処理を実行\n    break;\n}\n```\n\n一例として、タイプがいくつか？という分岐を以下に記載します。\n\n```javascript\nswitch (type){\n  case 1:\n    console.log(\"タイプが１です。\");\n    break;\n}\n```\n\n# 条件に当てはまらない場合\n\n以下のような「`switch文`」の記述を行うことで、条件分岐で、条件に当てはまらない場合の処理を行うことができます。\n\n```javascript\nswitch (変数){\n  case 条件:\n    条件に一致する場合処理を実行\n    break;\n  default:\n    条件に一致しない場合の処理を実行\n}\n```\n\n一例として、タイプが１ではない場合を以下に記載します。\n\n```javascript\nvar type = 1;\nswitch (type){\n  case 1:\n    console.log(\"タイプが１です。\");\n    break;\n  default:\n    console.log(\"タイプが１ではありません。\");\n}\n```\n\n# 複数の条件分岐\n\n以下のような「`switch文`」の記述を行うことで、複数の条件分岐を行うことができます。\n\n```javascript\nswitch (変数){\n  case 条件:\n    条件に一致する場合処理を実行\n    break;\n  case 条件1:\n    条件1に一致する場合処理を実行\n    break;\n  default:\n    全ての条件に一致しない場合の処理を実行\n}\n```\n\n以下に使用例を記載します。\n\n```javascript\nvar type = 1;\nswitch (type){\n  case 1:\n    console.log(\"タイプが１です。\");\n    break;\n  case 2:\n    console.log(\"タイプが２です。\");\n    break;\n  default:\n    console.log(\"タイプが１でも２でもありません。\");\n}\n```\n"])</script><script>self.__next_f.push([1,"48:Td01,"])</script><script>self.__next_f.push([1,"\n# はじめに\n\nプログレスバーとは、ダウンロードや何らかの処理の進捗を表示するバーのことです。\n\nゲームのインストール中などによく表示されます。\n\nここでは、HTMLの標準のprogressタグを使用して、プログレスバーの表示と進捗変更の処理を記載します。\n\n![](/images/2022-09-03-100000/20220830155728.png)\n\n# プログレスバー\n\nまずは以下が、プログレスバーのサンプルです。\n\nスタートボタンを押下する事で、プログレスバーが動きます。\n\n```JavaScript\n\u003cprogress id=\"prg\" value=\"0\" max=\"100\"\u003e\u003c/progress\u003e\u003cspan id=\"parsent\"\u003e0%\u003c/span\u003e\u003cbr /\u003e\n\u003cinput type=\"button\" id=\"btn\" onclick=\"progressAct()\" value=\"スタート\"\u003e\n\n\u003cscript\u003e\n// プログレスバーの進捗値\nvar val = 0;\n// 一定間隔で処理を行うintervalのIDを保持\nvar intervalID;\n// ボタンの状態（0: スタート, 1: ストップ, 2: 100%に到達）\nvar btnAct = 0;\n\nconst progressAct = () =\u003e {\n  if (btnAct === 2) {\n    // リセット\n    val = 0;\n    document.getElementById(\"parsent\").innerText = `${val}%`;\n  }\n  if (btnAct === 1) {\n    btnAct = 0;\n    // ボタン文言変更\n    document.getElementById(\"btn\").value = \"スタート\";\n    clearInterval(intervalID)\n    return;\n  } else {\n    btnAct = 1;\n    // ボタン文言変更\n    document.getElementById(\"btn\").value = \"ストップ\";\n  }\n  \n  // 50ms毎に実行\n  intervalID = setInterval(() =\u003e {\n    // プログレスバーに反映\n    val += 1;\n    document.getElementById(\"prg\").value = val;\n    // 画面表示に反映\n    document.getElementById(\"parsent\").innerText = `${val}%`;\n\n    // 100%で停止\n    if (val == 100) {\n      clearInterval(intervalID);\n      document.getElementById(\"btn\").value = \"スタート\";\n      btnAct = 2;\n    }\n  }, 50);\n}\n\u003c/script\u003e\n```\n\n上記のサンプルボタンのソースコードは以下です。\n\n```JavaScript\n\u003cprogress id=\"prg\" value=\"0\" max=\"100\"\u003e\u003c/progress\u003e\u003cspan id=\"parsent\"\u003e0%\u003c/span\u003e\u003cbr /\u003e\n\u003cinput type=\"button\" id=\"btn\" onclick=\"progressAct()\" value=\"スタート\"\u003e\n\n\u003cscript\u003e\n// プログレスバーの進捗値\nvar val = 0;\n// 一定間隔で処理を行うintervalのIDを保持\nvar intervalID;\n// ボタンの状態（0: スタート, 1: ストップ, 2: 100%に到達）\nvar btnAct = 0;\n\nconst progressAct = () =\u003e {\n  if (btnAct === 2) {\n    // リセット\n    val = 0;\n    document.getElementById(\"parsent\").innerText = `${val}%`;\n  }\n  if (btnAct === 1) {\n    btnAct = 0;\n    // ボタン文言変更\n    document.getElementById(\"btn\").value = \"スタート\";\n    clearInterval(intervalID)\n    return;\n  } else {\n    btnAct = 1;\n    // ボタン文言変更\n    document.getElementById(\"btn\").value = \"ストップ\";\n  }\n  \n  // 50ms毎に実行\n  intervalID = setInterval(() =\u003e {\n    // プログレスバーに反映\n    val += 1;\n    document.getElementById(\"prg\").value = val;\n    // 画面表示に反映\n    document.getElementById(\"parsent\").innerText = `${val}%`;\n\n    // 100%で停止\n    if (val == 100) {\n      clearInterval(intervalID);\n      document.getElementById(\"btn\").value = \"スタート\";\n      btnAct = 2;\n    }\n  }, 50);\n}\n\u003c/script\u003e\n```\n\nprogressタグの「value」が現在の進捗なので、JavaScriptでvalueを書き換えて進捗を更新しています\n"])</script><script>self.__next_f.push([1,"49:T928,"])</script><script>self.__next_f.push([1,"\n# はじめに\n\nダイアログには様々な種類があります。\n\n通常のダイアログ（alert）と、YesかNoかを選択させるダイアログ（confirm）と、入力を受け付けるダイアログ（prompt）などがあります。\n\n本記事では、入力を受け付けるダイアログ（prompt）に関して記載します。\n\n# 入力ダイアログ\n\n![](/images/2022-09-02-100000/20220830122927.png)\n\n入力ダイアログを表示する方法は以下です。\n\n```JavaScript\nwindow.prompt(\"入力ダイアログ\");\n```\n\n以下が、サンプルボタンです。\n\n押下する事で、入力ダイアログが表示されます。\n\n入力ダイアログテスト\n\n上記のサンプルボタンのソースコードは以下です。\n\n```JavaScript\n\u003cbutton type=\"button\" onclick=\"promptDialog()\"\u003e入力ダイアログテスト\u003c/button\u003e\n\n\u003cscript\u003e\nfunction promptDialog() {\n    window.prompt(\"入力ダイアログ\");\n}\n\u003c/script\u003e\n```\n\n# 入力ダイアログに初期値を設定\n\n![](/images/2022-09-02-100000/20220830123123.png)\n\n入力ダイアログの初期値を設定する方法は以下です。\n\n```JavaScript\nwindow.prompt(\"入力ダイアログ\", \"初期値\");\n```\n\n以下が、サンプルボタンです。\n\n押下する事で、入力ダイアログが表示されます。\n\n入力ダイアログ初期値テスト\n\n上記のサンプルボタンのソースコードは以下です。\n\n```JavaScript\n\u003cbutton type=\"button\" onclick=\"promptDefDialog()\"\u003e入力ダイアログ初期値テスト\u003c/button\u003e\n\n\u003cscript\u003e\nfunction promptDefDialog() {\n    window.prompt(\"入力ダイアログ\", \"初期値\");\n}\n\u003c/script\u003e\n```\n\n# 入力ダイアログの入力結果取得\n\n入力ダイアログの入力結果を取得する方法は以下です。\n\n```JavaScript\nconst result = window.prompt(\"入力ダイアログ\");\n```\n\n以下が、サンプルボタンです。\n\n押下する事で、入力ダイアログが表示されます。\n\n入力ダイアログ結果確認テスト\n\n上記のサンプルボタンのソースコードは以下です。\n\n```JavaScript\n\u003cbutton type=\"button\" onclick=\"promptResultDialog()\"\u003e入力ダイアログ結果確認テスト\u003c/button\u003e\n\n\u003cscript\u003e\nfunction promptResultDialog() {\n    const result = window.prompt(\"入力ダイアログ\");\n    window.alert(result);\n}\n\u003c/script\u003e\n```\n"])</script><script>self.__next_f.push([1,"4a:T60b,"])</script><script>self.__next_f.push([1,"\n# ファビコンとは\n\n簡単に説明すると、以下のようなタブなどの横についているアイコンのことです。\n\n![](/images/2022-08-25-100000/20220819164725.png)\n\n# ファビコン設定方法\n\nファビコン画像を用意して、HTMLと同じディレクトリに配置します。\n\n拡張子は、「.ico」「.png」のどちらでも大丈夫です。\n\nHTMLのヘッダーに以下の記述を追加します。\n\n```JavaScript\n\u003clink rel=\"icon\" href=\"./favicon.png\" /\u003e\n```\n\nHTMLは以下のようになります。\n\n```JavaScript\n\u003c!DOCTYPE html\u003e\n\u003chtml lang=\"ja\"\u003e\n  \u003chead\u003e\n    \u003ctitle\u003eタイトル\u003c/title\u003e\n    \u003cmeta charset=\"UTF-8\" /\u003e\n    \u003clink rel=\"icon\" href=\"./favicon.png\" /\u003e\n  \u003c/head\u003e\n  \u003cbody\u003e\n  \u003c/body\u003e\n\u003c/html\u003e\n```\n\n# モバイル端末のファビコン\n\nモバイル端末でブックマークをホームに配置する場合のファビコン設定は以下です。\n\n```JavaScript\n\u003clink rel=\"shortcut icon\" href=\"./favicon.png\" type=\"image/x-icon\" /\u003e\n\u003clink rel=\"apple-touch-icon\" href=\"./favicon.png\" /\u003e\n\u003clink rel=\"icon\" type=\"image/png\" href=\"./favicon.png\" /\u003e\n```\n\nHTMLは以下のようになります。\n\n```JavaScript\n\u003c!DOCTYPE html\u003e\n\u003chtml lang=\"ja\"\u003e\n  \u003chead\u003e\n    \u003ctitle\u003eタイトル\u003c/title\u003e\n    \u003cmeta charset=\"UTF-8\" /\u003e\n    \u003clink rel=\"icon\" href=\"./favicon.png\" /\u003e\n    \u003clink rel=\"shortcut icon\" href=\"./favicon.png\" type=\"image/x-icon\" /\u003e\n    \u003clink rel=\"apple-touch-icon\" href=\"./favicon.png\" /\u003e\n    \u003clink rel=\"icon\" type=\"image/png\" href=\"./favicon.png\" /\u003e\n  \u003c/head\u003e\n  \u003cbody\u003e\n  \u003c/body\u003e\n\u003c/html\u003e\n```\n"])</script><script>self.__next_f.push([1,"4b:T9bd,"])</script><script>self.__next_f.push([1,"\n# はじめに\n\n以下の記事を参考に、環境定数を用意してください。\n\n[https://reigle.info/entry/2022/08/20/100000](https://reigle.info/entry/2022/08/20/100000)[reigle.info](https://reigle.info/entry/2022/08/20/100000)\n\n# 環境毎のWebPackを修正する\n\n以下のように、環境情報が取得できる環境定数を定義します。\n\n※「`ENV`」の部分です。（既存のWebPackがある場合は、ENVのみ追加してください）\n\n```JavaScript\nconst webpack = require(\"webpack\");\n\nmodule.exports = (env) =\u003e {\n  return {\n    plugins: [\n      new webpack.DefinePlugin({\n        ENV: JSON.stringify(env),\n      }),\n    ],\n  };\n};\n```\n\n# 環境毎のCSSを作成する\n\n環境定数と同じディレクトリに「`[環境定数のファイル名].module.css`」のルールに則って、CSSファイルを作成してください。\n\n以下のようなファイル構成になるはずです。\n\n```JavaScript\n┗ development.js\n┗ development.module.css\n┗ production.js\n┗ production.module.css\n```\n\n「`[環境定数のファイル名].module.css`」には以下のように定数を定義します。\n\n「`:root {`」の中が定数なので、任意で追加してください。\n\n```css\n:root {\n  --sample-background-color: #d21919;\n}\n```\n\n# 定義したCSS定数を読み込む\n\n「`src`」配下の「`index.tsx`」を以下のように修正します。（index.tsxの内容は環境によって相違する場合があります。）\n\n重要なのは、「`require(`../${ENV}.module.css`);`」の部分です。\n\nここで、環境毎のCSSファイルを読み込んでいます。\n\n```JavaScript\nimport React from \"react\";\nimport ReactDOM from \"react-dom/client\";\nimport \"./index.css\";\nimport App from \"./App\";\nimport reportWebVitals from \"./reportWebVitals\";\nrequire(`../${ENV}.module.css`);\n\nconst root = ReactDOM.createRoot(\n  document.getElementById(\"root\") as HTMLElement\n);\nroot.render(\n  \u003cReact.StrictMode\u003e\n    \u003cApp /\u003e\n  \u003c/React.StrictMode\u003e\n);\n\n// If you want to start measuring performance in your app, pass a function\n// to log results (for example: reportWebVitals(console.log))\n// or send to an analytics endpoint. Learn more: https://bit.ly/CRA-vitals\nreportWebVitals();\n```\n\n# CSS定数を使用する方法\n\n「`var([定数名])`」を使用することで、CSS定数を利用することができます。\n\n以下のように定義が可能です。\n\n```css\n.hoge {\n  background: var(--sample-background-color);\n}\n```\n"])</script><script>self.__next_f.push([1,"4c:T1008,"])</script><script>self.__next_f.push([1,"\n# はじめに\n\n本記事では、SpinKitを使用したローディングの実装方法を記載します。\n\n複数の画面で使用出来るように、コンポーネントのような形で作成しています。\n\nhttps://tobiasahlin.com/spinkit/\n\n# ローディングのJavaScriptの準備\n\nSpinKitの「`\u003c\u003eSource`」を押下して表示された「`HTML`」の内容を以下の「`html`」の変数に記載します。\n\n※現在記載している内容は削除頂いて大丈夫です。\n\nhttps://tobiasahlin.com/spinkit/\n\n```JavaScript\n$(function () {\n  // 以下に「SpinKit」で選んだアニメーションのHTMLを貼付する\n  const html = `\n\n  `;\n\n  $(\".loading\").html(html);\n});\n```\n\n# ローディングのCSSの準備\n\nSpinKitの「`\u003c\u003eSource`」を押下して表示された「`CSS`」の内容を以下の「`/* 以下に「SpinKit」で選んだアニメーションのCSSを貼付する */`」の下に記載します。\n\n※現在記載している内容は削除頂いて大丈夫です。\n\nhttps://tobiasahlin.com/spinkit/\n\n```css\n@keyframes vaScriptとCSSを読み込みます。\n\nまた、ローディングのJavaScriptで使用するjQueryをCDNから読み込みます。\n\nローディング表示用に「``」を定義します。\n\n```JavaScript\n\u003c!DOCTYPE html\u003e\n\u003chtml lang=\"ja\"\u003e\n  \u003chead\u003e\n    \u003ctitle\u003eローディングサンプル\u003c/title\u003e\n    \u003cmeta charset=\"UTF-8\" /\u003e\n    \u003c!-- jQuery --\u003e\n    \u003cscript src=\"https://ajax.googleapis.com/ajax/libs/jquery/3.2.1/jquery.min.js\"\u003e\u003c/script\u003e\n\n    \u003clink rel=\"stylesheet\" href=\"./loading.css\" /\u003e\n    \u003cscript src=\"./loading.js\"\u003e\u003c/script\u003e\n  \u003c/head\u003e\n\n  \u003cbody\u003e\n\n  \u003c/body\u003e\n\u003c/html\u003e\n```\n\n# ローディングの止め方\n\n以下のjQueryを実行する事で、ローディングを停止する事ができます。\n\n```JavaScript\n$('.loading').hide();\n```\n\n以下のjQueryを実行する事で、ローディングを再開する事ができます。\n\n```JavaScript\n$('.loading').show();\n```\n\n# ソースコードの全量\n\nhttps://github.com/Reigle/loading_sample_spinkit\n"])</script><script>self.__next_f.push([1,"4d:T894,"])</script><script>self.__next_f.push([1,"\n# インポートのエイリアス化とは\n\n階層が深くなっていくと、importする際に「`../../../../Hoge`」のような「`../`」などの相対パスが複数記載されることがあります。\n\n共通コンポーネントなどは特に複数箇所からの利用が行われるため、上記のようなパスをエイリアスを設定することで、「@Hoge」のようにまとめる事ができます。\n\n# WebPackのエイリアス定義\n\n以下のようなディレクトリ構造の前提で記載します。\n\n```JavaScript\nsrc\n  ┣ index.ts\n  ┗components\n         ┣ file.ts\n         ┗ dir\n            ┗ fileee.ts\n```\n\n「`webpack.config.js`」を以下のようにエイリアスの定義を行います。\n\n```JavaScript\nmodule.exports = () =\u003e {\n  return {\n    resolve: {\n      alias: {\n        \"@dir\": path.join(__dirname, \"src/components/dir/\"),\n        \"@file\": path.join(__dirname, \"src/components/file.ts\"),\n      },\n      extensions: [\".json\", \".js\", \".jsx\", \".ts\", \".tsx\"],\n    },\n    ~~~~~WebPackの定義~~~~~\n  };\n};\n```\n\n# TypeScript用のエイリアス定義\n\n「`tsconfig.json`」を以下のようにエイリアスの定義を行います。\n\n```JavaScript\n{\n  \"compilerOptions\": {\n    ~~~~~tsconfig.jsonの他の定義~~~~~\n    \"baseUrl\": \"./src\",\n    \"paths\": {\n      \"@dir/*\": [\"components/dir/*\"],\n      \"@file\": [\"components/file.ts\"]\n    }\n  },\n}\n```\n\n# インポート\n\n## ディレクトリのエイリアス\n\n「`src/index.ts`」から、エイリアスを使わない「dir」配下の「fileee.ts」をインポートする方法\n\n```JavaScript\nimport fileee from './components/dir/fileee.ts';\n```\n\n「`src/index.ts`」から、エイリアスを使った「dir」配下の「fileee.ts」をインポートする方法\n\n```JavaScript\nimport fileee from '@dir/fileee.ts';\n```\n\n## ファイルのエイリアス\n\n「`src/index.ts`」から、エイリアスを使わない「file.ts」をインポートする方法\n\n```JavaScript\nimport file from './components/file.ts';\n```\n\n「`src/index.ts`」から、エイリアスを使った「file.ts」をインポートする方法\n\n```JavaScript\nimport file from '@file';\n```\n"])</script><script>self.__next_f.push([1,"4e:T85f,"])</script><script>self.__next_f.push([1,"\n# はじめに\n\n以下の記事を参考に、DockerとWebPackを使用したプロジェクトを用意してください。\n\n既にプロジェクトがある場合は、適時読み替えてください。\n\nhttps://reigle.info/entry/2022/07/12/100000\n\n# 難読化\n\n## 難読化とは\n\nプログラムの動作を変えずに、コード内の変数名や構造などを、読み取りにくくなるように改変・加工することです。\n\n難読化することで、他者にプログラムをコピーして類似サービスをリリースされたりなどの対策ができます。\n\nただし、難読化はあくまで読み辛くしているだけなので、100%複製できないわけではありません。\n\n## 難読化しない方法\n\n「`webpack.config.js`」の内容を以下のように「`mode`」定義を追加します。\n\n```JavaScript\nmodule.exports = () =\u003e {\n  return {\n    mode: \"development\",\n    ~~~~~WebPackの定義~~~~~\n  }\n}\n```\n\n## 難読化する方法\n\n「`webpack.config.js`」の内容を以下のように「`mode`」定義を追加します。\n\n```JavaScript\nmodule.exports = () =\u003e {\n  return {\n    mode: \"production\",\n    ~~~~~WebPackの定義~~~~~\n  }\n}\n```\n\n# ソースマップ\n\n## ソースマップとは\n\nDeveloperツールのSourcesで表示されるディレクトリ構造が表示される部分です。\n\n難読化を行なっても、ソースマップが表示されていれば、ソースコードが容易に取得できてしまいます。\n\n本番環境でリリースを行う際には必ずソースマップも非表示にしてください。\n\n## ソースマップを表示する方法\n\n「`webpack.config.js`」の内容を以下のように「`devtool`」定義を追加します。\n\n```JavaScript\nmodule.exports = () =\u003e {\n  return {\n    devtool: \"inline-source-map\",\n    ~~~~~WebPackの定義~~~~~\n  }\n}\n```\n\n## ソースマップを表示しない方法\n\n「`webpack.config.js`」の内容を以下のように「`devtool`」定義を追加します。\n\n```JavaScript\nmodule.exports = () =\u003e {\n  return {\n    devtool: false,\n    ~~~~~WebPackの定義~~~~~\n  }\n}\n```\n"])</script><script>self.__next_f.push([1,"4f:T8ca,"])</script><script>self.__next_f.push([1,"\n# はじめに\n\n以下の記事を参考に、DockerとWebPackを使用したプロジェクトを用意してください。\n\n既にプロジェクトがある場合は、適時読み替えてください。\n\nhttps://reigle.info/entry/2022/07/12/100000\n\n# package.jsonで環境を定義する\n\n「`webpack-dev-server`」の前に環境情報を保持する定数を定義します。\n\n以下では、「`ENV`」の定数に「`development`」と「`production`」を設定しています。\n\n```JavaScript\n\"scripts\": {\n    \"start\": \"ENV=development webpack-dev-server --config webpack.config.js --port 3000 --progress --profile --static src/\",\n    \"production\": \"ENV=production webpack-dev-server --config webpack.config.js --port 3000 --progress --profile --static src/\",\n  },\n```\n\n# WebPackの修正\n\n修正前は以下のような「`webpack.config.js`」の定義でした。\n\n```JavaScript\nconst path = require(\"path\");\nconst HtmlWebpackPlugin = require(\"html-webpack-plugin\");\nconst { LoaderOptionsPlugin } = require(\"webpack\");\n\nmodule.exports = () =\u003e {\n  return {\n    ~~~~~WebPackの定義~~~~~\n  }\n}\n```\n\n「`webpack.config.js`」を以下のように修正してください。\n\n※ポイントとしては、「`webpack-merge`」を使用して、別ファイルをマージしています。\n\n```JavaScript\nconst path = require(\"path\");\nconst webpackMerge = require(\"webpack-merge\");\nconst HtmlWebpackPlugin = require(\"html-webpack-plugin\");\nconst { LoaderOptionsPlugin } = require(\"webpack\");\nconst environment = process.env.ENV || \"development\";\n\nmodule.exports = () =\u003e {\n  return webpackMerge.merge(require(\"./\" + environment + \".js\")(environment), {\n    ~~~~~WebPackの定義（共通の部分）~~~~~\n  }\n}\n```\n\n「`webpack.config.js`」と同じ階層に「`development.js`」「`production.js`」を作成し、それぞれ以下のように記載します。\n\n「`development.js`」の記載\n\n```JavaScript\nconst webpack = require(\"webpack\");\n\nmodule.exports = (env) =\u003e {\n  return {\n    ~~~~~WebPackの定義（開発環境）~~~~~\n  };\n};\n```\n\n「`production.js`」の記載\n\n```JavaScript\nconst webpack = require(\"webpack\");\n\nmodule.exports = (env) =\u003e {\n  return {\n    ~~~~~WebPackの定義（本番環境）~~~~~\n  };\n};\n```\n"])</script><script>self.__next_f.push([1,"50:Td89,"])</script><script>self.__next_f.push([1,"\n# はじめに\n\n以下の記事を参考に、DockerとWebPackを使用したプロジェクトを用意してください。\n\n既にプロジェクトがある場合は、適時読み替えてください。\n\nhttps://reigle.info/entry/2022/07/12/100000\n\n# Dockerの本番環境用意\n\n「`docker-compose.yml`」と同じ階層に「`docker-compose.prod.yml`」を作成する。\n\n「`docker-compose.prod.yml`」に以下の内容を記載する。\n\n※「`npm run production`」の部分のみ修正されています。\n\n```JavaScript\n# docker-composeのバージョン\n# https://docs.docker.jp/compose/compose-file/compose-file-v3.html\nversion: \"3.8\"\n\nservices:\n  react-app:\n    # 環境構築\n    # dockerfileを指定して「Dockerfile」にて環境構築を実施\n    build:\n      context: .\n      dockerfile: Dockerfile\n    # バインドマウント、ホスト側のファイルやディレクトリをコンテナ側にマウント\n    volumes:\n      - ./:/src\n    # 起動時コマンド\n    command: sh -c \"npm install \u0026\u0026 npm run production\"\n    # ホスト側とコンテナ側の両方のポートを指定(ホスト側 : コンテナ側)\n    # ポートを1つのみ指定した場合は、ホスト側にランダムなポート番号が割り当てられる\n    ports:\n      - \"3000:3000\"\n    # 標準入出力とエラー出力をコンテナに結びつける\n    stdin_open: true\n```\n\n# package.jsonの内容を修正\n\n以下の通り、「`scripts`」の中を修正する。\n\n「`production`」の部分を追加します。\n\n```JavaScript\n\"scripts\": {\n  \"start\": \"webpack-dev-server --config webpack.config.js --port 3000 --progress --profile --static src/\",\n  \"production\": \"webpack --config webpack.config.js --progress --profile /src\"\n},\n```\n\n# webpack.config.jsの出力先指定\n\n既に記載されていれば対応は不要ですが、以下の記載を行なってください。\n\nビルド後の出力先の指定です。\n\n```JavaScript\noutput: {\n  path: path.resolve(__dirname, \"build\"),\n  filename: \"bundle.js\",\n  publicPath: \"/\",\n},\n```\n\n# ビルド実行\n\n以下のコマンドを実行して、ビルドを行います。\n\n```JavaScript\ndocker-compose -f docker-compose.yml -f docker-compose.prod.yml up\n```\n\nビルドが成功すると、プロジェクト直下に「`build`」ディレクトリが作成され、内部にhtmlなどが生成されます。\n\n※このhtmlをローカルで開いても、アプリは表示されません。\n\n# ビルド後のファイルをローカルで実行\n\n以下のコマンドを実行して、「`serve`」をグローバルにインストールします。\n\n```JavaScript\nnpm i -g serve\n```\n\n以下のコマンドを実行して、ローカルホストを起動します。\n\n```JavaScript\nserve -s build\n```\n\n# サーバーへのデプロイ\n\n「`ビルド実行`」で作成した「`build`」ディレクトリ配下を全てサーバーにアップします。\n\n※Apatchの場合は、「`/var/www/html`」の配下に「`index.html`」が入るようにしてください。\n\n※「`/var/www/html`」の配下に「`build`」ディレクトリをコピーすると、JSが読み込めず、エラーになります。\n\nSCPコマンドでデプロイする場合には以下のコマンドを参考にデプロイしてください。\n\n※IPとアカウント部分は各自書き換えてください。\n\n```JavaScript\nscp -r ./build/* root@111.11.11.111:/var/www/html\n```\n"])</script><script>self.__next_f.push([1,"51:T82c,"])</script><script>self.__next_f.push([1,"\n# 必要なパッケージのインストール\n\nサーバーにて、以下のコマンドを実行して「`httpd-tools`」をインストールする。\n\n```sh\nyum install httpd-tools\n```\n\n# htpasswdファイルの作成\n\n以下のコマンドを実行する。\n\n※「username」の部分は、Basic認証のユーザー名に置き換えてください。\n\n```sh\nhtpasswd -c /etc/nginx/.htpasswd username\n```\n\nパスワードの確認が行われるので、Basic認証で使用したいパスワードを入力してください。\n\n# nginxのドメインの設定ファイルにBasic認証の設定追加\n\n以下のコマンドでドメインの設定ファイルを修正します。\n\n※「`example.com`」の部分は各自のドメインに置き換えてください。\n\n```sh\nvi /etc/nginx/conf.d/example.com.conf\n```\n\n以下のように、「`location`」を追加します。\n\n```sh\nserver {\n  〜〜〜省略〜〜〜\n  location / {\n    auth_basic \"Restricted\";\n    auth_basic_user_file /etc/nginx/.htpasswd;\n  }\n}\n```\n\n全文は以下です。\n\n※人によって、記述内容などは相違しますので、ご参考程度にしてください。\n\n```sh\nserver {\n  listen 443 ssl;\n  server_name example.com;\n  root /var/www/html;\n  index  index.html;\n\n  ssl_certificate /etc/letsencrypt/live/example.com/fullchain.pem;\n  ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem;\n\n  ssl_prefer_server_ciphers on;\n\n  location / {\n    auth_basic \"Restricted\";\n    auth_basic_user_file /etc/nginx/.htpasswd;\n  }\n}\n```\n\n修正が終わったら、nginxを再起動します。\n\n```sh\nsystemctl restart nginx\n```\n\n# Basic認証\n\n該当のURLにアクセスした際に、以下のようなBasic認証が表示されたら成功です。\n\nBasic認証には「`htpasswdファイルの作成`」で設定した内容を使用してログインしてください。\n\n１度Basic認証にログインしたけど、再度確認したい場合には、プライベートブラウザで確認すると表示されます。\n\n![](/images/2022-08-17-100000/20220806172033.png)\n"])</script><script>self.__next_f.push([1,"52:T103b,"])</script><script>self.__next_f.push([1,"\n# 事前準備\n\n以下から、Stripeのアカウントを作成してダッシュボード画面まで登録を進める。\n\nhttps://stripe.com/jp\n\n以下の記事を参考に、カスタマーの登録が完了していること。\n\n`Node.jsでStripeのカスタマー（顧客）の登録方法　stripe.customers.create`\n\n# Stripeからトークンを取得\n\n以下のサイトにアクセスします。\n\n[https://dashboard.stripe.com/test/apikeys](https://dashboard.stripe.com/test/apikeys)\n\nテスト環境がONになっている事を確認します。\n\n※ONになっていない方は、ONにしておいてください。\n\n![](/images/2022-08-16-100000/20220806151626.png)\n\n「`制限付きのキーを作成`」を押下します。\n\n![](/images/2022-08-16-100000/20220806151715.png)\n\nキーの名前に任意の名前を入力します。（何でもいいです）\n\n![](/images/2022-08-16-100000/20220806151800.png)\n\n「`Customers`」の権限を「`書き込み`」に変更します。\n\n![](/images/2022-08-16-100000/20220806151956.png)\n\n画面最下部の「`キーを作成`」を押下します。\n\n「`テストキーを表示`」を押下して表示された「`トークン`」を後程利用するので、残しておいてください。\n\n![](/images/2022-08-16-100000/20220806152127.png)\n\n# カスタマーIDの確認\n\n以下のダッシュボードにアクセスし、顧客を選択します。\n\n[https://dashboard.stripe.com/test/customers](https://dashboard.stripe.com/test/customers)\n\n顧客画面の左側に記載されている「`cus_`」から始まるものがカスタマーIDです。\n\n※プログラム上で使用します。\n\n![](/images/2022-08-16-100000/20220806153740.png)\n\n# アカウントにカード情報の登録\n\n以下の記事を参考に、カード情報を登録しておいてください。\n\n`Stripeのカスタマー（顧客）の支払い方法の設定方法（クライアント側　純粋なHTML/JavaScript jQuery）【2/2】`\n\nまた、カード登録後のリダイレクト先のURLのクエリパラメータから「`setup_intent`」の値「`seti_XXXX`」を取得しておいてください。\n\n# Node.jsの関数用意\n\n以下のコマンドを実行して、Node.jsのプロジェクトにStripeをインストールします。\n\n```sh\nnpm i stripe\n```\n\n以下の関数を用意します。\n\n「`rk_test_XXXXXXXXXXXXXXXXXX`」の部分は「`Stripeからトークンを取得`」で取得したトークンに置き換えてください。\n\n「`cus_XXXXXX`」の部分は「`カスタマーIDの確認`」で取得したカスタマーIDに置き換えてください。\n\n「`seti_XXXX`」の部分は「`アカウントにカード情報の登録`」で取得した「`setup_intent`」の値に置き換えてください。\n\n```javascript\nvar stripe = require(\"stripe\")(\"rk_test_XXXXXXXXXXXXXXXXXX\");\n\nconst defaultCard = async (customerId, setupIntentId) =\u003e {\n  const setupIntent = await stripe.setupIntents.retrieve(setupIntentId);\n  if (!setupIntent.payment_method) {\n    return response.status(204).end();\n  }\n  const paymentMethodId =\n    typeof setupIntent.payment_method === \"string\"\n      ? setupIntent.payment_method\n      : setupIntent.payment_method.id;\n\n      if (paymentMethodId) {\n    const res = await stripe.customers.update(customerId, {\n      invoice_settings: {\n        default_payment_method: paymentMethodId,\n      },\n    });\n    console.log(res);\n  }\n};\n```\n\n用意した関数を以下の様に実行する事で、該当のカードをデフォルトカードに設定できます。\n\n```sh\ndefaultCard(\"cus_XXXXXX\", \"seti_XXXX\");\n```\n\n# カード登録情報確認\n\n以下のサイトにて、カード登録したカスタマーを選択すると、「支払い方法」にカード情報の登録が確認できます。\n\n[https://dashboard.stripe.com/test/customers](https://dashboard.stripe.com/test/customers)\n\n![](/images/2022-08-16-100000/20220806164908.png)\n\n# 公式ドキュメント\n\n公式ドキュメントは以下をご参照ください。\n\nhttps://stripe.com/docs/api/subscriptions/update#update_subscription-default_payment_method\n"])</script><script>self.__next_f.push([1,"53:T13bc,"])</script><script>self.__next_f.push([1,"\n# 前提\n\n本記事は以下の記事の続きです。\n\nまだ、ご覧になっていない方は、以下の記事からご確認をお願いいたします。\n\n`Node.jsでStripeのカスタマー（顧客）の支払い方法の設定方法（クライアントシークレット取得）　stripe.setupIntents.create【1/2】`\n\n# 公開可能キーを取得\n\n以下のURLにアクセスし、「公開可能キー」を取得する。\n\n[https://dashboard.stripe.com/test/apikeys](https://dashboard.stripe.com/test/apikeys)\n\n![](/images/2022-08-15-100000/20220806161431.png)\n\n# HTML/JavaScriptのプロジェクト構成\n\n```sh\nproject\n┗ sample\n　　　　　　┣ index.html\n　　　　　　┣ index.js\n　　　　　　┗ finish\n　　　　　　　　　　　　┗ index.html\n```\n\n# ソースコードの用意\n\n## project/sample/index.html\n\nソースコードの全量は以下です。\n\n重要なのは以下のポイントです。\n\n- StripeのCDNを読み込む必要がある。\n「``」\n\n- jQueryのCDNを読み込む必要がある。（ajaxを使用する用途ですが、必須ではありません）\n「``」\n\n- 「form」の中にhtmlが追加されていくため、idなどはJavaScriptと紐づいている必要がある。\n※書き換える場合は、注意してください。\n\n- 「`index.js`」の読み込みは「`body`」の閉じタグの直前である必要があります。\n※headなどではダメです。（カード入力フォームが読み込まれません）\n\n```html\n\u003chtml lang=\"ja\"\u003e\n  \u003chead\u003e\n    \u003cmeta charset=\"UTF-8\" /\u003e\n    \u003cscript src=\"https://js.stripe.com/v3/\"\u003e\u003c/script\u003e\n    \u003cscript src=\"https://ajax.googleapis.com/ajax/libs/jquery/3.2.1/jquery.min.js\"\u003e\u003c/script\u003e\n  \u003c/head\u003e\n  \u003cbody\u003e\n    \u003cform id=\"payment-form\"\u003e\n\n      \u003cbutton id=\"submit\"\u003e登録する\u003c/button\u003e\n    \u003c/form\u003e\n    \u003cscript src=\"./index.js\"\u003e\u003c/script\u003e\n  \u003c/body\u003e\n\u003c/html\u003e\n```\n\n## project/sample/index.js\n\nソースコードの全量は以下です。\n\n重要なのは以下のポイントです。\n\n- 以下のAPI呼び出しは、前の記事の、クライアントシークレット取得のAPIを実行してください。\n`https://example.com/xxxxx/yyyyy`\n\n- 「`pk_test_XXXXXXXXXX`」は「`公開可能キーを取得`」で取得した内容に置き換えてください。\n\n```javascript\n$.ajax({\n  type: \"GET\",\n  url: \"https://example.com/xxxxx/yyyyy\",\n  data: {},\n  dataType: \"json\",\n}).done((data) =\u003e {\n  // APIから取得したクライアントシークレット\n  const client_secret = data.client_secret;\n\n  const stripe = Stripe(\"pk_test_XXXXXXXXXX\");\n\n  const elements = stripe.elements({\n    clientSecret: client_secret,\n    appearance: {\n      theme: \"stripe\",\n    },\n  });\n\n  const paymentElement = elements.create(\"payment\");\n  paymentElement.mount(\"#payment-element\");\n  const form = document.getElementById(\"payment-form\");\n\n  form.addEventListener(\"submit\", async (event) =\u003e {\n    event.preventDefault();\n    const { error } = await stripe.confirmSetup({\n      elements,\n      confirmParams: {\n        return_url: `${location.protocol}//${location.host}/sample/finish/`,\n      },\n    });\n\n    if (error) {\n      const messageContainer = document.querySelector(\"#error-message\");\n      messageContainer.textContent = error.message;\n    }\n  });\n});\n```\n\n## project/sample/finish/index.html\n\nソースコードの全量は以下です。\n\n特に注意する必要はありません。\n\n適当なhtmlを用意してください。\n\n```html\n\u003chtml lang=\"ja\"\u003e\n  \u003chead\u003e\n    \u003cmeta charset=\"UTF-8\" /\u003e\n  \u003c/head\u003e\n  \u003cbody\u003e\n    クレジットカード登録完了\n  \u003c/body\u003e\n\u003c/html\u003e\n```\n\n# アクセス確認\n\nVSCodeなどでローカルサーバーを起動して、「`http://localhost:3000/sample/`」にアクセスします。\n\n![](/images/2022-08-15-100000/20220806162803.png)\n\n画面にて、以下の操作を行います。\n\n- カード番号に「4242424242424242」を入力します。\n\n- 有効期限には有効な日付（12/34）を入力します。\n\n- CVCには適当な数字を入力します。\n\n- 登録ボタンを押下します。\n\n画面遷移後、URLバーに以下のようなURLが入っています。\n\n「`redirect_status`」の部分が「`succeeded`」なら、登録成功です。\n\n```\nhttp://localhost:3000/sample/finish/index.html?setup_intent=seti_XXXX\u0026setup_intent_client_secret=seti_XXXX_secret_YYYY\u0026redirect_status=succeeded\n```\n\ omer) =\u003e {\n    if (err) {\n      console.log(err);\n      callback(false);\n    } else {\n      console.log(customer);\n      callback(true, customer);\n    }\n  });\n};\n```\n\n用意した関数を以下の様に実行する事で、アカウントが作成できます。\n\n```javascript\ncreate({ email: \"hoge@example.com\", description: \"hoge\" }, (r, cus) =\u003e {\n  console.log(r);\n  console.log(cus);\n});\n```\n\nカスタマーのアカウント作成時に登録できる情報は以下の公式ドキュメントをご参照ください。\n\nhttps://stripe.com/docs/api/customers/create\n\n# 作成したアカウントの確認方法\n\n以下のStripeのダッシュボードで作成したカスタマーの情報は確認が可能です。\n\n[https://dashboard.stripe.com/test/customers](https://dashboard.stripe.com/test/customers)\n"])</script><script>self.__next_f.push([1,"58:T7e6,"])</script><script>self.__next_f.push([1,"\n# 前提\n\n以下の環境の前提で記載する。\n\nIPアドレス：999.99.99.999\n\n# 公開鍵を設定\n\nMacにて、SSHディレクトリに移動する。\n\n```sh\ncd ~/.ssh\n```\n\nSSH鍵を作成する。\n\n```sh\nssh-keygen -t rsa -b 2048\n```\n\n以下の質問にそれぞれ回答を行う。\n\n```sh\nEnter file in which to save the key (/Users/nakkann/.ssh/id_rsa): [ファイル名]\nEnter passphrase (empty for no passphrase): [パスワード（空でもOK）]\nEnter same passphrase again: [パスワードの確認]\n```\n\n本記事では、以下の例で記載する。\n\n```sh\nEnter file in which to save the key (/Users/nakkann/.ssh/id_rsa): example_com\nEnter passphrase (empty for no passphrase): [空でそのままEnter]\nEnter same passphrase again: [空でそのままEnter]\n```\n\nSSH鍵をサーバーに配置する。\n\n```sh\nscp [ファイル名].pub root@[IPアドレス]:~/.ssh/authorized_keys\n```\n\n本記事の環境の場合は以下のコマンドになる。\n\n```sh\nscp example_com.pub root@999.99.99.999:~/.ssh/authorized_keys\n```\n\n# 鍵を使用してSSHログイン\n\n以下のコマンドでSSHアクセスする。\n\n```sh\nssh root@[IPアドレス] -i ~/.ssh/[ファイル名]\n```\n\n本記事の環境の場合は以下のコマンドになる。\n\n```sh\nssh root@999.99.99.999 -i ~/.ssh/example_com\n```\n\n# configに環境を設定\n\n以下のコマンドでconfigファイルを編集する。\n\n```sh\nvi ~/.ssh/config\n```\n\n以下の内容を記載する。\n\n```sh\nHost [任意の名前]\n     HostName 999.99.99.999\n     Port 22\n     User root\n     IdentityFile ~/.ssh/[ファイル名]\n```\n\n本記事の環境の場合は以下のコマンドになる。\n\n```sh\nHost example_com\n     HostName 999.99.99.999\n     Port 22\n     User root\n     IdentityFile ~/.ssh/example_com\n```\n\n# configの設定を使用したSSHログイン\n\n以下のコマンドでSSHログインを行う。\n\n```sh\nssh [任意の名前]\n```\n\n本記事の環境の場合は以下のコマンドになる。\n\n```sh\nssh example_com\n```\n"])</script><script>self.__next_f.push([1,"59:T6e3,"])</script><script>self.__next_f.push([1,"\n# はじめに\n\nReactなどのフレームワークを使用していない純粋なHTML/JavaScriptで共通関数を使用する方法を記載します。\n\n# プロジェクト構成\n\nプロジェクトの構成は以下とします。\n\n```sh\nproject\n┣ index.html\n┣ index.js\n┗ common.js\n```\n\n# 共通関数の定義\n\n「`common.js`」に以下のように定数を定義します。\n\nここでは、「`hello`」「`sample`」の２つの関数を定義しています。\n\nhelloはコンソール出力、smapleは戻り値がある関数です。\n\n必ず、最初に「`window.globalFunction = {};`」を記載して初期化することを忘れない様にしてください。\n\n```javascript\nwindow.globalFunction = {};\n\nwindow.globalFunction.hello = () =\u003e {\n  console.log(\"ハロー\");\n};\n\nwindow.globalFunction.sample = () =\u003e {\n  return \"サンプル\";\n};\n```\n\n# 共通関数の実行\n\n「`index.js`」に以下のように定数を定義します。\n\n「`hello`」「`sample`」の２つの関数を実行してコンソール出力しています。\n\n```javascript\nwindow.globalFunction.hello();\nconsole.log(window.globalFunction.sample());\n```\n\n# HTMLで呼び出し\n\n「`index.html`」に以下のように定数を定義します。\n\nグローバル定数定義のJSファイルをインポートする必要がある点が注意です。\n\n```javascript\n\u003c!DOCTYPE html\u003e\n\u003chtml lang=\"ja\"\u003e\n  \u003chead\u003e\n    \u003ctitle\u003e\u003c/title\u003e\n    \u003cmeta charset=\"UTF-8\" /\u003e\n    \u003cscript src=\"./common.js\"\u003e\u003c/script\u003e\n    \u003cscript src=\"./index.js\"\u003e\u003c/script\u003e\n  \u003c/head\u003e\n\n  \u003cbody\u003e\u003c/body\u003e\n\u003c/html\u003e\n```\n\n以下のGitHubにソースコードをアップしていますので、実際に確認したい方はPullしてご確認ください。\n\nhttps://github.com/Reigle/common_func_js\n"])</script><script>self.__next_f.push([1,"5a:T70d,"])</script><script>self.__next_f.push([1,"\n# 利用用途\n\n自分で生成したパスワードで各サイトのパスワードを設定しても良いですが、\n\nシステム的には、パスワードを生成してメールを送信し、ユーザーが自分でパスワードを変更したいなどで利用するケースがあります。\n\nここでは、JavaScriptだけを使用した簡単なパスワード生成方法を記載します。\n\n乱数で文字列を取得して返却するだけのものです。\n\n# 8文字で、アルファベットの大/小文字と数字のパスワード生成\n\n一般的によくある8文字で、アルファベットの大/小文字と数字組み合わせのパスワード生成は以下です。\n\n```javascript\nconst createPassword = () =\u003e {\n    var alphabet = 'abcdefghijklmnopqrstuvwxyz';\n    var alphabetUpper = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';\n    var numbers = '0123456789';\n\n    var passBase  = alphabet + alphabetUpper + numbers;\n\n    var len = 8; // 8桁\n    var password='';\n\n    for (var i = 0; i \u003c len; i++) {\n        password += passBase.charAt(Math.floor(Math.random() * passBase.length));\n    }\n\n    return password;\n}\n\nconsole.log(createPassword());\n```\n\n# 記号を含めたパスワード生成\n\n記号を含めたパスワード生成は以下です。\n\n```javascript\nconst createPassword = () =\u003e {\n    var alphabet = 'abcdefghijklmnopqrstuvwxyz';\n    var alphabetUpper = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';\n    var symbol = '!#$%()=-^¥[@]:;{}_/.'\n    var numbers = '0123456789';\n\n    var passBase  = alphabet + alphabetUpper + numbers + symbol;\n\n    var len = 8; // 8桁\n    var password='';\n\n    for (var i = 0; i \u003c len; i++) {\n        password += passBase.charAt(Math.floor(Math.random() * passBase.length));\n    }\n\n    return password;\n}\n\nconsole.log(createPassword());\n```\n"])</script><script>self.__next_f.push([1,"5b:Tba1,"])</script><script>self.__next_f.push([1,"\n# メディアクエリとは\n\n表示された画面環境に応じて適用するスタイルを切り替える機能。\n\n一つのページで複数の異なる表示環境に対応するレスポンシブWebデザインを実現することができる。\n\nよく使用される例としては、PC版とスマホ版のCSSを分けたい場合などに使用します。\n\n# 事前準備\n\nHTMLのヘッダータグ内に、以下のメタタグを追加します。\n\n```javascript\n\u003cmeta name=\"viewport\" content=\"width=device-width,initial-scale=1\"\u003e\n```\n\n# スマホにのみCSSを設定する方法\n\n以下の様に、メディアクエリを設定する事で、スマホにのみ設定できるCSSを記載できます。\n\n一例で「`sp_font`」のCSSを記載していますが、このクラスが設定されていてもスマホ以外はフォントサイズのCSSが反映されません。\n\n```css\n@media only screen and (max-width: 479px) {\n    /* スマートフォン用のCSS */\n    .sp_font {\n        font-size: 12px;\n    }\n}\n```\n\n# タブレットにのみCSSを設定する方法\n\n以下の様に、メディアクエリを設定する事で、タブレットにのみ設定できるCSSを記載できます。\n\n一例で「`tab_font`」のCSSを記載していますが、このクラスが設定されていてもタブレット以外はフォントサイズのCSSが反映されません。\n\n```css\n@media only screen and (min-width:479px) and (max-width:768px) {\n    /* タブレット用のCSS */\n    .tab_font {\n        font-size: 16px;\n    }\n}\n```\n\n# PCにのみCSSを設定する方法\n\n以下の様に、メディアクエリを設定する事で、PCにのみ設定できるCSSを記載できます。\n\n一例で「`tab_font`」のCSSを記載していますが、このクラスが設定されていてもPC以外はフォントサイズのCSSが反映されません。\n\n```css\n@media only screen and (min-width: 1200px) {\n    /* PC用のCSS */\n    .pc_font {\n        font-size: 18px;\n    }\n}\n```\n\n# 問題点\n\nこの記事で記載しているメディアクエリはブラウザの横幅からデバイスを判定しています。\n\nそのため、PCでもウィンドウを小さくすればスマホのCSSが当たります。\n\nまた、今後、とてもデカいタブレットが出てきた場合は、そのタブレットにPCのCSSが当たる場合もあります。\n\n# まとめ\n\n以下に各デバイスごとのCSSをまとめて記載します。\n\n```css\n/* 全てに使用されるCSS */\n.all_font {\n    font-size: 20px;\n}\n\n@media only screen and (min-width: 1200px) {\n    /* PC用のCSS */\n    .pc_font {\n        font-size: 18px;\n    }\n}\n\n@media only screen and (min-width:479px) and (max-width:768px) {\n    /* タブレット用のCSS */\n    .tab_font {\n        font-size: 16px;\n    }\n}\n\n@media only screen and (max-width: 479px) {\n    /* スマートフォン用のCSS */\n    .sp_font {\n        font-size: 12px;\n    }\n}\n```\n"])</script><script>self.__next_f.push([1,"5c:Tc7d,"])</script><script>self.__next_f.push([1,"\n# 環境\n\nVPS環境を想定して記載する。\n\n各種環境は以下とするので、読み替えて下さい。\n\nIP：999.99.99.999\n\nドメイン：example.com\n\n# サーバー環境準備\n\nサーバーにSSH接続\n\n```sh\nssh root@999.99.99.999\n```\n\n必要なパッケージのインストール\n\n```sh\nyum install yum-utils\nyum install https://dl.fedoraproject.org/pub/epel/epel-release-latest-7.noarch.rpm\nyum install http://rpms.remirepo.net/enterprise/remi-release-7.rpm\n```\n\n# nginxの環境構築\n\n## nginxのインストール\n\nnginxのインストール用の定義を記載するために、以下のコマンドを実行する。\n\n```sh\nvi /etc/yum.repos.d/nginx.repo\n```\n\n「`/etc/yum.repos.d/nginx.repo`」の内容は以下を記載する。\n\n```sh\n[nginx]\nname=nginx stable repo\nbaseurl=http://nginx.org/packages/centos/$releasever/$basearch/\ngpgcheck=1\nenabled=0\ngpgkey=https://nginx.org/keys/nginx_signing.key\n```\n\n以下のコマンドでnginxのインストールを実行する。\n\n```sh\nyum-config-manager --enable nginx\nyum install nginx\n```\n\n## nginxの起動、自動起動設定\n\n以下のコマンドでnginxの起動と、サーバー再起動後の自動起動の設定を行う。\n\n```sh\nsystemctl start nginx\nsystemctl enable nginx\n```\n\n## nginxのバージョン非表示\n\nnginx のバージョンを表示にするための設定を行うために以下のコマンドを実行します。\n\n```sh\nvi /etc/nginx/nginx.conf\n```\n\nファイル内に、以下の記述を追加します。\n（用意されている「`http`」の中括弧の中に「`server_tokens off;`」を追加します。）\n\n```sh\nhttp {\n  ~~~~~省略~~~~~\n  server_tokens off;\n  ~~~~~省略~~~~~\n}\n```\n\nnginxを再起動して上記の設定を反映させます。\n\n```sh\nsystemctl restart nginx\n```\n\n# ファイアーウォールの設定\n\n以下のコマンドを実行して、「`http`」「`https`」のポートを解放します。\n\n```sh\nfirewall-cmd --add-service=http --zone=public --permanent\nfirewall-cmd --add-service=https --zone=public --permanent\nfirewall-cmd --reload\n```\n\n# Let's EncryptのSSL証明書の設定\n\n必要なパッケージのインストールを行います。\n\n```sh\nyum install certbot python2-certbot-nginx\n```\n\n以下で証明書の発行を行います。\n\n```sh\ncertbot --nginx certonly -d example.com\n```\n\n# nginxのHTTPSリダイレクト設定\n\n以下のコマンドでドメインの設定ファイルを修正します。\n\n```sh\nvi /etc/nginx/conf.d/example.com.conf\n```\n\n以下の内容を記載します。\n※Apatchと同じディレクトリ（`/var/www/html`）をルートにしていますが、各自で任意のディレクトリに変更して下さい。\n\n```sh\nserver {\n  listen 443 ssl;\n  server_name example.com;\n  root /var/www/html;\n  index  index.html;\n\n  ssl_certificate /etc/letsencrypt/live/example.com/fullchain.pem;\n  ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem;\n\n  ssl_prefer_server_ciphers on;\n}\n\nserver {\n  listen 80;\n  server_name example.com;\n\n  return 301 [https://$host$request_uri;](https://$host$request_uri;)\n}\n```\n\nnginxの再起動を実施します。\n\n```sh\nsystemctl restart nginx\n```\n"])</script><script>self.__next_f.push([1,"5d:T8b9,"])</script><script>self.__next_f.push([1,"\n# オブジェクト型とは\n\n以下の様な「`{}`」で囲われたKeyとValue（プロパティ）で構成されている変数（定数）の事です。\n\n```javascript\nconst obj = {\n  key1: 'val1',\n  key2: 'val2',\n  key3: 'val3',\n};\n```\n\n# オブジェクト型の宣言\n\n以下の様に通常の変数（定数）宣言の形式で宣言が可能です。\n\n「`{}`」で囲った「`Key: Value`」形式になります。\n\n```javascript\nconst obj = {\n  key1: 'val1',\n  key2: 'val2',\n  key3: 'val3',\n};\n```\n\n# オブジェクト型に値を追加\n\nオブジェクト型に値を追加する方法は「`オブジェクト変数名.Key名 = Value値`」の形式にする事で値の追加が可能です。\n\n```javascript\nconst obj = {\n  key1: 'val1',\n  key2: 'val2',\n  key3: 'val3',\n};\n\nobj.hogehoge = \"sample\";\n\nconsole.log(obj);\n/*\n{\n  key1: 'val1',\n  key2: 'val2',\n  key3: 'val3',\n  hogehoge: 'sample',\n}\n*/\n```\n\n# オブジェクト型に値を追加（Keyを変数にする方法）\n\n「`オブジェクト型に値を追加`」の方法では、Keyを変数から取得する事が出来ません。\n\n「`オブジェクト変数名[Keyの変数名] = Value値`」の形式にする事でKeyを変数から取得して追加が可能です。\n\n```javascript\nconst obj = {\n  key1: 'val1',\n  key2: 'val2',\n  key3: 'val3',\n};\n\nconst key = \"hogehoge\";\nobj[key] = \"sample\";\n\nconsole.log(obj);\n/*\n{\n  key1: 'val1',\n  key2: 'val2',\n  key3: 'val3',\n  hogehoge: 'sample',\n}\n*/\n```\n\n# オブジェクト型の値取得\n\nオブジェクト型から値を取得する場合には「`オブジェクト変数名.Key名`」「`オブジェクト変数名[Key名]`」のどちらかの方法で取得が可能です。\n\n```javascript\nconst obj = {\n  key1: 'val1',\n  key2: 'val2',\n  key3: 'val3',\n};\n\nconsole.log(obj.key1);\nconsole.log(obj['key1']);\n```\n\n# オブジェクト型から特定のプロパティ削除\n\nオブジェクト型からプロパティを削除する場合には「`delete オブジェクト変数名.Key名`」で削除する事が可能です。\n\n```javascript\nconst obj = {\n  key1: 'val1',\n  key2: 'val2',\n  key3: 'val3',\n};\n\ndelete obj.key1;\nconsole.log(obj);\n/*\n{\n  key2: 'val2',\n  key3: 'val3',\n}\n*/\n```\n"])</script><script>self.__next_f.push([1,"5e:T870,"])</script><script>self.__next_f.push([1,"\n# 事前準備\n\nスプレッドシートを作成し、シートを2つ用意する。\n\n参照用のシートには「`A1`」に任意の文字列を記載する。\n\n※「`サンプル`」シートを作成して、「`A1`」に「`A1`」という文字列を記載した例が以下です。\n\n![](/images/2022-07-23-100000/20220721102412.png)\n\n# 別シートの値を取得（INDIRECT関数）\n\n任意のセル（ここでは「`B2`」とする）に「`''サンプル'!A1`」と記載する。\n\n※表示したい文字列は「`'サンプル'!A1`」だが、スプレッドシートの特性上、１文字目に「`'`」を入れる場合には「`''`」とする必要がある。\n\n![](/images/2022-07-23-100000/20220721102707.png)\n\nINDIRECT関数を使用して、上記で用意したセルを参照する。\n\n```sh\n=INDIRECT(B2)\n```\n\n上記の関数を記載した結果、「`A1`」と表示されれば、「`サンプル`」シートの「`A1`」の文字が表示されている状態となる。\n\n![](/images/2022-07-23-100000/20220721102917.png)\n\n# INDIRECT関数内部を文字列結合して、別シートの値を取得\n\n「`別シートの値を取得（INDIRECT関数）`」で使用した「`INDIRECT関数`」は引数を文字列結合して使用する事が出来ます。\n\n「`B2`」にシート名のみ「`サンプル`」を記載し、「`C2`」に「`サンプル`」シートの取得したいセル名「`A1`」を記載する。\n\nINDIRECT関数を使用して、上記で用意したセルを参照する。\n\n```sh\n=INDIRECT(\"'\" \u0026 B2 \u0026 \"'!\" \u0026 C2)\n```\n\nこれで、「`別シートの値を取得（INDIRECT関数）`」と同様に「`A1`」が表示できれば成功です。\n\n![](/images/2022-07-23-100000/20220721103438.png)\n\n# まとめ\n\nINDIRECT関数で別シートの値を取得する方法は確認できたかと思います。\n\n「`INDIRECT関数内部を文字列結合して、別シートの値を取得`」に記載した様に、文字列結合が使えるため、セル名など、関数で作成して結合など、様々な使い方が出来ます。\n\n![](/images/2022-07-23-100000/20220721102415.png)\n"])</script><script>self.__next_f.push([1,"5f:T6e8,"])</script><script>self.__next_f.push([1,"\n目次\n\n# 九九をconsole.tableで表示する\n\nコンソールに以下の様な出力が行われます。\n\n![](/images/2022-07-21-100000/20220715231426.png)\n\nソースコードは以下です。\n\n```javascript\n\u003cbutton type=\"button\" onclick=\"consoleAction()\"\u003eコンソール表示\u003c/button\u003e\n\n\u003cscript\u003e\nfunction consoleAction(){\n    var arrayLeft = [1, 2, 3, 4, 5, 6, 7, 8, 9];\n    var arrayRight = [1, 2, 3, 4, 5, 6, 7, 8, 9];\n    var result = [];\n    for (var i = 0; i \u003c arrayLeft.length; i++ ) {\n        var row =[];\n        for (var j = 0; j \u003c arrayRight.length; j++) {\n            row.push(arrayLeft[i] * arrayRight[j]);\n        }\n        result.push(row);\n    }\n    console.table(result);\n}\n\u003c/script\u003e\n```\n\n以下のボタンを押下する事で、コンソールに出力されるので、お試しください。\n\nコンソール表示\n\n# 画面上にTableタグで九九を表示する\n\nソースコードは以下です。\n\n```javascript\n\u003ctable class=\"target\"\u003e\u003c/table\u003e\n\n\u003cscript\u003e\nkuku()\nfunction kuku(){\n    const x = 9;\n    const y = 9;\n    var target = document.querySelector(\".target\");\n    target.innerHTML = \"\";\n    var tr = document.createElement(\"tr\");\n    target.appendChild(tr);\n    for(var i=0;i\u003c=x; i++){\n        var th = document.createElement(\"th\");\n        tr.appendChild(th);\n        if ( i === 0 ) { continue; }\n        th.textContent = i;\n    }\n\n    for(var i=1; i\u003c=x; i++){\n        var tr = document.createElement(\"tr\");\n        target.appendChild(tr);\n        var th = document.createElement(\"th\");\n        tr.appendChild(th);\n        th.textContent = i;\n        for(var j=1; j\u003c=y; j++){\n            var td = document.createElement(\"td\");\n            tr.appendChild(td);\n            td.textContent = (i*j);\n        }\n    }\n}\n\u003c/script\u003e\n```\n"])</script><script>self.__next_f.push([1,"60:T194e,"])</script><script>self.__next_f.push([1,"\n目次\n\n# 今までの記述\n\nUINavigationControllerの背景色、文字色、下線非表示の今までのソースコードは以下です。\n\n```javascript\npublic class func setNavigationController(vc: UIViewController) -\u003e UINavigationController {\n    let nav = UINavigationController(rootViewController: vc)\n    //　ナビゲーションバーの背景色\n    nav.navigationBar.barTintColor = UIColor.red\n    // ナビゲーションバーのアイテムの色　（戻る　＜　とか　読み込みゲージとか）\n    nav.navigationBar.tintColor = UIColor.white\n    // ナビゲーションバーのテキストを変更する\n    nav.navigationBar.titleTextAttributes = [.foregroundColor: UIColor.white]\n    // ナビゲーションバーの透過禁止\n    nav.navigationBar.isTranslucent = false\n    nav.navigationBar.setBackgroundImage(UIImage(), for: UIBarMetrics.default)\n    // 下線非表示\n    nav.navigationBar.shadowImage = UIImage()\n\n    return nav\n}\n```\n\n# iOS15以降の背景色設定\n\niOS15以上で、背景色を設定する場合には、以下の定義を追加する必要があります。\n\n```javascript\nlet appearance = UINavigationBarAppearance()\n// 背景色\nappearance.titleTextAttributes = [.foregroundColor: UIColor.white]\nappearance.backgroundColor = UIColor.red\n\n// ナビゲーションバーに反映\nnav.navigationBar.standardAppearance = appearance\nnav.navigationBar.scrollEdgeAppearance = appearance\n```\n\n上記の記述を含めたソースは以下です。\n\n```javascript\npublic class func setNavigationController(vc: UIViewController) -\u003e UINavigationController {\n    let nav = UINavigationController(rootViewController: vc)\n    //　ナビゲーションバーの背景色\n    nav.navigationBar.barTintColor = UIColor.red\n    // ナビゲーションバーのアイテムの色　（戻る　＜　とか　読み込みゲージとか）\n    nav.navigationBar.tintColor = UIColor.white\n    // ナビゲーションバーのテキストを変更する\n    nav.navigationBar.titleTextAttributes = [.foregroundColor: UIColor.white]\n    // ナビゲーションバーの透過禁止\n    nav.navigationBar.isTranslucent = false\n    nav.navigationBar.setBackgroundImage(UIImage(), for: UIBarMetrics.default)\n    // 下線非表示\n    nav.navigationBar.shadowImage = UIImage()\n\n    if #available(iOS 15.0, *) {\n        let appearance = UINavigationBarAppearance()\n        // 背景色\n        appearance.titleTextAttributes = [.foregroundColor: UIColor.white]\n        appearance.backgroundColor = UIColor.red\n\n        // ナビゲーションバーに反映\n        nav.navigationBar.standardAppearance = appearance\n        nav.navigationBar.scrollEdgeAppearance = appearance\n    }\n\n    return nav\n}\n```\n\n# iOS15以降の下線非表示\n\niOS15以上で、下線を非表示に設定する場合には、以下の定義を追加する必要があります。\n\n```javascript\nlet appearance = UINavigationBarAppearance()\n// 下線非表示\nappearance.shadowImage = UIImage()\nappearance.shadowColor = .clear\n\n// ナビゲーションバーに反映\nnav.navigationBar.standardAppearance = appearance\nnav.navigationBar.scrollEdgeAppearance = appearance\n```\n\n上記の記述を含めたソースは以下です。\n\n```javascript\npublic class func setNavigationController(vc: UIViewController) -\u003e UINavigationController {\n    let nav = UINavigationController(rootViewController: vc)\n    //　ナビゲーションバーの背景色\n    nav.navigationBar.barTintColor = UIColor.red\n    // ナビゲーションバーのアイテムの色　（戻る　＜　とか　読み込みゲージとか）\n    nav.navigationBar.tintColor = UIColor.white\n    // ナビゲーションバーのテキストを変更する\n    nav.navigationBar.titleTextAttributes = [.foregroundColor: UIColor.white]\n    // ナビゲーションバーの透過禁止\n    nav.navigationBar.isTranslucent = false\n    nav.navigationBar.setBackgroundImage(UIImage(), for: UIBarMetrics.default)\n    // 下線非表示\n    nav.navigationBar.shadowImage = UIImage()\n\n    if #available(iOS 15.0, *) {\n        let appearance = UINavigationBarAppearance()\n        // 下線非表示\n        appearance.shadowImage = UIImage()\n        appearance.shadowColor = .clear\n\n        // ナビゲーションバーに反映\n        nav.navigationBar.standardAppearance = appearance\n        nav.navigationBar.scrollEdgeAppearance = appearance\n    }\n\n    return nav\n}\n```\n\n# iOS15以降のソースコードまとめ\n\niOS15以上で、背景色の設定と、下線の非表示を設定する場合には、以下の定義を追加する必要があります。\n\n```javascript\nlet appearance = UINavigationBarAppearance()\n// 下線非表示\nappearance.shadowImage = UIImage()\nappearance.shadowColor = .clear\n\n// 背景色\nappearance.titleTextAttributes = [.foregroundColor: UIColor.white]\nappearance.backgroundColor = UIColor.red\n\n// ナビゲーションバーに反映\nnav.navigationBar.standardAppearance = appearance\nnav.navigationBar.scrollEdgeAppearance = appearance\n```\n\n上記の記述を含めたソースは以下です。\n\n```javascript\npublic class func setNavigationController(vc: UIViewController) -\u003e UINavigationController {\n    let nav = UINavigationController(rootViewController: vc)\n    //　ナビゲーションバーの背景色\n    nav.navigationBar.barTintColor = UIColor.red\n    // ナビゲーションバーのアイテムの色　（戻る　＜　とか　読み込みゲージとか）\n    nav.navigationBar.tintColor = UIColor.white\n    // ナビゲーションバーのテキストを変更する\n    nav.navigationBar.titleTextAttributes = [.foregroundColor: UIColor.white]\n    // ナビゲーションバーの透過禁止\n    nav.navigationBar.isTranslucent = false\n    nav.navigationBar.setBackgroundImage(UIImage(), for: UIBarMetrics.default)\n    // 下線非表示\n    nav.navigationBar.shadowImage = UIImage()\n\n    if #available(iOS 15.0, *) {\n        let appearance = UINavigationBarAppearance()\n        // 下線非表示\n        appearance.shadowImage = UIImage()\n        appearance.shadowColor = .clear\n\n        // 背景色\n        appearance.titleTextAttributes = [.foregroundColor: UIColor.white]\n        appearance.backgroundColor = UIColor.red\n\n        // ナビゲーションバーに反映\n        nav.navigationBar.standardAppearance = appearance\n        nav.navigationBar.scrollEdgeAppearance = appearance\n    }\n    return nav\n}\n```\n"])</script><script>self.__next_f.push([1,"61:T14a8,"])</script><script>self.__next_f.push([1,"\n目次\n\n# AppTrackingTransparencyとは\n\nAppleの公式サイトより引用\n\n\u003cblockquote\u003e\n新規App、および既存Appのアップデートを提出するには、Appにおける特定のデータ収集方針に関する情報をプロダクトページに掲載する必要があります。また、iOS 14.5、iPadOS 14.5、tvOS 14.5以降では、他社が所有するAppやWebサイトでの行動をトラッキングする場合、ユーザーに許可を求めることが必要になります。\n\u003c/blockquote\u003e\n\nhttps://developer.apple.com/jp/app-store/user-privacy-and-data-use/\n\nつまり、広告が表示されていて、iOS14.5以降にリリース、アップデートするアプリには必須の権限確認処理になります。\n\n# 「Info.plist」の設定\n\n「Property List」での編集の場合、「`Privacy - Tracking Usage Description`」を追加して、値に任意の文言を設定します。\n\n「Source Code」での編集の場合、以下を追加し、「``」内に任意の文言を設定します。\n\n```javascript\n\u003ckey\u003eNSUserTrackingUsageDescription\u003c/key\u003e\n\u003cstring\u003eダイアログに表示される任意の文言\u003c/string\u003e\n```\n\n# 広告パーミッション確認の表示方法\n\n以下のインポートを記載し、「`AppTrackingTransparency`」のライブラリをインポートします。\n\n```javascript\nimport AppTrackingTransparency\n```\n\n以下の様に記述することで、広告が表示される前の時点で、権限確認ダイアログが表示されます。\n\n```javascript\nATTrackingManager.requestTrackingAuthorization(completionHandler: { status in\n    // ここで広告表示処理を実施\n})\n```\n\n# iOS14以前をサポートする場合\n\n以下のようにiOS14以降と、以前とで広告表示処理を分ける事で対応が可能です。\n\n```javascript\nif #available(iOS 14, *) {\n    ATTrackingManager.requestTrackingAuthorization(completionHandler: { status in\n        // ここで広告表示処理を実施\n    })\n} else {\n    // ここで広告表示処理を実施\n}\n```\n\n# 広告表示処理周りのサンプル\n\n以下、画面下部に表示されるバナー広告の表示処理周りのサンプルです。\n\n「`AD_MOB_BANNER_ID`」は各自のバナーIDなので、それぞれで置き換えてください。\n\n```swift\nimport Foundation\nimport UIKit\nimport GoogleMobileAds\nimport AppTrackingTransparency\n\nclass GoogleAdUtil {\n    class func addBannerAd(vc: UIViewController) -\u003e GADBannerView {\n        let bannerView = GADBannerView(adSize: GADAdSizeBanner)\n\n        if #available(iOS 14, *) {\n            ATTrackingManager.requestTrackingAuthorization(completionHandler: { status in\n                DispatchQueue.main.async {\n                    bannerView.adUnitID = AD_MOB_BANNER_ID\n                    bannerView.rootViewController = vc\n\n                    bannerView.translatesAutoresizingMaskIntoConstraints = false\n                    vc.view.addSubview(bannerView)\n                    vc.view.addConstraints(\n                        [NSLayoutConstraint(item: bannerView,\n                                            attribute: .bottom,\n                                            relatedBy: .equal,\n                                            toItem: vc.view.safeAreaLayoutGuide,\n                                            attribute: .bottom,\n                                            multiplier: 1,\n                                            constant: 0),\n                         NSLayoutConstraint(item: bannerView,\n                                            attribute: .centerX,\n                                            relatedBy: .equal,\n                                            toItem: vc.view,\n                                            attribute: .centerX,\n                                            multiplier: 1,\n                                            constant: 0)\n                    ])\n                    bannerView.delegate = vc as? GADBannerViewDelegate\n                    bannerView.load(GADRequest())\n                }\n            })\n        } else {\n            bannerView.adUnitID = AD_MOB_BANNER_ID\n            bannerView.rootViewController = vc\n\n            bannerView.translatesAutoresizingMaskIntoConstraints = false\n            vc.view.addSubview(bannerView)\n            vc.view.addConstraints(\n                [NSLayoutConstraint(item: bannerView,\n                                    attribute: .bottom,\n                                    relatedBy: .equal,\n                                    toItem: vc.view.safeAreaLayoutGuide,\n                                    attribute: .bottom,\n                                    multiplier: 1,\n                                    constant: 0),\n                 NSLayoutConstraint(item: bannerView,\n                                    attribute: .centerX,\n                                    relatedBy: .equal,\n                                    toItem: vc.view,\n                                    attribute: .centerX,\n                                    multiplier: 1,\n                                    constant: 0)\n            ])\n\n            bannerView.delegate = vc as? GADBannerViewDelegate\n            bannerView.load(GADRequest())\n        }\n        return bannerView\n    }\n}\n```\n"])</script><script>self.__next_f.push([1,"62:T1766,"])</script><script>self.__next_f.push([1,"\n目次\n\n# 事前準備\n\n以下の記事の内容が完了している前提で本記事を記載しています。\n\nまだの方は、以下から進めてください。\n\n[React(TypeScript)\u0026#x30D7;\u0026#x30ED;\u0026#x30B8;\u0026#x30A7;\u0026#x30AF;\u0026#x30C8;\u0026#x306E;\u0026#x4F5C;\u0026#x6210;\u0026#x65B9;\u0026#x6CD5;\u0026#xFF08;Docker\u0026#x3001;ESLint\u0026#x3001;Prettier\u0026#x3001;WebPack\u0026#xFF09;\u0026#x3010;3/4\u0026#x3011; - Reigle \u0026#x6280;\u0026#x8853;\u0026#x30D6;\u0026#x30ED;\u0026#x30B0;](https://reigle.info/entry/2022/07/14/100000)\n\n# WebPack\n\n必要なWebPackのライブラリをインストールする\n\n```javascript\nnpm install --save-dev webpack webpack-cli webpack-dev-server\n```\n\n必要なloader系のライブラリをインストールする\n\n```javascript\nnpm install --save-dev babel-loader @babel/preset-react ts-loader style-loader css-loader react-svg-loader\n```\n\nプロジェクトのルートに「`webpack.config.js`」を作成し、内容に以下を記載する。\n\n※内容はサンプルなので、必要な設定を定義すること。\n\n```javascript\nconst path = require('path');\nconst HtmlWebpackPlugin = require('html-webpack-plugin');\nconst { LoaderOptionsPlugin } = require('webpack');\n\nmodule.exports = () =\u003e {\n  return {\n    mode: 'development',\n    context: __dirname,\n    devtool: 'inline-source-map', //sourceMapを出力する\n    entry: [\n      path.join(__dirname, 'src/index.tsx'),\n    ],\n    output: {\n      path: path.resolve(__dirname, 'build'),\n      filename: 'bundle.js',\n      publicPath: '/',\n    },\n    cache: true,\n    plugins: [\n      new LoaderOptionsPlugin({\n        debug: true\n      }),\n      new HtmlWebpackPlugin({ //reactのテンプレートを読み込む\n        template: './public/index.html',\n        filename: 'index.html',\n        favicon: './public/favicon.ico',\n        manifest: './public/manifest.json',\n      }),\n    ],\n    resolve: {\n      alias: {\n        \"react-draftjs-editor\": path.join(__dirname, '..', 'src/index.tsx'),\n      },\n      extensions: ['.json', '.js', '.jsx', '.ts', '.tsx'],\n    },\n    devServer: { // SPA対策\n      historyApiFallback: true,\n    },\n    module: {\n      rules: [{\n        test: /\\.(js|ts|tsx)$/,\n        use: {\n          loader: 'babel-loader',\n        },\n        exclude: /node_modules/,\n        include: [\n          __dirname,\n          path.join(__dirname, '..', 'src'),\n        ],\n      }, {\n        test: /\\.(ts|tsx)$/,\n        exclude: /node_modules/,\n        include: [\n          path.resolve(__dirname, 'src'),\n        ],\n        use: {\n          loader: 'ts-loader',\n        }\n      }, {\n        test: /\\.css$/, // cssのファイル読み込みモジュールを指定\n        use: [\"style-loader\", \"css-loader\"]\n      },\n      {\n        test: /\\.svg$/,\n        use: [{\n          loader: \"babel-loader\"\n        }, {\n          loader: \"react-svg-loader\",\n          options: {\n            jsx: true // true outputs JSX tags\n          }\n        }]\n      }\n    ]}\n  }\n};\n```\n\nプロジェクトのルートの「`package.json`」の「`scripts`」を以下の様に修正する。\n\n```javascript\n\"scripts\": {\n  \"start\": \"webpack-dev-server --config webpack.config.js --port 3000 --progress --profile --static src/\",\n  \"build\": \"react-scripts build\",\n  \"test\": \"react-scripts test\",\n  \"eject\": \"react-scripts eject\"\n},\n```\n\nプロジェクトのルートの「`tsconfig.json`」を以下の様に修正する。\n\n※内容はサンプルなので、必要な設定を定義すること。\n\n```javascript\n{\n  \"compilerOptions\": {\n    \"target\": \"es5\",\n    \"lib\": [\"dom\", \"dom.iterable\", \"esnext\"],\n    \"allowJs\": true,\n    \"skipLibCheck\": true,\n    \"esModuleInterop\": true,\n    \"allowSyntheticDefaultImports\": true,\n    \"strict\": true,\n    \"forceConsistentCasingInFileNames\": true,\n    \"noFallthroughCasesInSwitch\": true,\n    \"module\": \"esnext\",\n    \"moduleResolution\": \"node\",\n    \"resolveJsonModule\": true,\n    \"isolatedModules\": true,\n    \"jsx\": \"react-jsx\",\n    \"incremental\": true,\n    \"sourceMap\": true,\n    \"removeComments\": true,\n    \"experimentalDecorators\": true,\n    \"baseUrl\": \"./src\",\n  },\n  \"include\": [\"src\"],\n  \"exclude\": [\"node_modules\"]\n}\n```\n\nプロジェクトの「`public/index.html`」を以下の様に修正する。\n\n※不要な定義の削除\n\n```javascript\n\u003c!DOCTYPE html\u003e\n\u003chtml lang=\"en\"\u003e\n  \u003chead\u003e\n    \u003cmeta charset=\"utf-8\" /\u003e\n    \u003clink rel=\"icon\" href=\"%PUBLIC_URL%/favicon.ico\" /\u003e\n    \u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1\" /\u003e\n    \u003cmeta name=\"theme-color\" content=\"#000000\" /\u003e\n    \u003cmeta\n      name=\"description\"\n      content=\"Web site created using create-react-app\"\n    /\u003e\n    \u003ctitle\u003eReact App\u003c/title\u003e\n  \u003c/head\u003e\n  \u003cbody\u003e\n    \u003cnoscript\u003eYou need to enable JavaScript to run this app.\u003c/noscript\u003e\n\n  \u003c/body\u003e\n\u003c/html\u003e\n```\n\nプロジェクトの「`src/App.tsx`」を以下の様に修正する。\n\n```javascript\nimport React from 'react';\nimport logo from './logo.svg';\n// import './App.css';\n\nfunction App() {\n  return (\n\n      \u003cheader className=\"App-header\"\u003e\n        {/* \u003cimg src={logo} className=\"App-logo\" alt=\"logo\" /\u003e */}\n\nEdit `src/App.tsx` and save to reload.\n\n        [Learn React](https://reactjs.org)\n      \u003c/header\u003e\n\n  );\n}\n\nexport default App;\n```\n\nプロジェクトの「`.eslintrc.js`」の「`ignorePatterns`」を以下の様に修正する。\n\n```javascript\n\"ignorePatterns\": [\n  \"**/public/*\",\n  \"**/node_modules/*\",\n  \"**/.vscode/*\",\n  \".eslintrc.js\",\n  \".prettierrc.js\",\n  \"webpack.config.js\",\n],\n```\n\nプロジェクトの「`.prettierignore`」に以下を追加する。\n\n```javascript\nwebpack.config.js\n```\n\n以下でプロジェクトを実行し、エラーが発生しなければ完成です。\n\n```javascript\ndocker-compose up\n```\n\n# 完成\n\n以上でプロジェクトのテンプレートは完成です。\n完成版のソースコードは以下なので、クローンして各自でご利用ください。\n※それぞれ、お好きなようにカスタマイズしてください。\n\nhttps://github.com/Reigle/react-typescript-template/tree/template_5\n"])</script><script>self.__next_f.push([1,"63:T1014,"])</script><script>self.__next_f.push([1,"\n目次\n\n# 事前準備\n\n以下の記事の内容が完了している前提で本記事を記載しています。\n\nまだの方は、以下から進めてください。\n\n[React(TypeScript)\u0026#x30D7;\u0026#x30ED;\u0026#x30B8;\u0026#x30A7;\u0026#x30AF;\u0026#x30C8;\u0026#x306E;\u0026#x4F5C;\u0026#x6210;\u0026#x65B9;\u0026#x6CD5;\u0026#xFF08;Docker\u0026#x3001;ESLint\u0026#x3001;Prettier\u0026#x3001;WebPack\u0026#xFF09;\u0026#x3010;2/4\u0026#x3011; - Reigle \u0026#x6280;\u0026#x8853;\u0026#x30D6;\u0026#x30ED;\u0026#x30B0;](https://reigle.info/entry/2022/07/13/100000)\n\n# Prettier\n\n```javascript\nnpm install --save-dev prettier eslint-config-prettier\n```\n\n# ESLintの設定修正\n\n```javascript\nmodule.exports = {\n  \"env\": {\n    \"browser\": true,\n    \"es2021\": true\n  },\n  \"extends\": [\n    \"eslint:recommended\",\n    \"plugin:react/recommended\",\n    \"plugin:@typescript-eslint/recommended\",\n    'prettier',\n  ],\n  \"parser\": \"@typescript-eslint/parser\",\n  \"parserOptions\": {\n    \"ecmaFeatures\": {\n      \"jsx\": true\n    },\n    \"ecmaVersion\": \"latest\",\n    \"sourceType\": \"module\"\n  },\n  \"plugins\": [\n    \"react\",\n    \"react-hooks\",\n    \"@typescript-eslint\"\n  ],\n  \"rules\": {\n  },\n  \"overrides\": [\n    {\n        \"files\": [\"**/*.tsx\"],\n        \"rules\": {\n            \"react/prop-types\": \"off\"\n        }\n    }\n  ],\n  \"settings\": {\n    \"react\": {\n      \"version\": \"detect\"\n    },\n  },\n  // eslintの対象外ファイル\n  \"ignorePatterns\": [\n    \"**/public/*\",\n    \"**/node_modules/*\",\n    \"**/.vscode/*\",\n    \".eslintrc.js\",\n    \".prettierrc.js\",\n  ],\n}\n```\n\n# コマンドでPrettierの整形を行う\n\n以下のコマンドを実行する事で、「`src`」ディレクトリ配下の全てのファイルをPrettierで整形できる。\n\n```javascript\n./node_modules/.bin/prettier --write src/*\n```\n\n# VSCodeでPrettierを実行する\n\nVSCode の拡張機能の「Prettier - Code formatter」をインストールする\n\nhttps://marketplace.visualstudio.com/items?itemName=esbenp.prettier-vscode\n\nVSCodeで「command + ,」のショートカットを実行し、「format on save」を検索する。\n\n検索された項目の「Editor: format on save」にチェックを入れる。\n\n![](/images/2022-07-14-100000/20220708122112.png)\n\n「`.vscode/settings.json`」の内容を以下の様に修正す es/.bin/eslint ./src/.\n```\n\n# VSCodeでESLintのチェックを起動する\n\nVSCode の拡張機能の「ESLint」をインストールする\n\nhttps://marketplace.visualstudio.com/items?itemName=dbaeumer.vscode-eslint\n\nプロジェクトのルートに「`.vscode`」ディレクトリを作成し、その配下に「`settings.json`」を作成する。\n\n「`settings.json`」の内容は以下とする。\n\n```javascript\n{\n    \"eslint.validate\": [\n        \"javascript\",\n        \"javascriptreact\",\n        \"typescript\",\n        \"typescriptreact\"\n    ]\n}\n```\n\n本記事の全ての内容（VSCodeの設定など）を含んだソースコードは以下のGitHubにアップしています。\n\nhttps://github.com/Reigle/react-typescript-template/tree/template_3\n\n続きは以下の記事です。\n\n[React(TypeScript)\u0026#x30D7;\u0026#x30ED;\u0026#x30B8;\u0026#x30A7;\u0026#x30AF;\u0026#x30C8;\u0026#x306E;\u0026#x4F5C;\u0026#x6210;\u0026#x65B9;\u0026#x6CD5;\u0026#xFF08;Docker\u0026#x3001;ESLint\u0026#x3001;Prettier\u0026#x3001;WebPack\u0026#xFF09;\u0026#x3010;3/4\u0026#x3011; - Reigle \u0026#x6280;\u0026#x8853;\u0026#x30D6;\u0026#x30ED;\u0026#x30B0;](https://reigle.info/entry/2022/07/14/100000)\n"])</script><script>self.__next_f.push([1,"65:T1a06,"])</script><script>self.__next_f.push([1,"\n目次\n\n# 前提\n\nNode.jsの環境が用意されていること。\n\nまだの人は以下からNode.jsをインストールしておいてください。\n\nhttps://reigle.info/entry/2020/04/29/000000_2\n\n# Reactのプロジェクト作成環境の用意\n\n以下のコマンドを実行し、`yarn`をインストールする\n\n```\nnpm install --global yarn\n```\n\n以下のコマンドを実行し、`create-react-app`をインストールする\n\n```\nyarn global add create-react-app\n```\n\n# Reactプロジェクトに「TypeScript」の設定をしてプロジェクト作成\n\n以下のコマンドを実行し、プロジェクトを作成する\n\n「`[プロジェクト名]`」は各自で設定すること\n\n```\nnpx create-react-app [プロジェクト名] --template typescript\n```\n\n上記のように「`template`」オプションで「`typescript`」を指定するだけで、TypeScriptが設定されたReactプロジェクトが作成できる\n\n# Dockerの組み込み\n\n以下のDockerの公式サイトから、`Docker Desktop`アプリをインストールする。\n\nインストール後は手順に沿って、`Docker Desktop`を起動して確認してください。\n\nhttps://docs.docker.com/desktop/mac/install/\n\n以下のコマンドを実行して、Dockerのバージョンが表示されればDockerの準備は完了です。\n\n```\ndocker -v\n```\n\nプロジェクトのルート（「`package.json`」などがある場所）に「`Dockerfile`」を作成する\n\n`Dockerfile`には以下の内容を記述する（nodeのバージョンは任意で変更してください）\n\n```\nFROM node:16.14.2\nWORKDIR /src\n```\n\nプロジェクトのルート（「`package.json`」などがある場所）に「`docker-compose.yml`」を作成する\n\n`docker-compose.yml`には以下の内容を記述する\n\n```\n# docker-composeのバージョン\n# [https://docs.docker.jp/compose/compose-file/compose-file-v3.html](https://docs.docker.jp/compose/compose-file/compose-file-v3.html)\nversion: '3.8'\n\nservices:\n  react-app:\n    # 環境構築\n    # dockerfileを指定して「Dockerfile」にて環境構築を実施\n    build:\n      context: .\n      dockerfile: Dockerfile\n    # バインドマウント、ホスト側のファイルやディレクトリをコンテナ側にマウント\n    volumes:\n      - ./:/src\n    # 起動時コマンド\n    command: sh -c \"npm install \u0026\u0026 npm run start\"\n    # ホスト側とコンテナ側の両方のポートを指定(ホスト側 : コンテナ側)\n    # ポートを1つのみ指定した場合は、ホスト側にランダムなポート番号が割り当てられる\n    ports:\n      - \"3000:3000\"\n    # 標準入出力とエラー出力をコンテナに結びつける\n    stdin_open: true\n```\n\nここまで準備ができたら、Dockerを起動してみます。\n以下のコマンドを実行してください。\n\n```\ndocker-compose up\n```\n\nログで以下が表示されたら、起動は完了です。\n\n```\nwebpack compiled successfully\n```\n\n以下のURLにアクセスして起動されていることを確認してください。\n\n[http://localhost:3000/](http://localhost:3000/)\n\nここまでのソースコードは以下のGitHubにアップしています。\n\nhttps://github.com/Reigle/react-typescript-template/tree/template_1\n\n# 「docker-compose up」でエラーが出た場合\n\n以下のようなエラーが出た場合、原因はDocker Desktopアプリでユーザーのサインインをしていない事です。\n\n```\nTraceback (most recent call last):\n  File \"urllib3/connectionpool.py\", line 670, in urlopen\n  File \"urllib3/connectionpool.py\", line 392, in _make_request\n  File \"http/client.py\", line 1255, in request\n  File \"http/client.py\", line 1301, in _send_request\n  File \"http/client.py\", line 1250, in endheaders\n  File \"http/client.py\", line 1010, in _send_output\n  File \"http/client.py\", line 950, in send\n  File \"docker/transport/unixconn.py\", line 43, in connect\nFileNotFoundError: [Errno 2] No such file or directory\n\nDuring handling of the above exception, another exception occurred:\n\nTraceback (most recent call last):\n  File \"requests/adapters.py\", line 439, in send\n  File \"urllib3/connectionpool.py\", line 726, in urlopen
