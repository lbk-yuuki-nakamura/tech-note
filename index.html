.__next_f.push([1,"67:T7c4,"])</script><script>self.__next_f.push([1,"\n## ■はじめに\n\n以下のサイトを参考に、SQLite3は使用できるようにしておいてください。（基本的なことは飛ばして説明します。）\n\nhttps://www.reigle.info/entry/2020/04/22/000000_4\n\n## ■手順\n\nまずは、ソースコードの全量は以下\n\n```swift\nfunc insert() {\n    var stmt: OpaquePointer?\n\n    let queryString = \"INSERT INTO sampleTable (name, age) VALUES (?, ?)\"\n\n    // クエリを準備する\n    if sqlite3_prepare(db, queryString, -1, \u0026stmt, nil) != SQLITE_OK{\n        let errmsg = String(cString: sqlite3_errmsg(db)!)\n        print(\"error preparing insert: \\(errmsg)\")\n        return\n    }\n\n    // prepared statementを複数定義するために非定常の定義\n    let SQLITE_TRANSIENT = unsafeBitCast(-1, to: sqlite3_destructor_type.self)\n\n    // 1つめの？の定義\n    if sqlite3_bind_text(stmt, 1, \"ひとつめ\", -1, SQLITE_TRANSIENT) != SQLITE_OK{\n        let errmsg = String(cString: sqlite3_errmsg(self.db)!)\n        print(\"failure binding name: \\(errmsg)\")\n        return\n    }\n    // 2つめの？の定義\n    if sqlite3_bind_text(stmt, 2, \"ふたつめ\", -1, SQLITE_TRANSIENT) != SQLITE_OK{\n        let errmsg = String(cString: sqlite3_errmsg(self.db)!)\n        print(\"failure binding name: \\(errmsg)\")\n        return\n    }\n\n    // クエリを実行する\n    if sqlite3_step(stmt) != SQLITE_DONE {\n        let errmsg = String(cString: sqlite3_errmsg(db)!)\n        print(\"failure inserting hero: \\(errmsg)\")\n        return\n    }\n\n    print(\"データが登録されました\")\n}\n```\n\n重要なのは、以下の定義です。\n\nこれは、複数のPrepared Statementを使用するための「おまじない」だと思ってください。\n\n```swift\nlet SQLITE_TRANSIENT = unsafeBitCast(-1, to: sqlite3_destructor_type.self)\n```\n\n上記のおまじないの定数を「sqlite3_bind_text」の第五引数に設定することで、複数のPrepared Statementに値をそれぞれ設定できます。\n"])</script><script>self.__next_f.push([1,"68:T71b,"])</script><script>self.__next_f.push([1,"\n## ■はじめに\n\n実際にシステムを作る際には、RestAPIの実行は必須と言って良いほど、使用します。\n\nここでは、「axios」を使用したRestAPIの実行方法を記載します。\n\n## ■手順\n\naxiosをインストールするために、以下のコマンドを実行する\n\n```\nnpm i axios\n```\n\nApp.jsのソースコードの全量は以下。\n\n```js\nimport React from 'react';\nimport axios from 'axios';\n\nclass App extends React.Component{\n  render()\n  {\n    function btnGetClick() {\n      const data = { param : 'aa', paramtwo : 'aa' };\n      axios.get('https://hogehoge.com/hoge', {params: data})\n      .then((res) =\u003e {\n          console.log(res);\n      })\n      .catch(console.error);\n    }\n    function btnPostClick() {\n      const data = { param : 'aa', paramtwo : 'aa' };\n      axios.post('https://hogehoge.com/hoge', data)\n      .then((res) =\u003e {\n          console.log(res);\n      })\n      .catch(console.error);\n    }\n    return (\n\n# Hello World\n\n        \u003cbutton onClick={btnGetClick}\u003eGET通信\u003c/button\u003e\n        \u003cbutton onClick={btnPostClick}\u003ePOST通信\u003c/button\u003e\n\n    );\n  }\n}\n\nexport default App;\n```\n\n以下でaxiosのインポートをしています。\n\n```js\nimport axios from 'axios';\n```\n\n「btnGetClick」「btnPostClick」でそれぞれ、リクエストパラメータありのAPIの実行処理を書いています。\n\n違いは、呼び出している関数が「get」「post」なのと、第二引数（パラメータ）の指定方法です。\n\n「get」は以下のように、「{params: [パラメータ]}」というような書き方をする必要があります。\n\n```js\nconst data = { param : 'aa', paramtwo : 'aa' };\naxios.get('https://hogehoge.com/hoge', {params: data})\n.then((res) =\u003e {\n  console.log(res);\n})\n.catch(console.error);\n```\n"])</script><script>self.__next_f.push([1,"69:Ta5d,"])</script><script>self.__next_f.push([1,"\n## ■はじめに\n\nCORSとは、「Cross Origin Resource Sharing」の略です。\n\nこのエラーは、異なるドメインからアクセスされた際に発生します。\n\nつまり、localhostで実行しているWEBアプリから、サーバーにデプロイされているRestAPIを実行する時などで発生します。\n\n例）「[http://aaa.com/](http://aaa.com/)」のWebから「[http://bbb.com/](http://bbb.com/)」のNode.jsを実行する。\n\nここでは、CORSエラーが発生しないようにする手順を記載します。（ライブラリは使用しません。）\n\n## ■手順\n\nexpress-generatorでプロジェクトが作成されている前提で記載します。\n\n「app.js」の「app.use」が並んでいるところに、以下を追加します。\n\n```js\napp.use(function(req, res, next) {\n  res.header(\"Access-Control-Allow-Origin\", \"*\");\n  res.header(\"Access-Control-Allow-Headers\", \"Origin, X-Requested-With, Content-Type, Accept\");\n  res.header(\"Access-Control-Allow-Methods\", \"GET, POST, OPTIONS, PUT, DELETE\");\n  next();\n});\n```\n\nたったこれだけです。\n\nあとは、サーバーを再起動して確認してください。\n\n一応、以下に「app.js」の全量を載せておきます。（ほぼ自動生成ですが。）\n\n```js\nvar createError = require('http-errors');\nvar express = require('express');\nvar path = require('path');\nvar cookieParser = require('cookie-parser');\nvar logger = require('morgan');\n\nvar indexRouter = require('./routes/index');\nvar usersRouter = require('./routes/users');\n\nvar app = express();\n\n// view engine setup\napp.set('views', path.join(__dirname, 'views'));\napp.set('view engine', 'ejs');\n\napp.use(logger('dev'));\napp.use(express.json());\napp.use(express.urlencoded({ extended: false }));\napp.use(cookieParser());\napp.use(express.static(path.join(__dirname, 'public')));\n\napp.use(function(req, res, next) {\n  res.header(\"Access-Control-Allow-Origin\", \"*\");\n  res.header(\"Access-Control-Allow-Headers\", \"Origin, X-Requested-With, Content-Type, Accept\");\n  res.header(\"Access-Control-Allow-Methods\", \"GET, POST, OPTIONS, PUT, DELETE\");\n  next();\n});\n\napp.use('/', indexRouter);\napp.use('/users', usersRouter);\n\n// catch 404 and forward to error handler\napp.use(function(req, res, next) {\n  next(createError(404));\n});\n\n// error handler\napp.use(function(err, req, res, next) {\n  // set locals, only providing error in development\n  res.locals.message = err.message;\n  res.locals.error = req.app.get('env') === 'development' ? err : {};\n\n  // render the error page\n  res.status(err.status || 500);\n  res.render('error');\n});\n\nmodule.exports = app;\n```\n"])</script><script>self.__next_f.push([1,"6a:Tf18,"])</script><script>self.__next_f.push([1,"\n## ■はじめに\n\nライブラリは使用しないで、キーチェーンを使用する共通処理を記載します。\n\nなるべく保守性の高いクラスにしようとして作成しました。\n\n（今後、修正するかも。。。）\n\nあくまで、参考までに。\n\n## ■手順\n\n「KeyChain.swift」クラスを作成する。\n\n以下を丸々コピペで「KeyChain.swift」に貼り付けてください。\n\n※KeyChainの一意のKeyはBundleIDにしています。\n\n```swift\nimport Foundation\n\nclass KeyChain {\n    // KeyChainクラスのインスタンス取得\n    public static let shared = KeyChain()\n    // KeyChainの一意のKey情報（BundleID）\n    fileprivate let privateKey: String = Bundle.main.bundleIdentifier ?? \"\"\n\n    // 保存\n    func setKeyChain(_ value: String?, key: String) {\n        let data = value?.data(using: .utf8)\n\n        guard let _data = data else {\n            deleteKeyChain(key: key)\n            return\n        }\n\n        let dic: [String: Any] = [kSecClass as String: kSecClassGenericPassword,\n                                  kSecAttrGeneric as String: key,\n                                  kSecAttrAccount as String: privateKey,\n                                  kSecValueData as String: _data]\n\n        var itemAddStatus: OSStatus?\n        // 保存データが存在するかの確認\n        let matchingStatus = SecItemCopyMatching(dic as CFDictionary, nil)\n        if matchingStatus == errSecItemNotFound {\n            // 保存\n            itemAddStatus = SecItemAdd(dic as CFDictionary, nil)\n        } else if matchingStatus == errSecSuccess {\n            // 更新\n            itemAddStatus = SecItemUpdate(dic as CFDictionary, [kSecValueData as String: _data] as CFDictionary)\n        } else {\n            print(\"保存失敗1\")\n        }\n        // 保存・更新ステータス確認\n        if itemAddStatus == errSecSuccess {\n            print(\"正常終了\")\n        } else {\n            print(\"保存失敗\")\n        }\n    }\n\n    // 取得\n    func getKeyChain(key: String) -\u003e String? {\n\n        let dic: [String: Any] = [kSecClass as String: kSecClassGenericPassword,\n                                  kSecAttrGeneric as String: key,\n                                  kSecAttrAccount as String: privateKey,\n                                  kSecReturnData as String: kCFBooleanTrue]\n\n        var data: AnyObject?\n        let matchingStatus = withUnsafeMutablePointer(to: \u0026data){\n            SecItemCopyMatching(dic as CFDictionary, UnsafeMutablePointer($0))\n        }\n\n        if matchingStatus == errSecSuccess {\n            print(\"取得成功\")\n            if let getData = data as? Data,\n                let getStr = String(data: getData, encoding: .utf8) {\n                return getStr\n            }\n            print(\"取得失敗: Dataが不正\")\n            return nil\n        } else {\n            print(\"取得失敗\")\n            return nil\n        }\n    }\n\n    // 削除\n    func deleteKeyChain(key: String) {\n        // 削除するqueryを設定\n        let dic: [String: Any] = [kSecClass as String: kSecClassGenericPassword,\n                                  kSecAttrGeneric as String: key,\n                                  kSecAttrAccount as String: privateKey]\n\n        if SecItemDelete(dic as CFDictionary) == errSecSuccess {\n            print(\"削除成功\")\n        } else {\n            print(\"削除失敗\")\n        }\n    }\n}\n```\n\nこのクラスの使用方法は以下です。\n\n（なるべく、UserDefaultsに近い書き方ができるようにしています。）\n\n```swift\n// 値の取得\nprint(KeyChain.shared.getKeyChain(key: \"key\"))\n\n// 値の設定\nKeyChain.shared.setKeyChain(\"値\", key: \"key\")\n\n// 値の削除（以下のどちらでも可）\nKeyChain.shared.deleteKeyChain(key: \"kkkk\")\nKeyChain.shared.setKeyChain(nil, key: \"key\")\n```\n"])</script><script>self.__next_f.push([1,"6b:Tae5,"])</script><script>self.__next_f.push([1,"\n## ■はじめに\n\n以下のようにスプラッシュのViewを取得したい場合があります。（たまに）\n\n- スプラッシュ表示後も一定時間スプラッシュを表示したい\n- 特定の画面でローディングダイアログなどの代わりにスプラッシュを表示したい（裏で画面遷移するなど）\n\nその場合に、スプラッシュと同じような構成でViewを作成してもいいですが、二度手間になります。\n\nここでは、簡単にスプラッシュからViewを取得して使用する方法を記載します。\n\n## ■手順\n\n以下のように記載することで、スプラッシュのViewを取得できます。\n\n```swift\nlet splashStoryboardName = Bundle.main.object(forInfoDictionaryKey: \"UILaunchStoryboardName\") as? String ?? \"\"\nlet storyboard = UIStoryboard(name: splashStoryboardName, bundle: nil)\nlet viewController = storyboard.instantiateInitialViewController()\nlet splashView = viewController?.view ?? UIView()\n```\n\nまずは以下でSplashで使用しているStoryboardの名前を取得します。\n\n基本は「LaunchScreen」になっていると思いますが、変更されても問題ないようにInfo.plistから取得しています。\n\nInfo.plistの「Launch screen interface file base name」がSplashのストーリーボード名です。\n\n```swift\nlet splashStoryboardName = Bundle.main.object(forInfoDictionaryKey: \"UILaunchStoryboardName\") as? String ?? \"\"\n```\n\n上記で取得したStoryboard名から、Storyboardのインスタンスを取得します。\n\n```swift\nlet storyboard = UIStoryboard(name: splashStoryboardName, bundle: nil)\n```\n\n取得したStoryboardの「Is Initial View Controller」にチェックされているViewControllerを取得します。\n\n```swift\nlet viewController = storyboard.instantiateInitialViewController()\n```\n\n該当のViewControllerの一番親のViewを取得します。\n\n※このViewがスプラッシュのViewになります。\n\n```swift\nlet splashView = viewController?.view ?? UIView()\n```\n\n## ■おまけ\n\n以下のようにすることで、どのような画面でも、一番上にスプラッシュのViewを表示することが可能です。\n\n```swift\nlet splashStoryboardName = Bundle.main.object(forInfoDictionaryKey: \"UILaunchStoryboardName\") as? String ?? \"\"\nlet storyboard = UIStoryboard(name: splashStoryboardName, bundle: nil)\nlet viewController = storyboard.instantiateInitialViewController()\nlet splashView = viewController?.view ?? UIView()\nlet window = UIApplication.shared.keyWindow!\nwindow.addSubview(splashView);\n```\n\n任意のタイミングで、以下のようにViewを破棄することで、スプラッシュ表示前の画面に戻せます。\n\n```swift\nsplashView.removeFromSuperview()\n```\n"])</script><script>self.__next_f.push([1,"6c:T8d0,"])</script><script>self.__next_f.push([1,"\n## ■はじめに\n\nGASからSlackにメッセージを送信する方法を記載します。\n\nSlackのワークスペースを作成しておいてください。\n\n## ■Slackアプリの作成\n\n[こちら](https://api.slack.com/apps)にアクセスし、Slackのワークスペースにサインインする。\n\n※サインインしたら、Slackのワークスペースが表示されるので、別タブでもう一度「[こちら](https://api.slack.com/apps)」を開く\n\n「Create New App」を押下し、適当なアプリ名とワークスペースを選択してアプリを作成する。\n\n![](https://developer-kuro.com/develop/wp-content/uploads/2020/06/スクリーンショット-2020-06-23-14.33.12-300x243.png)\n\nサイドメニューの「Incoming Webhooks」を押下する。\n\n![](https://developer-kuro.com/develop/wp-content/uploads/2020/06/スクリーンショット-2020-06-23-14.34.35-262x300.png)\n\nActive Incoming WebhooksをONにする。\n\n![](https://developer-kuro.com/develop/wp-content/uploads/2020/06/スクリーンショット-2020-06-23-14.35.05-300x164.png)\n\n画面下部の「Add New Webhook to Workspace」を押下する。\n\n![](https://developer-kuro.com/develop/wp-content/uploads/2020/06/スクリーンショット-2020-06-23-14.35.19-300x196.png)\n\n使用するチャンネルを選択して、「許可する」を押下する。\n\n![](https://developer-kuro.com/develop/wp-content/uploads/2020/06/スクリーンショット-2020-06-23-14.35.26-300x236.png)\n\n「Copy」を押下する事で、クリップボードにAPIで使用するURLがコピーされる。\n\n![](https://developer-kuro.com/develop/wp-content/uploads/2020/06/スクリーンショット-2020-06-23-14.35.51-300x228.png)\n\n## ■GASでメッセージを送信\n\nソースコードの全量は以下。\n\n※「apiUrl」変数には、「■Slackアプリの作成」手順で取得したAPIのURLを設定する事。\n\n```js\nfunction sendMessage() {\n  var payload  = {\n    'text' : \"HELLO\"\n  };\n  var options = {'method':'post', 'contentType':'application/json', 'payload':JSON.stringify(payload)};\n  var apiUrl = \"https://hooks.slack.com/services/XXXXXXXXX/ZZZZZZZZZZZ/YYYYYYYYYYYYYYYYYYYYYYYY\"\n  UrlFetchApp.fetch(apiUrl, options);\n}\n```\n"])</script><script>self.__next_f.push([1,"6d:T5e8,"])</script><script>self.__next_f.push([1,"\n## ■はじめに\n\nreact-router-domを使用したSPA（シングルページアプリケーション）の画面切り替え（遷移）方法を記載します。\n\n以下のサイトを参考に環境構築、プロジェクト作成は済ませてからこちらの記事をご覧ください。\n\nhttps://www.reigle.info/entry/2021/05/22/132803\n\n## ■手順\n\n画面の構成として、「One」「Two」の2つの画面を切り替えれるように記載します。\n\n![](https://developer-kuro.com/develop/wp-content/uploads/2020/06/sb4m4-6vs87.gif)\n\n以下のコマンドで、「react-router-dom」をインストールします。\n\n```\nnpm i react-router-dom\n```\n\nソースコードの全量は以下。\n\n```js\nimport React, { Component } from 'react';\nimport { BrowserRouter as Router, Route } from 'react-router-dom';\nimport { Link } from 'react-router-dom'\nimport One from './One';\nimport Two from './Two';\n\nclass App extends Component {\n  render() {\n    return (\n\n        \u003cRouter\u003e\n\n            \u003cRoute exact path='/' component={One}/\u003e\n            \u003cRoute path='/Two' component={Two}/\u003e\n\n            \u003cLink to=\"/\"\u003eOne\u003c/Link\u003e\n\n            \u003cLink to=\"/Two\"\u003eTwo\u003c/Link\u003e\n\n        \u003c/Router\u003e\n\n    );\n  }\n}\n\nexport default App;\n```\n\n```js\nimport React from 'react'\n\nclass One extends React.Component {\n  render(){\n    return(\n\n# One\n\n    )\n  }\n}\n\nexport default One;\n```\n\n```js\nimport React from 'react'\n\nclass Two extends React.Component {\n  render(){\n    return(\n\n# Two\n\n    )\n  }\n}\n\nexport default Two;\n```\n"])</script><script>self.__next_f.push([1,"6e:Tae0,"])</script><script>self.__next_f.push([1,"\n## ■はじめに\n\n本記事は、個人で調べてまとめた内容です。\n\n筆者は法律に精通している訳では御座いませんので、あくまで自己責任でご覧ください。\n\nまた、記載ルールや提出方法など、変更になる可能性はあるので、ご注意ください。\n\n詳しくは、「[こちら](https://www.bis.doc.gov/index.php/policy-guidance/encryption/4-reports-and-reviews/a-annual-self-classification)」の公式サイトをご覧ください。\n\n## ■「年次自己分類レポート」とは？\n\niOSやAndroidのアプリは、アメリカのサーバーに配置されている各Storeからダウンロードして利用されます。\n\nつまり、扱いとしては、「アメリカからの輸出」という扱いになります。\n\n「アメリカから輸出」する商品（アプリ）に暗号化が利用されている場合には、「年次自己分析レポート」というレポートを提出する義務が課せられます。\n\n（暗号化には、HTTPS通信なども含みます。）\n\n## ■「年次自己分類レポート」の提出方法\n\n「[こちら](https://www.bis.doc.gov/index.php/documents/new-encryption/1675-sample-annual-self-classification-report)」から年次自己分析レポートのサンプルをダウンロードします。\n\n・年次自己分析レポートに必要情報を記載します。（書き方は後記します。）\n\n・「crypt-supp8@bis.doc.gov」「enc@nsa.gov」宛にメールにて提出する。\n\nこれだけです。\n\nちなみに、アプリを公開した翌年の2月までに提出する必要があるようです。\n\nまた、毎年、同様の提出が必要なようです。（変更していなくても）\n\n詳しくは、「[こちら](http://www009.upp.so-net.ne.jp/kgm1_ear/cipher4/Howto_file_selfClassify.htm)」を参照してください。\n\n## ■「年次自己分類レポート」の書き方\n\n年次自己分析レポートの書き方は、ダウンロードしたサンプルを元に書くだけです。\n\nそれぞれの項目には以下のように書いていってください。（項目の角カッコ内に「※」がついているものは、それぞれ書き換えてください。）\n\n```\n【※PRODUCT NAME】\nアプリ名\n【※MODEL NUMBER】\nApp StoreのSKU\n【MANUFACTURER】\nSELF\n【ECCN】\n5D992\n【AUTHORIZATION TYPE】\nMMKT\n【ITEM TYPE】\nMobility and mobile applications n.e.s.\n【※SUBMITTER NAME】\n送信者の名前（フルネーム）\n【※TELEPHONE NUMBER】\n連絡先の電話番号\n【※E-MAIL ADDRESS】\n連絡先のメールアドレス\n【※MAILING ADDRESS】\n郵便番号・住所\n【NON-U.S. COMPONENTS】\nNO\n【※NON-U.S. MANUFACTURING LOCATIONS】\n制作場所\n```\n"])</script><script>self.__next_f.push([1,"6f:T844,"])</script><script>self.__next_f.push([1,"\n## ■はじめに\n\nUserDefaultsの処理を保守性を高く記載しようと思って、色々と試行錯誤しました。\n\nここで紹介する方法は一例ですので、参考にしてください。\n\n（Keyを定数クラスで管理するなども考えましたが、保守するクラスが増えるだけでしたので断念。）\n\n## ■手順\n\nUserDefaultsの処理をまとめるクラス「UserDefaults+MyApp.swift」を作成してください。（ファイル名は任意）\n\nまずは、一例として、以下のコードを丸々コピペで「UserDefaults+MyApp.swift」に貼り付けてください。\n\n```swift\nimport Foundation\n\n// UserDefaultsの拡張クラス\nextension UserDefaults {\n    // UserDefaultsのKeyをまとめたenum\n    private enum UDKey: String {\n        case keyOne\n        case keyTwo\n    }\n\n    // データの全件削除処理\n    func removeAllObject() {\n        removeObject(forKey: UDKey.keyOne.rawValue)\n        removeObject(forKey: UDKey.keyTwo.rawValue)\n    }\n\n    // 「keyOne」のセッターゲッターの処理\n    var keyOne: String? {\n        get {\n            return string(forKey: UDKey.keyOne.rawValue)\n        }\n        set(val) {\n            set(val, forKey: UDKey.keyOne.rawValue)\n        }\n    }\n\n    // 「keyTwo」のセッターゲッターの処理\n    var keyTwo: Bool {\n        get {\n            return bool(forKey: UDKey.keyTwo.rawValue)\n        }\n        set(val) {\n            set(val, forKey: UDKey.keyTwo.rawValue)\n        }\n    }\n}\n```\n\n上記のサンプルは「String」「Bool」の2種類の型のUserDefaultsの定義をしています。\n\nUserDefaultsの「Key」は「UDKey」のenumにまとめて定義しています。\n\nsetterとgetterでKeyの処理を書いているので、以下のように利用できます。\n\n```swift\n// 取得する場合\nprint(UserDefaults.standard.keyOne)\nprint(UserDefaults.standard.keyTwo)\n\n// 値を設定する場合\nUserDefaults.standard.keyOne = \"きー1\"\nUserDefaults.standard.keyTwo = true\n\n// データを全件削除する場合\nUserDefaults.standard.removeAllObject()\n```\n"])</script><script>self.__next_f.push([1,"70:T100a,"])</script><script>self.__next_f.push([1,"\n## ■はじめに\n\nWebViewだけのアプリを作成する方法を記載します。\n\n環境はKotlinで、Minimum SDKはAndroid8.0としてプロジェクトを作成してください。\n\n## ■手順\n\n「activity_main.xml」を以下のように書き換えます。\n\n※「TextView」を「WebView」に変更しました。\n\n```\n\u003c?xml version=\"1.0\" encoding=\"utf-8\"?\u003e\n\u003candroidx.constraintlayout.widget.ConstraintLayout xmlns:android=\"http://schemas.android.com/apk/res/android\"\n    xmlns:app=\"http://schemas.android.com/apk/res-auto\"\n    xmlns:tools=\"http://schemas.android.com/tools\"\n    android:layout_width=\"match_parent\"\n    android:layout_height=\"match_parent\"\n    tools:context=\".MainActivity\"\u003e\n\n    \u003cWebView\n        android:id=\"@+id/webView\"\n        android:layout_width=\"match_parent\"\n        android:layout_height=\"match_parent\" /\u003e\n\n\u003c/androidx.constraintlayout.widget.ConstraintLayout\u003e\n```\n\n「styles.xml」を以下のように書き換えます。\n\n※ヘッダー部分を非表示にする処理です。\n\n```\n\u003cresources\u003e\n\n    \u003c!-- Base application theme. --\u003e\n    \u003cstyle name=\"AppTheme\" parent=\"Theme.AppCompat.Light.DarkActionBar\"\u003e\n        \u003c!-- Customize your theme here. --\u003e\n        \u003citem name=\"colorPrimary\"\u003e@color/colorPrimary\u003c/item\u003e\n        \u003citem name=\"colorPrimaryDark\"\u003e@color/colorPrimaryDark\u003c/item\u003e\n        \u003citem name=\"colorAccent\"\u003e@color/colorAccent\u003c/item\u003e\n\n        \u003citem name=\"windowNoTitle\"\u003etrue\u003c/item\u003e\n        \u003citem name=\"windowActionBar\"\u003efalse\u003c/item\u003e\n        \u003citem name=\"android:windowFullscreen\"\u003etrue\u003c/item\u003e\n        \u003citem name=\"android:windowContentOverlay\"\u003e@null\u003c/item\u003e\n    \u003c/style\u003e\n\n\u003c/resources\u003e\n```\n\n「MainActivity.kt」を以下のように書き換えます。\n\n※WebViewの表示処理です。（Googleの検索トップを表示するようにしています。）\n\n※[パッケージ名]は環境に合わせてください。\n\n```\npackage [パッケージ名]\n\nimport androidx.appcompat.app.AppCompatActivity\nimport android.os.Bundle\nimport android.webkit.WebView\nimport android.webkit.WebViewClient\nimport kotlinx.android.synthetic.main.activity_main.*\n\nclass MainActivity : AppCompatActivity() {\n\n    override fun onCreate(savedInstanceState: Bundle?) {\n        super.onCreate(savedInstanceState)\n        setContentView(R.layout.activity_main)\n\n        // JavaScriptを有効化\n        webView.settings.javaScriptEnabled = true\n        // Web Storage を有効化\n        webView.settings.domStorageEnabled = true\n\n        webView.webViewClient = object: WebViewClient(){\n            override fun shouldOverrideUrlLoading(\n                    view: WebView?,\n                    url: String?\n            ): Boolean {\n                view?.loadUrl(url)\n                return true\n            }\n        }\n\n        webView.loadUrl(\"https://www.google.com/\")\n    }\n}\n```\n\n「AndroidManifest.xml」を以下のように書き換えます。\n\n※「android.permission.INTERNET」を追加してWebアクセスを許可しています。\n\n※[パッケージ名]は環境に合わせてください。\n\n```\n\u003c?xml version=\"1.0\" encoding=\"utf-8\"?\u003e\n\u003cmanifest xmlns:android=\"http://schemas.android.com/apk/res/android\"\n    package=\"[パッケージ名]\"\u003e\n\n    \u003cuses-permission android:name=\"android.permission.INTERNET\" /\u003e\n    \u003capplication\n        android:allowBackup=\"true\"\n        android:icon=\"@mipmap/ic_launcher\"\n        android:label=\"@string/app_name\"\n        android:roundIcon=\"@mipmap/ic_launcher_round\"\n        android:supportsRtl=\"true\"\n        android:theme=\"@style/AppTheme\"\u003e\n        \u003cactivity android:name=\".MainActivity\"\u003e\n            \u003cintent-filter\u003e\n                \u003caction android:name=\"android.intent.action.MAIN\" /\u003e\n\n                \u003ccategory android:name=\"android.intent.category.LAUNCHER\" /\u003e\n            \u003c/intent-filter\u003e\n        \u003c/activity\u003e\n    \u003c/application\u003e\n\n\u003c/manifest\u003e\n```\n\n## ■おまけ\n\n上記で実装は完成です。\n\nただ、シミュレータだとうまく動いてくれません。\n\n※「net::ERR_NAME_NOT_RESOLVED」のエラーが発生しました。\n\nなので、実機で動作確認するようにしてください。\n"])</script><script>self.__next_f.push([1,"71:T866,"])</script><script>self.__next_f.push([1,"\n## ■はじめに\n\n本記事は、さくらVPSの利用方法がある程度わかっている前提で記載しています。\n\nまた、さくらVPSを契約している方を対象としています。\n\n## ■ドメインの設定\n\n1.さくらVPSコンソール（以降、コンソール）を開く。\n\n2.コンソールの左のメニューから、「ドメイン取得・転入」を押下する。\n\n![](/images/2021-06-02-190000-35/20220707120453.png)\n\n3.欲しいドメインを入力して、「検索」ボタンを押下する。\n\n![](/images/2021-06-02-190000-35/20220707115321.png)\n\n4.取得したいドメインの「申し込む」ボタンを押下する。（このボタンがない場合には、他者が既に取得している為、別ドメインを使用する必要があります。\n\n![](/images/2021-06-02-190000-35/20220707120429.png)\n\n5.以降、画面の手順にしたがって、支払情報などを記載する。\n\n6.ドメインが取得できたら、以下のリンク先にアクセスする。\n\n[https://secure.sakura.ad.jp/menu/domain/](https://secure.sakura.ad.jp/menu/domain/)\n\n7.取得したドメインが「利用中」になるまで、数時間〜48時間かかるようなので、それまで待機する。\n\n8.利用中になったら「ゾーン編集」を押下する。\n\n![](/images/2021-06-02-190000-35/20220707120411.png)\n\n9.「さくらインターネットのネームサーバに設定する（簡単設定）」に設定したいIPアドレスを入力して、「送信する」を押下する。\n\n![](/images/2021-06-02-190000-35/20220707150320.png)\n\n10.エントリ名「＠」のタイプ「A」にIPが設定されていればOKです。\n\n![](/images/2021-06-02-190000-35/20220707150323.png)\n\nサーバーへSSHで接続し以下のコマンドを実行する。（Apacheの場合）\n\n```\nvi /etc/httpd/conf.d/vhost.conf\n```\n\n編集モードに変更し、以下をコピペする。\n\n※「domain-name.com」はそれぞれのドメインに変更する。\n\n```\nNameVirtualHost *:80\n\n\u003cVirtualHost *:80\u003e\n  DocumentRoot /var/www/html\n  ServerName domain-name.com\n\u003c/VirtualHost\u003e\n```\n"])</script><script>self.__next_f.push([1,"72:Tbe8,"])</script><script>self.__next_f.push([1,"\n## ■はじめに\n\n開発環境であれば、Xcodeにログが出るので、クラッシュしてもすぐに分かります。\n\nただ、開発環境以外でAdHocなどでテストしてた場合、ログが見れないので調査が難航することがあります。\n\ncrashlyticsなどを組み込んでおけば、解析は楽ですが、それができないケースもあると思います。\n\nここでは、crashlyticsなどを使用せずにクラッシュログを確認する方法を記載します。\n\n## ■手順（iOS）（ips）\n\nクラッシュが起きた端末で以下の操作をしてください。\n\n※iOSのバージョンによって多少操作方法が異なる場合があります。\n\n```\n「設定」アプリ起動 -\u003e 「プライバシー」 -\u003e 「解析および改善」 -\u003e 「解析データ」\n```\n\n「解析データ」にずらっとログの一覧が表示されます。\n\nそこから、以下を探してタップします。\n\n※日時はクラッシュが起きた日時です。\n\n```\n[アプリ名]-[yyyy-MM-dd-HHmmss].ips\n```\n\nログを開いたら、「共有」でAirDropなどで解析するMacにログを送ってください。\n\n## ■手順（Mac）（dSYM）\n\n「dSYM」を用意します。\n\n※「dSYM」とはクラッシュログを人間が読める形にするために必要な情報です。\n\n以下で、テストに使用したアプリを探します。\n\n```\n「Xcode」を開く -\u003e Window -\u003e Organizer\n```\n\nテストに使用したアプリを右クリックし、「Show in Finder」を押下する。\n\n対象のアプリ（日時などを確認）の「.xcarchive」を右クリックして「パッケージの内容を表示」を押下する。\n\n以下のファイルを取得する。（コピーしておくなど）\n\n※ライブラリを使用していると、「dSYMs」配下に複数のdSYMがある場合があります。\n\n※「[アプリ名].app.dSYM」だけ使用するので間違えないようにしてください。\n\n```\n/dSYMs/[アプリ名].app.dSYM\n```\n\n## ■手順（Mac）（ログ生成）\n\n「■手順（iOS）（ips）」で取得した「.ips」ファイルと、「■手順（Mac）（dSYM）」の「.app.dSYM」を同じディレクトリにコピぺする。\n\nターミナルを起動し、以下を実行する。\n\n※初回のみ\n\n```\nexport DEVELOPER_DIR=\"/Applications/Xcode.app/Contents/Developer\"\n```\n\n「cd」コマンドでipsとdSYMが入っているディレクトリをカレントディレクトリにする。\n\n以下のコマンドでログを生成する。\n\n```\n/Applications/Xcode.app/Contents/SharedFrameworks/DVTFoundation.framework/Versions/A/Resources/symbolicatecrash -v [ipsファイル名].ips [アプリ名].app.dSYM \u003e crash.log\n```\n\n同ディレクトリに「crash.log」が生成されているので、このファイルがクラッシュログです。\n\n中身が空っぽの場合には何かが間違えているので、dSYMがテストしたアプリの物か？など調べてみてください。\n"])</script><script>self.__next_f.push([1,"73:T949,"])</script><script>self.__next_f.push([1,"\n## ■はじめに\n\nBluetoothで「kCBAdvDataManufacturerData」の値を取得してどうのこうのしたい時があります。\n\nその方法で結構詰まったので、メモ。\n\n## ■手順\n\n「kCBAdvDataManufacturerData」の値を以下とします。\n\n```\n\"kCBAdvDataManufacturerData\": \u003c68656c6c 6f20776f 726c64\u003e\n```\n\n以下のExtensionを用意します。\n\n```swift\n//// Data extension\nextension Data {\n    var dataToHexString: String {\n        return reduce(\"\") {$0 + String(format: \"%02x\", $1)}\n    }\n}\n```\n\n以下の通り、実装することで、値が取得できます。（具体的な値はコメントに記載。）\n\n```swift\nfunc centralManager(_ central: CBCentralManager, didDiscover peripheral: CBPeripheral, advertisementData: [String : Any], rssi RSSI: NSNumber){\n    let aaa = advertisementData[\"kCBAdvDataManufacturerData\"] as? NSData {\n        let publicData = Data(bytes: aaa.bytes, count: Int(aaa.length))\n        let str = publicData.dataToHexString\n        print(str) // 68656c6c6f20776f726c64\n    }\n}\n```\n\n以下の通りにすることで、文字列に復元することもできます。\n\n```swift\nlet str = publicData.dataToHexString\nvar bytes = [UInt8]()\nfor idx in stride(from: 0, to: str.count, by: 2) {\n    let hex = str[str.index(str.startIndex, offsetBy: idx)..\u003cstr.index(str.startIndex, offsetBy: idx + 2)]\n    bytes.append(UInt8(hex, radix: 16)!)\n}\nprint(String(bytes: bytes, encoding: .utf8)!) // Hello World\n```\n\n## ■ソースコード全量\n\n```swift\nfunc centralManager(_ central: CBCentralManager, didDiscover peripheral: CBPeripheral, advertisementData: [String : Any], rssi RSSI: NSNumber){\n    let aaa = advertisementData[\"kCBAdvDataManufacturerData\"] as? NSData {\n        let publicData = Data(bytes: aaa.bytes, count: Int(aaa.length))\n        let str = publicData.dataToHexString\n        print(str) // 68656c6c6f20776f726c64\n\n        var bytes = [UInt8]()\n        for idx in stride(from: 0, to: str.count, by: 2) {\n            let hex = str[str.index(str.startIndex, offsetBy: idx)..\u003cstr.index(str.startIndex, offsetBy: idx + 2)]\n            bytes.append(UInt8(hex, radix: 16)!)\n        }\n        print(String(bytes: bytes, encoding: .utf8)!) // Hello World\n    }\n}\n\n//// Data extension\nextension Data {\n    var dataToHexString: String {\n        return reduce(\"\") {$0 + String(format: \"%02x\", $1)}\n    }\n}\n```\n"])</script><script>self.__next_f.push([1,"74:T729,"])</script><script>self.__next_f.push([1,"\n## ■はじめに\n\n事前にカレンダーに予定を設定しておいてください。\n\n## ■手順\n\nソースコードの全量は以下\n\n※「[Googleのメールアドレス]」はそれぞれ置き換えてください。\n\n```js\nfunction calSample(){\n  var cal = CalendarApp.getCalendarById(\"[Googleのメールアドレス]\");\n  var date = new Date();\n  var events = cal.getEventsForDay(date);\n  for(var i = 0; i \u003c events.length; i++){\n    var title = events[i].getTitle();\n    Logger.log(title);\n  }\n}\n```\n\n以下で、Googleカレンダーのインスタンスを生成します。\n\n```js\nvar cal = CalendarApp.getCalendarById(\"[Googleのメールアドレス]\");\n```\n\n以下で、当日の日付を取得します。\n\n```js\nvar date = new Date();\n```\n\n以下で、当日のカレンダーの予定を全て取得します。\n\n```js\nvar events = cal.getEventsForDay(date);\n```\n\n上記で取得した予定をFor文でループさせて、タイトルをログに出力しています。\n\n```js\nfor(var i = 0; i \u003c events.length; i++){\n  var title = events[i].getTitle();\n  Logger.log(title);\n}\n```\n\n## ■翌日の予定を取得する方法\n\nソースコードの全量は以下\n\n※「[Googleのメールアドレス]」はそれぞれ置き換えてください。\n\n```js\nfunction calSample(){\n  var cal = CalendarApp.getCalendarById(\"[Googleのメールアドレス]\");\n  var date = new Date();\n  date.setDate(date.getDate() + 1);\n  var events = cal.getEventsForDay(date);\n  for(var i = 0; i \u003c events.length; i++){\n    var title = events[i].getTitle();\n    Logger.log(title);\n  }\n}\n```\n\n元々、new Dateで当日の日付を取得していましたが、以下で＋1日を設定しています。\n\nこれで、翌日のカレンダーの予定が取得できます。\n\n```js\ndate.setDate(date.getDate() + 1);\n```\n"])</script><script>self.__next_f.push([1,"75:T1233,"])</script><script>self.__next_f.push([1,"\n## ■はじめに\n\nここでは、以下の要望への対応方法を記載します。\n\n- TextFieldにフォーカスを当てた時のキーボードを、英数記号のみにして欲しい\n- ユーザーの設定関係なく、英数記号のキーボードにして欲しい。\n- キーボードの切り替えを許さないで欲しい\n- パスワード入力以外のTextFieldに使いたい（●は出さないで欲しい）\n\niOSの事を知らない人はこんな無茶苦茶な要望してくる人もいるかもしれません。\n\n（実際にされた人を知っていますw）\n\n上記は、iOSのデフォルト機能だけでは実現することができません。\n\n「●」は出さないで欲しい。が一番の原因ですね。。。\n\n## ■手順\n\n最終的にこんな感じのキーボードが表示されます。\n\n（パスワード用のキーボードだとスクショに映らないので、写真で取りました。。。見辛くてすみません。。。）\n\n![](/images/2021-06-02-190000-6/20220707150356.jpg)\n\nまずは、結論から。\n\nCustomTextField.swiftを作成して以下をコピペしてください。\n\n```swift\nimport UIKit\n\nclass CustomTextField: UITextField, UITextFieldDelegate {\n    // パスワード入力フィールド（画面上には表示しない）\n    var passText = UITextField()\n\n    /// 初期化処理\n    /// - Parameter frame: frame description\n    override init(frame: CGRect) {\n        super.init(frame: frame)\n        commonInit()\n    }\n\n    /// 初期化処理\n    /// - Parameter aDecoder: aDecoder description\n    required init?(coder aDecoder: NSCoder) {\n        super.init(coder: aDecoder)\n        commonInit()\n    }\n\n    /// 初期化処理で呼び出す共通処理\n    func commonInit() {\n        // 非表示のテキストフィールドをパスワード入力フィールドに設定\n        passText.isSecureTextEntry = true\n\n        // キーボードの上のiCloudから入力する「パスワード」の部分の非表示\n        if #available(iOS 12.0, *) {\n            passText.textContentType = .oneTimeCode\n        }\n\n        // TextFieldのデリゲートでフォーカス時、値入力時の制御を行う\n        self.delegate = self\n        passText.delegate = self\n\n        // パスワード入力テキストフィールドを非表示状態でViewに追加\n        passText.frame = CGRect(x: 0, y: 0, width: 0, height: 0)\n        self.addSubview(passText)\n    }\n\n    /// フォーカス時処理\n    /// - Parameter textField: textField description\n    func textFieldDidBeginEditing(_ textField: UITextField) {\n        // フォーカスが当たったあと、一瞬遅延させる（即時にフォーカス切り替えが動かないので）\n        DispatchQueue.main.asyncAfter(deadline: .now() + 0.01) {\n            // フォーカス制御はメインスレッドで\n            DispatchQueue.main.async {\n                // パスワード入力TextFIeldにフォーカスを当てる\n                self.passText.becomeFirstResponder()\n            }\n        }\n    }\n\n    /// 値入力（削除）時処理\n    /// - Parameters:\n    ///   - textField: textField description\n    ///   - range: range description\n    ///   - string: string description\n    /// - Returns: description\n    func textField(_ textField: UITextField, shouldChangeCharactersIn range: NSRange, replacementString string: String) -\u003e Bool {\n        // 値をTextFieldに反映\n        self.text = textField.text\n        // 一瞬遅延\n        DispatchQueue.main.asyncAfter(deadline: .now() + 0.01) {\n            // メインスレッドで処理\n            DispatchQueue.main.async {\n                // パスワード入力TextFieldの値を表示されているTextFieldに設定\n                self.text = self.passText.text\n            }\n        }\n        return true\n    }\n}\n```\n\n使い方は以下のような感じで、使ってください。（普通のUITextFieldと同じです）\n\n```swift\nlet text = CustomTextField()\ntext.frame = CGRect(x: 50, y: 160, width: 100, height: 30)\ntext.layer.borderColor = UIColor.blue.cgColor\ntext.layer.borderWidth = 1\nself.view.addSubview(text)\n```\n\nこの方法のポイントとしては、「passText」です。\n\nこれを画面に見えないように精製して、TextFieldにフォーカスされたタイミングで「passText」にフォーカスさせています。\n\nで、「passText」に値が入力された際にTextFieldに反映させています。\n\n結果、TextFieldに値が入力されているようにみえます。\n\n他に方法があれば、是非ご連絡ください。\n"])</script><script>self.__next_f.push([1,"76:T5cb,"])</script><script>self.__next_f.push([1,"\n## ■はじめに\n\n前回の記事の「定数クラス」に環境毎に分けた定数を定義する方法を記載します。\n\nAPIの向き先などで使用することはあると思います。\n\n## ■手順\n\nプロジェクトは「create-react-app」を使用して作成しておいてください。\n\n※そうすることで、環境を分ける定数が自動で用意されます。\n\n以下のようにConst.jsを作成します。\n\n```js\nclass Const {\n    ENV = () =\u003e {\n        if (process.env.NODE_ENV === 'development') {\n            return {\n                API_URL: \"http://hogehoge.com/\",\n                API_KEY: \"aaaaa\"\n            }\n        } else if (process.env.NODE_ENV === ' izePort(val) {\n  var port = parseInt(val, 10);\n\n  if (isNaN(port)) {\n    return val;\n  }\n\n  if (port \u003e= 0) {\n    return port;\n  }\n\n  return false;\n}\n\n/**\n * エラー発生時のハンドリング\n * @param error\n */\nfunction onError(error) {\n  if (error.syscall !== 'listen') {\n    throw error;\n  }\n\n  var bind = typeof port === 'string'\n    ? 'Pipe ' + port\n    : 'Port ' + port;\n\n  // handle specific listen errors with friendly messages\n  switch (error.code) {\n    case 'EACCES':\n      console.error(bind + ' requires elevated privileges');\n      process.exit(1);\n      break;\n    case 'EADDRINUSE':\n      console.error(bind + ' is already in use');\n      process.exit(1);\n      break;\n    default:\n      throw error;\n  }\n}\n```\n\n「[秘密鍵]」と「[証明書]」の部分は各環境に書き換えてください。\n\nちなみに、以下で取得した証明書の場合は以下のように記載できます。\n\nhttps://www.reigle.info/entry/2020/05/10/000000_4\n\n```\nvar options = {\n    key: fs.readFileSync(\"/etc/letsencrypt/live/hogehoge.com/privkey.pem\"),\n    cert: fs.readFileSync(\"/etc/letsencrypt/live/hogehoge.com/cert.pem\")\n};\n```\n\n「hogehoge.com」の部分は自分のドメインに書き換えてください。\n\n# ■HTTPSのポートを指定する方法\n\npackage.jsonの「scripts」を以下のように記載することで、HTTPとHTTPSのそれぞれのポートを指定できます。\n\n```\n\"scripts\": {\n  \"start\": \"PORT=1234 SSL_PORT=5678 node ./bin/www\"\n},\n```\n\n「PORT」がHTTPのポートで「SSL_PORT」がHTTPSのポートです。\n"])</script><script>self.__next_f.push([1,"78:Ted3,"])</script><script>self.__next_f.push([1,"\n# もくじ\n\n# ■はじめに\n\nfastlaneの環境構築はできている前提で記載しています。\n\nAppStoreへのリリースビルドのlaneの解説です。\n\n# ■手順\n\n## fastlaneの生成\n\ncdコマンドでプロジェクトのディレクトリをカレントディレクトリにする。\n\n以下のコマンドで、fastlaneの初期化をする。\n\n```\nfastlane init\n```\n\n質問は割愛しますが、最初の質問？のテンプレートを使うかどうか？は使用しないようにしてください。\n\n## AppStoreへのリリースビルドのlaneを作成\n\n以下のファイルをテキストエディタなどで開く\n\n```\n/プロジェクト/fastlane/Fastfile\n```\n\n以下の記載を行う。\n\n```\ndefault_platform(:ios)\n\nplatform :ios do\n\n  lane :release_app do\n    build_app(scheme: \"[アプリ名]\",\n            workspace: \"[アプリ名].xcworkspace\",\n            include_bitcode: true)\n    upload_to_app_store(\n      username: \"[Apple ID]\",\n      force: true,\n      skip_screenshots: true,\n      skip_metadata: true\n    )\n  end\nend\n```\n\n以下に関しては、それぞれの環境で書き換えてください。\n\n```\n[アプリ名]\n```\n\n```\n[Apple ID]\n```\n\n## AppStoreへのリリースビルドのlaneの解説\n\n以下は、アプリをビルドするフローです。\n\n```\nbuild_app(scheme: \"[アプリ名]\",\n            workspace: \"[アプリ名].xcworkspace\",\n            include_bitcode: true)\n```\n\n以下はAppStoreへIPAをアップロードするフローです。\n\n```\nupload_to_app_store(\n      username: \"[Apple ID]\",\n      force: true,\n      skip_screenshots: true,\n      skip_metadata: true\n    )\n```\n\n## upload_to_app_storeのオプション\n\n以下のオプションは、HTMLのプレビューをスキップするオプションです。\n\ntrueとすることで、HTMLプレビューをスキップできます。\n\n```\nforce\n```\n\n以下のオプションは、スクリーンショットのアップロードスキップするオプションです。\n\ntrueとすることで、スクリーンショットのアップロードスキップできます。\n\n```\nskip_screenshots\n```\n\n以下のオプションは、メタデータ（アプリの説明など）のアップロードスキップするオプションです。\n\ntrueとすることで、メタデータ（アプリの説明など）のアップロードスキップできます。\n\n```\nskip_metadata\n```\n\n## ビルド番号の自動インクリメント\n\nアプリバージョンならまだしも、ビルドバージョンをいちいち書き換えるのは面倒ですよね？\n\n以下の記載をlaneに追加することで、ビルドバージョンを自動で追加することができます。\n\n注意点として、ビルド番号は以下の形式にする必要があります。\n\n※純粋な数字にしてください。\n\n```\n【OK】\n1\n【NG】\n1.0\n```\n\n【ビルド番号のインクリメント　lane】\n\n```\nincrement_build_number\n```\n\nちなみに、以下でGitにPushできます。\n\n```\ncommit_version_bump(\n      force: true\n    )\n\n    push_to_git_remote(\n      force: true\n    )\n```\n\n## 全て合わせたlane\n\n上記の内容を全て合わせたlaneは以下です。\n\n```\ndefault_platform(:ios)\n\nplatform :ios do\n\n  lane :release_app do\n\n    increment_build_number\n    commit_version_bump(\n      force: true\n    )\n    push_to_git_remote(\n      force: true\n    )\n    build_app(scheme: \"[アプリ名]\",\n            workspace: \"[アプリ名].xcworkspace\",\n            include_bitcode: true)\n    upload_to_app_store(\n      username: \"[Apple ID]\",\n      force: true,\n      skip_screenshots: true,\n      skip_metadata: true\n    )\n\n  end\nend\n```\n\n以下のコマンドでlaneを実行することができます。\n\n```\nfastlane release_app\n```\n"])</script><script>self.__next_f.push([1,"79:T7c5,"])</script><script>self.__next_f.push([1,"\n# 目次\n\n# ■はじめに\n\nここでは、ローカルのmacにRubyをインストールする手順を記載します。\n\nRubyインストールには「rbenv」を使用いてバージョンの切り替えを用意に行えるようにします。\n\nHomebrewを使用しますが、Homebrewのインストール方法に関しては割愛します。\n\n# ■手順\n\n## 「rbenv」と「ruby-build」をインストール\n\n以下のコマンドを実行し、「rbenv」と「ruby-build」をインストールします。\n\n```\nbrew install rbenv ruby-build\n```\n\n以下のコマンドを実行し、インストールされていることを確認する。（バージョン情報が返ってきます）\n\n```\nrbenv -v\n```\n\n## rbenvでRubyをインストール\n\nまずは、以下のコマンドでインストールできるRubyのバージョンを確認する。\n\n```\nrbenv install --list\n```\n\n次に、Rubyをインストールする。（ここでは、2.6.0をインストールしています。\n\n```\nrbenv install 2.6.0\n```\n\n以下で今のRubyのバージョンを切り替えます。\n\n```\nrbenv global 2.6.0\n```\n\n## rbenvでインストールしたRubyを参照するように設定を変更\n\n以下のコマンドを実行して環境パスを取得する。\n\n```\nrbenv init\n```\n\n作者の環境では以下の情報が取得できました。\n\n```\neval \"$(rbenv init -)\"\n```\n\n上記の環境パスをbashの場合は「.bash_profile」、zshの場合は「.zshrc」に書き込みます。\n\n書き込みは以下のコマンドで行えます。\n\n【bash】\n\n```\necho 'eval \"$(rbenv init -)\"' \u003e\u003e ~/.bash_profile\n```\n\n【zsh】\n\n```\necho 'eval \"$(rbenv init -)\"' \u003e\u003e ~/.zshrc\n```\n\n書き込みを行ったら、以下のコマンドで設定を反映してください。\n\n【bash】\n\n```\nsource ~/.bash_profile\n```\n\n【zsh】\n\n```\nsource ~/.zshrc\n```\n\n以下のコマンドで、インストールしたRubyのバージョンが表示されればOKです。\n\n```\nruby -v\n```\n"])</script><script>self.__next_f.push([1,"7a:T708,"])</script><script>self.__next_f.push([1,"\n# ■はじめに\n\nここでは、BitbucketにPushされたことをトリガーにして、サーバーにソースコードをデプロイする方法を記載します。\n\nNode.jsの環境やBitbucketに関しては、ある程度理解している前提で記載しますので、わからない部分は都度調べてください。\n\n# ■手順\n\nまずは、ソースコードの全量は以下です。\n\n```javascript\nvar exec = require('child_process').exec\nvar http = require('http');\nvar cmd = 'cd /var/www/html/ \u0026\u0026 git pull origin master';\n\n/*コマンド実行関数*/\nfunction update() {\n    return exec(cmd, {timeout: 90000},\n        function(error, stdout, stderr) {\n            if(error !== null) {\n                console.log(error);\n            }\n        }\n    )\n};\n\nhttp.createServer(function (req, res) {\n  if(req.method == 'POST'){\n        console.log(\"===deploy===\");\n        update();\n  }\n}).listen(3456);\n```\n\n基本的には、コピペでいいですが、以下だけ修正しないといけません。\n\n以下は、実行するコマンドです。\n\ncdコマンドのディレクトリを「.git」が格納されているディレクトリに指定してください。\n\nまた、pullした後に何かコマンドを実行したければ「\u0026\u0026」でつなげて記載してください。\n\n```javascript\nvar cmd = 'cd /var/www/html/ \u0026\u0026 git pull origin master';\n```\n\n以下は、利用するポート番号を指定しています。\n\nこのポート番号は、ファイアーウォールに穴あけをしておいてください。\n\n```javascript\n}).listen(3456);\n```\n\n最後に、Bitbucketの「リポジトリ -\u003e 設定 -\u003e Webhooks」に上記のNodeの実行URLを記載しておいてください。\n\n例）[http://hogehoge.con:3456/](http://hogehoge.con:3456/)\n"])</script><script>self.__next_f.push([1,"7b:Td29,"])</script><script>self.__next_f.push([1,"\n## ■はじめに\n\n無料のSSL証明書を設定するにあたり、ドメインを設定しておく必要があります。\n\nCentOSにApatchの設定などが終わっており、http通信ができる前提です。\n\n## ■手順\n\nSSHでサーバーに接続する（rootユーザーに切り替えてください）\n\n以下のコマンドでファイアーウォール にhttpsが空いていることを確認する。（「services」の部分に「https」があればOK）\n\n```\nfirewall-cmd --list-all\n```\n\n以下のコマンドで無料SSLのインストールをする。\n\n```\nyum install certbot python2-certbot-apache\n```\n\n以下のコマンドでドメインに無料SSLを反映する。（以下は「example.com」の例です。）\n\n```\ncertbot --apache -d example.com\n```\n\n色々質問されるので、それぞれ回答していく。（以下は私が実施した際の質問です。）\n\n```\nEnter email address (used for urgent renewal and security notices) (Enter 'c' to\ncancel):\n　　→メールアドレスを入力する。\n\n-------------------------------------------------------------------------------\nPlease read the Terms of Service at\nhttps://letsencrypt.org/documents/LE-SA-v1.1.1-August-1-2016.pdf. You must agree\nin order to register with the ACME server at\nhttps://acme-v01.api.letsencrypt.org/directory\n-------------------------------------------------------------------------------\n(A)gree/(C)ancel:\n　　→A（利用規約に同意する）\n\n-------------------------------------------------------------------------------\nWould you be willing to share your email address with the Electronic Frontier\nFoundation, a founding partner of the Let's Encrypt project and the non-profit\norganization that develops Certbot? We'd like to send you email about EFF and\nour work to encrypt the web, protect its users and defend \n\n以下、JWTの値（PAYLOAD）の取得方法です。\n\n```swift\nlet jwt = \"eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiIxMjM0NTY3ODkwIiwibmFtZSI6IkpvaG4gRG9lIiwiaWF0IjoxNTE2MjM5MDIyfQ.SflKxwRJSMeKKF2QT4fwpMeJf36POk6yJV_adQssw5c\"\nprint(jwtDecode(jwt))\n```\n\nちなみに、以下の様に記載しても同じです！！\n\n※第二引数に「1」を入れました（デフォルト値が1なので入れなくてもいいですが。。。）\n\n```swift\nlet jwt = \"eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiIxMjM0NTY3ODkwIiwibmFtZSI6IkpvaG4gRG9lIiwiaWF0IjoxNTE2MjM5MDIyfQ.SflKxwRJSMeKKF2QT4fwpMeJf36POk6yJV_adQssw5c\"\nprint(jwtDecode(jwt, 1))\n```\n\nJWTのHEADERを取得したい場合には以下のように記載してください。\n\n※第二引数が「0」です！\n\n```swift\nlet jwt = \"eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiIxMjM0NTY3ODkwIiwibmFtZSI6IkpvaG4gRG9lIiwiaWF0IjoxNTE2MjM5MDIyfQ.SflKxwRJSMeKKF2QT4fwpMeJf36POk6yJV_adQssw5c\"\nprint(jwtDecode(jwt, 0))\n```\n\n注意ですが、第二引数に「0」「1」以外を入れても「nil」が返ってくるだけです。\n"])</script><script>self.__next_f.push([1,"7e:Tec4,"])</script><script>self.__next_f.push([1,"\n## ■はじめに\n\nここでは、「APIKit」というライブラリのサンプルを記載します。\n APIKitの詳細に関しては、GitHub（[https://github.com/ishkawa/APIKit](https://github.com/ishkawa/APIKit)）を参照してください。\n APIKitの詳細を簡単に説明すると、タイプセーフにAPIを利用するためのライブラリです。\n ※タイプセーフとは、型変換の時に別の型を渡せない様になっているみたいなことです。（String型にInt型を設定するなどはできない）\n ※CocoaPodsなどを用いて、APIKitをプロジェクトに組み込んでおいてください。（ここでは組込方法は割愛します。）\n\nまた、以下のサンプルでは、郵便番号検索APIを使用したサンプルになっていますが、郵便番号検索APIには「zipcloud」（[http://zipcloud.ibsnet.co.jp/doc/api](http://zipcloud.ibsnet.co.jp/doc/api)）を利用しています。\n\n## ■手順\n\nまずは、APIのレスポンスを入れるためのEntityを作成します。\n 郵便番号検索APIのレスポンスを入れるため、以下の様に記載してください。\n\n```swift\nimport Foundation\n\nclass Entity {\n    var address1: String = \"\"\n    var address2: String = \"\"\n    var address3: String = \"\"\n    var kana1: String = \"\"\n    var kana2: String = \"\"\n    var kana3: String = \"\"\n    var prefcode: String = \"\"\n    var zipcode: String = \"\"\n\n    init(object: [String: AnyObject]?) throws {\n        guard\n            let status: Int = object?[\"status\"] as? Int,\n            status == 200,\n            let results: NSArray = object?[\"results\"] as? NSArray\n        else { return }\n\n        if let data = results[0] as? [String: AnyObject] {\n            self.address1 = data[\"address1\"] as? String ?? \"\"\n            self.address2 = data[\"address2\"] as? String ?? \"\"\n            self.address3 = data[\"address3\"] as? String ?? \"\"\n            self.kana1 = data[\"kana1\"] as? String ?? \"\"\n            self.kana2 = data[\"kana2\"] as? String ?? \"\"\n            self.kana3 = data[\"kana3\"] as? String ?? \"\"\n            self.prefcode = data[\"prefcode\"] as? String ?? \"\"\n            self.zipcode = data[\"zipcode\"] as? String ?? \"\"\n        }\n    }\n}\n```\n\n次に、APIの本体となるDataStoreクラスを作成します。\n\n以下の様に記載してください。\n\nここで、APIのURLやパラメータやHTTPメソッドなどの指定をしています。\n\n```swift\nimport Foundation\nimport APIKit\n\nstruct DataStore: Request {\n    typealias Response = Entity\n    let zipcode: String\n\n    var baseURL: URL {\n        return URL(string: \"http://zipcloud.ibsnet.co.jp\")!\n    }\n\n    var method: HTTPMethod {\n        return .get\n    }\n\n    var path: String {\n        return \"/api/search\"\n    }\n\n    var parameters: Any? {\n        return [\"zipcode\": zipcode]\n    }\n\n    func response(from object: Any, urlResponse: HTTPURLResponse) throws -\u003e Entity {\n        return try Entity(object: object as? [String : AnyObject])\n    }\n}\n```\n\nここまで用意できたら以下の様に呼び出すだけです。\n\n以下は、千代田区の郵便番号を利用しています。（100-0000なんて、キリがいい郵便番号だったので！）\n\n```swift\n// 東京都千代田区の郵便番号「100-0000」\nlet request = DataStore(zipcode: \"1000000\")\nSession.send(request) { result in\n    switch result {\n    case .success(let target):\n        print(\"=====SUCCESS=====\")\n        print(target.address1)\n        print(target.address2)\n        print(target.address3)\n        print(target.kana1)\n        print(target.kana2)\n        print(target.kana3)\n        print(target.prefcode)\n        print(target.zipcode)\n    case .failure(let error):\n        print(\"error: \\(error)\")\n    }\n}\n```\n"])</script><script>self.__next_f.push([1,"7f:T78e,"])</script><script>self.__next_f.push([1,"\n## ■はじめに\n\nRestAPIなどJWTを生成したい場面がちょくちょくあります。\n\nここでは、Node.jsでJWTを生成する方法と、生成したJWTをデコードして中身を見る方法を記載します。\n\n※基本的なNode.jsの使い方などは割愛していますので、ご了承ください。\n\n※秘密鍵に関しては生成している前提で進めています。\n\n## ■手順\n\n以下のnpmコマンドでライブラリをインストールする。\n\n```\nnpm i jsonwebtoken\n```\n\n以下をコピペして実行してみてください。（早速完成系ですw）\n\n```js\nvar jwt = require('jsonwebtoken');\n\n// 本来なら直書きでは無く、「readFileSync」などで読み込んだ方が良さげだが、ここではローカル実行するために直書きしてます。\nconst PEM = `[秘密鍵の中の値]`\n// var fs = require('fs');\n// const PEM = fs.readFileSync('auth.pem')\n\n// JWT生成関数\nfunction issueToken() {\n    // headerの設定\n    const opts = jwt.SignOptions = {\n        algorithm: 'RS256',\n        issuer: 'https://issuer.example.com',\n        expiresIn: '1d'\n    }\n\n    // payloadの設定\n    const payload = {\n        sub: \"TEST\",\n    }\n\n    // headerとpayloadを元に秘密鍵でJWT化\n    return jwt.sign(payload, PEM, opts)\n}\n\n// JWTのデコード（引数にJWT）\nfunction verifyToken(idToken) {\n    // headerの設定\n    const opts = jwt.VerifyOptions = {\n        algorithms: ['RS256'],\n        issuer: 'https://issuer.example.com',\n        maxAge: '1d'\n    }\n\n    // デコード\n    return new Promise((resolve, reject) =\u003e {\n        jwt.verify(idToken, PEM, opts, function(err, decoded) {\n            if (err) {\n                reject(err)\n            } else {\n                resolve(decoded)\n            }\n        })\n    })\n}\n\nconst idToken = issueToken()\nconsole.log(idToken)\nconst result = verifyToken(idToken)\nconsole.log(result)\n```\n"])</script><script>self.__next_f.push([1,"80:T696,"])</script><script>self.__next_f.push([1,"\n■はじめに\n\nデータセットを作成していない人は、[こちら](http://developer-kuro.com/develop/?p=1149)を参照してデータセットを作成しておいてください。\n\n■手順\n\nプロジェクトの構成は以下です。\n\n- Project　# プロジェクトの一番親のディレクトリDog　# 犬の画像を格納するディレクトリ\n- Cat　# 猫の画像を格納するディレクトリ\n- Check　# 分類したい画像を格納するディレクトリ\n- learning.py　# データセットを生成するPythonファイル\n- match.py　# 画像分類を行うPythonファイル\n\n\u003c/li\u003e\u003c/ul\u003e\n\nソースコードの全量は以下です。（「TARGET_FILE」の画像名は、チェックしたい画像名に変更してください。）\n\n```python\nimport cv2\nimport numpy\n\nsam = numpy.load('./filename.npz')\n\nlabelList = sam['trainlabel']\n\nTARGET_FILE = './Check/check.png'\nIMG_SIZE = (50, 50)\n\ntarget_img = cv2.imread(TARGET_FILE)\ntarget_img = cv2.resize(target_img, IMG_SIZE)\ntarget_hist = cv2.calcHist([target_img], [0], None, [256], [0, 256])\n\nfor i in range(0, len(labelList)):\n    comparing_img = sam['trainimg'][i]\n    comparing_img = cv2.resize(comparing_img, IMG_SIZE)\n    comparing_hist = cv2.calcHist([comparing_img], [0], None, [256], [0, 256])\n\n    ret = cv2.compareHist(target_hist, comparing_hist, 0)\n    print(sam['type'][i], sam['trainlabel'][i], ret)\n```\n\nターミナルで以下のコマンドを実行することで、画像の分類が行えます。\n\n```\npython match.py\n```\n\n値が「1」に近いほど類似した画像という結果になります。（「1」の場合は全く同じということです。）\n"])</script><script>self.__next_f.push([1,"81:T112b,"])</script><script>self.__next_f.push([1,"\n## ■はじめに\n\nAppleから、Googleログインなどのソーシャルログインを追加する場合にはAppleのソーシャルログインを追加するようにレビューガイドラインが更新されました。\n\nそのため、ここでは、Appleのソーシャルログイン（Sign In with Apple）の実装方法を記載します。\n\nこのログインはiOS13から利用できますので、ターゲットバージョンを13以上にしてください。\n\n## ■手順\n\nプロジェクトを作成し、「Capability」で「Sign In with Apple」を追加する。\n\n![](https://developer-kuro.com/develop/wp-content/uploads/2020/02/スクリーンショット-2020-02-18-11.30.25-300x76.png)\n\n![](https://developer-kuro.com/develop/wp-content/uploads/2020/02/スクリーンショット-2020-02-18-11.30.46-300x219.png)\n\nViewControllerに「AuthenticationServices」のインポートを追加する。\n\n```swift\nimport AuthenticationServices\n```\n\nDelegateに「ASAuthorizationControllerDelegate」を追加する。\n\n```swift\nclass ViewController: UIViewController, ASAuthorizationControllerDelegate {\n```\n\n「viewDidLoad」で「Sign In」のボタンを作成する。\n\n```swift\noverride func viewDidLoad() {\n    super.viewDidLoad()\n    self.view.backgroundColor = .white\n\n    let authorizationButton = ASAuthorizationAppleIDButton()\n    authorizationButton.frame = CGRect(x: 10, y: 100, width: UIScreen.main.bounds.size.width - 20, height: 50)\n    author er.createRequest()\n        request.requestedScopes = [.fullName, .email]\n\n        let authorizationController = ASAuthorizationController(authorizationRequests: [request])\n        authorizationController.delegate = self\n        authorizationController.performRequests()\n    }\n\n    func authorizationController(controller: ASAuthorizationController, didCompleteWithAuthorization authorization: ASAuthorization) {\n        if let appleIDCredential = authorization.credential as? ASAuthorizationAppleIDCredential {\n            print(appleIDCredential.user)\n            print(appleIDCredential.fullName ?? \"\")\n            print(appleIDCredential.email ?? \"\")\n        }\n    }\n\n    func authorizationController(controller: ASAuthorizationController, didCompleteWithError error: Error) {\n        // エラー処理\n    }\n}\n```\n"])</script><script>self.__next_f.push([1,"82:T99a,"])</script><script>self.__next_f.push([1,"\n## ■はじめに\n\n機械学習で使用する膨大な量の画像を集める方法として、1枚ずつGoogleでダウンロードしてもいいですが、途方もない作業になります。\n\nそこで、「google-images-download」を使用して画像をまとめてダウンロードする方法を記載します。\n\nこちらから、「pip」のインストールまで終わらせている必要があります。\n\n## ■手順\n\nターミナルで以下のコマンドを実行し、「google_images_download」をインストールします。\n\n```\npip install google_images_download\n```\n\nインストールしたら、以下のコマンドで実行できます。\n\n```\ngoogleimagesdownload -k \"犬\"\n```\n\n上記は、「犬」というキーワードにヒットした画像をカレントディレクトリに保存しています。\n\nこのダウンロードした画像で機械学習などに利用していきましょう。\n\n## ■オプション\n\nショートカット説明k画像のキーワードを指定sk画像のキーワードを複数指定lダウンロードする画像の数（100件が上限）\n※ChromeDriverを使用するとそれ以上、指定可能f画像の形式（jpg,png,など）co画像の色（red,blue,など）ct画像色のタイプ（full-color,transparent,black-and-white）s画像のサイズ（large,medium,'\u003e400*300',など）a画像の形（tall,square,など）tダウンロードする画像タイプ（face,photo,など）w画像の期間（past-24-hours,past-7-days,など）o指定したディレクトリに画像を展開（指定しなければカレントディレクトリ）si画像ファイルやURLから類似の画像をダウンロードするcdChrome Driverの指定la言語の指定（Japanese,English,など）\n\n## ■100件以上まとめてダウンロードする場合\n\n100件以上まとめてダウンロードする場合には、「Chrome Driver」が必要になります。\n\n※「Chrome Driver」は、[こちら](http://chromedriver.chromium.org/downloads)からダウンロードしてください。\n\nダウンロード、解凍を行い、出てきた「chromedriv  value: Any) {\n        if let archiveData = try? NSKeyedArchiver.archivedData(withRootObject: value, requiringSecureCoding: true) {\n            setKeyChainCommon(key: key, data: archiveData)\n        }\n    }\n\n    /// データの保存共通処理\n    /// - Parameters:\n    ///   - key: 保存する対象のキー\n    ///   - data: 保存するデータのData型の値\n    fileprivate static func setKeyChainCommon(key: String, data: Data) {\n        deleteKeyChain(key: key)\n        SecItemAdd([kSecClass: kSecClassGenericPassword,\n                    kSecValueData: data,\n                    kSecAttrAccount: Bundle.main.bundleIdentifier ?? \"\",\n                    kSecAttrService: key] as CFDictionary, nil)\n    }\n\n    // MARK: - 取得\n\n    /// String型のデータ取得処理\n    /// - Parameter key: 取得データのキー\n    static func getStringKeyChain(key: String) -\u003e String? {\n        guard let targetData = getKeyChainCommon(key: key) else { return nil }\n        return String(data: targetData, encoding: .utf8)\n    }\n\n    /// Int型のデータ取得処理\n    /// - Parameter key: 取得データのキー\n    static func getIntKeyChain(key: String) -\u003e Int? {\n        return Int(getStringKeyChain(key: key) ?? \"\")\n    }\n\n    /// Double型のデータ取得処理\n    /// - Parameter key: 取得データのキー\n    static func getDoubleKeyChain(key: String) -\u003e Double? {\n        return Double(getStringKeyChain(key: key) ?? \"\")\n    }\n\n    /// Float型のデータ取得処理\n    /// - Parameter key: 取得データのキー\n    static func getFloatKeyChain(key: String) -\u003e Float? {\n        return Float(getStringKeyChain(key: key) ?? \"\")\n    }\n\n    /// Bool型のデータ取得処理\n    /// - Parameter key: 取得データのキー\n    static func getBoolKeyChain(key: String) -\u003e Bool? {\n        return Bool(getStringKeyChain(key: key) ?? \"\")\n    }\n\n    /// Any型のデータ取得処理（配列や辞書などの関数が用意されていないものはこの関数を利用する）\n    /// - Parameter key: 取得データのキー\n    static func getAnyKeyChain(key: String) -\u003e Any? {\n        guard let data: Data = getKeyChainCommon(key: key) else { return nil }\n        return try? NSKeyedUnarchiver.unarchiveTopLevelObjectWithData(data)\n    }\n\n    /// データ取得処理の共通処理\n    /// - Parameter key: 取得データのキー\n    fileprivate static func getKeyChainCommon(key: String) -\u003e Data? {\n        var queryResult: AnyObject?\n\n        _ = withUnsafeMutablePointer(to: \u0026queryResult) {\n            SecItemCopyMatching([kSecClass: kSecClassGenericPassword,\n                                          kSecAttrAccount: Bundle.main.bundleIdentifier ?? \"\",\n                                          kSecAttrService: key,\n                                          kSecReturnAttributes: kCFBooleanTrue as Any,\n                                          kSecMatchLimit: kSecMatchLimitOne] as CFDictionary, UnsafeMutablePointer($0))\n        }\n\n        // パスワード以外のキーを取得する\n        guard var valueQuery = queryResult as? [AnyHashable: AnyHashable] else { return nil }\n        valueQuery[kSecClass] = kSecClassGenericPassword\n        valueQuery[kSecReturnData] = kCFBooleanTrue\n\n        // パスワードを取得する\n        var valueQueryResult: AnyObject?\n\n        _ = withUnsafeMutablePointer(to: \u0026valueQueryResult){\n            SecItemCopyMatching(valueQuery as CFDictionary, UnsafeMutablePointer($0))\n        }\n\n        return valueQueryResult as? Data\n    }\n\n    // MARK: - 削除\n\n    /// 削除処理\n    /// - Parameter key: 削除対象のキー\n    static func deleteKeyChain(key: String) {\n        SecItemDelete([kSecClass: kSecClassGenericPassword,\n                       kSecAttrAccount: Bundle.main.bundleIdentifier ?? \"\",\n                       kSecAttrService: key] as CFDictionary)\n    }\n}\n```\n\nこれで、簡単にKeyChainを使用する準備ができました。\n 以下の様に使用する事で、KeyChainにデータを保存することができます。\n ※以下では、「value」をString型で記載していますが、その他のデータ型でも同様です。\n ※「key」に関してはString型で定義する必要があります。\n ※既に保存されているKeyの場合には、データが上書きされます。（この動きでデータを更新します。）\n\n```swift\nKeyChain.setKeyChain(key: \"key\", value: \"VALUE\")\n```\n\n以下の様に使用する事で、KeyChainからデータを取得することができます。\n ※データ型によって、取得方法を変更する必要があるので、メソッド名は「get[データ型]KeyChain」の様にしてください。\n ※「key」に関してはString型で定義する必要があります。\n ※配列型や辞書型などは「Any」で取得した後にキャストする必要があります。\n\n```swift\nKeyChain.getStringKeyChain(key: \"key\")\n```\n\n以下の様に使用する事で、KeyChainからデータを削除することができます。\n\n※「key」に関してはString型で定義する必要があります。\n\n```swift\nKeyChain.deleteKeyChain(key: \"key\")\n```\n"])</script><script>self.__next_f.push([1,"84:T826,"])</script><script>self.__next_f.push([1,"\n## ■はじめに\n\nここでは、PythonとOpenCVを使用して画像解析を行うための環境構築手順を記載します。\n\nMacを前提として記載します。\n\n## ■手順\n\nターミナルで以下のコマンドを実行し、「Xcode Command Line Tools」をインストールします。\n\n```\nxcode-select --install\n```\n\n[こちら](https://brew.sh/)のサイトから、「/usr/bin/ruby」で始まるコマンドを丸々コピーして、ターミナルで実行し、「Homebrew」をインストールします。\n\nターミナルで以下のコマンドを実行し、「pyenv」をインストールします。\n\n```\nbrew install pyenv\n```\n\nターミナルで以下のコマンドを実行し、「pyenv-virtualenv」をインストールします。\n\n```\nbrew install pyenv-virtualenv\n```\n\nターミナルで以下のコマンドを実行し、インストールできるPythonのバージョンを確認します。\n\n```\npyenv install -l\n```\n\nターミナルで以下のコマンドを実行し、「Python」をインストールします。（ここでは、ver3.6.0をインストールしています。）\n\n```\npyenv install 3.6.0\npyenv rehash\n```\n\nターミナルで以下のコマンドを実行し、「pip」（プラグイン管理ツール）をインストールします。\n\n```\nsudo easy_install pip\nsudo easy_install --upgrade six\nsudo pip install --upgrade pip\n```\n\nターミナルで以下のコマンドを実行し、PythonをpyenvでインストールしたPythonに切り替える。（macにはデフォルトでPythonが入っていますが、バージョンの切り替えが簡単にできるpyenvを採用しています。）\n\n```\necho eval \"$(pyenv init -)\" \u003e\u003e ~/.bash_profile\nsource ~/.bash_profile\n```\n\nターミナルで以下のコマンドを実行することで、Pythonのバージョンを確認できます。\n\n```\npython --version\n```\n\nターミナルで以下のコマンドを実行し、「OpenCV」をインストールします。\n\n```\npip install opencv-python\n```\n\nこれで、環境構築は終了です。\n"])</script><script>self.__next_f.push([1,"85:Ta9a,"])</script><script>self.__next_f.push([1,"\n## ■はじめに\n\nPythonとOpenCVの環境構築は、[こちら](https://developer-kuro.com/develop/?p=1147)を参照してください。\n\n## ■手順\n\nプロジェクトの構成は以下です。\n\n- Project　# プロジェクトの一番親のディレクトリDog　# 犬の画像を格納するディレクトリ\n- Cat　# 猫の画像を格納するディレクトリ\n- learning.py　# データセットを生成するPythonファイル\n\n\u003c/li\u003e\u003c/ul\u003e\n\nソースコードの全量は以下です。（「DATADIR」のパスはProjectのディレクトリパスを記載してください）\n\n※実行する前に、「Dog」ディレクトリに「犬の画像」、「Cat」ディレクトリに「猫の画像」を格納しておいてください。（画像サイズは問わないので、適当にGoogleから取得するなど。）\n\n```python\nimport os\nimport cv2\nimport random\nimport numpy\n\n# ディレクトリパスの定義\nDATADIR = \"/Users/user/Desktop/Project/\"\n# ディレクトリ名の定義\nCATEGORIES = [\"Dog\", \"Cat\"]\n# 画像のサイズ定義\nIMG_SIZE = 50\n\ntraining_data = []\ndef create_training_data():\n    for class_num, category in enumerate(CATEGORIES):\n        path = os.path.join(DATADIR, category)\n        for image_name in os.listdir(path):\n            try:\n                img_array = cv2.imread(os.path.join(path, image_name),)  # 画像読み込み\n                img_resize_array = cv2.resize(img_array, (IMG_SIZE, IMG_SIZE))  # 画像のリサイズ\n                training_data.append([img_resize_array, class_num])  # 画像データ、ラベル情報を追加\n            except Exception as e:\n                pass\n\ncreate_training_data()\nrandom.shuffle(training_data)  # データをシャッフル\nX_train = []  # 画像データ\ny_train = []  # ラベル情報\nz_train = []  # カテゴリ情報\n\n# データセット作成\nfor feature, label in training_data:\n    X_train.append(feature)\n    y_train.append(label)\n    z_train.append(CATEGORIES[label])\n\n# データセットの保存\nnumpy.savez('./filename.npz', type=z_train,trainimg=X_train, trainlabel=y_train, imgsize=(IMG_SIZE, IMG_SIZE))\n```\n\n上記のPythonファイルを以下のコマンドを実行することでデータセットを作成できます。\n\n```\n# Pythonファイルが格納されているディレクトリをルートに\ncd /Users/user/Desktop/Project/\n# Pythonファイルの実行\npython learning.py\n```\n\nこれで、「Project」ディレクトリ直下に「filename.npz」が生成されていると思います。\n\nこのファイルがデータセットのバイナリファイルです。\n\n以降は、このファイルを元に、画像分類などを行います。\n"])</script><script>self.__next_f.push([1,"86:Tbf8,"])</script><script>self.__next_f.push([1,"\n## ■はじめに\n\nパスワード情報など、セキュリティを強固にしたいデータを扱う際に暗号化/複合化を利用することがあります。\n\nここでは、「CryptoSwift」のライブラリを使用させて頂き、暗号化/複合化を行う方法を記載します。\n\n## ■手順\n\nCocoaPodsを使用して、「CryptoSwift」をインストールします。\n\n```\nCryptoSwift\n```\n\n以下のソースコードを記載します。\n\n※これは、暗号化/複合化の共通処理です。\n\n※「encryptionKey」と「encryptionIv」の定数の値は任意で書き換えてください。\n\n```swift\nimport Foundation\nimport CryptoSwift\n\n/// 暗号化/複合化の共通処理\nclass EncryptionCommon {\n\n    /// 暗号化のキー（16文字）\n    private static let encryptionKey = \"samplesamplesamp\"\n    /// データをシフト演算するキー（16文字の数字）\n    private static let encryptionIv = \"1111122222333339\"\n\n    /// 暗号化\n    /// - Parameter target: 暗号化したい文字列\n    class func encode(_ target: String) -\u003e String {\n\n        do {\n            // 暗号化処理\n            // AES インスタンス化\n            let aes = try AES(key: encryptionKey, iv: encryptionIv)\n            let encrypt = try aes.encrypt(Array(target.utf8))\n\n            // Data 型変換\n            let data = Data(encrypt)\n            // base64 変換\n            let base64Data: Data = data.base64EncodedData() as Data\n\n            // base64文字列をUTF-8に変換して返す\n            return String(data: base64Data, encoding: String.Encoding.utf8) ?? \"\"\n\n        } catch {\n            // エラー処理\n            return \"\"\n        }\n    }\n\n    /// 複合化\n    /// - Parameter base64: 暗号化されている文字列\n    class func decode(_ base64: String) -\u003e String {\n\n        do {\n            // AES インスタンス化\n            let aes = try AES(key: encryptionKey, iv: encryptionIv)\n\n            // base64 から Data型へ\n            guard let byteData = base64.data(using: String.Encoding.utf8) else { return \"\" }\n            // base64 デーコード\n            guard let data = Data(base64Encoded: byteData) else { return \"\" }\n\n            // UInt8 配列の作成\n            let aBuffer = Array\u003cUInt8\u003e(data)\n            // AES 複合\n            let decrypted = try aes.decrypt(aBuffer)\n\n            // UTF-8に変換して返す\n            return String(data: Data(decrypted), encoding: .utf8) ?? \"\"\n        } catch {\n            // エラー処理\n            return \"\"\n        }\n    }\n}\n```\n\n暗号化する際は以下のように共通処理を呼び出します。\n\n※引数に暗号化したい文字列を渡してください。\n\n```swift\nlet encode = EncryptionCommon.encode(\"暗号化したい文字列\")\n```\n\n上記で暗号化された文字列を複合化したい場合は以下のように共通処理を呼び出します。\n\n※引数に複合化したい文字列を渡してください。\n\n```swift\nlet decode = EncryptionCommon.decode(encode)\n```\n"])</script><script>self.__next_f.push([1,"87:Tf59,"])</script><script>self.__next_f.push([1,"\
